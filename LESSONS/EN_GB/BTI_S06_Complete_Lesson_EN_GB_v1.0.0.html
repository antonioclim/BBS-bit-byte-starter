function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s06-complete-lesson-v1-en-GB')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s06-complete-lesson-v1-en-GB',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Example hidden</span></div><section class="example" id="example-${i}" aria-label="Worked example" hidden></section><p class="connection"><b>Next.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Present lesson':'Read lesson';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Replay step by step';return f<p.steps.length-1?'Next step':'Replay example ↺';}
function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Example hidden':state.all[i]?`All ${p.steps.length} steps shown`:`Example step ${f+1} of ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'COMPLETE WORKING':`STEP ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Previous step</button><button data-action="all" data-index="${i}">Full working</button><button data-action="hide" data-index="${i}">Hide example</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Back to the method ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Lesson map':'← Previous topic';$('nextBtn').textContent=state.index===pages.length-1?'Restart lesson ↺':'Next topic →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Return to lesson':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Optional panel. Next topic returns to the lesson and advances.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Example hidden':'Example shown'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Topic ${state.index+1} of ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Example hidden until requested.':'Example shown.'}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lesson restarted. All worked examples are hidden.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Continuous lesson: all methods visible; examples still controlled individually.':'Presentation: one topic at a time.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Return to lesson</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['signed','boundary','integration'].includes(which)){h=s06Panel(which);}
else if(which==='map'){h=panelHead("Lesson map")+`<p>Resume the project, state your own hypothesis and check the signed interpretation boundary. Consult Gemini or the prepared example, test the claim and follow the fix through a branch, pull request, merge and updating local main.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Present one topic":"Read the continuous lesson"}</button><button data-command="tools">Checking tools</button><button data-command="reference">Shared reference</button><button data-command="help">Display and help</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">The proposed 90-minute route gives 75 minutes to the project, 10 minutes to Q06 and five minutes to finish. Tools prepared before class are necessary for this pace. These times have not been measured for every group.</p></div>`;}
else if(which==='help'){h=panelHead('Reading, navigation and display')+`<p><b>The explanations are visible from the start.</b> Use E or the green button to reveal the example one step at a time. The right arrow moves to the next topic even when the example is unfinished. Full working displays all its steps after your own attempt.</p><p><a href="BTI_S06_Lesson_Text_EN_GB_v1.0.0.html">Open the complete reading version</a>. It contains the same explanations and examples and needs no JavaScript. Keep both files in the same folder after downloading. In Moodle, use the separate reading link as well.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Lesson text scale: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− and A+ change the text by five percentage points. Enter a percentage for an exact size. Scroll longer explanations and wide tables. Choose a size for the actual screen and viewing distance.</p><div class="panel-controls"><button data-command="theme">Switch light/dark theme</button><button data-command="fullscreen">Full screen</button><button data-command="blank">Blank screen (B)</button><button data-command="tools">Tools and timer</button></div><h2>Keys</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Letter shortcuts: on':'Letter shortcuts: off'}</button></div><p class="small">Turn character shortcuts off if they interfere with typing or voice control. Arrows, Escape and on-screen buttons still work.</p><p>← / →: previous / next topic. E: show or advance an example. Shift+E: previous step. H: hide example. M: lesson map. F: full screen. B: blank screen. Escape: return to the lesson or restore keyboard focus.</p><p class="small">Inside form fields, arrows retain their editing function. Escape returns to the lesson. Alt+← / Alt+→ also navigate from a field.</p><h2>What we learn and why</h2><p>We complete one byte representation function in an existing project. A precise input and output contract lets us make a prediction, change the function and examine what each test demonstrates.</p><p>After forgetting the commands, retain the distinctions: Save updates a working file, Stage selects its snapshot, Commit records the selected snapshot locally and Push transmits existing commits. Check the actual file on GitHub after pushing.</p><h2>The connection with S06–S07</h2><p>S06 investigates a defect through a hypothesis and tests. S07 adds an individual requirement and reproduces the result. S06 establishes the project copy, the first completed function and the working method.</p><h2>Practice and assessment</h2><p>Make your own prediction and attempt before revealing worked answers or using a tool. Optional Gemini clarification follows the attempt; verify its claims and never use it in Q06. During Q06 use only the existing shared reference and resources announced in the course. Close the lesson tools and worked answers. Q06 gives at most 0.2 real points; all three project quizzes give at most 1 point in total. A quiz score does not certify who made a repository change.</p><h2>Tool conventions</h2><p>The decimal parser reproduces the starter project: decimal digits, optional surrounding spaces and an integer from 0 to 255. It does not accept hexadecimal input, exponents or signs. The additional 128-character limit belongs only to this teaching tool. The Git panel is a simulation, with no connection to your files or account.</p><p class="small">The downloaded files work offline. Use the reading version to print all explanations and steps.</p></div>`;}
else if(which==='reference'){h=panelHead("Shared reference")+S06REFERENCE+'</div>';}
else if(which==='tools'){const u=S06UI;h=panelHead("Checking tools")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="signed">${u.signedTitle}</button><button data-command="boundary">${u.boundaryTitle}</button><button data-command="integration">${u.integrationTitle}</button><button data-command="reference">Shared reference</button></div><h2>Practice timer</h2><p>The timer does not reveal answers, advance topics or control a Moodle assessment’s time limit.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4500">75 min</button><button data-command="timerPause">Pause / resume</button><button data-command="timerOff">Hide timer</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S06UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S06UI.errors[err.code||err.message]||S06UI.unexpectedError;box.textContent=message;say(S06UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS06Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Time finished · ':timer.running?'Practice · ':'Paused · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('Full screen was refused. Use the browser’s own full-screen command.');}}

const S06REFERENCE="<section id=\"format-reference\"><h2>Shared reference</h2><p>This preserves the complete shared reference content from project v0.4.0. Use it in practice and in Q06 under the rules communicated in the course. It also includes parity, which belongs to the S07 implementation. In Q06, close the extended lesson, tools and AI; keep only the permitted reference. Boundary results already appear in this reference: the quiz checks understanding with the announced support.</p><section class=\"section\" id=\"shared-ref-byte\"><h2>Eight data bits</h2><p>The input is a decimal integer <code>u</code> from <strong>0 to 255</strong> inclusive. Leading and trailing spaces are ignored; leading zeros are accepted. Empty input, text, negatives, fractions and 256 are rejected. The eight binary positions have weights <code>128, 64, 32, 16, 8, 4, 2, 1</code>.</p><p>One hexadecimal digit represents four bits because <code>16 = 2⁴</code>. Therefore a byte needs exactly two hexadecimal characters, including a leading zero where required. Digits 10–15 are <code>A–F</code>. For example, <code>5 → 00000101 → 05</code> and <code>255 = 15 × 16 + 15 → FF</code>.</p><p>For eight-bit two’s complement, interpret the same pattern as <code>s = u</code> for <code>0 ≤ u &lt; 128</code>, or <code>s = u − 256</code> for <code>128 ≤ u ≤ 255</code>. The range is <strong>−128 to 127</strong>. The leftmost bit has weight −128 in this interpretation; the stored bits do not change.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Shared reference\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Unsigned u</th><th scope=\"col\">Eight bits</th><th scope=\"col\">Hex</th><th scope=\"col\">Signed s</th></tr></thead><tbody><tr><td>0</td><td>00000000</td><td>00</td><td>0</td></tr><tr><td>5</td><td>00000101</td><td>05</td><td>5</td></tr><tr><td>127</td><td>01111111</td><td>7F</td><td>127</td></tr><tr><td>128</td><td>10000000</td><td>80</td><td>−128</td></tr><tr><td>129</td><td>10000001</td><td>81</td><td>−127</td></tr><tr><td>255</td><td>11111111</td><td>FF</td><td>−1</td></tr></tbody></table></div></section><section class=\"section\" id=\"shared-ref-parity\"><h2>One separate parity bit</h2><p>Let <code>k</code> count the 1 bits in the eight data bits. Append a numeric bit <code>p</code> at the right. <strong>A · even:</strong> <code>p = k % 2</code>, making <code>k + p</code> even. <strong>B · odd:</strong> <code>p = 1 − (k % 2)</code>, making <code>k + p</code> odd.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Shared reference\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Data</th><th scope=\"col\">Count k</th><th scope=\"col\">A · even p</th><th scope=\"col\">B · odd p</th></tr></thead><tbody><tr><td>3 · 00000011</td><td>2</td><td>0</td><td>1</td></tr><tr><td>7 · 00000111</td><td>3</td><td>1</td><td>0</td></tr></tbody></table></div><p>The transmitted display has <strong>nine bits</strong>: eight data bits plus a separate check bit. A single bit flip changes parity; any odd number of flips does so. An even number can preserve it. A parity check does not locate or correct the error.</p></section><section class=\"section\" id=\"shared-ref-git\"><h2>Git actions and where the result exists</h2><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Shared reference\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Result and useful check</th></tr></thead><tbody><tr><td>Save</td><td>Writes a file in your local folder. Reload the browser to use saved code.</td></tr><tr><td>Diff</td><td>Shows the changed content. <code>git diff</code> shows unstaged changes.</td></tr><tr><td>Stage</td><td>Selects the content of the next commit. <code>git diff --cached</code> shows that selection.</td></tr><tr><td>Commit</td><td>Records the staged version in local Git history. It is not published yet.</td></tr><tr><td>Push</td><td>Sends local commits to <code>origin</code>, normally your own GitHub repository.</td></tr><tr><td>Clone</td><td>Creates a local working copy and Git history from the remote URL.</td></tr><tr><td>Issue</td><td>Describes a problem, observations and a hypothesis in your own repository.</td></tr><tr><td>Branch</td><td>Names the separate line on which you make a repair.</td></tr><tr><td>Pull request</td><td>Explains a branch change proposed for integration into <code>main</code>.</td></tr><tr><td>Merge then pull</td><td>Merge integrates on GitHub; <code>git pull --ff-only</code> updates local <code>main</code> afterwards.</td></tr></tbody></table></div><p><code>origin</code> is the remote’s name; <code>main</code> is the main branch in this project. If you edit a file after staging it, stage the new content again before committing.</p><p><code>git status</code> checks branch and local changes; <code>git remote -v</code> checks the remote URL; <code>git branch --show-current</code> checks the branch; <code>git rev-parse HEAD</code> prints the full current commit identifier. A clean working tree alone does not prove that you pushed.</p></section><section class=\"section\" id=\"shared-ref-method\"><h2>Investigation, reproduction and assessment</h2><p><strong>Investigation:</strong> own hypothesis → one AI claim or prepared response → predicted test result → observed result → conclusion. Test the point where a rule changes and rerun previously correct cases. One counterexample contradicts a claim that something works for every valid input; a few passing examples do not establish such a universal claim.</p><p><strong>Reproduction:</strong> finish and push → clone into a different folder → check <code>main</code>, clean status and the same full SHA → open the fresh clone’s HTML files → rerun the reported tests. Put the final SHA in Moodle after the last commit and push, not inside a file belonging to that commit.</p><p><strong>Quizzes:</strong> individual, no AI or classmates, this reference allowed. Q05: 10 minutes and maximum 0.20 real points; Q06: 10 minutes and 0.30; Q07: 15 minutes and 0.50. Total maximum: one real point. The final online-text assignment is compulsory and ungraded.</p></section></section>";

'use strict';

// Pure teaching helpers: no files, Git repositories, authentication or network.
// The 128-character limit belongs to these lesson tools, not the project parser.
function s06Error(code) {
  const error = new Error(code);
  error.code = code;
  throw error;
}

function parseByteInput(raw) {
  const input = String(raw);
  if (input.length > 128) s06Error('INPUT_TOO_LONG');
  const text = input.trim();
  if (!/^\d+$/.test(text)) s06Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s06Error('BYTE_RANGE');
  return value;
}

function signedRepresentation(raw) {
  const value = parseByteInput(raw);
  const bits = [128, 64, 32, 16, 8, 4, 2, 1].map(weight => Math.floor(value / weight) % 2);
  const unsignedWeights = [128, 64, 32, 16, 8, 4, 2, 1];
  const signedWeights = [-128, 64, 32, 16, 8, 4, 2, 1];
  return {
    value, binary: bits.join(''), unsigned: value,
    signed: bits.reduce((sum, bit, index) => sum + bit * signedWeights[index], 0),
    bitweights: bits.map((bit, index) => ({
      bit, unsignedWeight: unsignedWeights[index], signedWeight: signedWeights[index],
      unsignedTerm: bit * unsignedWeights[index], signedTerm: bit * signedWeights[index]
    }))
  };
}

function boundaryComparison(raw) {
  const representation = signedRepresentation(raw);
  const value = representation.value;
  const buggy = value > 128 ? value - 256 : value;
  const fixed = value >= 128 ? value - 256 : value;
  const expected = representation.signed;
  return {value, binary: representation.binary, buggy, fixed, expected,
    buggyPasses: buggy === expected, fixedPasses: fixed === expected,
    resultDifference: buggy !== fixed};
}

function createIntegrationState() {
  return {
    currentBranch: 'main', working: 'v0', index: 'v0',
    localMain: {id: 'c0', snapshot: 'v0'}, remoteMain: {id: 'c0', snapshot: 'v0'},
    fixHEAD: null, remoteFix: null, prStatus: 'none', prHead: null,
    history: [{id: 'c0', snapshot: 'v0', parents: []}],
    revision: 0, commitNumber: 0, lastAction: 'reset', changed: false
  };
}

function s06IntegrationState(state) {
  const snapshot = value => typeof value === 'string' && /^v\d+$/.test(value) &&
    Number.isSafeInteger(Number(value.slice(1))) && Number(value.slice(1)) <= state.revision;
  if (!state || typeof state !== 'object' || !['main', 'fix-signed8'].includes(state.currentBranch) ||
      !snapshot(state.working) || !snapshot(state.index) ||
      !Number.isSafeInteger(state.revision) || state.revision < 0 ||
      !Number.isSafeInteger(state.commitNumber) || state.commitNumber < 0 ||
      !['none', 'open', 'merged'].includes(state.prStatus) ||
      !Array.isArray(state.history) || state.history.length !== state.commitNumber + 1 ||
      !state.history.every((item, i) => item && item.id === 'c' + i && snapshot(item.snapshot) &&
        Array.isArray(item.parents) && new Set(item.parents).size === item.parents.length && item.parents.every(parent =>
          state.history.slice(0, i).some(earlier => earlier.id === parent)) &&
        (i === 0 ? item.parents.length === 0 && item.snapshot === 'v0' : item.parents.length >= 1 && item.parents.length <= 2))) {
    s06Error('INVALID_INTEGRATION_STATE');
  }
  const validRef = ref => ref && state.history.some(item => item.id === ref.id && item.snapshot === ref.snapshot);
  if (!validRef(state.localMain) || !validRef(state.remoteMain) ||
      (state.fixHEAD !== null && !validRef(state.fixHEAD)) ||
      (state.remoteFix !== null && !validRef(state.remoteFix)) ||
      (state.currentBranch === 'fix-signed8' && state.fixHEAD === null) ||
      (state.prStatus !== 'none' && (state.remoteFix === null || state.prHead !== state.remoteFix.id)) ||
      (state.prStatus === 'none' && state.prHead !== null) ||
      (state.prStatus === 'merged' && state.history.find(item => item.id === state.remoteMain.id).parents.length !== 2)) {
    s06Error('INVALID_INTEGRATION_STATE');
  }
  return state;
}

function integrationSummary(state) {
  const current = s06IntegrationState(state);
  const head = current.currentBranch === 'main' ? current.localMain : current.fixHEAD;
  const unstaged = current.working !== current.index;
  const staged = current.index !== head.snapshot;
  const mergeCommit = current.history.find(item => item.id === current.remoteMain.id);
  return {
    currentBranch: current.currentBranch, working: current.working, index: current.index,
    currentHEAD: {...head}, localMain: {...current.localMain}, remoteMain: {...current.remoteMain},
    fixHEAD: current.fixHEAD && {...current.fixHEAD}, remoteFix: current.remoteFix && {...current.remoteFix},
    prStatus: current.prStatus, prHead: current.prHead,
    unstaged, staged, workspaceClean: !unstaged && !staged,
    fixPublished: Boolean(current.fixHEAD && current.remoteFix && current.fixHEAD.id === current.remoteFix.id),
    mainUpdated: current.localMain.id === current.remoteMain.id,
    integratedRemotely: current.prStatus === 'merged',
    mergeParents: mergeCommit.parents.slice(),
    lastAction: current.lastAction, changed: current.changed, simulation: true
  };
}

function integrationStep(state, action) {
  const actions = ['branch', 'save', 'stage', 'commit', 'push', 'openPR', 'merge', 'switchMain', 'pull', 'reset'];
  if (!actions.includes(action)) s06Error('INVALID_INTEGRATION_ACTION');
  s06IntegrationState(state);
  if (action === 'reset') return createIntegrationState();
  const next = {
    ...state, localMain: {...state.localMain}, remoteMain: {...state.remoteMain},
    fixHEAD: state.fixHEAD && {...state.fixHEAD}, remoteFix: state.remoteFix && {...state.remoteFix},
    history: state.history.map(item => ({...item, parents: item.parents.slice()})),
    lastAction: action, changed: false
  };
  const summary = integrationSummary(state);
  const requireFix = () => {
    if (next.currentBranch !== 'fix-signed8') s06Error('FIX_BRANCH_REQUIRED');
  };
  const addCommit = (snapshot, parents) => {
    if (next.commitNumber >= Number.MAX_SAFE_INTEGER) s06Error('SIMULATION_LIMIT');
    const item = {id: 'c' + (++next.commitNumber), snapshot, parents};
    next.history.push(item);
    return {id: item.id, snapshot: item.snapshot};
  };
  if (action === 'branch') {
    if (next.currentBranch !== 'main' || next.fixHEAD !== null || next.prStatus !== 'none') s06Error('BRANCH_ALREADY_CREATED');
    next.fixHEAD = {...next.localMain};
    next.currentBranch = 'fix-signed8';
    // A new branch at the same commit preserves existing working/index notes.
    next.changed = true;
  } else if (action === 'save') {
    requireFix();
    if (next.prStatus === 'merged') s06Error('PR_ALREADY_MERGED');
    if (next.revision >= Number.MAX_SAFE_INTEGER) s06Error('SIMULATION_LIMIT');
    next.working = 'v' + (++next.revision);
    next.changed = true;
  } else if (action === 'stage') {
    requireFix();
    next.changed = next.index !== next.working;
    next.index = next.working;
  } else if (action === 'commit') {
    requireFix();
    if (next.prStatus === 'merged') s06Error('PR_ALREADY_MERGED');
    if (next.index !== next.fixHEAD.snapshot) {
      next.fixHEAD = addCommit(next.index, [next.fixHEAD.id]);
      next.changed = true;
    }
  } else if (action === 'push') {
    requireFix();
    if (next.prStatus === 'merged') s06Error('PR_ALREADY_MERGED');
    next.changed = !next.remoteFix || next.remoteFix.id !== next.fixHEAD.id;
    next.remoteFix = {...next.fixHEAD};
    if (next.prStatus === 'open') next.prHead = next.remoteFix.id;
  } else if (action === 'openPR') {
    if (next.prStatus !== 'none') s06Error('PR_ALREADY_EXISTS');
    if (!next.remoteFix || next.remoteFix.id === next.remoteMain.id) s06Error('PUBLISHED_CHANGE_REQUIRED');
    next.prStatus = 'open'; next.prHead = next.remoteFix.id; next.changed = true;
  } else if (action === 'merge') {
    if (next.prStatus !== 'open') s06Error('OPEN_PR_REQUIRED');
    // A GitHub merge changes the remote repository, not the local files.
    next.remoteMain = addCommit(next.remoteFix.snapshot, [next.remoteMain.id, next.remoteFix.id]);
    next.prStatus = 'merged'; next.changed = true;
  } else if (action === 'switchMain') {
    if (!summary.workspaceClean) s06Error('DIRTY_WORKSPACE');
    next.changed = next.currentBranch !== 'main';
    next.currentBranch = 'main';
    next.working = next.localMain.snapshot;
    next.index = next.localMain.snapshot;
  } else if (action === 'pull') {
    if (next.currentBranch !== 'main') s06Error('MAIN_BRANCH_REQUIRED');
    if (!summary.workspaceClean) s06Error('DIRTY_WORKSPACE');
    const ancestors = new Set();
    const visit = id => {
      if (ancestors.has(id)) return;
      ancestors.add(id);
      next.history.find(item => item.id === id).parents.forEach(visit);
    };
    visit(next.remoteMain.id);
    if (!ancestors.has(next.localMain.id)) s06Error('FAST_FORWARD_REQUIRED');
    next.changed = next.localMain.id !== next.remoteMain.id;
    next.localMain = {...next.remoteMain};
    next.working = next.localMain.snapshot;
    next.index = next.localMain.snapshot;
  }
  s06IntegrationState(next);
  return next;
}

 if(which==='signed'||which==='boundary'){const signed=which==='signed',prefix=signed?'signed':'boundary';return panelHead(signed?u.signedTitle:u.boundaryTitle)+`<p>${u.attempt}</p><form id="${prefix}Form"><div class="form-grid"><label>${u.decimal}<input id="${prefix}Value" value="${signed?'192':'128'}" maxlength="128" inputmode="numeric" autocomplete="off" spellcheck="false"></label><label>${u.prediction}<input id="${prefix}Prediction" value="" maxlength="20" inputmode="text" autocomplete="off" spellcheck="false" aria-required="true"></label></div>${s06FormButtons()}</form>${s06AnswerBox()}</div>`;}
