<script id="lessonData" type="application/json">{"title":"A hypothesis, a test and an explained fix","version":"1.0.0","language":"en-GB","duration_seconds":4500,"quiz_separate_minutes":10,"font_min":20,"font_max":200,"pages":[{"id":"start","start":0,"end":180,"title":"An explanation becomes useful when we can test it","chapter":"01 · Resume the S05 project","rule":"In S06 you investigate an incorrect interpretation of a byte. First record what you think causes it, consult Gemini or the prepared example, test one claim and preserve the repair in your own project.","method":["S05 left us with a completed function and a published version. Now we continue in the same clone rather than starting from the starter again.","Signed interpretation connects BTI concepts with program investigation: the expected result comes from the definition and the observed result comes from running the program.","After you forget the commands, retain these questions: what should have happened, what did I observe, which explanations are possible and what test distinguishes them?"],"steps":[{"title":"The case to investigate","html":"<p class=\"explain\">The application shows the same eight bits in several ways. Signed interpretation contains a declared teaching defect. Do not treat every displayed result as a correct rule; compare it with the definition. Your S05 hexadecimal implementation stays in the project.</p>"},{"title":"What you should be able to explain","html":"<p class=\"explain\">You should be able to justify the signed interpretation, reproduce the boundary failure, show a test that contradicts an overgeneralised claim and explain where the change exists after commit, push, merge and pull. A correct line of code still needs a reason.</p>"},{"title":"Where to keep the work","html":"<p class=\"explain\">Edit the files in your own clone in VS Code, run the application and tests from that clone in a browser and use your own GitHub repository for the issue and pull request. Keep a few lines in <code>PROJECT/evidence.md</code>; there is no additional S06 Moodle assignment.</p>"},{"title":"The 90-minute route","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"S06 route\"><table><caption>S06 route</caption><thead><tr><th scope=\"col\">Interval</th><th scope=\"col\">Activity</th></tr></thead><tbody><tr><th scope=\"row\">0–75 min</th><td>Investigation, test, repair and integration in your own copy</td></tr><tr><th scope=\"row\">75–85 min</th><td>Individual Q06, maximum 0.30 real points</td></tr><tr><th scope=\"row\">85–90 min</th><td>Conclusion and observed confirmations; a short commit/push if notes changed</td></tr></tbody></table></div><p class=\"explain\">Your initial hypothesis may be wrong. Keep it and explain which observation made you revise it. Q06 has its own assessment; the quiz alone does not certify a complete repository.</p><p class=\"explain\"><strong>The timings are planning estimates and have not been piloted with a class.</strong> The work intervals assume prepared tools. If work is blocked, record the problem and follow the course recovery arrangements; report the results you actually checked.</p>"}],"connection":"Start with an identified copy and the working S05 behaviour.","mistake":"Do not replace your own project with a solution copy. We need the connection between your observations and your change.","prompt":"Show the work route"},{"id":"resume","start":180,"end":480,"title":"Find the clone, branch and starting point","chapter":"01 · Resume the S05 project","rule":"The folder, origin and branch are three different facts. Check them before running or changing the project so that you do not test one copy and publish another.","method":["Use the S05 resumption note in evidence.md. If the folder no longer exists, clone your own published repository again; do not create another template repository.","Update main only after reading the status and preserving useful changes. Pulling from an unclear state does not identify the correct copy.","Run S05 first and then S06. This separates a resumption problem from the new defect we want to investigate."],"steps":[{"title":"Open the copy named in evidence.md","html":"<p class=\"explain\">In VS Code use <strong>File → Open Folder</strong> and choose the folder recorded in S05. Explorer should show <code>PROJECT</code>, <code>GUIDES</code> and <code>START.html</code> directly. Open <code>PROJECT/evidence.md</code> and read the repository, branch and first check recorded there.</p>"},{"title":"Identify the state before pulling","html":"<p class=\"explain\"><strong>Paste into: the VS Code terminal at the repository root.</strong></p><pre><code>git status\ngit remote -v\ngit branch --show-current</code></pre><p class=\"explain\">Recognise your own URL at <code>origin</code> and the <code>main</code> branch. If there are uncommitted changes, read the differences. Preserve useful work in a justified commit or ask us to inspect it before changing branches. Do not delete files just to obtain a clean state.</p>"},{"title":"Update only after checking the state","html":"<p class=\"explain\"><strong>Paste into: the VS Code terminal after useful changes are preserved and the state is understood.</strong></p><pre><code>git switch main\ngit pull --ff-only\ngit status</code></pre><p class=\"explain\">“Already up to date” is normal. <code>--ff-only</code> refuses an update that cannot advance the history directly. Keep the message and resolve the state; do not use force-push or reset to hide the difference. This pull retrieves from your online copy, not later changes to the shared template.</p>"},{"title":"Confirm that S05 is the starting point","html":"<p class=\"explain\">Use File Explorer or Finder to open <code>PROJECT/tests.html</code> from this clone. Reload the page, select <strong>S05 · Hexadecimal</strong> and click <strong>Run tests</strong>. With the supplied list and no extra tests, you have <strong>31 passed, 0 failed, 0 unimplemented</strong>. If the result differs, read the first test; do not assume it is the S06 defect yet.</p>"},{"title":"When resumption is blocked","html":"<p class=\"explain\">If published hexadecimal work, authentication or the folder is missing, retain the actual state and report the specific blockage. Do not mix a new starter ZIP into the S05 clone. Git author identity is separate from GitHub authentication. The planned pace assumes these preparations before the seminar.</p>"}],"connection":"We have a known version; now calculate the signed interpretation.","mistake":"An old browser tab may run old code. Check the folder and reload rather than relying on the project name in the tab.","prompt":"Show the resumption checks"},{"id":"signed-rule","start":480,"end":720,"title":"The same bits with different weights","chapter":"02 · The definition before the program","rule":"For an eight-bit two’s complement value, the first bit has weight −128 and the remaining weights are 64, 32, 16, 8, 4, 2 and 1. Changing the interpretation does not change the bits.","method":["The application input remains an unsigned decimal integer from 0 to 255. The signed output interprets those eight bits; it is not a different input required from the user.","Calculate the expectation without asking the program. This lets you recognise an incorrect displayed result.","The piecewise rule is useful in code; the weights explain why the rule is correct."],"steps":[{"title":"Compare the weights of the eight positions","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Byte weights from left to right\"><table><caption>Byte weights from left to right</caption><thead><tr><th scope=\"col\">Interpretation</th><th scope=\"col\">b7</th><th scope=\"col\">b6</th><th scope=\"col\">b5</th><th scope=\"col\">b4</th><th scope=\"col\">b3</th><th scope=\"col\">b2</th><th scope=\"col\">b1</th><th scope=\"col\">b0</th></tr></thead><tbody><tr><th scope=\"row\">Unsigned</th><td>128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr><tr><th scope=\"row\">Signed</th><td>-128</td><td>64</td><td>32</td><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr></tbody></table></div><p class=\"explain\">Add a weight only when the bit in that position is 1. The changed weight of b7 makes the difference.</p>"},{"title":"One case from each half","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Two examples calculated from the weights\"><table><caption>Two examples calculated from the weights</caption><thead><tr><th scope=\"col\">u</th><th scope=\"col\">Bits</th><th scope=\"col\">Unsigned</th><th scope=\"col\">Signed</th></tr></thead><tbody><tr><th scope=\"row\">64</th><td>01000000</td><td>64</td><td>64</td></tr><tr><th scope=\"row\">192</th><td>11000000</td><td>128 + 64 = 192</td><td>−128 + 64 = −64</td></tr></tbody></table></div><p class=\"explain\">For 192 retain the string <code>11000000</code>. Do not rewrite it to produce −64; read the same bits with different weights.</p>"},{"title":"Why subtract 256?","html":"<p class=\"explain\">When the first bit is 1, its contribution changes from +128 to −128. The difference is <code>−128 − 128 = −256</code>. Therefore subtract 256 from the unsigned value. When the first bit is 0, its contribution stays zero and the value is unchanged.</p>"},{"title":"The rule and the output range","html":"<p class=\"explain\"><strong>Rule:</strong> <code>s = u</code> for <code>0 ≤ u &lt; 128</code>; <code>s = u − 256</code> for <code>128 ≤ u ≤ 255</code>. The signed result is in <code>−128…127</code>. The function receives an already validated number; do not weaken validation to repair interpretation.</p>"}],"connection":"Apply the rule before looking at the program outputs.","mistake":"Two’s complement describes an interpretation at a fixed bit width. It does not make every displayed conversion result automatically correct.","prompt":"Show the weights and rule"},{"id":"signed-prediction","start":720,"end":900,"title":"Your prediction for the boundary and its neighbours","chapter":"02 · The definition before the program","rule":"Write the expected results before running. You need an independent reference to decide whether an output is correct.","method":["Calculate for 0, 127, 128, 129 and 255. The endpoints do not replace checking the point where the rule changes case.","Separate the binary string from the signed number. One test can compare two outputs and help locate the problem.","Keep the prediction even if you correct it later; its difference from the observation explains the investigation."],"steps":[{"title":"Try before revealing the answer","html":"<p class=\"explain\">In the S06 section of <code>PROJECT/evidence.md</code>, record the expected eight-bit string and signed interpretation for <strong>0, 127, 128, 129 and 255</strong>. Use the weights or the piecewise rule. Do not enter the values in the application yet. Ask: at which input does the rule change case?</p>"},{"title":"Compare with the derived results","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"S06 predictions from the definition\"><table><caption>S06 predictions from the definition</caption><thead><tr><th scope=\"col\">u</th><th scope=\"col\">Bits</th><th scope=\"col\">Signed calculation</th><th scope=\"col\">s</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td>00000000</td><td>0</td><td>0</td></tr><tr><th scope=\"row\">127</th><td>01111111</td><td>64 + 32 + 16 + 8 + 4 + 2 + 1</td><td>127</td></tr><tr><th scope=\"row\">128</th><td>10000000</td><td>−128</td><td>-128</td></tr><tr><th scope=\"row\">129</th><td>10000001</td><td>−128 + 1</td><td>-127</td></tr><tr><th scope=\"row\">255</th><td>11111111</td><td>−128 + 127</td><td>-1</td></tr></tbody></table></div>"},{"title":"The interpretation changes at the boundary","html":"<p class=\"explain\">From 127 to 128 the pattern changes from <code>01111111</code> to <code>10000000</code>. The unsigned value increases by 1, but the signed interpretation moves from 127 to −128. This is where the two cases of the definition meet. You did not change the program to obtain this expectation.</p>"},{"title":"A short note rather than a new document","html":"<p class=\"explain\"><strong>Paste into: PROJECT/evidence.md, EN-GB · S06 section; complete with your own calculation.</strong></p><pre><code>Prediction before running: u = [value]; binary = [eight bits]; signed = [number].\nReason from the definition: [weights / applicable case].\nObserved result after running: [complete later].</code></pre><p class=\"explain\">You can record the five inputs in one compact list. Do not replace the expected value with the application output when they differ.</p>"}],"connection":"Run the same inputs and read the difference without editing code.","mistake":"An expected result copied after running is no longer a prediction. Record the order and keep the initial calculation.","prompt":"Show the check after my attempt","answer_after_attempt":true},{"id":"reproduce","start":900,"end":1080,"title":"Reproduce the defect before repairing it","chapter":"03 · Observation and hypothesis","rule":"A defect is reproducible when we can identify the copy, input, expected result and observed result. Do not change the code while establishing this observation.","method":["Use the application in the S05 clone rather than a lesson archive file or another copy with the same name.","Do not confuse a correct binary display with a correct signed interpretation. Compare each output with its own prediction.","S06 tests are cumulative. Two failed checks can describe the same defective input."],"steps":[{"title":"Open the local application in your own copy","html":"<p class=\"explain\">Use File Explorer or Finder to open <code>PROJECT/index.html</code> in a browser and reload it. Select the group language under <strong>Limba / Language</strong>. Enter 0, 127, 128, 129 and 255 in the decimal input one at a time. Outputs update when the input changes; the application has no Run button.</p>"},{"title":"Compare the outputs separately","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Observation in the S05 project before the S06 repair\"><table><caption>Observation in the S05 project before the S06 repair</caption><thead><tr><th scope=\"col\">u</th><th scope=\"col\">Observed binary</th><th scope=\"col\">Expected signed</th><th scope=\"col\">Observed signed</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td>00000000</td><td>0</td><td>0</td></tr><tr><th scope=\"row\">127</th><td>01111111</td><td>127</td><td>127</td></tr><tr><th scope=\"row\">128</th><td>10000000</td><td>-128</td><td>128</td></tr><tr><th scope=\"row\">129</th><td>10000001</td><td>-127</td><td>-127</td></tr><tr><th scope=\"row\">255</th><td>11111111</td><td>-1</td><td>-1</td></tr></tbody></table></div><p class=\"explain\">At 128, <strong>Binary · exactly eight bits</strong> is correct, while <strong>Signed · two’s complement</strong> disagrees with the definition. You have observed two different outputs from the same run.</p>"},{"title":"Run the S06 stage","html":"<p class=\"explain\">In the other tab open <code>PROJECT/tests.html</code> from the same clone, reload, select <strong>S06 · Signed interpretation</strong> and click <strong>Run tests</strong>. With S05 complete and the supplied list, before adding the new custom test, expect <strong>34 passed / 2 failed / 0 unimplemented</strong>. Read the individual row for 128 and the row covering all 256 values.</p>"},{"title":"What the two failures mean","html":"<p class=\"explain\">One row checks 128 individually. Another checks the whole domain and reports <code>255/256; 128: 128 / -128</code>. They identify the same defective input rather than two independent causes. Record the observation in <code>evidence.md</code> and keep the tests unchanged. Parity belongs to S07 and is outside this stage.</p>"}],"connection":"The observation is established; write your explanation before assistance.","mistake":"Do not change expected in tests.js to remove a failure. The expectation comes from the definition rather than defective code.","prompt":"Show the reproduction steps"},{"id":"hypothesis","start":1080,"end":1320,"title":"Your hypothesis and an observation that could disprove it","chapter":"03 · Observation and hypothesis","rule":"A hypothesis is a possible explanation rather than an established result. Formulate it so that you can say which observation would support it and which would contradict it.","method":["Write before consulting Gemini and before inspecting the line to repair. Otherwise you would rephrase a solution rather than preserve your initial thinking.","A wrong guess is acceptable if you preserve it and justify its revision. Do not invent a perfect hypothesis after seeing the cause.","Distinguish the observation, what was displayed, from the proposed cause. One observation can have several possible explanations."],"steps":[{"title":"Write before opening the examples","html":"<p class=\"explain\">In <strong>My hypothesis before consulting Gemini</strong> in <code>PROJECT/evidence.md</code>, write one or two sentences: “I suspect … because I observed …”. Add a way to be wrong: “The hypothesis would be contradicted if …”. Do not inspect <code>asSigned8</code> or ask for the fix yet.</p>"},{"title":"Two possible explanations, not answers to copy","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Example hypotheses after your own attempt\"><table><caption>Example hypotheses after your own attempt</caption><thead><tr><th scope=\"col\">Possible explanation</th><th scope=\"col\">Observable prediction</th></tr></thead><tbody><tr><th scope=\"row\">The binary display loses the first bit at 128.</th><td>The displayed string for 128 will differ from 10000000.</td></tr><tr><th scope=\"row\">The signed case selection mishandles the exact boundary.</th><td>The string may remain correct while the signed output is wrong only at the boundary.</td></tr></tbody></table></div><p class=\"explain\">These examples are for comparison. Keep what you wrote first rather than replacing it with something that sounds better.</p>"},{"title":"Use the observation already obtained","html":"<p class=\"explain\">You observed <code>10000000</code> for 128. This contradicts the precise explanation “the display loses the first bit at 128”. It does not prove that all display code is correct in every situation. It is consistent with a signed interpretation problem but has not yet identified the defective line.</p>"},{"title":"Keep the hypothesis and revision separately","html":"<p class=\"explain\"><strong>Paste into: PROJECT/evidence.md, S06 section; complete briefly.</strong></p><pre><code>My hypothesis before consultation: ...\nObservation that would contradict it: ...\nWhat I know from the run so far: ...\nWhat remains to be checked: ...</code></pre><p class=\"explain\">There is no separate practical penalty for a wrong initial hypothesis. The requirement is to show why you retained or changed the explanation.</p>"}],"connection":"The issue preserves the problem and hypothesis before the repair.","mistake":"“AI says that…” is not your own hypothesis written before consultation. Preserve the actual order of the work.","prompt":"Show examples after my hypothesis","answer_after_attempt":true},{"id":"issue","start":1320,"end":1680,"title":"Issue: why a change is needed","chapter":"03 · Observation and hypothesis","rule":"An issue describes the problem, reproduction and what is known so far. It does not change the project files or mean that a repair already exists.","method":["Preserve the connection between the wrong behaviour and the later change. A title alone does not allow reproduction.","Work in your own repository. Do not send the exercise issue or PR to the shared template.","Preserve uncertainty: the hypothesis is initial and the final conclusion comes after verification."],"steps":[{"title":"Open Issues in your own repository","html":"<p class=\"explain\">In the browser open your own URL from <code>evidence.md</code>. Check the owner in the address. Choose <strong>Issues → New issue</strong>; if a template chooser appears, use the general or available option in your copy. A possible title is <strong>Signed interpretation at the byte boundary</strong>.</p>"},{"title":"Fill the description with your observations","html":"<p class=\"explain\"><strong>Paste into: the new GitHub issue description; replace the fields before posting.</strong></p><pre><code>Problem: input [u]; expected [s]; observed [result].\nReproduction: PROJECT/index.html from the S05 clone; enter [u].\nObserved binary: [eight-bit string].\nInitial hypothesis, before consultation: [my hypothesis].\nTest that could contradict it: [input and output checked].\nConclusion so far: [what is established and what remains uncertain].</code></pre>"},{"title":"Post and keep the issue address","html":"<p class=\"explain\">Submit the issue using the form button, then check the title and repository. Copy the resulting page URL into <strong>Issue URL</strong> in <code>PROJECT/evidence.md</code>. Keep the hypothesis in its initial form. A later conclusion can be added without pretending it was known at the start.</p>"},{"title":"If Issues is unavailable","html":"<p class=\"explain\">First check that this is your own copy. The owner may have the option <strong>Settings → General → Features → Issues</strong>. If settings or policy block it, keep the same text in <code>evidence.md</code>, record “issue not yet published” and report the blockage. Continue the investigation with that record; do not invent a URL or declare the step complete.</p>"}],"connection":"Our own hypothesis is recorded; now request or read an explanation.","mistake":"The issue explains why we need a change. A commit will record what changed; these are different functions.","prompt":"Show the issue steps"},{"id":"gemini","start":1680,"end":1980,"title":"Gemini or the prepared example: the same investigation","chapter":"04 · A tested claim","rule":"In S06 investigating an assisted explanation is required. Use available Gemini access without a paid subscription or a prepared teaching example; in both cases you test the claim yourself.","method":["Record the source accurately. The prepared example is not a real Gemini conversation and must not be presented as one.","Ask for questions and tests rather than replacement code before investigation. If a response immediately gives code, still identify and test a claim.","Do not spend the interval creating accounts or waiting for a limit. The prepared alternative has the same requirement without a penalty."],"steps":[{"title":"Check the order before consultation","html":"<p class=\"explain\">Have you kept your own hypothesis and definition-based expectation in <code>evidence.md</code>? If not, stop and record them now. Then choose Gemini in the browser or the prepared example. On either route select a claim, predict an output, run the test and write a conclusion. No transcript or screenshots are required.</p>"},{"title":"Main prompt if access is available","html":"<p class=\"explain\"><strong>Paste into: the Gemini prompt field after completing the bracketed fields.</strong></p><pre><code>I am investigating an unsigned byte interpreted as 8-bit two’s complement.\nMy hypothesis before consultation: [hypothesis].\nFor 127, 128, 129 and 255 I expect [results] and observe [results].\nDo not give replacement code yet. Propose two possible explanations and a test that distinguishes them.\nSeparate the binary string from signed interpretation and the definition from assumptions about the implementation.</code></pre><p class=\"explain\">Open <a href=\"https://gemini.google.com/\" target=\"_blank\" rel=\"noopener\">Gemini in a browser</a> using the access available to you. We do not assume a model, a guaranteed prompt count or automatic access through an ASE address. If access fails, use the example below.</p>"},{"title":"Prepared alternative: an explanation to investigate","html":"<p class=\"explain\"><strong>A teaching text prepared for this lesson, not a quote from a Gemini conversation.</strong> Read it after recording your own hypothesis:</p><p class=\"explain\">“The eight-bit string and signed interpretation are different outputs. Compare 127, 128 and 129, checking the string and number separately. If the string is correct but the signed value is not, inspect the signed rule’s case selection. The observations suggest where to look; the repair still needs checking in code and through tests.”</p><p class=\"explain\">Choose one claim from this text. Continue with your own prediction and run; the example did not run your project.</p>"},{"title":"Prepared alternative: a generalisation to challenge","html":"<p class=\"explain\"><strong>A second teaching text, again not attributed to an actual Gemini answer:</strong> “The function gives the correct signed results for 0 and 255, so it works for every byte value. If another value seems wrong, first check the binary display.”</p><p class=\"explain\">You may choose this claim instead of the first. Do not accept the universal conclusion just because two examples work. The next page helps you formulate a precise test before running.</p>"},{"title":"One follow-up prompt only if useful","html":"<p class=\"explain\"><strong>Paste into: Gemini as an optional follow-up after the first response.</strong></p><pre><code>The precise claim I selected is: [claim].\nI checked: [inputs and results].\nWhat counterexample could contradict it? Suggest a test and justify the expectation from the definition.\nState what cannot be concluded from these examples alone.</code></pre><p class=\"explain\">One useful response and one tested claim are enough. In <code>evidence.md</code>, honestly record <strong>Gemini</strong> or <strong>prepared example from the guide</strong>. Do not buy access for this step.</p>"}],"connection":"Turn one sentence from the response into a testable claim.","mistake":"An explanation is not evidence of a run. The response source cannot replace an observation from your own copy.","prompt":"Show the prompts and alternative after my hypothesis","answer_after_attempt":true},{"id":"claim","start":1980,"end":2280,"title":"Choose a sufficiently precise claim","chapter":"04 · A tested claim","rule":"A testable claim specifies what we should observe. “The answer is good” or “the program has a problem” is not precise enough for today’s test.","method":["Choose one claim from the Gemini response or prepared example. You do not need to summarise the whole conversation.","Establish the definition-based expectation before running. The record should allow an expected–observed comparison.","A conclusion limited to the evidence is more accurate than “AI was right” without identifying the claim."],"steps":[{"title":"Choose before the worked examples","html":"<p class=\"explain\">Select a precise sentence from the response you consulted. In <code>evidence.md</code>, record the source, claim, test input and the output that would support or contradict it. Justify your expectation from the definition. Do not reveal this page’s test explanation yet.</p>"},{"title":"Example: separate the two outputs","html":"<p class=\"explain\">Possible claim: <strong>“At the same input, the binary string can be correct while signed interpretation is wrong.”</strong> For this project choose 128 and check both outputs. From the definition expect <code>10000000</code> and <code>−128</code>. Before the repair observe <code>10000000</code> and <code>128</code>. This run demonstrates the claimed separation.</p>"},{"title":"Example: a claim about every value","html":"<p class=\"explain\">Possible claim: <strong>“If 0 and 255 are correct, the function is correct for every input.”</strong> This concerns 256 inputs. One counterexample disproves it: at 128 expect −128 and observe 128. Two correct examples do not justify the rest of the range.</p>"},{"title":"The conclusion and its limit","html":"<p class=\"explain\"><strong>Paste into: PROJECT/evidence.md, the S06 claim, prediction, test and conclusion fields.</strong></p><pre><code>Source: [Gemini / prepared example].\nClaim: [one sentence].\nBefore running I expect: [input, output and reason].\nAfter running I observe: [actual result].\nConclusion: [supported / contradicted / unresolved], because [...].\nThis test does not establish: [...].</code></pre><p class=\"explain\">One case can support a precise claim about that case. It does not automatically certify every function, every input or a repair not yet made. If the claim is ambiguous, reformulate it before testing.</p>"}],"connection":"Check that the chosen test can actually distinguish the explanations.","mistake":"Do not write “test passed” just because a claim describes what you observed. Separate program correctness from the correctness of a claim about the program.","prompt":"Show examples after my claim","answer_after_attempt":true},{"id":"discriminating-test","start":2280,"end":2520,"title":"A test that distinguishes two explanations","chapter":"04 · A tested claim","rule":"If two explanations predict the same result for the chosen test, that test does not distinguish them. Find an input or observation for which their predictions differ.","method":["The boundary and its neighbours are more informative than repeating a favourable example.","Choose the output to inspect: binary, signed interpretation or both. “Check 128” without saying what you read is incomplete.","A test can contradict a precise prediction without automatically identifying a particular line of code."],"steps":[{"title":"Propose the test before revealing the example matrix","html":"<p class=\"explain\">Use two possible explanations from your investigation. For the same test, write what each predicts. If the predictions match, change the input or inspect another output too. Record why the test could distinguish them, then run it in your own copy.</p>"},{"title":"An example prediction matrix at 128","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Different predictions for the same input\"><table><caption>Different predictions for the same input</caption><thead><tr><th scope=\"col\">Explanation</th><th scope=\"col\">Binary at 128</th><th scope=\"col\">Signed at 128</th></tr></thead><tbody><tr><th scope=\"row\">The display loses the first bit.</th><td>Different from 10000000.</td><td>The number alone does not identify the binary display.</td></tr><tr><th scope=\"row\">The interpretation excludes the boundary from its negative case.</th><td>May remain 10000000.</td><td>May stay at 128 rather than −128.</td></tr></tbody></table></div><p class=\"explain\">The observation <code>10000000</code> contradicts the first precise prediction. The wrong signed output is consistent with the second explanation; inspection of the implementation comes next for the exact cause.</p>"},{"title":"Why also check 127 and 129?","html":"<p class=\"explain\">127 should stay at 127 and 129 should be −127. If only 128 is wrong, the problem is consistent with exclusion of equality at the boundary. If every upper-half value were wrong, you would investigate a wider issue. The observation pattern narrows explanations rather than automatically proving a cause.</p>"},{"title":"Run and retain the actual conclusion","html":"<p class=\"explain\">Reload <code>PROJECT/index.html</code>, enter the chosen values and read the outputs named in your test. Complete the input, expected, observed and retained or revised explanation in <code>evidence.md</code>. You may reuse an already recorded observation, but identify that earlier run rather than claiming a new one.</p>"}],"connection":"Preserve the boundary case in a test that will run again after the repair.","mistake":"Do not infer “all display code is correct” from one correct string. Keep the conclusion within the test scope.","prompt":"Show the analysis after my proposed test","answer_after_attempt":true},{"id":"custom-test","start":2520,"end":2760,"title":"Your custom test for 128 before the repair","chapter":"05 · Preserve the evidence and repair","rule":"A regression test preserves the case that exposed the problem. Run it before the repair to observe the failure and afterwards to check that it no longer occurs.","method":["Add one object to CustomTests in custom-tests.js. Do not change tests.js or remove the supplied tests.","The signed result is a number. expected: -128 and expected: \"-128\" have different types; the test distinguishes them.","A custom test runs in every selected stage, not only S06. Understanding this avoids wrongly removing a useful test."],"steps":[{"title":"Open the existing list","html":"<p class=\"explain\">In VS Code open <code>PROJECT/custom-tests.js</code>. Find <code>globalThis.CustomTests = [</code> and the supplied binary 255 object. Keep it. If you already have a signed custom test for input 128, do not duplicate it; check its structure and expected value. This activity needs one such test.</p>"},{"title":"Add the object inside the list","html":"<p class=\"explain\"><strong>Paste into: the CustomTests array in PROJECT/custom-tests.js, before ];.</strong></p><pre><code>{ label: &#x27;Signed interpretation boundary&#x27;, input: 128, operation: &#x27;signed&#x27;, expected: -128 }</code></pre><p class=\"explain\">Add a comma after the preceding object to separate the two objects. <code>expected: -128</code> has no quotation marks. The label describes the test; <code>operation: 'signed'</code> chooses the function and <code>input</code> and <code>expected</code> define the comparison.</p>"},{"title":"Save, reload and observe the useful failure","html":"<p class=\"explain\">Save with <strong>Ctrl+S / Cmd+S</strong>. Reload the <code>PROJECT/tests.html</code> tab, select S06 and run. Before the repair you have <strong>34 passed / 3 failed / 0 unimplemented</strong> if you have exactly the supplied list and this new test. Your custom row expects −128 and observes 128. The three failures detect the same incorrect input.</p>"},{"title":"If the row is missing or types disagree","html":"<p class=\"explain\">If the row is missing, check that you saved the right file and reloaded the tab from the same clone. A message that <code>custom-tests.js</code> did not load requires checking commas, quotation marks and brackets. If actual is the number −128 but expected is the string <code>'-128'</code>, correct the expectation’s type according to the requirement; do not copy a defective actual result into expected.</p>"},{"title":"Why S05 can now report a failure","html":"<p class=\"explain\">Custom tests run in all stages. After adding this test and before the repair, S05 reports <strong>31 passed / 1 failed</strong> even though hexadecimal conversion is correct. After the repair it will report <strong>32 passed / 0 failed</strong>. Totals change if you have other custom tests. This is no reason to delete the signed test.</p>"}],"connection":"You have a failing test; prepare the branch that will preserve the repair.","mistake":"Do not accept a green result obtained by deleting the test or setting expected: 128. That would remove the evidence of the problem.","prompt":"Show how to add and check the test"},{"id":"branch","start":2760,"end":3000,"title":"A repair branch in the same clone","chapter":"05 · Preserve the evidence and repair","rule":"A branch names a line of work in Git history. It is not a new folder and does not automatically publish changes.","method":["You started from the main checked at the beginning. The notes and new test are intentional investigation changes; they are not committed yet.","Creating a branch at the same commit retains these working-tree changes. Do not pull now while those changes are present.","The branch will let a PR compare the repair with main and explain its integration."],"steps":[{"title":"Read the state of the intended changes","html":"<p class=\"explain\"><strong>Paste into: the VS Code terminal at the repository root.</strong></p><pre><code>git status\ngit branch --show-current</code></pre><p class=\"explain\">The starting branch is <code>main</code>. You may see modified <code>PROJECT/evidence.md</code> and <code>PROJECT/custom-tests.js</code>: these are the notes and test just added. Read the differences if another file appears. There is no need to pull again in this state.</p>"},{"title":"Create and activate the branch","html":"<p class=\"explain\"><strong>Paste into: the VS Code terminal after identifying the intended changes.</strong></p><pre><code>git switch -c fix/signed-boundary\ngit branch --show-current\ngit status</code></pre><p class=\"explain\"><code>switch -c</code> creates the branch at the current commit and activates it. The name check should report <code>fix/signed-boundary</code>. With the same starting commit, the modified files remain available for the repair.</p>"},{"title":"The VS Code interface route","html":"<p class=\"explain\">If you prefer the interface, open the Command Palette with <strong>Ctrl+Shift+P / Cmd+Shift+P</strong>, find <strong>Git: Create Branch</strong>, enter <code>fix/signed-boundary</code> and confirm. Check the branch name in the status bar. Use one route; do not create two branches just because both explanations are shown.</p>"},{"title":"If the branch exists or switching is refused","html":"<p class=\"explain\">An existing branch may contain an earlier attempt. Read <code>git status</code> and inspect the history before <code>git switch fix/signed-boundary</code>. If switching would overwrite work, retain the message and ask us to inspect the state. Do not delete the branch or reset to obtain the expected name. The name alone does not establish the correct version.</p>"}],"connection":"The investigation and test are preserved; inspect the function and correct the boundary.","mistake":"Before a commit, the notes and test remain in local files. The new branch has neither published them nor created a separate folder copy.","prompt":"Show branch creation"},{"id":"fix","start":3000,"end":3300,"title":"The smallest repair justified by the definition","chapter":"05 · Preserve the evidence and repair","rule":"Compare the asSigned8 condition with the two cases of the definition. Correct the boundary treatment and preserve validation, S05 hexadecimal conversion and the functions reserved for S07.","method":["Open the implementation after your own hypothesis and the test that reproduces the problem. Code inspection can now explain the observation.","A one-character change can affect an important case. A small diff does not remove the need to check it.","Do not change the display, validation and tests at the same time. Preserve a clear connection between the identified cause and the repair."],"steps":[{"title":"Try comparing with the definition first","html":"<p class=\"explain\">In VS Code open <code>PROJECT/lab.js</code> and find <code>function asSigned8(u)</code>. Your hypothesis, test and failure are already recorded. Read the condition and answer before revealing the solution: for 128, does the program choose the same case as 127 or 129? What does the definition require? Change it only if you can justify the difference.</p>"},{"title":"The exact cause of the excluded boundary","html":"<p class=\"explain\"><strong>The original line to inspect in asSigned8, not to paste over the repair.</strong></p><pre><code>return u &gt; 128 ? u - 256 : u;</code></pre><p class=\"explain\"><code>&gt;</code> is false at 128. The program therefore keeps <code>u</code>, although the definition requires the case that subtracts 256. At 129 the condition is true and the result is correct. The pattern of correct 127, incorrect 128 and correct 129 now has an implementation-based explanation.</p>"},{"title":"The justified line after your attempt","html":"<p class=\"explain\"><strong>Paste into: PROJECT/lab.js, replacing only the return line in asSigned8.</strong></p><pre><code>return u &gt;= 128 ? u - 256 : u;</code></pre><p class=\"explain\">Keep <code>validateByte(u);</code> above it. <code>&gt;=</code> includes 128 in the case that subtracts 256. Do not change <code>toHex8</code>, <code>parseByte</code>, <code>toBinary8</code> or <code>parityBit8</code>. The S07 comments and unimplemented parity results stay.</p>"},{"title":"Save and state the next check","html":"<p class=\"explain\">Save with <strong>Ctrl+S / Cmd+S</strong>. The browser does not execute unsaved code or automatically load saved changes: next reload the application and tests. Your prediction at 128 is now −128; neighbours 127 and 129 must stay at 127 and −127. Outputs at 0 and 255 must stay at 0 and −1. Do not declare the repair verified before running.</p>"},{"title":"What this change teaches","html":"<p class=\"explain\">We do not make the number negative through a display trick. We align the implementation with the definition on the valid domain. A test that failed before and passes after the change will support the repair; rerunning neighbours and the whole domain will check preservation of earlier behaviour.</p>"}],"connection":"Rerun the application, custom test and S06 stage from the saved code.","mistake":"Do not treat unimplemented parity as an S06 defect or complete it now. The selected stage defines what we check.","prompt":"Show the explanation after my attempt","answer_after_attempt":true},{"id":"retest","title":"Retest and identify what changed","chapter":"05 · Verify the fix","start":3300,"end":3480,"rule":"A test retained before and after a change shows which problem it reproduces and whether the fix removes it. Rerun behaviours that were already correct as well.","method":["Save PROJECT/lab.js, then reload the application and test page from your own clone. Tests run on a different copy do not describe the files you will publish.","Select S06 and read the individual results, including your custom test for 128. Count the results only after checking which tests are included.","Compare the results before and after the fix, then check that hexadecimal output and validation remain correct. Parity is the next seminar’s task."],"steps":[{"title":"Save, reload and check the copy","html":"<p class=\"explain\">In VS Code, save <code>PROJECT/lab.js</code> with <strong>Ctrl+S</strong> or <strong>Cmd+S</strong>. In the browser, reload <code>PROJECT/index.html</code> and <code>PROJECT/tests.html</code> from your own folder. Select your group’s language in the application; on the test page, select <strong>S06</strong> and choose <strong>Run tests</strong>. The page does not automatically load an unsaved change from the editor.</p><p class=\"explain\">If the result remains unchanged, check the open file’s path, saving and reloading before editing the function again. An unexpected result can also come from the wrong copy.</p>"},{"title":"Compare the boundary and its neighbours","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"The same inputs before and after the fix\"><table><caption>The same inputs before and after the fix</caption><thead><tr><th scope=\"col\">Input u</th><th scope=\"col\">Expected signed value</th><th scope=\"col\">Before</th><th scope=\"col\">After</th></tr></thead><tbody><tr><th scope=\"row\">127</th><td>127</td><td>127</td><td>127</td></tr><tr><th scope=\"row\">128</th><td>−128</td><td>128</td><td>−128</td></tr><tr><th scope=\"row\">129</th><td>−127</td><td>−127</td><td>−127</td></tr><tr><th scope=\"row\">255</th><td>−1</td><td>−1</td><td>−1</td></tr></tbody></table></div><p class=\"explain\">At 128, inspect binary <code>10000000</code> and signed value <code>−128</code> separately. The bits have not changed; the condition determining their interpretation has been corrected. Your custom test with <code>expected: -128</code> now passes. Its expected result remains the same as before the fix.</p>"},{"title":"A test count needs its accompanying list","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Counts for supplied tests and exactly the mandatory custom test\"><table><caption>Counts for supplied tests and exactly the mandatory custom test</caption><thead><tr><th scope=\"col\">Stage</th><th scope=\"col\">Before the fix</th><th scope=\"col\">After the fix</th></tr></thead><tbody><tr><th scope=\"row\">S06</th><td>34 pass · 3 fail · 0 unimplemented</td><td>37 pass · 0 fail · 0 unimplemented</td></tr><tr><th scope=\"row\">S05</th><td>31 pass · 1 fail · 0 unimplemented</td><td>32 pass · 0 fail · 0 unimplemented</td></tr><tr><th scope=\"row\">baseline</th><td>26 pass · 1 fail · 0 unimplemented</td><td>27 pass · 0 fail · 0 unimplemented</td></tr></tbody></table></div><p class=\"explain\">Custom tests run in every stage. After adding the signed test, even S05 and baseline therefore detect this problem. The three S06 failures observe the same defective input through different checks: the supplied example, the exhaustive check and your test. Additional custom tests change the totals.</p>"},{"title":"What the results support and where to stop","html":"<p class=\"explain\">Read the hexadecimal, binary and invalid-input checks in the S06 list too. The row covering all 256 signed values compares the entire admitted numeric domain against the test reference. For this function and domain, it is stronger evidence than a few examples.</p><p class=\"explain\">It does not establish that every future use or application file is correct. Do not edit <code>tests.js</code> or complete parity to obtain favourable results in a future stage. Keep the regression test: if the defect returns, the test should expose it.</p>"}],"connection":"Retain the actual observations in your notes and explain the current version in README.","mistake":"Do not delete the test that detected the problem or change its expected result just to make it pass.","prompt":"Show the next step"},{"id":"work-notes","title":"The notes describe completed work, not future work","chapter":"06 · Retain the explanation","start":3480,"end":3780,"rule":"Record your initial hypothesis, the checked claim and actual results. A future operation remains pending until you perform and verify it.","method":["In PROJECT/evidence.md, complete EN-GB · S06. Retain the hypothesis written before consultation even if you revised it.","In PROJECT/README.md, describe how to run the project, the corrected behaviour and the current integration state. Tick S06 after the PR, pull and tests from main.","Save both files before the remediation commit. Complete the PR URL and integration confirmation after Q06 during the seminar’s closing minutes."],"steps":[{"title":"Connect the claim to an observation","html":"<p class=\"explain\">In <code>PROJECT/evidence.md</code>, complete only your group’s language section. Retain the observed problem, your initial hypothesis and the source used: <strong>Gemini</strong> or the <strong>prepared fallback response</strong>. If you used the prepared example, do not present it as a response you personally obtained from Gemini.</p><p class=\"explain\">Record the precise claim selected, its prediction, the test input and the observed result. In your conclusion, state which explanation the observation supports and what you have not checked. A few lines are sufficient; do not transcribe the conversation or prepare screenshots.</p>"},{"title":"Retain before and after without rewriting the past","html":"<p class=\"explain\"><strong>A short model for the S06 fields in PROJECT/evidence.md; retain only results you actually observed.</strong></p><pre><code>Regression test: input 128; expected -128.\nBefore the fix: observed 128, fail.\nAfter the fix: observed -128, pass.\nMy conclusion in relation to the selected claim: [complete].\nIssue URL: [my actual issue address].\nPull request URL: pending until the PR is created.\nMerge / local main / pull confirmation: pending integration check.</code></pre><p class=\"explain\">Replace the brackets with your own information. If a result differs, record it and return to the test or function. “Pending” correctly describes a PR that does not yet exist; do not invent a PR number or completed integration.</p>"},{"title":"README describes the version we can run","html":"<p class=\"explain\">In <code>PROJECT/README.md</code>, retain the opening steps for <code>PROJECT/index.html</code> and <code>PROJECT/tests.html</code>. State that we select S06 and reload the pages after saving JavaScript. Add a short status: “Signed interpretation now includes the boundary at 128; the regression test passes on the remediation branch. Integration into main is pending.”</p><p class=\"explain\">Keep the S05 tick previously verified. Leave S06 unticked for now, because its description includes a merged PR and updated local main. Parity remains the S07 task. README should describe the actual state rather than every planned final result.</p>"},{"title":"Why a further update follows Q06","html":"<p class=\"explain\">The commit we are preparing now includes the hypothesis, claim, tests, conclusion and actual issue. It cannot include confirmation of a PR we have not created. We will verify code integration into main before Q06; in minutes <strong>85–90</strong>, complete the actual PR URL, confirmation and first check for S07.</p><p class=\"explain\">If these notes or README change, save them and make a short documentation commit followed by a push on main. This remains the same activity, with no additional Moodle submission. If integration is blocked, retain the incomplete state and the specific problem.</p>"}],"connection":"Reading the differences shows exactly which version we will record.","mistake":"Do not describe future operations as completed facts or replace your initial hypothesis with the final explanation.","prompt":"Show the next step"},{"id":"diff-stage","title":"Read the differences and stage four files","chapter":"07 · Record the work on a branch","start":3780,"end":3900,"rule":"Staging selects content for the next commit. First read what changed and retain the fix, its test and its explanation in the same version.","method":["In Source Control, check fix/signed-boundary and open the differences. The code change remains within asSigned8; preserve validation and the S05 implementation.","Stage PROJECT/lab.js, PROJECT/custom-tests.js, PROJECT/README.md and PROJECT/evidence.md. Do not automatically select files unrelated to this activity.","After staging, read Staged Changes. If you edit a file again, check the new difference and stage it again before committing."],"steps":[{"title":"First check the branch and code change","html":"<p class=\"explain\">Open <strong>Source Control</strong> in VS Code. The status bar should show <code>fix/signed-boundary</code>. Select <code>PROJECT/lab.js</code> under <strong>Changes</strong> to inspect its diff. Check the changed condition in <code>asSigned8</code> and that <code>validateByte(u)</code> remains present.</p><p class=\"explain\">Do not add a new parity function, remove validation or rewrite <code>toHex8</code>. The diff also exposes accidental changes that a single run with 128 could miss.</p>"},{"title":"Each of the four files has a reason to be included","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"What we should explain before staging\"><table><caption>What we should explain before staging</caption><thead><tr><th scope=\"col\">File</th><th scope=\"col\">What to inspect in the difference</th></tr></thead><tbody><tr><th scope=\"row\"><code>PROJECT/lab.js</code></th><td>The condition including the boundary at 128, with other behaviours preserved.</td></tr><tr><th scope=\"row\"><code>PROJECT/custom-tests.js</code></th><td>The custom signed test with numeric expected value −128, retaining existing examples.</td></tr><tr><th scope=\"row\"><code>PROJECT/evidence.md</code></th><td>Hypothesis, source, claim, prediction, results, conclusion and actual issue; PR and integration still pending.</td></tr><tr><th scope=\"row\"><code>PROJECT/README.md</code></th><td>Run instructions and current state, without prematurely ticking integration.</td></tr></tbody></table></div><p class=\"explain\">Save the files before staging them. If an unexpected file appears, read its name and difference; do not include it merely because it is listed.</p>"},{"title":"Select content, not only file names","html":"<p class=\"explain\">Choose <strong>+</strong> beside each of the four files. They appear under <strong>Staged Changes</strong>. Open that list too: it describes the content the commit will record. Staging neither publishes to GitHub nor completes a commit.</p><p class=\"explain\">If you edit <code>evidence.md</code> again after staging, the file can appear in both lists: the staged version and the later edit. Save, read the new difference and choose <strong>+</strong> again for the content you want in the commit.</p>"},{"title":"The same check through the terminal","html":"<p class=\"explain\"><strong>Alternative to the Stage buttons: the VS Code terminal, opened at the root of your own clone.</strong></p><pre><code>git branch --show-current\ngit status\ngit diff\ngit add PROJECT/lab.js PROJECT/custom-tests.js PROJECT/README.md PROJECT/evidence.md\ngit diff --staged\ngit status</code></pre><p class=\"explain\"><code>git diff --staged</code> shows the selected difference. Do not run commit or push commands until you have read it. For today’s route, the displayed branch should be <code>fix/signed-boundary</code>. If the state differs, identify the cause before continuing.</p>"}],"connection":"The commit will record the staged content in the branch’s local history.","mistake":"Selecting every file is not a substitute for reading the differences.","prompt":"Show the next step"},{"id":"commit","title":"A commit retains the fix locally","chapter":"07 · Record the work on a branch","start":3900,"end":3960,"rule":"A commit records staged content and its message in local history. On the remediation branch, it does not yet change main or publish to GitHub.","method":["In Source Control, enter a short message naming the problem corrected.","Use a plain Commit after reading Staged Changes. Do not automatically include changes that you have not staged.","Check the branch, latest commit and remaining state. A commit is a local record, which we publish in the next step."],"steps":[{"title":"The message identifies the change","html":"<p class=\"explain\">In the <strong>Source Control</strong> message field, enter <code>S06: fix the signed interpretation boundary</code>, or an equivalent short description. The message should remain useful when we return to history: identify the problem rather than writing only “done” or “update”.</p><p class=\"explain\">Check <code>fix/signed-boundary</code> in the status bar again. At the start of this operation, the four files you inspected belong under <strong>Staged Changes</strong>.</p>"},{"title":"Record only the content you inspected","html":"<p class=\"explain\">Choose <strong>Commit</strong>. If VS Code reports that no changes are staged and offers to stage them automatically, return to Stage and inspect the list; do not bypass the check. If an author identity error appears, check the name and email configuration for your own clone.</p><p class=\"explain\">Commit author identity and GitHub authentication are different matters. An error at this step is not resolved by recording an invented successful commit in your notes.</p>"},{"title":"Terminal alternative and verification","html":"<p class=\"explain\"><strong>Alternative to the Commit button: the VS Code terminal at the root of your own clone, after staging.</strong></p><pre><code>git commit -m &quot;S06: fix the signed interpretation boundary&quot;\ngit log -1 --oneline\ngit status\ngit branch --show-current</code></pre><p class=\"explain\">If you already committed through the interface, run only the three verification commands, not another commit. Read the message and branch. A successful commit has an identifier in history; a list of files saved on the computer is not the same thing.</p>"},{"title":"A clean state does not mean integration","html":"<p class=\"explain\">If no other changes remain, the working tree is clean. The fix now exists in the local history of <code>fix/signed-boundary</code>. Local <code>main</code> has not received that commit merely because we created and worked on a branch.</p><p class=\"explain\">GitHub’s <code>main</code> has not changed either. Retain this distinction even after forgetting command names: local recording, branch publication and integration are separate operations.</p>"}],"connection":"Publish your own branch, then request its integration into main through a PR.","mistake":"Do not confuse a successful commit or clean working tree with publication to GitHub.","prompt":"Show the next step"},{"id":"push","title":"Publish the branch and check where it appears","chapter":"08 · Publish and integrate","start":3960,"end":4080,"rule":"Publish Branch or push sends commits to the GitHub branch. Publishing fix/signed-boundary does not automatically integrate the fix into main.","method":["In VS Code, publish a new branch with Publish Branch. If it already tracks an online branch, use Push.","Check that origin is your own repository and publication succeeded. An error message remains a real obstruction.","In the browser, select fix/signed-boundary and inspect the commit and file. Do not check only main, which does not yet include the fix."],"steps":[{"title":"Publish Branch is the operation for a new branch","html":"<p class=\"explain\">In VS Code, choose <strong>Publish Branch</strong> for <code>fix/signed-boundary</code>. If authentication is requested, check that you sign in to your own GitHub account, then return to VS Code. If the branch already tracks its online counterpart, use <strong>Push</strong> in the Source Control menu.</p><p class=\"explain\">Do not create another repository: continue in the personal copy used in S05. <strong>Publish Branch</strong> publishes the current branch. If the interface offers <strong>Sync Changes</strong>, remember that it combines operations; use explicit Push for this step.</p>"},{"title":"The terminal alternative identifies the destination","html":"<p class=\"explain\"><strong>Alternative to Publish Branch: the VS Code terminal at the root of your own clone.</strong></p><pre><code>git remote -v\ngit branch --show-current\ngit push -u origin fix/signed-boundary</code></pre><p class=\"explain\">In <code>git remote -v</code>, <code>origin</code> should identify your copy, not the <code>antonioclim/BBS-bit-byte-starter</code> template. <code>-u</code> establishes tracking between the local and published branches. If publication through the interface already succeeded, you do not need to repeat it in the terminal.</p>"},{"title":"Check the correct branch in the browser","html":"<p class=\"explain\">Open your own repository on GitHub. Choose <code>fix/signed-boundary</code> in the branch selector. Check the latest commit message and open <code>PROJECT/lab.js</code>: the corrected condition should be present. You can also read the custom test and notes published on this branch.</p><p class=\"explain\">The default selector may show <code>main</code>. If you remain there before merging, seeing the previous version is expected. It does not mean that push automatically integrated the change or that the local file is wrong.</p>"},{"title":"If pushing fails","html":"<p class=\"explain\">Read the message: authentication, permissions, connection and an incorrect destination are different problems. Retain the local commit, check the account and your own repository address, then report the obstruction. Do not redirect origin to the shared repository to find another destination.</p><p class=\"explain\">Do not use force push as a general remedy. Until the online branch is confirmed, the correct state is “local commit; publication blocked”. Continue and recover under the existing communicated rules without inventing an integration or a new grading condition.</p>"}],"connection":"The PR will compare the published branch with main in the same personal repository.","mistake":"Do not confuse branch publication with changing main or verify a different GitHub copy.","prompt":"Show the next step"},{"id":"pull-request","title":"A PR connects the problem to the change","chapter":"08 · Publish and integrate","start":4080,"end":4200,"rule":"A pull request compares two branches and retains the explanation of a proposed integration. Both branches belong to your own repository in this activity.","method":["On GitHub, open a PR with base main and compare fix/signed-boundary, both in your own copy.","Link the actual issue and describe the test, fix and investigation conclusion. Your own PR does not establish that a colleague reviewed the change.","Read Files changed before integration. Creating a PR does not run local tests by itself and does not mean a merge has occurred."],"steps":[{"title":"Select the base and comparison branch","html":"<p class=\"explain\">In your own GitHub repository, choose <strong>Pull requests → New pull request</strong>, or the <strong>Compare &amp; pull request</strong> banner. Check <strong>base: main</strong> and <strong>compare: fix/signed-boundary</strong>. Both owner and repository positions should identify your personal copy.</p><p class=\"explain\">Do not propose the fix against the shared template. A copy created from a template has its own history. If the page says there is nothing to compare, check the branches and published commit; do not create an empty PR merely to obtain an address.</p>"},{"title":"A short description with your own information","html":"<p class=\"explain\"><strong>In your own GitHub PR description; replace the brackets before Create pull request.</strong></p><pre><code>Problem: signed interpretation of input 128.\nIssue: [the actual URL of my issue].\nFix: include the exact boundary at 128; preserve validation and hexadecimal output.\nRegression test: input 128, expected -128; before 128, after -128.\nTests run from my clone: [stage and actual observed results].\nChecked claim, source and conclusion: [complete briefly].</code></pre><p class=\"explain\">The title can be “S06: fix the signed interpretation boundary”. The issue URL is the full address of the problem opened in your own repository. If you also use <code>#NUMBER</code>, replace NUMBER with its actual number in that repository.</p>"},{"title":"Read Files changed before merging","html":"<p class=\"explain\">After <strong>Create pull request</strong>, open <strong>Files changed</strong>. Read the code difference, test and two documentation files. Compare them with the content you staged and committed locally. An S07 implementation or files unrelated to the activity should not appear.</p><p class=\"explain\">If the description states that tests passed, you must have run them from your own copy. The PR does not automatically execute these tests. This activity does not require a GitHub Actions result to replace local verification.</p>"},{"title":"What your own PR teaches us","html":"<p class=\"explain\">Keep the actual PR address in the browser tab; we will enter it in the notes after Q06. The PR now documents the problem, change and checks you report. It remains <strong>Open</strong>, and main has not received the fix.</p><p class=\"explain\">Read your own proposal before integration. This is an exercise in explanation and integration without claiming independent review by a colleague. We do not require individual approval of every PR from the teaching team when repository settings allow your own integration.</p>"}],"connection":"Merge only after reading the difference and verify the Merged result.","mistake":"Do not reverse base and compare or describe an open PR as an integrated fix.","prompt":"Show the next step"},{"id":"merge","title":"Merging changes main on GitHub","chapter":"08 · Publish and integrate","start":4200,"end":4290,"rule":"Merging the PR adds the fix to online main. It does not automatically change main in the local clone.","method":["In the PR, choose Create a merge commit, then Merge pull request and Confirm merge.","Check that the PR is Merged and read the corrected condition on online main. Closed alone does not confirm integration.","Retain the issue until local main is checked. If settings block integration, retain the state and identify the obstruction."],"steps":[{"title":"Choose the integration method","html":"<p class=\"explain\">In your own PR, after reading <strong>Files changed</strong>, open the menu beside the merge button. Choose <strong>Create a merge commit</strong>, if available and not already selected. Then choose <strong>Merge pull request</strong> and <strong>Confirm merge</strong>.</p><p class=\"explain\">Today’s route retains an integration commit visible in history. Do not select another method merely because it appears first. You do not have to delete the branch at this point to demonstrate integration.</p>"},{"title":"Merged has a precise meaning","html":"<p class=\"explain\">Read the PR state: it should be <strong>Merged</strong>. A PR can also be <strong>Closed</strong> without a merge; closing alone does not establish that the fix reached main. On the repository page, select <code>main</code> and inspect <code>PROJECT/lab.js</code> and the integration commit.</p><p class=\"explain\">The fix now exists in <strong>online</strong> main. VS Code may still show the remediation branch, while local main may retain the previous version. The browser and clone do not update each other without Git operations.</p>"},{"title":"The issue retains its link to the fix","html":"<p class=\"explain\">The actual issue and your own PR remain connected through the addresses entered in the description. After merging, we still have to update local main and run tests from that copy. During closing after Q06, add the complete result and close the issue if a link used in the PR did not close it automatically.</p><p class=\"explain\">Closing an issue organises the problem record. It does not replace a test, perform a merge or update the local clone. Even if the issue closed automatically, checking local main remains necessary.</p>"},{"title":"If the button or method is blocked","html":"<p class=\"explain\">Read the exact message: an unavailable merge method, branch restriction, conflict or check required by settings. Do not silently alter settings or bypass a rule using force push. Retain the PR, commit and problem description; report the obstruction for recovery.</p><p class=\"explain\">Do not report integrated main while the PR is merely open or closed without merging. A blockage introduces no new individual approval prerequisite for Q06 and does not silently change the mark. Your notes should show the actual state.</p>"}],"connection":"Return to your own clone and bring local main to the integrated version.","mistake":"Do not confuse Closed with Merged or assume that the online merge performed a local pull.","prompt":"Show the next step"},{"id":"pull","title":"Return to main and update the clone","chapter":"09 · Verify local integration","start":4290,"end":4380,"rule":"Switch main changes the active local branch. Pull retrieves integration from your own origin; then check the actual files in that copy.","method":["In VS Code, check that no uncommitted changes remain. Do not switch branches with newly mixed notes without understanding the state.","Return to main and run git pull --ff-only at the clone’s root. Local main advances to online main when the state permits.","Read the branch, status and history. A pull error does not establish integration and must not be hidden using reset --hard."],"steps":[{"title":"Check the state before switching branches","html":"<p class=\"explain\">Return to <strong>the same personal clone</strong> in VS Code. In Source Control, check that no uncommitted changes from the activity remain. The remediation commit should exist, and pushing and merging should have been confirmed. Do not complete the final PR/merge/pull fields in the files yet; retain that update for the closing minutes after Q06.</p><p class=\"explain\">If a new edit appears, read its difference and identify when it was made. Do not delete a file or force a branch switch merely to obtain a clean list.</p>"},{"title":"Switch and pull from the root of your own copy","html":"<p class=\"explain\"><strong>In the VS Code terminal at the root of your own clone, after successful merging and checking the state.</strong></p><pre><code>git status\ngit switch main\ngit pull --ff-only\ngit branch --show-current\ngit status\ngit log -3 --oneline</code></pre><p class=\"explain\"><code>git switch main</code> selects main in the existing clone; it does not create another folder. <code>git pull --ff-only</code> retrieves from origin and permits only a fast-forward update of the branch. If it succeeds, online integration becomes available in local main.</p>"},{"title":"What to read after the operations","html":"<p class=\"explain\"><code>git branch --show-current</code> should display <code>main</code>. In history, identify the integration commit and S06 change; in <code>PROJECT/lab.js</code>, read the condition that includes 128. <code>PROJECT/custom-tests.js</code> should contain your test. A clean working tree confirms that no other local changes remain, not that you have tested this branch.</p><p class=\"explain\">Origin is your own copy created in S05. This pull does not automatically retrieve any later changes we make to the shared template.</p>"},{"title":"If the update is refused","html":"<p class=\"explain\">Retain the message and check: are you in the correct clone, is the PR Merged, does origin identify your copy and does local main have a divergent history? <code>--ff-only</code> refuses to create an automatic new merge when a fast-forward is impossible. Resolve the specific cause before reporting that local main is updated.</p><p class=\"explain\">Do not use <code>reset --hard</code> or force push to conceal the situation. Retain the existing code and notes; if recovery cannot fit now, record the blocked operation and continue assessment under the communicated rules.</p>"}],"connection":"Test local main after integration from the clone’s updated files.","mistake":"Do not check only the branch’s fix or assume that an unsuccessful pull updated main.","prompt":"Show the next step"},{"id":"integrated-check","title":"Verify the integrated version, not a recollection","chapter":"09 · Verify local integration","start":4380,"end":4440,"rule":"The final code check is performed on local main after pulling. History, files and tests should describe the same version.","method":["Confirm main in VS Code, saved files and the local pages’ paths. Reload before testing.","Rerun S06 from the updated copy. Your test for 128 should pass together with earlier checks.","Distinguish branch publication, online integration and local updating. The closing update after Q06 documents events already observed."],"steps":[{"title":"The files come from local main","html":"<p class=\"explain\">In VS Code, <code>main</code> appears in the status bar. In the browser, open or reload <code>PROJECT/index.html</code> and <code>PROJECT/tests.html</code> from the same updated clone. Check that you have not remained on a ZIP copy or another folder opened at the start of the seminar.</p><p class=\"explain\">The browser page may still contain previously loaded JavaScript. Reloading is part of verification; pulling does not itself change an already open page.</p>"},{"title":"Run S06 again after integration","html":"<p class=\"explain\">In <code>PROJECT/tests.html</code>, select <strong>S06</strong> and run the tests. For supplied tests and exactly the mandatory custom test, the result is <strong>37 pass, 0 fail, 0 unimplemented</strong>. Read the custom row with <code>input: 128</code>, <code>expected: -128</code> and observed value <code>−128</code>.</p><p class=\"explain\">If you added further tests, the total differs; the criterion is that the relevant checks pass. Do not replace the actual list with the example count. Also check that hexadecimal output and validation remain correct.</p>"},{"title":"Locate the change at four successive points","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"The operation and the location of the fix\"><table><caption>The operation and the location of the fix</caption><thead><tr><th scope=\"col\">After the operation</th><th scope=\"col\">What exists now</th><th scope=\"col\">What does not follow automatically</th></tr></thead><tbody><tr><th scope=\"row\">Commit on <code>fix/signed-boundary</code></th><td>The version in the branch’s local history.</td><td>Publication to GitHub.</td></tr><tr><th scope=\"row\">Publish Branch / push</th><td>The same branch on GitHub too.</td><td>Integration into main.</td></tr><tr><th scope=\"row\">PR merge</th><td>The fix in online main.</td><td>An update to local main.</td></tr><tr><th scope=\"row\">Switch main + successful pull</th><td>The fix in local main.</td><td>Testing from the updated copy.</td></tr></tbody></table></div><p class=\"explain\">The final run adds evidence of behaviour in the integrated copy. This chain helps us resume on another computer or explain why two copies show different results.</p>"},{"title":"What remains to be documented","html":"<p class=\"explain\">Before Q06, the code has already been checked on local main if all steps succeeded. Published notes may still mark the PR and merge/pull fields as pending; this was declared before the commit. During closing, enter the actual addresses and confirmations, then publish the update.</p><p class=\"explain\">If a step is blocked, identify the exact state: local commit, online branch, open PR or outdated local main. Do not report a completed activity or invent results. Q06 remains the established individual assessment, without a new personal approval prerequisite for access.</p>"}],"connection":"At minute 75, move to Q06; after assessment, finish the notes and publish their update.","mistake":"Tests run before merging do not establish that the version on local main has been checked.","prompt":"Show the next step"},{"id":"quiz-transition","title":"Q06, then close the activity accurately","chapter":"10 · Assess and prepare to resume","start":4440,"end":4500,"rule":"Q06 individually checks understanding of the investigation and Git route with the permitted shared reference. The Moodle result alone does not certify the project or authorship.","method":["In minutes 75–85, complete Q06 in Moodle: 10 minutes, one attempt and at most 30 internal marks, equivalent to 0.30 real points.","Close the extended lesson, tools and AI; retain only the shared reference already permitted. Do not obtain help from classmates.","In minutes 85–90, enter actual confirmations, update the README tick and record the first S07 check. If documentation changed, commit and push it on main."],"steps":[{"title":"Prepare for individual assessment","html":"<p class=\"explain\">Open <strong>Q06</strong> in your group’s Moodle course. You have <strong>10 minutes</strong> and <strong>one attempt</strong>. Four questions are selected, each with two responses, for at most <strong>30</strong> internal marks. Within the S05–S07 contribution, Q06 provides at most <strong>0.30 real points</strong>.</p><p class=\"explain\">Navigation between questions is free. Read each instruction and check that you completed both responses before submitting the attempt. The actual settings and group window are those communicated in Moodle.</p>"},{"title":"The permitted resource remains unchanged","html":"<p class=\"explain\">Close the extended lesson, simulations and Gemini tab before the attempt. Retain only the <strong>shared reference communicated in the course</strong>. Do not consult classmates or ask AI for assessment answers. Permission to use the reference does not automatically extend to every resource available during practical work.</p><p class=\"explain\">Q06 checks understanding under these working conditions. A strong result alone does not establish that you published the repository or personally completed every operation. Keep the assessment result and the project’s actual state distinct.</p>"},{"title":"After Q06, record only observed events","html":"<p class=\"explain\">In minutes <strong>85–90</strong>, return to <code>PROJECT/evidence.md</code>. Enter the actual PR URL and confirm merging, switching to main, pulling and testing <strong>only if they succeeded</strong>. In <code>PROJECT/README.md</code>, tick S06 only after verifying everything in that line and replace the pending integration status with the actual result.</p><p class=\"explain\">For “First check in S07”, record: identify my own clone, check main and origin, read Git status and run S06 before the new task. If integration and tests from main are confirmed, add the conclusion and actual PR to the issue, then close it if still open. If blocked, record the relevant operation and message; do not tick completion. There is no additional S06 Moodle assignment.</p>"},{"title":"Publish the update and retain the method","html":"<p class=\"explain\"><strong>Only if documentation changed and main is updated: the VS Code terminal at the clone’s root, after saving and reading the difference.</strong></p><pre><code>git branch --show-current\ngit diff -- PROJECT/evidence.md PROJECT/README.md\ngit add PROJECT/evidence.md PROJECT/README.md\ngit diff --staged\ngit commit -m &quot;S06: record integration and prepare to resume&quot;\ngit push origin main\ngit status</code></pre><p class=\"explain\">The branch should be <code>main</code>. This short cycle publishes notes about completed operations; it requires no further implementation or separate submission. Check on GitHub that the latest update appears in main. If nothing changed, do not create an empty commit; if integration is blocked, retain the state and arrange recovery.</p><p class=\"explain\">What remains useful: define the expected behaviour, formulate a hypothesis, choose a test that could refute it and identify which copy contains the change. The method also applies to tax thresholds, age limits or validation rules; fluent explanations need observational checks.</p>"}],"connection":"S06 ends here. In S07, we will address the individual requirement and check reproducibility of the final version.","mistake":"Do not assume the Moodle mark confirms integration or retain actual updates only in local files.","prompt":"Show the next step"}],"math_checks":[],"rehearsal":[]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
