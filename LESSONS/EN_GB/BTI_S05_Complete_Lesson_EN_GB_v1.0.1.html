function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Example hidden':state.all[i]?`All ${p.steps.length} steps shown`:`Example step ${f+1} of ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'COMPLETE WORKING':`STEP ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Previous step</button><button data-action="all" data-index="${i}">Full working</button><button data-action="hide" data-index="${i}">Hide example</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Back to the method ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Lesson map':'← Previous topic';$('nextBtn').textContent=state.index===pages.length-1?'Restart lesson ↺':'Next topic →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Return to lesson':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Optional panel. Next topic returns to the lesson and advances.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Example hidden':'Example shown'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Topic ${state.index+1} of ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Example hidden until requested.':'Example shown.'}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lesson restarted. All worked examples are hidden.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Continuous lesson: all methods visible; examples still controlled individually.':'Presentation: one topic at a time.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Return to lesson</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['byte','hex','git'].includes(which)){h=s05Panel(which);}
else if(which==='map'){h=panelHead("Lesson map")+`<p>Read the project, predict its behaviour, implement one function and verify the result. Then follow the change from the saved file to the index, local commit and GitHub repository.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Present one topic":"Read the continuous lesson"}</button><button data-command="tools">Checking tools</button><button data-command="reference">Shared reference</button><button data-command="help">Display and help</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">The proposed 90-minute route gives 75 minutes to the project, 10 minutes to Q05 and five minutes to finish. Tools prepared before class are necessary for this pace. These times have not been measured for every group.</p></div>`;}
else if(which==='help'){h=panelHead('Reading, navigation and display')+`<p><b>The explanations are visible from the start.</b> Use E or the green button to reveal the example one step at a time. The right arrow moves to the next topic even when the example is unfinished. Full working displays all its steps after your own attempt.</p><p><a href="BTI_S05_Lesson_Text_EN_GB_v1.0.1.html">Open the complete reading version</a>. It contains the same explanations and examples and needs no JavaScript. Keep both files in the same folder after downloading. In Moodle, use the separate reading link as well.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Lesson text scale: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− and A+ change the text by five percentage points. Enter a percentage for an exact size. Scroll longer explanations and wide tables. Choose a size for the actual screen and viewing distance.</p><div class="panel-controls"><button data-command="theme">Switch light/dark theme</button><button data-command="fullscreen">Full screen</button><button data-command="blank">Blank screen (B)</button><button data-command="tools">Tools and timer</button></div><h2>Keys</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Letter shortcuts: on':'Letter shortcuts: off'}</button></div><p class="small">Turn character shortcuts off if they interfere with typing or voice control. Arrows, Escape and on-screen buttons still work.</p><p>← / →: previous / next topic. E: show or advance an example. Shift+E: previous step. H: hide example. M: lesson map. F: full screen. B: blank screen. Escape: return to the lesson or restore keyboard focus.</p><p class="small">Inside form fields, arrows retain their editing function. Escape returns to the lesson. Alt+← / Alt+→ also navigate from a field.</p><h2>What we learn and why</h2><p>We complete one byte representation function in an existing project. A precise input and output contract lets us make a prediction, change the function and examine what each test demonstrates.</p><p>After forgetting the commands, retain the distinctions: Save updates a working file, Stage selects its snapshot, Commit records the selected snapshot locally and Push transmits existing commits. Check the actual file on GitHub after pushing.</p><h2>The connection with S06–S07</h2><p>S06 investigates a defect through a hypothesis and tests. S07 adds an individual requirement and reproduces the result. S05 establishes the project copy, the first completed function and the working method.</p><h2>Practice and assessment</h2><p>Make your own prediction and attempt before revealing worked answers or using a tool. Optional Gemini clarification follows the attempt; verify its claims and never use it in Q05. During Q05 use only the existing shared reference and resources announced in the course. Close the lesson tools and worked answers. Q05 gives at most 0.2 real points; all three project quizzes give at most 1 point in total. A quiz score does not certify who made a repository change.</p><h2>Tool conventions</h2><p>The decimal parser reproduces the starter project: decimal digits, optional surrounding spaces and an integer from 0 to 255. It does not accept hexadecimal input, exponents or signs. The additional 128-character limit belongs only to this teaching tool. The Git panel is a simulation, with no connection to your files or account.</p><p class="small">The downloaded files work offline. Use the reading version to print all explanations and steps.</p></div>`;}
else if(which==='reference'){h=panelHead("Shared reference")+S05REFERENCE+'</div>';}
else if(which==='tools'){const u=S05UI;h=panelHead("Checking tools")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="byte">${u.byteTitle}</button><button data-command="hex">${u.hexTitle}</button><button data-command="git">${u.gitTitle}</button><button data-command="reference">Shared reference</button></div><h2>Practice timer</h2><p>The timer does not reveal answers, advance topics or control a Moodle assessment’s time limit.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4500">75 min</button><button data-command="timerPause">Pause / resume</button><button data-command="timerOff">Hide timer</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S05UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S05UI.errors[err.code||err.message]||S05UI.unexpectedError;box.textContent=message;say(S05UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS05Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Time finished · ':timer.running?'Practice · ':'Paused · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('Full screen was refused. Use the browser’s own full-screen command.');}}
function blank(){const open=$('blank').hidden;$('blank').hidden=!open;$('app').inert=open;if(open)$('blank').focus();else $('stage').focus({preventScroll:true});}
function command(cmd){if(cmd==='shortcuts'){state.shortcuts=!state.shortcuts;applyPrefs();openPanel('help');return;}if(cmd==='return'){go(state.index,{keep:true});return;}if(cmd==='reading'){mode();return;}if(cmd==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyPrefs();return;}if(cmd==='fullscreen'){fullscreen();return;}if(cmd==='blank'){blank();return;}if(cmd==='timerPause'){timerPause();return;}if(cmd==='timerOff'){timer.running=false;$('timerReadout').hidden=true;return;}openPanel(cmd);}

const S05REFERENCE="<section id=\"format-reference\"><h2>Shared reference</h2><p>This preserves the shared reference content from project v0.4.0. Use it in practice and in Q05 under the rules communicated in the course. It also includes S06–S07 concepts, which are not implementation requirements today. In Q05, close the extended lesson, calculation tools and AI; keep only the permitted reference.</p><section class=\"section\" id=\"shared-ref-byte\"><h2>Eight data bits</h2><p>The input is a decimal integer <code>u</code> from <strong>0 to 255</strong> inclusive. Leading and trailing spaces are ignored; leading zeros are accepted. Empty input, text, negatives, fractions and 256 are rejected. The eight binary positions have weights <code>128, 64, 32, 16, 8, 4, 2, 1</code>.</p><p>One hexadecimal digit represents four bits because <code>16 = 2⁴</code>. Therefore a byte needs exactly two hexadecimal characters, including a leading zero where required. Digits 10–15 are <code>A–F</code>. For example, <code>5 → 00000101 → 05</code> and <code>255 = 15 × 16 + 15 → FF</code>.</p><p>For eight-bit two’s complement, interpret the same pattern as <code>s = u</code> for <code>0 ≤ u &lt; 128</code>, or <code>s = u − 256</code> for <code>128 ≤ u ≤ 255</code>. The range is <strong>−128 to 127</strong>. The leftmost bit has weight −128 in this interpretation; the stored bits do not change.</p><div class=\"tablewrap\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Unsigned u</th><th scope=\"col\">Eight bits</th><th scope=\"col\">Hex</th><th scope=\"col\">Signed s</th></tr></thead><tbody><tr><td>0</td><td>00000000</td><td>00</td><td>0</td></tr><tr><td>5</td><td>00000101</td><td>05</td><td>5</td></tr><tr><td>127</td><td>01111111</td><td>7F</td><td>127</td></tr><tr><td>128</td><td>10000000</td><td>80</td><td>−128</td></tr><tr><td>129</td><td>10000001</td><td>81</td><td>−127</td></tr><tr><td>255</td><td>11111111</td><td>FF</td><td>−1</td></tr></tbody></table></div></section><section class=\"section\" id=\"shared-ref-parity\"><h2>One separate parity bit</h2><p>Let <code>k</code> count the 1 bits in the eight data bits. Append a numeric bit <code>p</code> at the right. <strong>A · even:</strong> <code>p = k % 2</code>, making <code>k + p</code> even. <strong>B · odd:</strong> <code>p = 1 − (k % 2)</code>, making <code>k + p</code> odd.</p><div class=\"tablewrap\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Data</th><th scope=\"col\">Count k</th><th scope=\"col\">A · even p</th><th scope=\"col\">B · odd p</th></tr></thead><tbody><tr><td>3 · 00000011</td><td>2</td><td>0</td><td>1</td></tr><tr><td>7 · 00000111</td><td>3</td><td>1</td><td>0</td></tr></tbody></table></div><p>The transmitted display has <strong>nine bits</strong>: eight data bits plus a separate check bit. A single bit flip changes parity; any odd number of flips does so. An even number can preserve it. A parity check does not locate or correct the error.</p></section><section class=\"section\" id=\"shared-ref-git\"><h2>Git actions and where the result exists</h2><div class=\"tablewrap\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Result and useful check</th></tr></thead><tbody><tr><td>Save</td><td>Writes a file in your local folder. Reload the browser to use saved code.</td></tr><tr><td>Diff</td><td>Shows the changed content. <code>git diff</code> shows unstaged changes.</td></tr><tr><td>Stage</td><td>Selects the content of the next commit. <code>git diff --cached</code> shows that selection.</td></tr><tr><td>Commit</td><td>Records the staged version in local Git history. It is not published yet.</td></tr><tr><td>Push</td><td>Sends local commits to <code>origin</code>, normally your own GitHub repository.</td></tr><tr><td>Clone</td><td>Creates a local working copy and Git history from the remote URL.</td></tr><tr><td>Issue</td><td>Describes a problem, observations and a hypothesis in your own repository.</td></tr><tr><td>Branch</td><td>Names the separate line on which you make a repair.</td></tr><tr><td>Pull request</td><td>Explains a branch change proposed for integration into <code>main</code>.</td></tr><tr><td>Merge then pull</td><td>Merge integrates on GitHub; <code>git pull --ff-only</code> updates local <code>main</code> afterwards.</td></tr></tbody></table></div><p><code>origin</code> is the remote’s name; <code>main</code> is the main branch in this project. If you edit a file after staging it, stage the new content again before committing.</p><p><code>git status</code> checks branch and local changes; <code>git remote -v</code> checks the remote URL; <code>git branch --show-current</code> checks the branch; <code>git rev-parse HEAD</code> prints the full current commit identifier. A clean working tree alone does not prove that you pushed.</p></section><section class=\"section\" id=\"shared-ref-method\"><h2>Investigation, reproduction and assessment</h2><p><strong>Investigation:</strong> own hypothesis → one AI claim or prepared response → predicted test result → observed result → conclusion. Test the point where a rule changes and rerun previously correct cases. One counterexample contradicts a claim that something works for every valid input; a few passing examples do not establish such a universal claim.</p><p><strong>Reproduction:</strong> finish and push → clone into a different folder → check <code>main</code>, clean status and the same full SHA → open the fresh clone’s HTML files → rerun the reported tests. Put the final SHA in Moodle after the last commit and push, not inside a file belonging to that commit.</p><p><strong>Quizzes:</strong> individual, no AI or classmates, this reference allowed. Q05: 10 minutes and maximum 0.20 real points; Q06: 10 minutes and 0.30; Q07: 15 minutes and 0.50. Total maximum: one real point. The final online-text assignment is compulsory and ungraded.</p></section>\n</section>";
const S05UI={"byteTitle": "Represent the same byte", "hexTitle": "Follow the hexadecimal string stages", "gitTitle": "Simulate save, stage, commit and push", "attempt": "Write your own prediction first. Then use this tool to compare it with a computed result. Close the tools before Q05; they are not an authorised quiz resource.", "decimal": "Decimal input, 0–255", "reveal": "Check my prediction", "other": "Other tools", "value": "Validated number", "binary": "Exactly eight binary digits", "hex": "Exactly two uppercase hexadecimal characters", "stageCaption": "A number becomes a string in three steps", "operation": "Operation", "result": "Result", "gitIntro": "This is a simulation of one tracked file on one branch. It does not change your project, VS Code, Git or GitHub. The initial state has every file snapshot v0 and both HEADs c0. Returning to this panel retains its state; use Reset for a fresh run. Each Save action creates a new imagined file revision. The index is the staged snapshot; a commit records that snapshot, while push transmits existing local commits.", "gitAttempt": "Predict which snapshots the next action changes. Try Save → Stage → Save → Commit. What is committed, and which edit is still unstaged?", "gitActions": {"save": "Save a new revision", "stage": "Stage current working file", "commit": "Commit staged snapshot", "push": "Push local commits", "reset": "Reset simulation"}, "gitCaption": "Simulated Git snapshots", "place": "Location", "snapshot": "File snapshot", "commitId": "Commit identifier", "working": "Working file", "index": "Index / staging area", "head": "Local HEAD", "remote": "Remote HEAD", "none": "Not a commit", "yes": "Yes", "no": "No", "unstaged": "Unstaged change: working file differs from index", "staged": "Staged change: index differs from local HEAD", "outgoing": "Local commits not yet pushed", "clean": "Working tree and index are clean", "published": "Local HEAD has been pushed", "noChange": "This action had nothing to change in the simulation.", "gitLimit": "A clean working tree does not show that local commits are published. The simulation has no concurrent remote changes, conflicts, credentials, hooks or network failures; check the actual repository separately.", "resultReady": "The comparison result is displayed.", "unexpectedError": "The comparison could not be completed. Check the input and try again.", "errorPrefix": "Cannot process the input: ", "errors": {"INPUT_TOO_LONG": "Use at most 128 characters in this teaching tool. Enter a decimal integer from 0 to 255.", "INVALID_BYTE_INPUT": "Enter decimal digits only, with optional surrounding spaces. This project parser does not accept signs, decimal points, exponents or a 0x prefix.", "BYTE_RANGE": "The decimal integer must be between 0 and 255 inclusive. Do not wrap a larger value into a byte.", "INVALID_GIT_ACTION": "Choose Save, Stage, Commit, Push or Reset in this simulation.", "INVALID_GIT_STATE": "The simulation state is invalid. Reset the simulation before continuing.", "SIMULATION_LIMIT": "The simulation has reached its revision limit. Reset it before continuing."}};
'use strict';

// Pure teaching helpers. They do not read or change files, Git or GitHub.
function s05Error(code) {
  const error = new Error(code);
  error.code = code;
  throw error;
}

function parseByteInput(raw) {
  const input = String(raw);
  if (input.length > 128) s05Error('INPUT_TOO_LONG');
  const text = input.trim();
  if (!/^\d+$/.test(text)) s05Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s05Error('BYTE_RANGE');
  return value;
}

function byteRepresentation(raw) {
  const value = parseByteInput(raw);
  return {
    value,
    binary: value.toString(2).padStart(8, '0'),
    hex: value.toString(16).padStart(2, '0').toUpperCase()
  };
}

function hexStages(raw) {
  const value = parseByteInput(raw);
  const base16 = value.toString(16);
  const padded = base16.padStart(2, '0');
  return {value, base16, padded, uppercase: padded.toUpperCase()};
}

function createGitState() {
  return {
    working: 'v0', index: 'v0',
    head: {id: 'c0', snapshot: 'v0'},
    remote: {id: 'c0', snapshot: 'v0'},
    history: [{id: 'c0', snapshot: 'v0', parent: null}],
    revision: 0, commitNumber: 0, lastAction: 'reset', changed: false
  };
}

function s05GitState(state) {
  if (!state || typeof state !== 'object' || !Number.isSafeInteger(state.revision) || state.revision < 0 ||
      !Number.isSafeInteger(state.commitNumber) || state.commitNumber < 0 ||
      !/^v\d+$/.test(state.working) || !/^v\d+$/.test(state.index) ||
      !state.head || !state.remote || !Array.isArray(state.history) || state.history.length < 1 ||
      !state.history.every((item, i) => item && item.id === 'c' + i && /^v\d+$/.test(item.snapshot) && item.parent === (i ? 'c' + (i - 1) : null)) ||
      state.commitNumber !== state.history.length - 1 || state.head.id !== 'c' + state.commitNumber ||
      state.head.snapshot !== state.history[state.commitNumber].snapshot ||
      !state.history.some(item => item.id === state.remote.id && item.snapshot === state.remote.snapshot)) s05Error('INVALID_GIT_STATE');
  return state;
}

function gitSummary(state) {
  const current = s05GitState(state);
  const remoteIndex = current.history.findIndex(item => item.id === current.remote.id);
  const outgoingCount = current.history.length - remoteIndex - 1;
  const unstaged = current.working !== current.index;
  const staged = current.index !== current.head.snapshot;
  return {
    working: current.working, index: current.index,
    localHEAD: {...current.head}, remoteHEAD: {...current.remote},
    unstaged, staged, outgoing: outgoingCount > 0, outgoingCount,
    workspaceClean: !unstaged && !staged,
    published: current.head.id === current.remote.id,
    lastAction: current.lastAction, changed: current.changed,
    simulation: true
  };
}

function gitStep(state, action) {
  if (!['save', 'stage', 'commit', 'push', 'reset'].includes(action)) s05Error('INVALID_GIT_ACTION');
  s05GitState(state);
  if (action === 'reset') return createGitState();
  const next = {
    ...state, head: {...state.head}, remote: {...state.remote},
    history: state.history.map(item => ({...item})), lastAction: action, changed: false
  };
  if (action === 'save') {
    if (next.revision >= Number.MAX_SAFE_INTEGER) s05Error('SIMULATION_LIMIT');
    next.revision++;
    next.working = 'v' + next.revision;
    next.changed = true;
  } else if (action === 'stage') {
    next.changed = next.index !== next.working;
    next.index = next.working;
  } else if (action === 'commit') {
    if (next.index !== next.head.snapshot) {
      next.commitNumber++;
      const item = {id: 'c' + next.commitNumber, snapshot: next.index, parent: next.head.id};
      next.history.push(item);
      next.head = {id: item.id, snapshot: item.snapshot};
      next.changed = true;
    }
  } else if (action === 'push') {
    next.changed = next.remote.id !== next.head.id;
    next.remote = {...next.head};
  }
  return next;
}

function bindS05Panel(){const u=S05UI,b=$('byteForm');if(b)b.onsubmit=e=>{e.preventDefault();showTool(()=>{const r=byteRepresentation($('byteValue').value);return `<p>${u.value}: <b>${r.value}</b>.</p><p>${u.binary}: <span class="numeral">${r.binary}</span>.</p><p>${u.hex}: <span class="numeral">${r.hex}</span>.</p>`;});};
