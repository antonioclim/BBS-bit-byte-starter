<script id="lessonData" type="application/json">{"title":"Your first tested and published change","version":"1.0.1","language":"en-GB","duration_seconds":4500,"quiz_separate_minutes":10,"font_min":20,"font_max":200,"pages":[{"id":"start","title":"Take over a project and publish your first change","chapter":"01 · Starting point","start":0,"end":180,"rule":"In S05 you take over an existing BTI project, complete one function and check the version that reaches your GitHub repository. Hexadecimal representation provides the concrete problem through which you learn this workflow.","method":["In S01–S04 you worked with representations and verifiable conditions. A BTI requirement must now become correct behaviour in a program, then an identifiable change in the project history.","We use the same project in S05–S07. Today we complete only toHex8; investigation of signed interpretation and the parity task remain for the following seminars.","After you forget the menus, you should still be able to establish what you changed, how you checked it and where the version exists. These questions remain useful in an assignment, a team or when you resume work two weeks later."],"steps":[{"title":"What you will have at the end","html":"<p class=\"explain\">You will have a repository under your account, a local copy with Git history and a published change: representing a byte using exactly two uppercase hexadecimal characters. You will keep a few notes in the project so that you can resume work in S06.</p>"},{"title":"The same value in different forms","html":"<p class=\"explain\">A number can be written in decimal, binary or hexadecimal without changing its value. The program must also satisfy the requested format: the number of characters and the use of uppercase letters. This is a requirement that we can test precisely.</p>"},{"title":"Where does the change exist?","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Initial landmarks for working with Git\"><table><caption>Initial landmarks for working with Git</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Immediate effect</th></tr></thead><tbody><tr><th scope=\"row\">Save a file</th><td>Its content changes on your computer.</td></tr><tr><th scope=\"row\">Make a commit</th><td>Git records the selected content locally.</td></tr><tr><th scope=\"row\">Push</th><td>You send commits to the remote repository.</td></tr></tbody></table></div><p class=\"explain\">We will also introduce the selection step, called <em>staging</em>. For now, remember that saving, committing and pushing are separate actions.</p>"},{"title":"How we use the 90 minutes","html":"<p class=\"explain\">The first 75 minutes cover preparation, project work, checking and publication. They are followed by 10 minutes for the individual Q05 quiz and 5 minutes for closing. This pace assumes that the tools were prepared before the seminar; the explanations remain available afterwards.</p><p class=\"explain\"><strong>The timings are planning estimates and have not been piloted with a class.</strong> The work intervals assume prepared tools. If work is blocked, record the problem and follow the course recovery arrangements; report the results you actually checked.</p>"}],"connection":"We begin by recognising the tools and the accounts in which we work.","mistake":"A tick or a green result alone does not establish where the code exists or who wrote it. You should be able to explain the steps and identify the published version.","prompt":"Show the first step"},{"id":"preflight","title":"Check preparation and distinguish the tools","chapter":"01 · Starting point","start":180,"end":600,"rule":"Git keeps versions; GitHub hosts the repository; VS Code is the editor; the browser opens the application, tests and online services. Each has a distinct role.","method":["The opening check helps distinguish a preparation problem from a code problem. We do not install libraries for this project or build a server.","You need Git, VS Code, a browser, your GitHub account and access to the BTI Moodle course. Gemini access is optional in S05.","On a computer used by several students, author identity and authentication are separate matters. Use your own session according to the laboratory procedure."],"steps":[{"title":"Recognise the roles","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Tools used in S05\"><table><caption>Tools used in S05</caption><thead><tr><th scope=\"col\">Tool</th><th scope=\"col\">Role in the activity</th></tr></thead><tbody><tr><th scope=\"row\">Git</th><td>Keeps local history and transfers commits to a remote.</td></tr><tr><th scope=\"row\">GitHub</th><td>Hosts your copy and lets you check the published commit.</td></tr><tr><th scope=\"row\">VS Code</th><td>Opens the folder, edits files and provides Source Control.</td></tr><tr><th scope=\"row\">Browser</th><td>Runs local HTML pages and opens GitHub or Moodle.</td></tr></tbody></table></div><p class=\"explain\">Installing VS Code does not replace installing Git. The application opens directly from a file: it requires neither Node.js, Python nor Live Server.</p>"},{"title":"Check Git in the terminal","html":"<p class=\"explain\">In VS Code choose <strong>Terminal → New Terminal</strong>. Paste the command below into the terminal, then press Enter; do not place it in a JavaScript file.</p><pre><code>git --version</code></pre><p class=\"explain\">The result should begin with <code>git version</code>. This checks installation; it neither creates a repository nor authenticates you with GitHub. If Git is not recognised, reopen VS Code after the prepared installation; report the problem if it persists.</p>"},{"title":"Check the accounts","html":"<p class=\"explain\">Open GitHub in the browser and check the username in the account menu. Then open <code>online.ase.ro</code> and your group’s BTI course. When cloning or pushing, VS Code may request separate authentication; check which account you authorise then too.</p>"},{"title":"Choose the parent directory","html":"<p class=\"explain\">Use a location that you can find again, such as <code>Documents/BTI</code>. During cloning, Git will create the repository folder inside it. Choose a location that survives sign-out and distinguish the parent directory from the project folder.</p>"},{"title":"Prepare author identity and distinguish it from access","html":"<p class=\"explain\">A commit records an author name and email. We will configure these locally after cloning. If you choose a <code>noreply</code> address, copy it exactly from GitHub <strong>Settings → Emails</strong>. The name and email do not change the account authenticated for pushing. On a shared computer, follow the laboratory procedure if another person’s account appears.</p>"}],"connection":"With the tools prepared, we create the copy that will receive your changes.","mistake":"Do not initialise an empty repository as a substitute for the required copy. Do not put passwords or tokens in code or in commands stored in project files.","prompt":"Check the first landmark"},{"id":"template","title":"Create your repository from the template","chapter":"02 · Your own copy","start":600,"end":900,"rule":"The template provides the shared starting point. The new repository belongs to your account and will keep your changes; you do not work in the series’ shared repository.","method":["The common source gives us the same application and requirement. Personal repositories make it possible to identify a version without mixing students’ work.","Creating from the template places the starter files in a new repository. You do not need every GitHub option now: identify the source, owner, branch and resulting address.","At the end of this step you should be able to name the shared source and the address of your own copy. Use the latter for cloning and pushing."],"steps":[{"title":"Recognise the shared source","html":"<p class=\"explain\">In the browser open <a href=\"https://github.com/antonioclim/BBS-bit-byte-starter\">BBS-bit-byte-starter</a>. Recognise <code>PROJECT</code>, <code>GUIDES</code> and <code>START.html</code> at the root. This material was built for the verified v0.4.0 starter; do not edit the shared source.</p>"},{"title":"Create the copy","html":"<p class=\"explain\">Choose <strong>Use this template → Create a new repository</strong>. Select your account as <strong>Owner</strong>. Use the name communicated to your group or, if no naming rule exists, a recognisable name such as <code>bti-byte-lab</code>. Copy only the default branch; do not select the option to include all branches.</p>"},{"title":"Select the visibility communicated to the group","html":"<p class=\"explain\">Follow the course’s visibility rule. A public repository can be read through its link; for a private repository, sending a link does not automatically grant another person access. Visibility does not change the local steps for saving, committing and pushing.</p>"},{"title":"Check the result before cloning","html":"<p class=\"explain\">After creation, the header and address should contain <code>YOUR_ACCOUNT/YOUR_REPOSITORY</code>. Check the three root landmarks again. If <strong>Use this template</strong> is missing, check the link and sign-in and report the problem; do not substitute an empty repository on your own initiative.</p>"}],"connection":"We now copy the URL of your own repository and clone it in VS Code.","mistake":"If the address still shows antonioclim/BBS-bit-byte-starter, you are viewing the shared source. The working copy must belong to your account.","prompt":"Show the browser steps"},{"id":"clone","title":"Clone your copy and check origin","chapter":"02 · Your own copy","start":900,"end":1200,"rule":"Cloning brings files and Git history into a local folder and sets up a connection usually named origin. For this activity, origin must point to your own repository.","method":["A ZIP supplies files for reading; cloning also prepares the history and the connection through which you will publish. We therefore use cloning for the work.","Work at the root of the cloned repository: PROJECT, GUIDES and START.html appear directly there. Run Git commands in the terminal for this folder.","Checking origin before editing prevents confusion between the shared source and the destination of your own commits. Configure author identity after opening the correct folder."],"steps":[{"title":"Copy the correct URL","html":"<p class=\"explain\">In <strong>your repository</strong> on GitHub choose <strong>Code → HTTPS</strong> and copy the URL ending in <code>.git</code>. Check the account name in the address. It must be yours.</p>"},{"title":"Use Git: Clone in VS Code","html":"<p class=\"explain\">Open the Command Palette with <strong>Ctrl+Shift+P</strong> on Windows/Linux or <strong>Cmd+Shift+P</strong> on macOS. Choose <strong>Git: Clone</strong>, enter the copied URL and select the prepared parent directory. At the end choose <strong>Open</strong> for the new folder. If a trust question appears, first check that you opened the supplied project in your own copy.</p>"},{"title":"Check the folder, branch and destination","html":"<p class=\"explain\">In VS Code you should see <code>PROJECT</code>, <code>GUIDES</code> and <code>START.html</code> directly. Open <strong>Terminal → New Terminal</strong> and run the commands one at a time:</p><pre><code>git status\ngit remote -v\ngit branch --show-current</code></pre><p class=\"explain\">Initially you expect branch <code>main</code>, a clean local state and your address at <code>origin</code> for both fetch and push. <code>origin</code> is a local name for the remote, not a username or proof of authentication.</p>"},{"title":"Configure the author for this repository only","html":"<p class=\"explain\">In the same terminal replace the quoted placeholders with your chosen name and email, then run:</p><pre><code>git config user.name &quot;Chosen name&quot;\ngit config user.email &quot;EXACT_CHOSEN_EMAIL_ADDRESS&quot;\ngit config --get user.name\ngit config --get user.email</code></pre><p class=\"explain\">The first two commands usually print nothing when successful; the last two display the values. Without <code>--global</code>, this configuration applies only to this repository. It does not change the account authenticated for pushing.</p>"},{"title":"Resolve folder confusion before editing","html":"<p class=\"explain\">If <code>git status</code> reports <code>not a git repository</code>, use <strong>File → Open Folder</strong> to open the cloned folder rather than its parent. If <code>origin</code> shows the shared template, you cloned the source; open your own copy in a separate folder. Do not continue on the assumption that pushing will automatically find the right destination.</p>"}],"connection":"In the checked copy, we identify the files that we will run and modify.","mistake":"Do not use git init in the wrong folder merely to remove the message. The correct clone already contains the repository and history.","prompt":"Show the VS Code steps"},{"id":"project-files","title":"Find the files and open the same copy","chapter":"03 · Observe before editing","start":1200,"end":1440,"rule":"The editor and browser must use the same local copy. PROJECT/lab.js contains the logic to edit; PROJECT/index.html displays the application; PROJECT/tests.html checks the selected stage.","method":["You do not need to read an existing project in full before the first change. Locate its entry point, target function, tests and work notes.","This lesson may be downloaded separately from Moodle. The PROJECT and GUIDES files are in the cloned repository, not beside this lesson file.","We distinguish observing a result from checking it. The application also displays functions prepared for later stages that are not yet complete."],"steps":[{"title":"A minimal project map","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Files to recognise in the cloned copy\"><table><caption>Files to recognise in the cloned copy</caption><thead><tr><th scope=\"col\">File</th><th scope=\"col\">Role</th></tr></thead><tbody><tr><th scope=\"row\">PROJECT/index.html</th><td>Opens the application in the browser.</td></tr><tr><th scope=\"row\">PROJECT/tests.html</th><td>Opens local tests in the browser.</td></tr><tr><th scope=\"row\">PROJECT/lab.js</th><td>Contains the functions; in S05 change only the return inside toHex8.</td></tr><tr><th scope=\"row\">PROJECT/evidence.md</th><td>Keeps your own notes and information for resuming work.</td></tr><tr><th scope=\"row\">PROJECT/README.md</th><td>Explains how to run the project and records progress.</td></tr><tr><th scope=\"row\">GUIDES/EN_GB/S05.html</th><td>The S05 guide within the cloned copy.</td></tr></tbody></table></div><p class=\"explain\">Distinguish <code>PROJECT/README.md</code> from the README at the repository root. Use the file in <code>PROJECT</code> to record application progress.</p>"},{"title":"Open the application rather than HTML source","html":"<p class=\"explain\">In your file manager — File Explorer on Windows, Finder on macOS or your Linux distribution’s application — enter the cloned folder, then <code>PROJECT</code>. Open <code>index.html</code> with the browser. If you see text in VS Code, you opened it for editing; use the file manager’s option to open it with the browser.</p>"},{"title":"Open the tests and local guide","html":"<p class=\"explain\">From the same <code>PROJECT</code> folder, open <code>tests.html</code> in a second tab. If you need the project guide, enter <code>GUIDES</code> in the cloned folder, then <code>EN_GB</code> and open <code>S05.html</code>. Check the tab addresses: all should come from the same cloned folder.</p>"},{"title":"Observe what is supplied and what remains to do","html":"<p class=\"explain\">In VS Code open <code>PROJECT/lab.js</code>. Validation, binary conversion and counting 1 bits are supplied. <code>toHex8</code> still returns <code>null</code>. Signed interpretation has a teaching defect for S06, while parity is the S07 task. We neither repair nor complete these in S05.</p>"}],"connection":"Before running the examples, make your own prediction.","mistake":"Two folders with the same name may contain different versions. Check the browser location and VS Code folder rather than just the page title.","prompt":"Show the project map"},{"id":"prediction","title":"Predict before running","chapter":"03 · Observe before editing","start":1440,"end":1620,"rule":"First write what you expect to obtain. Your own prediction lets us compare an understood rule with an observed result, even when the first attempt is wrong.","method":["For this short attempt, use your own knowledge of a byte. Delay running the application, consulting Gemini and revealing the answers until you have recorded a prediction.","Use three inputs: 0, 5 and 255. For each, propose its eight-bit binary representation and two-character hexadecimal representation.","Keep the attempt in the S05 section for your group’s language in PROJECT/evidence.md. An honest comparison is more useful than rewriting the prediction after seeing the result."],"steps":[{"title":"Your attempt, without displayed answers","html":"<p class=\"explain\">For <strong>0, 5 and 255</strong>, write in <code>PROJECT/evidence.md</code>: input → eight-bit binary → two-character hexadecimal. Add a sentence explaining your reasoning. Do not run the application or open the following frames until you have made your own attempt.</p>"},{"title":"Compare after your attempt","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Checking predictions for a byte\"><table><caption>Checking predictions for a byte</caption><thead><tr><th scope=\"col\">Decimal input</th><th scope=\"col\">Eight-bit binary</th><th scope=\"col\">Two-character hexadecimal</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td><code>00000000</code></td><td><code>00</code></td></tr><tr><th scope=\"row\">5</th><td><code>00000101</code></td><td><code>05</code></td></tr><tr><th scope=\"row\">255</th><td><code>11111111</code></td><td><code>FF</code></td></tr></tbody></table></div><p class=\"explain\">Compare each column with your notes. If you omitted leading zeroes, the value may be unchanged but the required format is incomplete.</p>"},{"title":"Explain value and format","html":"<p class=\"explain\">For input 5, binary <code>101</code> represents the correct value, but here we require <code>00000101</code>. Similarly, hexadecimal <code>5</code> must appear as <code>05</code>. Leading zeroes provide the required length without changing the value.</p>"},{"title":"Keep what you learnt from the comparison","html":"<p class=\"explain\">Below your initial prediction, record what you corrected and why. For example, you might state that you identified the value but omitted its fixed width. This is a project note rather than a new assignment, screenshot or separate document to submit.</p>"}],"connection":"We now run the supplied baseline to establish the starting point before editing.","mistake":"Do not copy the program’s displayed output into “expected” as evidence that it is correct. Establish the expectation from the requirement, then compare.","prompt":"I have a prediction; compare the answers","answer_after_attempt":true},{"id":"baseline","title":"Run baseline before editing","chapter":"03 · Observe before editing","start":1620,"end":1920,"rule":"Baseline checks the supplied foundation. In the verified starter it has 26 PASS results; selecting S05 adds five hexadecimal checks that are PENDING before implementation.","method":["An initial result helps distinguish an existing problem from one introduced by editing. We therefore test before and after the change.","Select the stage explicitly in tests.html. S06 and S07 tests have additional purposes and do not decide whether S05 is complete.","The counts below describe the v0.4.0 starter with the custom-test list unchanged. Adding a custom test increases the number of rows."],"steps":[{"title":"Run the supplied baseline","html":"<p class=\"explain\">In the browser tab opened from the clone for <code>PROJECT/tests.html</code>, select <strong>Supplied baseline / baseline</strong>. Press <strong>Run tests</strong>. This page has a run button; the application updates directly when you change its input.</p>"},{"title":"Read the initial result","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Starter state before editing\"><table><caption>Starter state before editing</caption><thead><tr><th scope=\"col\">Selected stage</th><th scope=\"col\">PASS</th><th scope=\"col\">FAIL</th><th scope=\"col\">PENDING</th></tr></thead><tbody><tr><th scope=\"row\">baseline</th><td>26</td><td>0</td><td>0</td></tr><tr><th scope=\"row\">S05</th><td>26</td><td>0</td><td>5</td></tr></tbody></table></div><p class=\"explain\">After baseline, you may select <strong>S05</strong> and run again. The five <code>PENDING</code> rows are four individual hexadecimal checks and one check of all 256 valid inputs. The function still returns <code>null</code>.</p>"},{"title":"Observe the application separately from the tests","html":"<p class=\"explain\">In <code>PROJECT/index.html</code> enter the prediction inputs one at a time. Binary representation is supplied, while hexadecimal is not implemented yet. You can change the language using the selector. Results update when the input changes; the application has no Run button.</p>"},{"title":"If the starting point differs","html":"<p class=\"explain\">If baseline has a failure or files are missing, first check the folder, open page and whether you have already edited anything. Reload the page and read the first problematic row. Do not edit tests to hide the difference. Keep the observation and report the problem if it is present in the supplied copy.</p>"}],"connection":"With the starting point checked, we formulate the hexadecimal conversion rule.","mistake":"PENDING here means “function not implemented”, rather than “mark pending”. Local results are not Moodle marks.","prompt":"Show the initial run"},{"id":"hex-rule","title":"From a byte to two hexadecimal digits","chapter":"04 · A requirement becomes code","start":1920,"end":2220,"rule":"One hexadecimal digit represents four bits. An eight-bit byte can be written with two digits: the first has weight 16 and the second has weight 1.","method":["Base 16 uses digits 0…9 and letters A…F. The application requires uppercase letters for a consistent display.","For an integer u between 0 and 255, write u = 16q + r, with q and r between 0 and 15. The two digits correspond to q and r.","This rule lets you check the result without copying it from the program. The connection with binary is direct: split the bits into two groups of four."],"steps":[{"title":"Why two digits are sufficient","html":"<p class=\"explain\">Two positions in base 16 provide <code>16 × 16 = 256</code> combinations. They cover exactly the 256 unsigned byte values from 0 to 255 inclusive. Two hexadecimal digits do not mean two bits: each digit represents four bits.</p>"},{"title":"Calculate the left and right digits","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Additional conversion examples\"><table><caption>Additional conversion examples</caption><thead><tr><th scope=\"col\">u</th><th scope=\"col\">Base-16 decomposition</th><th scope=\"col\">Resulting digits</th><th scope=\"col\">Eight-bit binary</th></tr></thead><tbody><tr><th scope=\"row\">31</th><td><code>31 = 16 × 1 + 15</code></td><td><code>1F</code></td><td><code>00011111</code></td></tr><tr><th scope=\"row\">160</th><td><code>160 = 16 × 10 + 0</code></td><td><code>A0</code></td><td><code>10100000</code></td></tr><tr><th scope=\"row\">254</th><td><code>254 = 16 × 15 + 14</code></td><td><code>FE</code></td><td><code>11111110</code></td></tr></tbody></table></div><p class=\"explain\">The numbers in the decomposition are decimal values; in the result column, each is replaced by its corresponding base-16 digit.</p>"},{"title":"Check using groups of four bits","html":"<p class=\"explain\">For 160, split <code>10100000</code> into <code>1010 | 0000</code>. The first group corresponds to digit <code>A</code> and the second to <code>0</code>, giving <code>A0</code>. For 254, <code>1111 | 1110</code> gives <code>FE</code>. Splitting is a checking method and does not change the bits.</p>"},{"title":"Reconstruct the value","html":"<p class=\"explain\">Check in reverse: for <code>A0</code>, the value is <code>10 × 16 + 0 = 160</code>; for <code>1F</code>, it is <code>1 × 16 + 15 = 31</code>. If the reconstructed value differs from the input, the conversion is wrong even if the result has two characters.</p>"}],"connection":"We now turn the mathematical rule into a precise function contract.","mistake":"Length and value are separate conditions. A two-character string can have the correct width while representing the wrong number.","prompt":"Show the rule and examples"},{"id":"hex-contract","title":"Specify the toHex8 contract","chapter":"04 · A requirement becomes code","start":2220,"end":2400,"rule":"toHex8 receives a validated integer in 0…255 and returns a string of exactly two uppercase hexadecimal characters. Preserve the validateByte(u) call.","method":["The contract specifies what the function should receive and produce. Distinguish interface text from the number passed to the function.","Input validation is already supplied. The S05 change should provide a result for valid inputs without weakening rejection of invalid arguments.","We use a string because formatting is part of the result: leading zeroes and uppercase letters must be preserved exactly."],"steps":[{"title":"Interface input and function argument","html":"<p class=\"explain\">In the application enter a <strong>decimal</strong> integer between 0 and 255. <code>parseByte</code> converts valid text to a number. Surrounding spaces and leading zeroes are accepted; notation <code>0xFF</code> is not a decimal input accepted by this field. <code>toHex8</code> receives the resulting number rather than the field’s text.</p>"},{"title":"Output conditions","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"The toHex8 function contract\"><table><caption>The toHex8 function contract</caption><thead><tr><th scope=\"col\">Condition</th><th scope=\"col\">What we check</th></tr></thead><tbody><tr><th scope=\"row\">Domain</th><td>A numeric integer from 0 to 255 inclusive.</td></tr><tr><th scope=\"row\">Result type</th><td>A string rather than a number.</td></tr><tr><th scope=\"row\">Length</th><td>Exactly two characters.</td></tr><tr><th scope=\"row\">Alphabet</th><td>Hexadecimal digits 0…9 and A…F.</td></tr><tr><th scope=\"row\">Value</th><td>The string represents the same value as the input.</td></tr><tr><th scope=\"row\">Validation</th><td>The validateByte(u) call remains in the function.</td></tr></tbody></table></div><p class=\"explain\">The name <code>toHex8</code> refers to representing an eight-bit byte; the hexadecimal output has two characters, rather than eight.</p>"},{"title":"Correct value and incomplete format","html":"<p class=\"explain\">For input 5, string <code>\"5\"</code> does not satisfy the length requirement, while number <code>5</code> also fails the result-type requirement. For input 255, string <code>\"ff\"</code> has the right value and length but lacks the required uppercase letters. The contract requires every condition to hold.</p>"},{"title":"Keep the change within scope","html":"<p class=\"explain\">In <code>PROJECT/lab.js</code>, work only inside <code>toHex8(u)</code>. Keep <code>validateByte(u);</code> and replace the unimplemented return. Do not change <code>parseByte</code>, <code>tests.js</code>, signed interpretation or parity. We can then attribute the change to a precise purpose.</p>"}],"connection":"You now have enough conditions to attempt an implementation.","mistake":"Do not remove validation merely because the application filters input. The function is also tested directly with invalid numeric arguments.","prompt":"Show the contract conditions"},{"id":"edit","title":"Complete the function after your own attempt","chapter":"04 · A requirement becomes code","start":2400,"end":2820,"rule":"Combine base-16 conversion, leading-zero padding to two characters and uppercase conversion. First attempt to join these operations inside the existing function.","method":["We use operations supplied by JavaScript, but each has a verifiable role in the contract. Memorising a line that seems to work is insufficient.","Open PROJECT/lab.js in VS Code and find toHex8(u). Preserve validation and replace only return null;","Write your own attempt before revealing the complete solution. After comparing, explain which operation ensures the value, length and uppercase letters."],"steps":[{"title":"Your attempt: join three operations","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Operations available for your attempt\"><table><caption>Operations available for your attempt</caption><thead><tr><th scope=\"col\">Operation</th><th scope=\"col\">Role</th></tr></thead><tbody><tr><th scope=\"row\"><code>toString(16)</code></th><td>Represents the number as base-16 text.</td></tr><tr><th scope=\"row\"><code>padStart(2, '0')</code></th><td>Adds leading zeroes up to length two if needed.</td></tr><tr><th scope=\"row\"><code>toUpperCase()</code></th><td>Converts letters to uppercase.</td></tr></tbody></table></div><p class=\"explain\">In <code>PROJECT/lab.js</code>, inside <code>toHex8(u)</code>, keep <code>validateByte(u);</code> and propose a return expression in place of <code>null</code>. Read the operations from left to right. Make an attempt before opening the frame containing the complete line.</p>"},{"title":"Trace the effect of each operation","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Intermediate conversion results\"><table><caption>Intermediate conversion results</caption><thead><tr><th scope=\"col\">Input</th><th scope=\"col\">After toString(16)</th><th scope=\"col\">After padStart</th><th scope=\"col\">After toUpperCase</th></tr></thead><tbody><tr><th scope=\"row\">5</th><td><code>\"5\"</code></td><td><code>\"05\"</code></td><td><code>\"05\"</code></td></tr><tr><th scope=\"row\">31</th><td><code>\"1f\"</code></td><td><code>\"1f\"</code></td><td><code>\"1F\"</code></td></tr><tr><th scope=\"row\">160</th><td><code>\"a0\"</code></td><td><code>\"a0\"</code></td><td><code>\"A0\"</code></td></tr><tr><th scope=\"row\">254</th><td><code>\"fe\"</code></td><td><code>\"fe\"</code></td><td><code>\"FE\"</code></td></tr></tbody></table></div><p class=\"explain\"><code>padStart</code> does not add a zero when the string already has two characters. Quotation marks in the table show that the intermediate results are strings.</p>"},{"title":"Compare with a complete implementation","html":"<p class=\"explain\">After your own attempt, compare your return with the following line. Replace <strong>only</strong> <code>return null;</code> inside <code>toHex8</code>; the validation call above it remains.</p><pre><code>return u.toString(16).padStart(2, &#x27;0&#x27;).toUpperCase();</code></pre><p class=\"explain\">The dot connects the next operation to the preceding result. Parentheses invoke methods and the semicolon ends the return statement.</p>"},{"title":"Why the length is exactly two here","html":"<p class=\"explain\"><code>padStart(2, '0')</code> ensures a length of at least two; it does not truncate an overlong string. The length is exactly two in this contract because validation limits the number to 0…255, whose base-16 representation has at most two digits. Validation and formatting work together.</p>"},{"title":"Check the edit before running","html":"<p class=\"explain\">Read the function again: validation is intact, one result return replaces the unimplemented return and the other functions remain unchanged. Check quotation marks, dots and parentheses. Do not copy labels or code-block delimiters into the file.</p>"}],"connection":"We save the file and reload the pages that use the code.","mistake":"A copied line can produce a correct result without being understood. Explain each operation and why the validated range matters for the length.","prompt":"I have attempted it; show the check","answer_after_attempt":true},{"id":"save-reload","title":"Save and reload: the browser receives the new code","chapter":"05 · Check behaviour","start":2820,"end":3000,"rule":"Editing changes the text in the editor; saving writes it to the file; reloading makes the browser read the updated file. None of these actions creates a commit.","method":["The browser does not automatically track edits made in VS Code. For this local project, save lab.js and reload both the application and tests.","If the initial result still appears, first check saving and the copy’s location. Do not compensate for an old page by making further code changes.","A manual check is a quick control of the display. Next we use tests to check the full contract over the valid domain."],"steps":[{"title":"Save in VS Code","html":"<p class=\"explain\">With <code>PROJECT/lab.js</code> open, use <strong>Ctrl+S</strong> or <strong>Cmd+S</strong>. Check that the unsaved-file indicator disappears. The change is now in your local copy; it has not yet been recorded in a commit or published on GitHub.</p>"},{"title":"Reload both local tabs","html":"<p class=\"explain\">In the browser reload <code>PROJECT/index.html</code>, then <code>PROJECT/tests.html</code>. Check each tab’s address: it must come from the cloned folder that you edit. Selecting the stage again and running tests without reloading may use the previously loaded code.</p>"},{"title":"Check four quick results","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Manual check after saving and reloading\"><table><caption>Manual check after saving and reloading</caption><thead><tr><th scope=\"col\">Input</th><th scope=\"col\">Required hexadecimal</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td><code>00</code></td></tr><tr><th scope=\"row\">5</th><td><code>05</code></td></tr><tr><th scope=\"row\">128</th><td><code>80</code></td></tr><tr><th scope=\"row\">255</th><td><code>FF</code></td></tr></tbody></table></div><p class=\"explain\">Enter these values one at a time in the application’s decimal field. They cover zero, leading-zero padding, a value in the second half of the domain and the upper boundary. We do not change the signed interpretation displayed alongside them today.</p>"},{"title":"If the display differs from the expectation","html":"<p class=\"explain\">If hexadecimal remains unimplemented, check saving and the open copy. If <code>5</code> appears instead of <code>05</code>, check padding; for <code>ff</code>, check uppercase conversion. If the page reports a JavaScript error, read its message and the line identified in the browser console; first check the return syntax and that the function structure is preserved.</p>"}],"connection":"With the pages updated, we explicitly run stage S05.","mistake":"An old result in a tab does not establish that the saved file is wrong. First confirm that the browser reread the same copy.","prompt":"Show the save–reload sequence"},{"id":"stage-tests","title":"Run S05 and read each difference","chapter":"05 · Check behaviour","start":3000,"end":3240,"rule":"After implementation, S05 in the verified starter should have 31 PASS results with no FAIL or PENDING. Check the stage, input, expectation and result rather than just the colour.","method":["S05 includes the supplied baseline and hexadecimal checks. A baseline failure after editing may indicate an accidental change outside the requirement.","A test compares the obtained result with a separately established expectation. If they differ, we explain the difference before correcting it.","We do not require S06 or S07 to be completed today. Their tests include additional behaviour deliberately left unfinished."],"steps":[{"title":"Select the appropriate stage","html":"<p class=\"explain\">In the reloaded <code>PROJECT/tests.html</code> choose <strong>S05 · Hexadecimal</strong>, then press <strong>Run tests</strong>. Read the summary and locate the first row that is not PASS. The custom-test list must remain as supplied if you want to compare the exact row counts with the table below.</p>"},{"title":"Compare before and after","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Checking S05 with custom tests unchanged\"><table><caption>Checking S05 with custom tests unchanged</caption><thead><tr><th scope=\"col\">Project state</th><th scope=\"col\">PASS</th><th scope=\"col\">FAIL</th><th scope=\"col\">PENDING</th></tr></thead><tbody><tr><th scope=\"row\">Before implementation</th><td>26</td><td>0</td><td>5</td></tr><tr><th scope=\"row\">After correct implementation</th><td>31</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"explain\">The five new checks become PASS. One compares the function with the expected result for every integer in 0…255, rather than just the values shown in individual rows.</p>"},{"title":"Read a failure as information","html":"<p class=\"explain\">For example, if the test for 5 expects <code>\"05\"</code> but the function returns <code>\"5\"</code>, the value conversion may be correct while padding is missing. If the result is <code>null</code>, the function is still unimplemented. Correct the identified cause, save, reload and run S05 again.</p>"},{"title":"Delimit the current check","html":"<p class=\"explain\">The application’s general notice describes the initial starter state and may remain visible after hexadecimal is complete. Use S05 results to assess today’s progress. An S06 failure or S07 PENDING result does not automatically make a correct S05 implementation incorrect.</p>"}],"connection":"We now establish what the tests support and what remains to be checked through Git.","mistake":"Do not change the expected result or tests.js merely to obtain green results. That would hide the problem rather than fulfil the requirement.","prompt":"Show how to read the results"},{"id":"test-meaning","title":"What tests establish and what we check separately","chapter":"05 · Check behaviour","start":3240,"end":3420,"rule":"Tests support a claim about the behaviour of the loaded code. By themselves they do not show who wrote it, whether you committed it or whether the version reached GitHub.","method":["For a finite domain we can exhaustively check every valid input. This project’s hexadecimal check covers 256 values.","That is stronger than a few favourable examples, but it does not establish the entire activity. Identify the tested file, local history and remote repository separately.","Keep brief notes and clear commits, without additional screenshots, PDFs or individual approval steps. S05 requires no new assignment."],"steps":[{"title":"One row can check 256 inputs","html":"<p class=\"explain\">The summary <code>31 PASS</code> counts check rows rather than just individual function calls. The “Hexadecimal: all 256 values” row checks every integer in the domain and reports whether all outputs match the expectation. The number of rows and number of evaluated cases are distinct measures.</p>"},{"title":"Exhaustive for the valid domain, with explicit limits","html":"<p class=\"explain\">A 256/256 result supports the claim that this function, loaded in the test page, produces the expected representation for every valid byte input. Rejection of selected invalid arguments is checked separately. This result does not evaluate every possible program, every environment or code authorship.</p>"},{"title":"Match each claim to the appropriate check","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Which check answers each question\"><table><caption>Which check answers each question</caption><thead><tr><th scope=\"col\">Question</th><th scope=\"col\">Relevant check</th></tr></thead><tbody><tr><th scope=\"row\">Does the function meet S05 requirements?</th><td>Run S05 from the same saved and reloaded copy.</td></tr><tr><th scope=\"row\">Which lines did I change?</th><td>Read the diff in Source Control.</td></tr><tr><th scope=\"row\">What content is recorded locally?</th><td>Check the commit and its contents.</td></tr><tr><th scope=\"row\">Which version reached GitHub?</th><td>After pushing, check the commit and file in your own repository.</td></tr></tbody></table></div><p class=\"explain\">Q05 checks understanding of representation and Git states. It does not automatically read your repository or replace publication steps.</p>"},{"title":"Prepare your own explanation","html":"<p class=\"explain\">Before publication, you should be able to explain why <code>toString(16)</code> changes representation, what <code>padStart</code> adds and why validation remains. Next, record briefly what you observed and read the differences before committing.</p>"}],"connection":"We complete the notes and README, then inspect differences before staging, committing and pushing.","mistake":"“The tests pass” and “the change is published” are separate claims. Each needs its corresponding check.","prompt":"Show the limits of checking"},{"id":"work-notes","title":"Short notes that help us resume work","chapter":"06 · Keep the result and explanation","start":3420,"end":3600,"rule":"Record what you predicted, what you observed and what you changed. A few useful lines are enough; the notes belong to the project and will be pushed with it.","method":["Open PROJECT/evidence.md and complete only EN-GB · S05, keeping the prediction you made before running the project. Keep an incorrect prediction beside the checked conclusion.","Update PROJECT/README.md in your group’s language: after the tests pass, tick only hexadecimal functionality and the verified tests. Publication has a separate instruction without a premature tick. S06 and S07 remain future stages.","Prepare the resumption information before committing. Confirm publication only after checking GitHub; adding that confirmation afterwards requires another commit and push."],"steps":[{"title":"Keep prediction and observation together","html":"<p class=\"explain\">The S05 fields are already provided in <code>PROJECT/evidence.md</code>. Keep your original entry under “Prediction before running”. For the observation, record two or three useful comparisons: input, expected result, observed result. If you originally omitted the leading zero, explain that the requirement is two characters and state what you checked after editing.</p><p class=\"explain\">Keep the original prediction even when it was wrong. The difference between prediction and observation records what you learnt from the activity.</p>"},{"title":"Explain the change in your own words","html":"<p class=\"explain\">Under “What I changed in lab.js and why”, use one sentence to explain the three operations: conversion to base 16, left padding and uppercase letters. State that you kept <code>validateByte(u)</code>. There is no need to copy the lesson or transcribe an AI conversation.</p><p class=\"explain\">A suitable amount of detail is: “I completed the return value in toHex8. I kept validation and checked length, letter case and the ends of the input range.” Add your actual observations; record a test only if you ran it.</p>"},{"title":"The README helps another person run the project","html":"<p class=\"explain\">In <code>PROJECT/README.md</code>, retain the run instructions: open <code>PROJECT/index.html</code>, then <code>PROJECT/tests.html</code> and select S05. Once the S05 tests pass, replace only the S05 progress line with the two lines below; keep the S06 and S07 entries.</p><pre><code>- [x] S05: two-character hexadecimal output and tests verified.\nI check S05 publication on GitHub after Push.</code></pre><p class=\"explain\">The first line confirms functionality and tests already checked. The second is an instruction for the next step; it does not claim that committing or pushing has already happened. Confirm publication only after a successful push and inspection of your own GitHub copy.</p><p class=\"explain\">The README should describe your version. State the stage when describing a limitation: functions for later seminars are still in their starter state. Completing hexadecimal output does not mean that every project feature is complete.</p>"},{"title":"Prepare to resume, then save","html":"<p class=\"explain\">Complete “What I need to resume work”: your repository URL, local folder, completed stage and the <code>main</code> branch. Your first check will be to open the correct copy and inspect Git status. Save both Markdown files before staging them.</p><p class=\"explain\">The publication confirmation remains unverified until after pushing. If you add it after checking GitHub, save and publish that addition in another commit. S05 has no extra Moodle assignment; these notes stay in the project.</p>"}],"connection":"Read the differences before choosing what enters the history.","mistake":"Do not tick future stages or record “published” before checking the GitHub copy.","prompt":"Show the next step"},{"id":"diff","title":"Read the change before committing","chapter":"07 · From file to a pushed version","start":3600,"end":3780,"rule":"A diff shows the difference between two states. Use it to explain the change and to check whether you edited more than S05 requires.","method":["In VS Code, open Source Control and then each file in Changes. Inspect both code and notes; a filename alone does not describe the changed content.","In lab.js, recognise the toHex8 change and retained validation. Leave the other functions in their starter state.","Distinguish the unstaged diff from the staged diff. After staging, inspect the latter as well."],"steps":[{"title":"Open the Source Control comparison","html":"<p class=\"explain\">Choose <strong>Source Control</strong> in the VS Code sidebar. Under <strong>Changes</strong>, select <code>PROJECT/lab.js</code>. The diff editor may show the versions side by side or in a single column, depending on your settings. In either view, locate removed and added lines, then read the surrounding function.</p><p class=\"explain\">Colour is a useful aid. The <code>−</code>/<code>+</code> markers and line contents also identify the change when colours are difficult to distinguish.</p>"},{"title":"The essential toHex8 difference","html":"<pre><code>@@ function toHex8(u) @@\n   validateByte(u);\n-  return null;\n+  return u.toString(16).padStart(2, &#x27;0&#x27;).toUpperCase();</code></pre><p class=\"explain\">This is an explanatory diff fragment; do not paste it into the JavaScript file as source code. The minus marker identifies the removed line and the plus marker identifies the added line. <code>validateByte(u)</code> is a context line and remains in the function.</p><p class=\"explain\">You may retain or briefly update the TODO comments. Leave <code>asSigned8</code>, <code>parityBit8</code>, input parsing and supplied tests unchanged. Today’s programming requirement is only <code>toHex8</code>.</p>"},{"title":"Inspect the explanation files too","html":"<p class=\"explain\">Open the diffs for <code>PROJECT/README.md</code> and <code>PROJECT/evidence.md</code>. Look for your observations, the S05 stage and your repository address. Keep the other language and stage sections. If you added the optional test, inspect the <code>PROJECT/custom-tests.js</code> diff too.</p><p class=\"explain\">Explain an unexpected file before including it. It could be an accidental edit or a working file that does not belong in the project. Select relevant content rather than automatically selecting everything.</p>"},{"title":"The same distinction in the terminal","html":"<p class=\"explain\"><strong>Where to run these:</strong> the VS Code terminal at the root of your own clone, with <code>PROJECT</code> and <code>GUIDES</code> directly inside it. These commands read status and differences; they do not create a commit.</p><pre><code>git status\ngit diff -- PROJECT/lab.js\ngit diff --cached</code></pre><p class=\"explain\"><code>git diff</code> compares working files with the current staging area. <code>git diff --cached</code> compares the staging area with the latest commit. Before you stage anything, the second command may show no differences; that does not imply that every working file is unchanged.</p>"}],"connection":"Explicitly choose the content for the next commit.","mistake":"An empty diff in one comparison does not establish that every state is unchanged. Identify which two states are being compared.","prompt":"Show the next step"},{"id":"stage","title":"Stage: choose content for the next commit","chapter":"07 · From file to a pushed version","start":3780,"end":3900,"rule":"Staging records content at that moment. A further saved edit does not automatically enter the existing selection.","method":["In Source Control, use the plus beside each relevant file and check that it appears under Staged Changes.","Inspect the staged diff as the final content check. If you edited after staging, stage the updated content again before committing.","The v0/v1/v2 example explains a Git state; it does not require extra edits or implementation of future functions."],"steps":[{"title":"Stage only the relevant files","html":"<p class=\"explain\">Under <strong>Changes</strong>, select <strong>+</strong> beside <code>PROJECT/lab.js</code>, <code>PROJECT/README.md</code> and <code>PROJECT/evidence.md</code>. If you changed the optional test, stage <code>PROJECT/custom-tests.js</code> too. The files appear under <strong>Staged Changes</strong>; inspect their diffs there.</p><p class=\"explain\">This tells Git which content to record in the next commit. It has not yet created a history entry or sent the change to GitHub.</p>"},{"title":"A precise example: v0, v1 and v2","html":"<p class=\"explain\">Call the starter function with <code>return null;</code> <strong>v0</strong>. <strong>v1</strong> is the completed hexadecimal function. <strong>v2</strong> is the same correct function with a brief comment added afterwards. These labels name content states; they are not official kit versions.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Content in each local state\"><table><caption>Content in each local state</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Saved working file</th><th scope=\"col\">Staging area</th><th scope=\"col\">Latest commit</th></tr></thead><tbody><tr><th scope=\"row\">Starting point</th><td>v0</td><td>v0</td><td>v0</td></tr><tr><th scope=\"row\">Save v1</th><td>v1</td><td>v0</td><td>v0</td></tr><tr><th scope=\"row\">Stage v1</th><td>v1</td><td>v1</td><td>v0</td></tr><tr><th scope=\"row\">Save a further edit v2</th><td>v2</td><td>v1</td><td>v0</td></tr><tr><th scope=\"row\">Commit without staging again</th><td>v2</td><td>v1</td><td>v1</td></tr></tbody></table></div><p class=\"explain\">After the final row, the commit contains v1 while the working file contains v2. The difference from v1 to v2 remains unstaged. A file can have both staged and unstaged changes.</p>"},{"title":"If v2 should enter the commit","html":"<p class=\"explain\">Before committing, stage the file again and inspect the updated selection. In VS Code, staging the remaining change updates the selected content. If you already committed v1, stage v2 and create another commit. Both versions can then be pushed without losing the edit.</p><p class=\"explain\">For the ordinary S05 route, save the intended edits, stage them and commit. This example explains why staging needs to be repeated when you edit after the selection.</p>"},{"title":"Terminal alternative","html":"<p class=\"explain\"><strong>Where to run these:</strong> only in the terminal at the root of your own clone. Use this instead of the interface’s plus buttons; it is not an additional required step.</p><pre><code>git add PROJECT/lab.js PROJECT/README.md PROJECT/evidence.md\ngit diff --cached\ngit status</code></pre><p class=\"explain\">If you changed <code>custom-tests.js</code>, add it explicitly. You can repeat <code>git add</code> for a file edited after staging: its staged content then contains the updated saved version. Check the result before committing.</p>"}],"connection":"Now record the selected version with a message that explains the change.","mistake":"Staging does not automatically follow future saves. An edit saved afterwards needs to be staged again.","prompt":"Show the next step"},{"id":"commit","title":"Commit: record a local version","chapter":"07 · From file to a pushed version","start":3900,"end":4020,"rule":"A commit records staged content in local history, together with a message and author identity. Sending it to GitHub is the next step.","method":["Before committing, check Staged Changes and the message. In the laboratory, configure author identity locally for your own repository.","A useful message states the behaviour changed. It should not imply that S06/S07 are complete or that every possible test has passed.","After committing, inspect local status and history. A clean working directory alone does not show that GitHub has the same version."],"steps":[{"title":"Check author identity","html":"<p class=\"explain\">If your first commit reports <strong>Author identity unknown</strong>, return to the prepared identity step. Check your name and email in the terminal at the root of your own clone. On a shared laboratory account, configure this repository only, without <code>--global</code>. Replace the examples with your chosen values before running these commands.</p><pre><code>git config user.name &quot;My name&quot;\ngit config user.email &quot;MY_CHOSEN_EMAIL&quot;\ngit config --get user.name\ngit config --get user.email</code></pre><p class=\"explain\">You may use the <code>noreply</code> address provided in your GitHub account’s Settings → Emails; copy it exactly from your account. Author name and email do not determine the account used to authenticate a push.</p>"},{"title":"Write the message and commit","html":"<p class=\"explain\">In Source Control, enter a message such as <code>S05: two-character hexadecimal output</code>. Check that the intended files are under <strong>Staged Changes</strong>, then choose <strong>Commit</strong>. If the interface offers to stage every change automatically, stop that step and review your selection; you need to know what the version contains.</p><p class=\"explain\">The message explains the purpose. The code diff shows the implementation and your notes retain the checks. Together, these make the version easier to understand when you return.</p>"},{"title":"Check the recorded version","html":"<p class=\"explain\">From the terminal at the root of your clone, use these commands to inspect history and status. <code>git log -1 --oneline</code> shows the latest commit and its message; it is not a check of the GitHub page.</p><pre><code>git status\ngit log -1 --oneline</code></pre><p class=\"explain\">If every intended edit was staged before committing, the working files may be clean. The commit is still local. If you saved v2 after staging v1, a working difference remains: inspect it and stage it for another commit if it belongs in the history.</p>"},{"title":"“Nothing to commit” needs context","html":"<p class=\"explain\">This message may mean that the change has already been committed. It may also mean that you are editing another folder or have not saved the file. Check the editor tab, open folder, <code>git status</code> and latest commit rather than repeating buttons at random.</p><p class=\"explain\">For the terminal alternative, after reviewing staged content, use <code>git commit -m \"S05: two-character hexadecimal output\"</code>. Run it only in your own clone as an alternative to Commit in Source Control.</p>"}],"connection":"Send the commit to origin and check where it arrived.","mistake":"A successful commit and “working tree clean” are insufficient evidence that it was pushed.","prompt":"Show the next step"},{"id":"push","title":"Push: send the commit to your GitHub copy","chapter":"07 · From file to a pushed version","start":4020,"end":4140,"rule":"Push sends commits to the specified repository. In this activity, push to your own copy on main; this step does not deploy a GitHub Pages site.","method":["First check origin and the branch: they should be your own copy and main. Do not push changes to the shared template.","Use Push in Source Control or the explicit terminal command. Read the operation result and authenticate the correct account if requested.","If the push is rejected, keep the message and check its cause. A force push is not a normal recovery step for this activity."],"steps":[{"title":"Check the destination before pushing","html":"<p class=\"explain\">Run these read-only checks in the terminal at the root of your own clone. Both fetch and push addresses for <code>origin</code> should identify <strong>your account</strong> and repository. The branch used for this route is <code>main</code>.</p><pre><code>git remote -v\ngit branch --show-current\ngit status</code></pre><p class=\"explain\">If origin points to <code>antonioclim/BBS-bit-byte-starter</code>, you probably opened a clone of the template. Return to your own clone in a separate folder. Checking the destination is easier than recovering work done in the wrong project.</p>"},{"title":"Choose Push and read the result","html":"<p class=\"explain\">Open the action menu in Source Control and choose <strong>Push</strong>. Its label or location may vary between VS Code versions. A first push may request GitHub authentication: check the account before proceeding. The author identity used for commits does not replace this authentication.</p><p class=\"explain\">Read whether the operation completed or reported an error before opening the browser check. Clicking Push alone does not prove that the send succeeded.</p>"},{"title":"Explicit terminal alternative","html":"<p class=\"explain\"><strong>Where to run these:</strong> the terminal at the root of your own clone, after committing and checking origin. The command names both the destination and branch.</p><pre><code>git push origin main\ngit status</code></pre><p class=\"explain\">Git sends the required commits for the branch; it does not directly send a saved edit that has not entered a commit. In the v1/v2 example, pushing can publish committed v1 while v2 remains a local edit. To publish v2, stage it, commit it and push again.</p>"},{"title":"If an error appears, identify its scope","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Common messages and useful checks\"><table><caption>Common messages and useful checks</caption><thead><tr><th scope=\"col\">Situation</th><th scope=\"col\">What to check</th></tr></thead><tbody><tr><th scope=\"row\">Access denied / repository not found</th><td>Origin address, authenticated account and access to your own copy.</td></tr><tr><th scope=\"row\">The commit exists locally, but the push did not finish</th><td>Connectivity and the operation message. Committed work remains in local history.</td></tr><tr><th scope=\"row\">Push rejected because the online copy contains another change</th><td>The full message and the two copies’ states before choosing how to synchronise.</td></tr><tr><th scope=\"row\">Everything up-to-date</th><td>Branch and destination. There may be no new commit on main; inspect history too.</td></tr></tbody></table></div><p class=\"explain\">Ask for help using the actual message, without force pushes or deletion commands. Keep passwords and tokens out of project files and notes.</p>"}],"connection":"Open your own GitHub page and inspect the function in the pushed commit.","mistake":"Push works with commits. Saving, staging or clicking a button without a successful operation does not establish publication.","prompt":"Show the next step"},{"id":"published-check","title":"Check the version on GitHub","chapter":"07 · From file to a pushed version","start":4140,"end":4200,"rule":"Confirm the result in your own GitHub copy on the correct branch by inspecting the commit and changed file. A clean local working state establishes less.","method":["Reload your own repository page and check the owner, repository and main branch.","Read the commit message and toHex8 in PROJECT/lab.js. Check that the notes needed to resume are also present.","If you now add a confirmation to evidence.md, it is a new change: save, stage, commit and push it."],"steps":[{"title":"Open the correct copy","html":"<p class=\"explain\">Open <strong>your own repository</strong> in the browser, rather than the template page. Reload it and check the owner name and <code>main</code> branch selector. The S05 commit message should appear in that branch’s history; a later notes commit may appear first.</p><p class=\"explain\">A private repository is visible to accounts with access. Sending someone its URL does not by itself grant permission to read it.</p>"},{"title":"Inspect the file as well as the message","html":"<p class=\"explain\">Open <code>PROJECT/lab.js</code> on GitHub and locate <code>toHex8</code>. Check that the implementation is present, validation is retained and future functions are preserved. Then inspect <code>PROJECT/README.md</code> and <code>PROJECT/evidence.md</code>. A descriptive message does not replace the version’s actual content.</p><p class=\"explain\">For precise identification, use <code>git rev-parse HEAD</code> to read the full local commit identifier and compare it with the commit on GitHub. S05 requires no screenshot or extra Moodle submission.</p>"},{"title":"A written confirmation also needs to be pushed","html":"<p class=\"explain\">You can now complete the <code>evidence.md</code> field confirming that you checked the online copy and found the change. Editing it now creates another local change. Save it, inspect its diff, stage it, make a short confirmation commit and push. Reload GitHub to check that note as well.</p><p class=\"explain\">Do not put the file’s own final commit identifier inside it: editing the file would require a new commit. In S07, the final identifier goes into Moodle after the last commit and push.</p>"}],"connection":"Keep a short resumption record for the next seminar.","mistake":"“Working tree clean” describes local working files and staged content relative to the commit. It does not alone establish that GitHub contains that commit.","prompt":"Show the next step"},{"id":"resume","title":"Two weeks later: where do we resume?","chapter":"08 · Resume and check understanding","start":4200,"end":4320,"rule":"A resumption note identifies the project, local copy and first check. It is useful when you no longer remember the folder or last completed stage.","method":["Review the information prepared in evidence.md: URL, local folder, main, S05 and the first check.","Do not depend exclusively on the laboratory folder. Committed and pushed changes are present in your own GitHub copy.","In S06 we will investigate a problem; in S07 we will implement the individual requirement and reproduce the result. Their solutions are not part of today’s task."],"steps":[{"title":"Read the note before closing","html":"<p class=\"explain\">In <code>PROJECT/evidence.md</code>, identify four things: your repository address, today’s local folder, the S05 stage and <code>main</code>. The first action should be clear: open the correct copy and inspect status. If you completed the note now, save, stage, commit and push it.</p><p class=\"explain\">The local folder helps on the same computer. Your own repository URL remains the starting point on another computer or when the laboratory folder is no longer available.</p>"},{"title":"The first check at the next meeting","html":"<p class=\"explain\">When reopening an existing copy, read <code>git status</code>, <code>git remote -v</code> and the branch before editing. On another computer, clone your own repository into a separate folder, open the application and run the completed stage. These checks establish whether you have the expected project and version.</p><p class=\"explain\">Keep an existing copy with local edits until you have inspected it. Reading status first tells you what needs to be kept or synchronised.</p>"},{"title":"What remains when we forget the commands","html":"<p class=\"explain\">Retain four questions: what did I change, how did I check it, which version contains it and where can I retrieve it? The guide can supply the exact commands later. In S06 we use the same discipline for a hypothesis and test; in S07 we check whether the result can be reproduced from the pushed copy.</p><p class=\"explain\">There is no extra document to submit at the end of this seminar. The short note and commits provide continuity; the individual quiz checks understanding of selected situations and representations.</p>"}],"connection":"Use a short prediction to distinguish the working file, staging area, commit and GitHub copy.","mistake":"Memory of a folder is fragile. Keep the repository address and inspect status before continuing.","prompt":"Show the next step"},{"id":"git-transfer","title":"One-minute prediction: which version reaches which place?","chapter":"08 · Resume and check understanding","start":4320,"end":4380,"rule":"First reconstruct the sequence yourself, then reveal the comparison. Use the four places in which project content can exist.","method":["Answer before revealing the next steps. You may write only v0, v1 and v2 labels; you do not need to perform these edits in the project.","Then compare each location, rather than using “I saved it” to explain every state.","This is a public learning check, ungraded and with no separate Moodle upload."],"steps":[{"title":"Your answer first","html":"<p class=\"explain\">Starting point: v0 in the local file, staging area, latest commit and GitHub copy. You save v1 and stage it. Then you add a comment, save v2 and commit without staging again. Which version now exists in each of the four places?</p><p class=\"explain\">Next, you stage the new content, make another commit and successfully push to your own <code>main</code>. What changed? Explain each answer before revealing the comparison. You do not need to run this sequence as an extra project exercise.</p>"},{"title":"Comparison after your attempt","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Complete v0 → v1 → v2 sequence\"><table><caption>Complete v0 → v1 → v2 sequence</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Working file</th><th scope=\"col\">Staging area</th><th scope=\"col\">Local commit</th><th scope=\"col\">GitHub</th></tr></thead><tbody><tr><th scope=\"row\">Save v1</th><td>v1</td><td>v0</td><td>v0</td><td>v0</td></tr><tr><th scope=\"row\">Stage v1</th><td>v1</td><td>v1</td><td>v0</td><td>v0</td></tr><tr><th scope=\"row\">Save v2 without staging again</th><td>v2</td><td>v1</td><td>v0</td><td>v0</td></tr><tr><th scope=\"row\">Commit</th><td>v2</td><td>v1</td><td>v1</td><td>v0</td></tr><tr><th scope=\"row\">Stage v2 and make another commit</th><td>v2</td><td>v2</td><td>v2</td><td>v0</td></tr><tr><th scope=\"row\">Successful push to your own main</th><td>v2</td><td>v2</td><td>v2</td><td>v2</td></tr></tbody></table></div><p class=\"explain\">The first commit contains v1 while the v2 edit remains in the working file. Staging again and making another commit records v2. A successful push to the correct destination sends the required history so that the GitHub branch reaches v2.</p>"},{"title":"What supports the GitHub conclusion?","html":"<p class=\"explain\">After committing v2, the local working state can be clean while GitHub still contains v0. This is a counterexample to “clean locally means published”. After pushing, inspect your own page, branch and commit contents.</p><p class=\"explain\">If your prediction was wrong, identify the operation whose effect you extended too far. Saving updates the working file rather than an existing selection; committing records staged content rather than every edit on disk.</p>"}],"connection":"An optional AI clarification can be checked in the same way: select a claim and a case that tests it.","mistake":"Do not infer every state from the last button pressed. Track the file, staging area, commit and push destination separately.","prompt":"Show the comparison after my attempt","answer_after_attempt":true},{"id":"gemini","title":"Optional Gemini: check one claim","chapter":"08 · Resume and check understanding","start":4380,"end":4440,"rule":"An AI explanation can help us formulate a test. First attempt the problem yourself, then choose a precise claim and check it in the project.","method":["This clarification is optional in S05. If you do not use Gemini or cannot access it, use the prepared teaching example without an account or transcript.","Open the support only after writing your own judgement. A general claim about code needs to be compared with the required result.","Use the available minute for one question. The full hypothesis-and-test investigation belongs to S06."],"steps":[{"title":"Your judgement first","html":"<p class=\"explain\">Without consulting a new answer, decide: “For a valid integer from 0 to 255, does <code>u.toString(16)</code> alone meet the requirement of exactly two uppercase hexadecimal characters?” Write yes or no and choose two inputs that could distinguish the claim from the requirement.</p><p class=\"explain\">This is not a second required implementation and does not replace S05 tests. It is a brief way to distinguish a plausible suggestion from one that actually meets the function’s contract.</p>"},{"title":"Three prompts: choose one","html":"<p class=\"explain\">After your own attempt, you may use free Gemini if you have access. Choose one prompt and adapt the prediction field. You do not need to send the whole project.</p><pre><code>My function receives a valid integer from 0 to 255 and must return exactly two uppercase hexadecimal characters. I think [write my prediction]. Explain whether toString(16) is sufficient and suggest two cases to test the claim, without writing the complete function.</code></pre><pre><code>I saved an edit after staging the file. I think [write what I expect the commit to contain]. Explain what git diff and git diff --cached would compare in this situation. I want to check the explanation rather than memorise commands.</code></pre><pre><code>My S05 tests are green. I think this proves [write my conclusion]. What do these results actually support, and which conclusions about authorship, publication or untested cases would exceed the observation?</code></pre>"},{"title":"The prepared alternative is a teaching example","html":"<p class=\"explain\"><strong>A prepared claim for checking, not a quotation from Gemini:</strong> “Using <code>toString(16)</code> is sufficient because the result is text in base 16.” Choose <code>0</code> and <code>31</code>. The application contract requires <code>00</code> and <code>1F</code>. Conversion alone produces <code>0</code> and <code>1f</code>.</p><p class=\"explain\">The first input exposes the length difference; the second exposes letter case. The claim confuses writing in base 16 with the exact required format. One counterexample would refute it; the two cases distinguish separate parts of the requirement.</p>"},{"title":"Keep the conclusion, then close AI for the quiz","html":"<p class=\"explain\">If you used the clarification, you may briefly record the checked claim and conclusion in your S05 notes. No conversation transcript, screenshot or extra file is required. The useful outcome is an explanation of the chosen case and what it showed.</p><p class=\"explain\">Gemini, other AI and help from classmates are not allowed in Q05. The previously announced shared reference remains permitted. We now move from learning support to individual assessment.</p>"}],"connection":"Finish preparation and enter Q05 with only the permitted resource.","mistake":"An AI claim is not checked by obtaining another AI’s approval. Choose a case, determine its expected result and compare the observation.","prompt":"Show support after my attempt","answer_after_attempt":true},{"id":"quiz-transition","title":"Individual Q05, then recap","chapter":"09 · Assessment and closing","start":4440,"end":4500,"rule":"Q05 individually checks representations and Git situations. It contributes up to 0.20 real marks; it does not automatically inspect code or repository publication.","method":["At minute 75, open Q05 in the Moodle course. It lasts 10 minutes, permits one attempt and selects four questions, each with two subanswers.","Work individually without AI or classmates. Use only the existing permitted shared reference; this explanatory lesson is not an additional permitted quiz resource.","In minutes 85–90, recap the requirement, checks and distinction between saving, committing and pushing. There is no added S05 assignment."],"steps":[{"title":"Before starting the attempt","html":"<p class=\"explain\">Open <strong>Q05 in the actual Moodle course</strong> using your group’s instructions. Close Gemini or other AI and put away unpermitted support. Only the announced shared reference remains available. Read the displayed instructions and access window before starting.</p><p class=\"explain\">The 10 minutes are for individual answers. If you cannot find the activity or access is blocked, report it immediately rather than inferring a link or password from another group.</p>"},{"title":"What the marks mean","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Q05 structure\"><table><caption>Q05 structure</caption><thead><tr><th scope=\"col\">Element</th><th scope=\"col\">Rule</th></tr></thead><tbody><tr><th scope=\"row\">Selected questions</th><td>4, each with 2 subanswers: 8 in total.</td></tr><tr><th scope=\"row\">Raw weights</th><td>6 + 6 + 4 + 4 = 20.</td></tr><tr><th scope=\"row\">Duration and attempts</th><td>10 minutes; one attempt.</td></tr><tr><th scope=\"row\">Real contribution</th><td>Up to 0.20 real marks for Q05.</td></tr><tr><th scope=\"row\">S05–S07</th><td>Up to 1 real mark in total: 0.20 + 0.30 + 0.50.</td></tr></tbody></table></div><p class=\"explain\">Navigation is free and feedback is deferred. The reference contents and access settings remain those communicated in the course. The 20 raw marks are not 20 marks in the subject grade.</p>"},{"title":"Quiz answers and application formatting","html":"<p class=\"explain\">Q05 hexadecimal questions accept lowercase letters as well as uppercase. This does not change the program requirement: <code>toHex8</code> must return exactly two <strong>uppercase</strong> characters. Quiz answer recognition and a software function’s contract are different rules.</p><p class=\"explain\">A good Q05 result shows correct answers to the selected questions. It does not automatically certify code authorship, tests run or a successful push. Those aspects were addressed through the project workflow.</p>"},{"title":"The final five minutes: what do we retain?","html":"<p class=\"explain\">After the quiz, in minutes <strong>85–90</strong>, explain without a command list: an unsigned byte has 256 values; two hexadecimal characters represent its eight bits; software output has a formatting contract; a change needs checking and identification in a version. Saving, staging, committing and pushing have distinct effects.</p><p class=\"explain\">In S06 we will investigate a problem and test a hypothesis. In S07 we will implement the individual requirement and reproduce the result from the pushed copy. Today’s outcome is your own repository, checked hexadecimal output and a resumption note.</p>"}],"connection":"Keep the same repository for S06; the next activity starts from today’s checked version.","mistake":"The quiz and project provide different evidence. A good Q05 mark does not by itself establish a complete repository.","prompt":"Show the next step"}],"math_checks":[],"rehearsal":[]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s05-complete-lesson-v1-en-GB')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s05-complete-lesson-v1-en-GB',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Example hidden</span></div><section class="example" id="example-${i}" aria-label="Worked example" hidden></section><p class="connection"><b>Next.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Present lesson':'Read lesson';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Replay step by step';return f<p.steps.length-1?'Next step':'Replay example ↺';}
