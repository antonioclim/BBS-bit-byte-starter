function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Present lesson':'Read lesson';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Replay step by step';return f<p.steps.length-1?'Next step':'Replay example ↺';}
function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Example hidden':state.all[i]?`All ${p.steps.length} steps shown`:`Example step ${f+1} of ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'COMPLETE WORKING':`STEP ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Previous step</button><button data-action="all" data-index="${i}">Full working</button><button data-action="hide" data-index="${i}">Hide example</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Back to the method ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Lesson map':'← Previous topic';$('nextBtn').textContent=state.index===pages.length-1?'Restart lesson ↺':'Next topic →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Return to lesson':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Optional panel. Next topic returns to the lesson and advances.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Example hidden':'Example shown'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Topic ${state.index+1} of ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Example hidden until requested.':'Example shown.'}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lesson restarted. All worked examples are hidden.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Continuous lesson: all methods visible; examples still controlled individually.':'Presentation: one topic at a time.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Return to lesson</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['parity','errors','publication'].includes(which)){h=s07Panel(which);}
else if(which==='map'){h=panelHead("Lesson map")+`<p>Continue your own S06 project, predict the parity bit, write tests and individually implement the assigned mode. Publish main, check its identity and run the project from a fresh clone before the final submission and Q07.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Present one topic":"Read the continuous lesson"}</button><button data-command="tools">Checking tools</button><button data-command="reference">Shared reference</button><button data-command="help">Display and help</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">The proposed 90-minute session allows 70 minutes for the project and submission preparation, 15 minutes for Q07 and five minutes for closing. This pace assumes S06 and the tools are ready. Times have not been measured for each group.</p></div>`;}
else if(which==='help'){h=panelHead('Reading, navigation and display')+`<p><b>The explanations are visible from the start.</b> Use E or the green button to reveal the example one step at a time. The right arrow moves to the next topic even when the example is unfinished. Full working displays all its steps after your own attempt.</p><p><a href="BTI_S07_Lesson_Text_EN_GB_v1.0.0.html">Open the complete reading version</a>. It contains the same explanations and examples and needs no JavaScript. Keep both files in the same folder after downloading. In Moodle, use the separate reading link as well.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Lesson text scale: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− and A+ change the text by five percentage points. Enter a percentage for an exact size. Scroll longer explanations and wide tables. Choose a size for the actual screen and viewing distance.</p><div class="panel-controls"><button data-command="theme">Switch light/dark theme</button><button data-command="fullscreen">Full screen</button><button data-command="blank">Blank screen (B)</button><button data-command="tools">Tools and timer</button></div><h2>Keys</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Letter shortcuts: on':'Letter shortcuts: off'}</button></div><p class="small">Turn character shortcuts off if they interfere with typing or voice control. Arrows, Escape and on-screen buttons still work.</p><p>← / →: previous / next topic. E: show or advance an example. Shift+E: previous step. H: hide example. M: lesson map. F: full screen. B: blank screen. Escape: return to the lesson or restore keyboard focus.</p><p class="small">Inside form fields, arrows retain their editing function. Escape returns to the lesson. Alt+← / Alt+→ also navigate from a field.</p><h2>What we learn and why</h2><p>We individually solve a precise requirement: the parity bit for the assigned mode. Predict the results first, then write the tests and implementation. Check which errors the rule detects and which remain undetected.</p><p>After forgetting the commands, retain three questions: what should happen, which version did we publish and can a fresh copy reproduce the result?</p><h2>Connection with S05 and S06</h2><p>Keep your own existing copy with the hexadecimal function from S05 and the boundary-128 fix from S06. In S07 publish on main; S06 already practised a branch and pull request. This requirement needs no new PR.</p><h2>Practice and assessment</h2><p>Write your prediction and rule before revealing explanations. Gemini is optional for S07 clarification after your own attempt. Test any claim. During Q07 do not use AI or classmates; keep only the permitted shared reference and close the extended lesson and tools. Q07 lasts 15 minutes and is worth at most 0.50 real points. Q05–Q07 together are worth at most one point.</p><p>The final assignment is compulsory with ten Online text fields and no separate grade. Individual approval does not control access to Q07. A quiz mark certifies neither execution of a project nor authorship of its changes.</p><h2>Tool conventions</h2><p>The parser mirrors the project's decimal input: digits, optional surrounding whitespace and an integer between 0 and 255. The additional 128-character bound belongs only to this teaching tool. The parity word contains nine bits: eight data bits with a parity bit appended on the right. The error lab starts only with a word valid for the chosen mode.</p><p>The publication panel simulates two files and numbered fresh copies. It does not execute Git, the project or tests and does not access GitHub. Matching identities do not prove that the application works.</p><p class="small">The downloaded files work offline. Use the reading version to print all explanations and steps.</p></div>`;}
else if(which==='reference'){h=panelHead("Shared reference")+S07REFERENCE+'</div>';}
else if(which==='tools'){const u=S07UI;h=panelHead("Checking tools")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="parity">${u.parityTitle}</button><button data-command="errors">${u.errorTitle}</button><button data-command="publication">${u.publicationTitle}</button><button data-command="reference">Shared reference</button></div><h2>Practice timer</h2><p>The timer does not reveal answers, advance topics or control a Moodle assessment’s time limit.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4200">70 min</button><button data-command="timerPause">Pause / resume</button><button data-command="timerOff">Hide timer</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S07UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S07UI.errors[err.code||err.message]||S07UI.unexpectedError;box.textContent=message;say(S07UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS07Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Time finished · ':timer.running?'Practice · ':'Paused · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('Full screen was refused. Use the browser’s own full-screen command.');}}
function blank(){const open=$('blank').hidden;$('blank').hidden=!open;$('app').inert=open;if(open)$('blank').focus();else $('stage').focus({preventScroll:true});}
function command(cmd){if(cmd==='shortcuts'){state.shortcuts=!state.shortcuts;applyPrefs();openPanel('help');return;}if(cmd==='return'){go(state.index,{keep:true});return;}if(cmd==='reading'){mode();return;}if(cmd==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyPrefs();return;}if(cmd==='fullscreen'){fullscreen();return;}if(cmd==='blank'){blank();return;}if(cmd==='timerPause'){timerPause();return;}if(cmd==='timerOff'){timer.running=false;$('timerReadout').hidden=true;return;}openPanel(cmd);}
$('mapBtn').onclick=()=>openPanel('map');$('helpBtn').onclick=()=>openPanel('help');$('toolsBtn').onclick=()=>openPanel('tools');$('modeBtn').onclick=mode;$('fullBtn').onclick=fullscreen;$('smaller').onclick=()=>setScale(state.scale-5);$('larger').onclick=()=>setScale(state.scale+5);$('scaleInput').addEventListener('change',e=>setScale(e.target.value));$('scaleInput').addEventListener('keydown',e=>{if(e.key==='Enter'){setScale(e.target.value);$('stage').focus();}});$('prevBtn').onclick=()=>navigate(-1);$('nextBtn').onclick=()=>navigate(1);$('revealBtn').onclick=()=>reveal();$('blank').onclick=blank;

const S07REFERENCE="<section id=\"format-reference\"><h2>Shared reference</h2><p>This preserves the complete shared reference content from project v0.4.0. Use it in practice and in Q07 under the rules communicated in the course. In Q07, close the extended lesson, tools and AI; keep only the permitted reference. It includes useful results and rules: the quiz checks understanding with the announced support and does not certify the project or authorship.</p><section class=\"section\" id=\"shared-ref-byte\"><h2>Eight data bits</h2><p>The input is a decimal integer <code>u</code> from <strong>0 to 255</strong> inclusive. Leading and trailing spaces are ignored; leading zeros are accepted. Empty input, text, negatives, fractions and 256 are rejected. The eight binary positions have weights <code>128, 64, 32, 16, 8, 4, 2, 1</code>.</p><p>One hexadecimal digit represents four bits because <code>16 = 2⁴</code>. Therefore a byte needs exactly two hexadecimal characters, including a leading zero where required. Digits 10–15 are <code>A–F</code>. For example, <code>5 → 00000101 → 05</code> and <code>255 = 15 × 16 + 15 → FF</code>.</p><p>For eight-bit two’s complement, interpret the same pattern as <code>s = u</code> for <code>0 ≤ u &lt; 128</code>, or <code>s = u − 256</code> for <code>128 ≤ u ≤ 255</code>. The range is <strong>−128 to 127</strong>. The leftmost bit has weight −128 in this interpretation; the stored bits do not change.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Shared reference\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Unsigned u</th><th scope=\"col\">Eight bits</th><th scope=\"col\">Hex</th><th scope=\"col\">Signed s</th></tr></thead><tbody><tr><td>0</td><td>00000000</td><td>00</td><td>0</td></tr><tr><td>5</td><td>00000101</td><td>05</td><td>5</td></tr><tr><td>127</td><td>01111111</td><td>7F</td><td>127</td></tr><tr><td>128</td><td>10000000</td><td>80</td><td>−128</td></tr><tr><td>129</td><td>10000001</td><td>81</td><td>−127</td></tr><tr><td>255</td><td>11111111</td><td>FF</td><td>−1</td></tr></tbody></table></div></section><section class=\"section\" id=\"shared-ref-parity\"><h2>One separate parity bit</h2><p>Let <code>k</code> count the 1 bits in the eight data bits. Append a numeric bit <code>p</code> at the right. <strong>A · even:</strong> <code>p = k % 2</code>, making <code>k + p</code> even. <strong>B · odd:</strong> <code>p = 1 − (k % 2)</code>, making <code>k + p</code> odd.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Shared reference\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Data</th><th scope=\"col\">Count k</th><th scope=\"col\">A · even p</th><th scope=\"col\">B · odd p</th></tr></thead><tbody><tr><td>3 · 00000011</td><td>2</td><td>0</td><td>1</td></tr><tr><td>7 · 00000111</td><td>3</td><td>1</td><td>0</td></tr></tbody></table></div><p>The transmitted display has <strong>nine bits</strong>: eight data bits plus a separate check bit. A single bit flip changes parity; any odd number of flips does so. An even number can preserve it. A parity check does not locate or correct the error.</p></section><section class=\"section\" id=\"shared-ref-git\"><h2>Git actions and where the result exists</h2><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Shared reference\"><table><caption>Shared reference</caption><thead><tr><th scope=\"col\">Action</th><th scope=\"col\">Result and useful check</th></tr></thead><tbody><tr><td>Save</td><td>Writes a file in your local folder. Reload the browser to use saved code.</td></tr><tr><td>Diff</td><td>Shows the changed content. <code>git diff</code> shows unstaged changes.</td></tr><tr><td>Stage</td><td>Selects the content of the next commit. <code>git diff --cached</code> shows that selection.</td></tr><tr><td>Commit</td><td>Records the staged version in local Git history. It is not published yet.</td></tr><tr><td>Push</td><td>Sends local commits to <code>origin</code>, normally your own GitHub repository.</td></tr><tr><td>Clone</td><td>Creates a local working copy and Git history from the remote URL.</td></tr><tr><td>Issue</td><td>Describes a problem, observations and a hypothesis in your own repository.</td></tr><tr><td>Branch</td><td>Names the separate line on which you make a repair.</td></tr><tr><td>Pull request</td><td>Explains a branch change proposed for integration into <code>main</code>.</td></tr><tr><td>Merge then pull</td><td>Merge integrates on GitHub; <code>git pull --ff-only</code> updates local <code>main</code> afterwards.</td></tr></tbody></table></div><p><code>origin</code> is the remote’s name; <code>main</code> is the main branch in this project. If you edit a file after staging it, stage the new content again before committing.</p><p><code>git status</code> checks branch and local changes; <code>git remote -v</code> checks the remote URL; <code>git branch --show-current</code> checks the branch; <code>git rev-parse HEAD</code> prints the full current commit identifier. A clean working tree alone does not prove that you pushed.</p></section><section class=\"section\" id=\"shared-ref-method\"><h2>Investigation, reproduction and assessment</h2><p><strong>Investigation:</strong> own hypothesis → one AI claim or prepared response → predicted test result → observed result → conclusion. Test the point where a rule changes and rerun previously correct cases. One counterexample contradicts a claim that something works for every valid input; a few passing examples do not establish such a universal claim.</p><p><strong>Reproduction:</strong> finish and push → clone into a different folder → check <code>main</code>, clean status and the same full SHA → open the fresh clone’s HTML files → rerun the reported tests. Put the final SHA in Moodle after the last commit and push, not inside a file belonging to that commit.</p><p><strong>Quizzes:</strong> individual, no AI or classmates, this reference allowed. Q05: 10 minutes and maximum 0.20 real points; Q06: 10 minutes and 0.30; Q07: 15 minutes and 0.50. Total maximum: one real point. The final online-text assignment is compulsory and ungraded.</p></section></section>";

// Pure teaching models: no files, real Git, authentication or network calls.
// The 128-character bound is a lesson UI limit, not the project parser's limit.
function s07Error(code) { const error = new Error(code); error.code = code; throw error; }
function parseByteInput(raw) {
  const input = String(raw);
  if (input.length > 128) s07Error('INPUT_TOO_LONG');
  const text = input.trim();
  if (!/^\d+$/.test(text)) s07Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s07Error('BYTE_RANGE');
  return value;
}
function s07Mode(mode) { if (mode !== 'even' && mode !== 'odd') s07Error('INVALID_PARITY_MODE'); return mode; }
function parityPrediction(raw, mode) {
  const value = parseByteInput(raw); s07Mode(mode);
  const binary = value.toString(2).padStart(8, '0');
  const countOnes = [...binary].reduce((sum, bit) => sum + Number(bit), 0);
  const parity = mode === 'even' ? countOnes % 2 : 1 - countOnes % 2;
  return {value, binary, countOnes, mode, parity, totalOnes: countOnes + parity, word: binary + parity};
}
function parityErrorLab(originalWord, flippedPositions, mode) {
  s07Mode(mode);
  if (typeof originalWord !== 'string' || !/^[01]{9}$/.test(originalWord)) s07Error('INVALID_WORD');
  if (!Array.isArray(flippedPositions) || flippedPositions.some(p => !Number.isInteger(p) || p < 0 || p > 8) ||
      new Set(flippedPositions).size !== flippedPositions.length) s07Error('INVALID_FLIPS');
  const originalOnes = [...originalWord].reduce((sum, bit) => sum + Number(bit), 0);
  const target = mode === 'even' ? 0 : 1;
  if (originalOnes % 2 !== target) s07Error('ORIGINAL_PARITY_MISMATCH');
  const selected = new Set(flippedPositions);
  const receivedWord = [...originalWord].map((bit, index) => selected.has(index) ? String(1 - Number(bit)) : bit).join('');
  const receivedOnes = [...receivedWord].reduce((sum, bit) => sum + Number(bit), 0);
  const rulePasses = receivedOnes % 2 === target;
  return {originalWord, receivedWord, mode, flippedPositions: flippedPositions.slice().sort((a,b)=>a-b),
    flips: selected.size, originalOnes, receivedOnes, rulePasses, detected: !rulePasses,
    canLocate: false, canCorrect: false, simulation: true};
}

function createPublicationState() {
  return {working: {code: 'v0', test: null}, index: {code: 'v0', test: null},
    localMain: {id: 'c0', files: {code: 'v0', test: null}},
    remoteMain: {id: 'c0', files: {code: 'v0', test: null}}, freshClone: null,
    history: [{id: 'c0', files: {code: 'v0', test: null}, parent: null}],
    revision: 0, commitNumber: 0, cloneNumber: 0, lastAction: 'reset', changed: false};
}
function s07PublicationState(state) {
  if (!state || typeof state !== 'object' || !Number.isSafeInteger(state.revision) || state.revision < 0 ||
      !Number.isSafeInteger(state.commitNumber) || state.commitNumber < 0 || !Number.isSafeInteger(state.cloneNumber) || state.cloneNumber < 0 || !Array.isArray(state.history) ||
      state.history.length !== state.commitNumber + 1) s07Error('INVALID_PUBLICATION_STATE');
  const version = value => value === null || (typeof value === 'string' && /^v\d+$/.test(value) &&
    Number.isSafeInteger(Number(value.slice(1))) && Number(value.slice(1)) <= state.revision);
  const files = value => value && typeof value === 'object' && Object.keys(value).sort().join(',') === 'code,test' &&
    value.code !== null && version(value.code) && version(value.test);
  const same = (a,b) => a.code === b.code && a.test === b.test;
  if (!files(state.working) || !files(state.index) || !state.history.every((item, i) => item && item.id === 'c' + i &&
      files(item.files) && item.parent === (i === 0 ? null : 'c' + (i - 1))) ||
      state.history[0].files.code !== 'v0' || state.history[0].files.test !== null) s07Error('INVALID_PUBLICATION_STATE');
  const ref = value => value && state.history.some(item => value.id === item.id && files(value.files) && same(value.files, item.files));
  if (!ref(state.localMain) || !ref(state.remoteMain) || state.localMain.id !== 'c' + state.commitNumber ||
      Number(state.remoteMain.id.slice(1)) > Number(state.localMain.id.slice(1)) ||
      (state.freshClone !== null && (!Number.isSafeInteger(state.freshClone.serial) || state.freshClone.serial !== state.cloneNumber || !ref(state.freshClone) || Number(state.freshClone.id.slice(1)) > Number(state.remoteMain.id.slice(1)))))
    s07Error('INVALID_PUBLICATION_STATE');
  return state;
}
function publicationSummary(state) {
  const current = s07PublicationState(state);
  const copy = ref => ref && {id: ref.id, files: {...ref.files}, ...(ref.serial === undefined ? {} : {serial: ref.serial})};
  const same = (a,b) => a.code === b.code && a.test === b.test;
  const unstaged = !same(current.working, current.index), staged = !same(current.index, current.localMain.files);
  return {working: {...current.working}, index: {...current.index}, localMain: copy(current.localMain),
    remoteMain: copy(current.remoteMain), freshClone: copy(current.freshClone), unstaged, staged,
    workspaceClean: !unstaged && !staged, pushed: current.localMain.id === current.remoteMain.id,
    cloneMatchesPublished: Boolean(current.freshClone && current.freshClone.id === current.remoteMain.id),
    cloneMatchesLocal: Boolean(current.freshClone && current.freshClone.id === current.localMain.id),
    cloneHasTest: Boolean(current.freshClone && current.freshClone.files.test !== null),
    testsExecuted: false, testsPassed: null, lastAction: current.lastAction, changed: current.changed, simulation: true};
}
function publicationStep(state, action) {
  const actions = ['saveCode','saveTest','stageCode','stageTest','commit','push','clone','reset'];
  if (!actions.includes(action)) s07Error('INVALID_PUBLICATION_ACTION');
  s07PublicationState(state);
  if (action === 'reset') return createPublicationState();
  const next = { ...state, working: {...state.working}, index: {...state.index},
    localMain: {...state.localMain, files: {...state.localMain.files}},
    remoteMain: {...state.remoteMain, files: {...state.remoteMain.files}},
    freshClone: state.freshClone && {...state.freshClone, files: {...state.freshClone.files}},
    history: state.history.map(item=>({...item, files: {...item.files}})), lastAction: action, changed: false};
  if (action === 'saveCode' || action === 'saveTest') {
    if (next.revision >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
    next.working[action === 'saveCode' ? 'code' : 'test'] = 'v' + (++next.revision); next.changed = true;
  } else if (action === 'stageCode' || action === 'stageTest') {
    const file = action === 'stageCode' ? 'code' : 'test';
    if (next.working[file] === null) s07Error('FILE_NOT_SAVED');
    next.changed = next.index[file] !== next.working[file]; next.index[file] = next.working[file];
  } else if (action === 'commit') {
    if (publicationSummary(state).staged) {
      if (next.commitNumber >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
      const item = {id: 'c' + (++next.commitNumber), files: {...next.index}, parent: next.localMain.id};
      next.history.push(item); next.localMain = {id: item.id, files: {...item.files}}; next.changed = true;
    }
  } else if (action === 'push') {
    next.changed = next.remoteMain.id !== next.localMain.id;
    next.remoteMain = {id: next.localMain.id, files: {...next.localMain.files}};
  } else if (action === 'clone') {
    if (next.cloneNumber >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
    next.freshClone = {id: next.remoteMain.id, files: {...next.remoteMain.files}, serial: ++next.cloneNumber}; next.changed = true;
  }
  s07PublicationState(next); return next;
}
