<script id="lessonData" type="application/json">{"title":"An individual task and a verified version","version":"1.0.0","language":"en-GB","duration_seconds":4200,"quiz_separate_minutes":15,"font_min":20,"font_max":200,"pages":[{"id":"start","start":0,"end":120,"title":"Finish a project that someone else can run","chapter":"01 · Resume the S06 result","rule":"In S07 you implement the assigned parity requirement individually, publish the final version and check it from a fresh clone. Keep your S05 work and S06 fix alongside your explanations and tests.","method":["We used Git to record and integrate a change. Now we use it to identify exactly the version we submit and someone else can retrieve.","The BTI concept is parity, the software requirement is a function with precise inputs and outputs and the practical check is rerunning tests in the published copy.","When syntax fades, keep three questions: what result does the definition require, which test checks it and which version contains that result?"],"steps":[{"title":"Two kinds of check","html":"<p class=\"explain\">Parity checks a property of a bit word. A fresh clone checks whether the published files allow the result to be reproduced. We will explain the evidence each check provides and the conclusions it cannot support.</p>"},{"title":"Where the project continues","html":"<p class=\"explain\">Edit <code>PROJECT/lab.js</code>, <code>custom-tests.js</code>, <code>README.md</code> and <code>evidence.md</code> in the same clone of your own repository. Do not create another template-derived repository. The current Moodle lesson guides S07 while the project files remain yours.</p>"},{"title":"What you submit","html":"<p class=\"explain\">At the end, complete the ten-field Moodle record with the repository, final version, assigned mode, instructions and verified results, including the S06 investigation. The record is compulsory and carries no separate mark. No PDF, screenshots or full AI conversation is required.</p>"},{"title":"How we use the 90 minutes","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"S07 route\"><table><caption>S07 route</caption><thead><tr><th scope=\"col\">Interval</th><th scope=\"col\">Activity</th></tr></thead><tbody><tr><th scope=\"row\">0–70 min</th><td>Implementation, tests, publication, fresh clone and final record</td></tr><tr><th scope=\"row\">70–85 min</th><td>Individual Q07, maximum 0.50 real points</td></tr><tr><th scope=\"row\">85–90 min</th><td>Recap and what carries over to other projects</td></tr></tbody></table></div><p class=\"explain\">Q05, Q06 and Q07 together are worth at most one real point. Q07 has 50 raw marks, converted to at most 0.50 real points. Gemini clarification during S07 practice is optional; Q07 permits neither AI nor help from classmates. The detailed explanations can also be revisited after class.</p><p class=\"explain\"><strong>The timings are planning estimates and have not been piloted with a class.</strong> The work intervals assume prepared tools. If work is blocked, record the problem and follow the course recovery arrangements; report the results you actually checked.</p>"}],"connection":"First find the copy containing the integrated S06 fix.","mistake":"A green test page in one folder does not identify the published version in another folder.","prompt":"Show the starting point"},{"id":"resume","start":120,"end":360,"title":"Find your own copy and main","chapter":"01 · Resume the S06 result","rule":"Identify the folder, origin URL and branch before updating. Continue from main in your S06 project after the fix has been merged and retrieved locally.","method":["Read the S06 resumption note in evidence.md. The working folder and GitHub URL must refer to the same repository of your own.","With a clean working tree, you can switch to main and retrieve changes. If useful edits remain, inspect and preserve them before switching or pulling.","Do not assume pulling brings new guides from the shared template. Origin is your independent repository; follow the current Moodle S07 lesson."],"steps":[{"title":"Open the folder from the resumption note","html":"<p class=\"explain\">In VS Code, use <strong>File → Open Folder</strong> and select the folder recorded at the end of S06. Explorer should show the familiar <code>PROJECT</code>, <code>GUIDES</code> and <code>START.html</code>. Open <code>PROJECT/evidence.md</code> and check the URL and state recorded there.</p>"},{"title":"Read the state before changing it","html":"<p class=\"explain\"><strong>Paste into: the VS Code terminal at the root of your own repository.</strong></p><pre><code>git status\ngit remote -v\ngit branch --show-current</code></pre><p class=\"explain\">Recognise your own URL at <code>origin</code>. Inspect any modified file. If useful S06 notes remain unpublished, preserve them with an appropriate commit before updating; do not delete them to make the state appear clean.</p>"},{"title":"Update main once the state is clear","html":"<p class=\"explain\"><strong>Paste into: the same terminal after preserving useful edits.</strong></p><pre><code>git switch main\ngit pull --ff-only\ngit status</code></pre><p class=\"explain\">A direct update or “Already up to date” is normal. If <code>--ff-only</code> refuses because the histories have diverged, stop the update and clarify the difference with us. Do not use force push or reset to hide the problem.</p>"},{"title":"If the folder no longer exists","html":"<p class=\"explain\">Clone <strong>your own published repository</strong> into a new folder and check the S06 fix. A fresh clone of the starter template would restore the unfinished functions. If the online version is also incomplete, retain an honest record and recover the work rather than claiming S06 is complete.</p>"}],"connection":"Now check the earlier behaviour before adding parity tests.","mistake":"Pull updates from origin; it does not turn your own project into a new edition of the template.","prompt":"Show how to resume the copy"},{"id":"previous-check","start":360,"end":600,"title":"Check what was already correct in S06","chapter":"01 · Resume the S06 result","rule":"Before parity work, the S06 run should confirm the S05 hexadecimal implementation and signed interpretation fix. Separate an earlier problem from a requirement that is not yet implemented.","method":["Open the application and tests from the identified folder rather than an old tab with an unrecognised path.","Reload after saving JavaScript files. The browser must run the version you are inspecting in VS Code.","Keep your signed128 custom test. It is an example of protecting a fix when adding new functionality."],"steps":[{"title":"Open the identified local files","html":"<p class=\"explain\">From File Explorer or Finder, open <code>PROJECT/index.html</code> and <code>PROJECT/tests.html</code> in your own clone. Read the browser’s <code>file:</code> path. If needed, use the <strong>Language / Limba</strong> selector. No code change is needed to select the language.</p>"},{"title":"Run S06 before adding S07 tests","html":"<p class=\"explain\">On the test page, select <strong>S06 · Signed interpretation</strong> and press <strong>Run tests</strong>. With the supplied tests, original binary example and signed128 custom test, the result is <strong>37 passed, 0 failed, 0 unimplemented</strong>. Extra custom tests can change the total; read the rows as well as the count.</p>"},{"title":"Check that the fix reached local main","html":"<p class=\"explain\">In the application, 128 should have the signed interpretation −128. If the S06 check fails, first verify the folder, branch and saved files. A fix existing only in a PR, on GitHub or in another clone does not establish that this local copy contains it. Return to the S06 integration steps and record the actual blocker.</p>"},{"title":"Why the application may still describe the starter","html":"<p class=\"explain\">The initial-state notice is text supplied with the project, not a verdict calculated from your current code. It may remain after the fix. Use actual outputs and tests as evidence; deleting a notice does not implement a function. Today’s task does not redesign the interface.</p>"}],"connection":"Assign one parity mode and state the required result.","mistake":"At this checkpoint, S07 cases have not yet been added. Later, custom parity cases will run in earlier stages too.","prompt":"Show the S06 check"},{"id":"requirement","start":600,"end":780,"title":"The requirement: one separate bit for the assigned mode","chapter":"02 · From requirement to prediction","rule":"Implement only the assigned mode in parityBit8(u, mode): A means even parity and B means odd parity. The function receives a validated number and returns the number 0 or 1.","method":["Count the 1 bits in the eight data bits and choose one extra bit so that the total has the required parity.","The interface appends the bit on the right. The resulting word has nine bits: eight data bits and one check bit. A byte still consists of eight bits.","Preserve validation, completed functions and the unassigned mode. A/B is your project requirement; it does not override the mode specified by a Q07 item."],"steps":[{"title":"Record the assigned mode","html":"<p class=\"explain\">At the start of the S07 section in <code>PROJECT/evidence.md</code>, write <strong>Variant A — even</strong> or <strong>Variant B — odd</strong> as assigned in class. Select that same mode in the application and test page. Do not later choose whichever mode happens to produce green results.</p>"},{"title":"Distinguish data, one-bit count and check bit","html":"<p class=\"explain\">Let <code>k</code> be the number of 1 bits in the data and <code>p</code> the extra bit. <code>k</code> ranges from 0 to 8 whereas <code>p</code> is only 0 or 1. For A, the total <code>k + p</code> must be even; for B, it must be odd. Count 1 bits rather than using the decimal data value.</p>"},{"title":"What the function preserves and the interface builds","html":"<p class=\"explain\"><code>parityBit8</code> neither changes the byte <code>u</code> nor returns a nine-character string. It returns only the numeric bit. The interface then combines the eight bits from <code>toBinary8(u)</code> with this bit. Signed interpretation remains the separate function fixed in S06.</p>"},{"title":"Why the boundary matters","html":"<p class=\"explain\">A small requirement becomes easy to check when inputs, outputs and each function’s responsibility are explicit. In Q07 you can explain the distinction between data and control. In other projects, the same discipline prevents new functionality from accidentally changing established formats or behaviour.</p>"}],"connection":"Predict two outputs before formulas or implementation.","mistake":"The parity of the decimal input is not the number of 1 bits in its representation.","prompt":"Show the precise requirement"},{"id":"prediction","start":780,"end":960,"title":"First predict the results for 3 and 7","chapter":"02 · From requirement to prediction","rule":"Before consulting the completed table or changing the function, write the extra bit you would choose for your mode and explain why. A recorded prediction can be compared with the actual result.","method":["Use the requirement’s definition: the total number of 1 bits after appending the bit must have the assigned parity.","Record your attempt in evidence.md before revealing the following explanations. Keep any later correction alongside the original prediction.","An initially incorrect prediction is not separately penalised. We need the reasoning and the observation that led you to revise it."],"steps":[{"title":"Your attempt before the answer","html":"<p class=\"explain\">For <code>3 = 00000011</code> and <code>7 = 00000111</code>, record your assigned mode, the number of 1 bits and your proposed extra bit. Then write the total number of 1 bits after appending it. Leave <code>lab.js</code> unchanged and keep the next answer closed until you have two predictions of your own.</p>"},{"title":"Check the count","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Data before the check bit\"><table><caption>Data before the check bit</caption><thead><tr><th scope=\"col\">Value</th><th scope=\"col\">Eight data bits</th><th scope=\"col\">k</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td><code>00000011</code></td><td>2</td></tr><tr><th scope=\"row\">7</th><td><code>00000111</code></td><td>3</td></tr></tbody></table></div><p class=\"explain\">Count positions containing 1. Leading zeroes preserve the eight-bit width but do not contribute to <code>k</code>. The two counts have different parity even though both decimal values are odd.</p>"},{"title":"Compare both modes with the definition","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Justified predictions for A and B\"><table><caption>Justified predictions for A and B</caption><thead><tr><th scope=\"col\">Data</th><th scope=\"col\">k</th><th scope=\"col\">A: p / total</th><th scope=\"col\">B: p / total</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td>2</td><td>0 / 2</td><td>1 / 3</td></tr><tr><th scope=\"row\">7</th><td>3</td><td>1 / 4</td><td>0 / 3</td></tr></tbody></table></div><p class=\"explain\">For A and 3, the two 1 bits already form an even total, so append 0. For A and 7, three 1 bits require one more 1. B makes the opposite choice to obtain an odd total. Implement only your assigned mode; understanding both explanations helps you use the definition.</p>"},{"title":"Keep nine positions and their meaning","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Words formed by appending on the right\"><table><caption>Words formed by appending on the right</caption><thead><tr><th scope=\"col\">Data</th><th scope=\"col\">A: even</th><th scope=\"col\">B: odd</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td><code>000000110</code></td><td><code>000000111</code></td></tr><tr><th scope=\"row\">7</th><td><code>000001111</code></td><td><code>000001110</code></td></tr></tbody></table></div><p class=\"explain\">The final character is the extra bit. The first eight are the original data. Do not interpret this word as the output of <code>asSigned8</code> or replace a data bit with the parity bit.</p>"},{"title":"256 does not receive a parity bit","html":"<p class=\"explain\">Add to the same note: <strong>input 256 must be rejected</strong>. An unsigned byte ranges from 0 to 255 inclusive. The invalid case checks validation rather than seeking a parity bit for 256. The custom test will use <code>parse-error</code>.</p>"}],"connection":"Turn the explanation into a rule covering every one-bit count.","mistake":"Do not rewrite an initial prediction as though you knew the answer from the start. Record what changed and why.","prompt":"I have written predictions; show the check","answer_after_attempt":true},{"id":"parity-rule","start":960,"end":1200,"title":"Derive the rule from the required total","chapter":"02 · From requirement to prediction","rule":"A general rule must work for every one-bit count, from none to all eight. Derive it from the parity of the required total, then express it mathematically.","method":["Before the formula, describe what to do when the count is even and when it is odd.","Compare your rule with your two recorded predictions. A rule returning the same bit for every input cannot satisfy both cases.","The derivation applies to valid data. Validation remains before the calculation, with the mode checked separately."],"steps":[{"title":"State the rule before the formula","html":"<p class=\"explain\">Complete your note: “If the number of 1 bits is even, my mode appends …; if it is odd, it appends …”. Explain why each resulting total has the required parity. Try this before copying a JavaScript expression.</p>"},{"title":"The remainder describes the count’s parity","html":"<p class=\"explain\">Let <code>r = k % 2</code> be the remainder when <code>k</code> is divided by 2. An even count gives 0 and an odd count gives 1. Here <code>k</code> is a non-negative integer, so this expression covers the two cases. Do not use <code>u % 2</code> on the decimal data value.</p>"},{"title":"Derivation for A and B","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Rule for each count parity\"><table><caption>Rule for each count parity</caption><thead><tr><th scope=\"col\">k</th><th scope=\"col\">r</th><th scope=\"col\">A: p</th><th scope=\"col\">B: p</th></tr></thead><tbody><tr><th scope=\"row\">even</th><td>0</td><td>0</td><td>1</td></tr><tr><th scope=\"row\">odd</th><td>1</td><td>1</td><td>0</td></tr></tbody></table></div><p class=\"explain\">For A, choose <code>p = k % 2</code>: an odd count receives another 1 and becomes even. For B, choose <code>p = 1 - (k % 2)</code>: an even count receives a 1 and becomes odd. Each expression returns the numeric bit rather than the total <code>k + p</code>.</p>"},{"title":"Check the ends of the count range","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"No 1 bits and all eight\"><table><caption>No 1 bits and all eight</caption><thead><tr><th scope=\"col\">Data</th><th scope=\"col\">Binary</th><th scope=\"col\">k</th><th scope=\"col\">A: p</th><th scope=\"col\">B: p</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td><code>00000000</code></td><td>0</td><td>0</td><td>1</td></tr><tr><th scope=\"row\">255</th><td><code>11111111</code></td><td>8</td><td>0</td><td>1</td></tr></tbody></table></div><p class=\"explain\">These cases show that zero data and all-one data need no special rule. The required total determines the bit. Eight data bits permit nine count values but the extra bit still has only two values.</p>"},{"title":"Why two examples are not the whole argument","html":"<p class=\"explain\">Examples 3 and 7 exercise the two count cases, but the general justification is that every <code>k</code> is either even or odd. The rule covers both possibilities. The supplied exhaustive check later tests all 256 valid inputs; retain the distinction between a mathematical argument and a program check.</p>"}],"connection":"Write tests with these expectations before implementing the rule.","mistake":"The function returns p rather than k, k + p or the full word as a string.","prompt":"I have tried the rule; show the derivation","answer_after_attempt":true},{"id":"custom-tests","start":1200,"end":1440,"title":"Add the three custom tests once","chapter":"03 · Tests before implementation","rule":"In custom-tests.js keep the existing array and add only your assigned mode’s set: two valid cases and rejection of 256. Expected results come from the definition before implementation.","method":["Keep the original binary example and S06 boundary128 test. Add checks rather than replacing useful earlier coverage.","Each object contains label, input, operation and expected. Commas separate array entries; the block does not declare another CustomTests array.","Do not edit tests.js. It automatically includes every CustomTests entry, even when an earlier stage is selected."],"steps":[{"title":"Find the insertion point and keep existing entries","html":"<p class=\"explain\">In VS Code, open <code>PROJECT/custom-tests.js</code>. Find <code>globalThis.CustomTests = [ ... ];</code>. Keep existing entries, including <code>operation: 'signed'</code> for 128 and the <code>binary</code> example. Add a comma after the last existing entry, then insert your assigned block before <code>];</code>.</p>"},{"title":"A — even: entries to add","html":"<p class=\"explain\"><strong>Paste into: the existing array in PROJECT/custom-tests.js, only if assigned A.</strong></p><pre><code>{ label: 'A: two 1 bits', input: 3, operation: 'parity-even', expected: 0 },\n{ label: 'A: three 1 bits', input: 7, operation: 'parity-even', expected: 1 },\n{ label: 'Reject 256', input: '256', operation: 'parse-error', expected: 'ERROR' }</code></pre><p class=\"explain\">The first two expected values are numbers without quotation marks. The third uses the exact string <code>'ERROR'</code>, the runner’s rejection convention. Do not also copy set B.</p>"},{"title":"B — odd: entries to add","html":"<p class=\"explain\"><strong>Paste into: the existing array in PROJECT/custom-tests.js, only if assigned B.</strong></p><pre><code>{ label: 'B: two 1 bits', input: 3, operation: 'parity-odd', expected: 1 },\n{ label: 'B: three 1 bits', input: 7, operation: 'parity-odd', expected: 0 },\n{ label: 'Reject 256', input: '256', operation: 'parse-error', expected: 'ERROR' }</code></pre><p class=\"explain\">The same data needs opposite bits to A because the total must now be odd. The invalid case is identical in both variants: byte validation does not depend on parity.</p>"},{"title":"Save and avoid duplicate entries","html":"<p class=\"explain\">Save with <strong>Ctrl+S</strong> or <strong>Cmd+S</strong>. Read the array: the two earlier entries remain and three new ones cover a single mode. Keep any additional legitimate custom tests; lesson totals refer to the set described here. Do not paste the block again for later runs.</p>"}],"connection":"The first run shows what is implemented and what remains unfinished.","mistake":"Do not replace numeric 0 or 1 with a string, Boolean or the output of an incorrect function.","prompt":"Show the three tests"},{"id":"initial-run","start":1440,"end":1620,"title":"Read the initial state without calling it success","chapter":"03 · Tests before implementation","rule":"Run S07 and your assigned mode before implementation. Null means Not implemented rather than 0, a correct output or a passed check. The invalid-input test should already pass.","method":["Reload the test page so it loads the saved array. Select S07 and the same mode recorded in evidence.md.","Read each row’s state: passed, failed or unimplemented. A total without these categories can be misleading.","Retain this run as the comparison point for after implementation. Do not change expectations to hide a mismatch."],"steps":[{"title":"Select stage and mode before running","html":"<p class=\"explain\">Reload <code>PROJECT/tests.html</code> in the browser. Set <strong>Stage</strong> to S07 and <strong>S07 variant</strong> to assigned A — even or B — odd. Press <strong>Run tests</strong>. Changing a selector also recalculates the page, but the button provides an explicit checking step.</p>"},{"title":"Totals for the specified set","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Before parity implementation\"><table><caption>Before parity implementation</caption><thead><tr><th scope=\"col\">State</th><th scope=\"col\">Passed</th><th scope=\"col\">Failed</th><th scope=\"col\">Unimplemented</th></tr></thead><tbody><tr><th scope=\"row\">S07 without the three new tests</th><td>38</td><td>0</td><td>7</td></tr><tr><th scope=\"row\">S07 with the three new tests</th><td>39</td><td>0</td><td>9</td></tr></tbody></table></div><p class=\"explain\">The two new parity cases increase the unimplemented count. Rejection of 256 adds a passed check because validation already exists. The seven supplied parity checks include individual cases and one exhaustive row; one row does not always represent a single input.</p>"},{"title":"Keep the observation in evidence.md","html":"<p class=\"explain\">Record the stage, mode, totals and custom case results: 3 and 7 are still unimplemented while 256 is rejected. If a row fails instead of being unimplemented, read its operation and cause. If parity was already completed, record the actual state and history; do not artificially restore <code>null</code> to manufacture an initial run.</p>"},{"title":"If the page cannot load the tests","html":"<p class=\"explain\">Check saving and syntax in <code>custom-tests.js</code>: a missing comma can prevent the whole array from loading. Keep filenames and property names unchanged. If <strong>custom-tests.js did not load</strong> appears, missing rows are not evidence of missing errors. Fix the cause and reload before continuing.</p>"}],"connection":"Now write your own rule for the function you will complete.","mistake":"Do not modify tests.js or remove unfinished rows. They accurately describe the state before the requirement is implemented.","prompt":"Show the first run"},{"id":"own-rule","start":1620,"end":1800,"title":"Write and check your own rule before coding","chapter":"04 · Implement and explain","rule":"Before changing the return, connect the assigned mode to your own rule and the two predictions. State which input the rule uses and which result it returns.","method":["Use k for the number of 1 bits. The required result is p, the separate bit, rather than the count or the data value.","Check the rule against the counts in both cases. A short expression is not correct merely because it is easy to copy.","Reveal the explanation after your attempt. Keep any revision so that your tests remain linked to your reasoning."],"steps":[{"title":"Your own attempt","html":"<p class=\"explain\">In <code>evidence.md</code>, write two or three sentences: “My mode is … . If the number of 1 bits is …, I choose … because … . The function must return …”. Then write the expression you would use without editing the function yet. Compare it with your recorded predictions for 3 and 7.</p>"},{"title":"Separate counting from choosing the bit","html":"<p class=\"explain\"><code>countOnes8(u)</code> is supplied. It receives a valid number and returns the number of 1 bits in the eight-bit representation. Use it for <code>k</code>; do not rewrite it or manually add a result for every data value. The parity rule turns that count into the extra bit.</p>"},{"title":"Expressions and a paper check","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Rule checked against the two counts\"><table><caption>Rule checked against the two counts</caption><thead><tr><th scope=\"col\">Mode</th><th scope=\"col\">Expression for p</th><th scope=\"col\">k = 2</th><th scope=\"col\">k = 3</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>k % 2</code></td><td>0</td><td>1</td></tr><tr><th scope=\"row\">B — odd</th><td><code>1 - (k % 2)</code></td><td>1</td><td>0</td></tr></tbody></table></div><p class=\"explain\">The remainder of 2 divided by 2 is 0 and the remainder for 3 is 1. B subtracts that remainder from 1. This check substitutes actual values for symbols and asks again whether the total has the required parity.</p>"},{"title":"What you can explain without memorising the expression","html":"<p class=\"explain\">If you forget the formula, reconstruct it from the two possible count parities and the required total. Keep an explained requirement rather than a memorised line. A Q07 item may specify the other mode; derive it from the definition even though your project implements only one.</p>"}],"connection":"Apply the rule only inside the assigned mode’s block.","mistake":"Use the number of 1 bits rather than the parity of the decimal value u.","prompt":"I have written a rule; show the comparison","answer_after_attempt":true},{"id":"implement","start":1800,"end":2100,"title":"Complete only the assigned mode’s return","chapter":"04 · Implement and explain","rule":"In parityBit8 preserve validation and the two existing mode blocks. Replace return null only inside even for A or odd for B, then save and check the behaviour.","method":["Attempt the implementation from your own rule before revealing the supporting code. Use the supplied countOnes8 helper.","Implement individually. The explanations link the expression to the definition and the tests check the function actually saved.","The unassigned mode may remain null. Avoid expanding the task at the expense of fully publishing and reproducing your own mode."],"steps":[{"title":"Your attempt in the file","html":"<p class=\"explain\">In VS Code, open <code>PROJECT/lab.js</code> and find <code>function parityBit8(u, mode)</code>. Read its validation and locate your assigned block. Use your written rule to replace only that <code>return null;</code>. Keep the rest of the function and <code>tests.js</code> unchanged. Make your own attempt before the following code.</p>"},{"title":"Read the hints one at a time after your own attempt","html":"<ol><li><strong>The rule:</strong> the returned bit must make <code>k + p</code> even for A or odd for B. Check an even count and an odd count separately.</li><li><strong>The calculation input:</strong> <code>countOnes8(u)</code> supplies the count <code>k</code>. The decimal value <code>u</code> and its number of 1 bits are different quantities.</li><li><strong>The change location:</strong> work only inside your assigned mode block, preserve validation and use the expression you derived for that mode. Return the number 0 or 1, rather than the count or the transmitted word.</li><li><strong>The check:</strong> for 3 and 7, compare the function result with your prediction from counting the bits. If a case differs, first check the mode, count and result type; do not change the test expectation.</li></ol><p class=\"explain\">Stop at the hint that lets you continue. The formulas and examples explain the rule; write your assigned variant’s implementation yourself.</p>"},{"title":"An analogous example: how many boxes of eight items are needed?","html":"<p class=\"explain\"><strong>A supporting example, with no additional task.</strong> We have an already validated integer count of items from 0 to 255; a box holds at most eight. First calculate the full boxes; the remainder tells you whether one more is needed. The problem asks for a box count, rather than a parity bit.</p><pre><code>function boxesNeeded(itemCount) {\n  const fullBoxes = Math.floor(itemCount / 8);\n  const extraBox = itemCount % 8 === 0 ? 0 : 1;\n  return fullBoxes + extraBox;\n}</code></pre><p class=\"explain\">For 16 items there are two full boxes and no remainder: the result is 2. For 19 there are two full boxes and a remainder of 3: the result is 3. For zero items the result is 0. Follow the sequence: intermediate value → decision from the contract → numeric result.</p><p class=\"explain\">The fragment can be evaluated separately in JavaScript, but do not paste it into <code>PROJECT/lab.js</code> or commit it to the project. In S07, another function supplies the count, the criterion concerns the parity of the total and the result is only 0 or 1. The box rule does not solve that task.</p>"},{"title":"Save and open the application from the same copy","html":"<p class=\"explain\">Save <code>lab.js</code>, reload <code>PROJECT/index.html</code> and select your assigned mode. Enter 3 and 7. Compare the separate bit and nine-bit word against your predictions. <strong>Not implemented yet</strong> in the other mode is expected when only the assigned mode has been completed.</p>"},{"title":"Why a different result type violates the contract","html":"<p class=\"explain\">Do not return <code>'0'</code>, <code>'1'</code>, <code>true</code> or <code>false</code>. Tests compare values strictly, so type is part of the contract. The interface may display something plausible even if the function returned a string. That is why tests matter as well as the text’s appearance.</p>"}],"connection":"If an explanation remains unclear, you may ask for clarification before the final check.","mistake":"Keep validateByte and mode validation and do not turn the function output into the displayed word.","prompt":"I have tried implementation; show the support","answer_after_attempt":true},{"id":"optional-clarification","start":2100,"end":2280,"title":"Gemini can clarify a rule you have attempted","chapter":"04 · Implement and explain","rule":"Gemini consultation in S07 is optional and follows your own prediction and rule. Ask for a checkable explanation without code, then record which statement you checked and how.","method":["If the explanation is already clear, continue to testing. Completing this requirement does not depend on a service account or subscription.","If using Gemini, specify the mode and your own rule. A confident-sounding answer does not replace counting and execution.","S07 remains an individual implementation. No transcript is required and AI consultation is not permitted in Q07."],"steps":[{"title":"Choose exactly what needs clarification","html":"<p class=\"explain\">Before opening Gemini, write a precise question: “I do not understand why …” or “My rule would give …; I want to check …”. If nothing needs clarification, record that you continued without S07 consultation. Not using Gemini here is not a project omission.</p>"},{"title":"Prompt after filling in your own rule","html":"<p class=\"explain\"><strong>Paste into: Gemini’s prompt box only if you choose consultation. Complete the bracketed fields first.</strong></p><pre><code>For my variant [A-even/B-odd], the rule I derived is: [my rule].\nFor 00000011 and 00000111, check the extra bit and explain why the total has the required parity.\nDo not write the code. Keep the eight data bits separate from the check bit.\nIdentify a statement in the explanation that I can check independently by counting or testing.</code></pre><p class=\"explain\">The requirement, rule and two bit strings are sufficient. No password, token or personal data is needed in this prompt.</p>"},{"title":"Turn the explanation into a check","html":"<p class=\"explain\">Choose a precise statement from the response and check it against your count and actual application outputs. If it concerns all inputs, connect it to the general rule and the supplied exhaustive check. If the response confuses the decimal value with the one-bit count, show the distinction using 3 and 7.</p>"},{"title":"Record the source honestly and briefly","html":"<p class=\"explain\">A short S07 note should name the consulted source, statement or uncertainty, check and conclusion. You may write “I used no AI in S07; I checked the rule by counting and testing”. Keep the S06 investigation source separate: actual Gemini use or the prepared teaching alternative. Do not attribute an answer to a service you did not receive it from.</p>"}],"connection":"Rerun the same tests without changing their expectations.","mistake":"A well-written prompt is not evidence of the result. Evidence comes from the check you describe and execute.","prompt":"I have formulated a question; show the steps","answer_after_attempt":true},{"id":"retest","start":2280,"end":2520,"title":"Rerun the same tests after implementation","chapter":"05 · Check what was preserved","rule":"Save, reload and run S07 for the assigned mode. Compare the same expected results with actual outputs; an unfinished check should now pass if the function is correct.","method":["Do not add the 3, 7 and 256 entries again. Reuse the array run before implementation.","For the specified set, completed S07 gives 48 passed, 0 failed and 0 unimplemented. Read your custom results and the exhaustive row too.","Notes retain stage, mode, input, expectation and observed result. Confirm fresh-clone reproduction in Moodle only after performing it."],"steps":[{"title":"Reload and run explicitly","html":"<p class=\"explain\">Save <code>lab.js</code> and <code>custom-tests.js</code>. Reload the original clone’s test page, choose S07 and the assigned mode, then press <strong>Run tests</strong>. If the application and tests appear to run different versions, check both <code>file:</code> paths and reload both tabs.</p>"},{"title":"Compare the complete set’s results","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"S07 after completing the assigned mode\"><table><caption>S07 after completing the assigned mode</caption><thead><tr><th scope=\"col\">Run</th><th scope=\"col\">Passed</th><th scope=\"col\">Failed</th><th scope=\"col\">Unimplemented</th></tr></thead><tbody><tr><th scope=\"row\">S07 with required tests</th><td>48</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"explain\">The nine previously unimplemented parity checks now pass: seven supplied and your two custom cases. The invalid case already passed. This total assumes the original binary example, signed128 and exactly the three new tests; additional checks can change the count without changing the requirement.</p>"},{"title":"Check the application and three cases","html":"<p class=\"explain\">In the application, enter 3 and 7 for your assigned mode and read the separate bit, then the full word. Enter 256 and check rejection rather than reporting a bit for invalid input. In <code>evidence.md</code>, fill the <strong>input / operation / expected / observed</strong> table from this run. These are original-clone results, not yet confirmed fresh-clone results.</p>"},{"title":"If a test still fails","html":"<p class=\"explain\">Read the first mismatch: operation, expectation, output and its type. Check the selected mode, edited block, saved file and expression’s parentheses. If the output is a string rather than a number, fix the implementation instead of weakening the test. If the problem remains, record the actual difference rather than inventing an all-passed report.</p><p class=\"explain\"><strong>Optional further practice, with no new required test:</strong> choose a valid byte other than 3 and 7. Count its 1 bits, predict the bit for your mode and explain why you chose the input. If you check it in the application, compare it with that prediction. The Moodle record retains the same three required tests.</p>"}],"connection":"Confirm earlier behaviour and the input contract too.","mistake":"Passing your assigned mode’s tests does not establish that the unassigned mode works.","prompt":"Show the post-implementation comparison"},{"id":"regression","start":2520,"end":2760,"title":"The new function preserves validation and the earlier fix","chapter":"05 · Check what was preserved","rule":"S07 includes earlier checks. Test the new requirement and whether adding it preserved completed behaviour, keeping the input text separate from the validated number received by the function.","method":["Reading hexadecimal and signed rows within S07 is a regression check: previously working behaviour should remain correct.","Custom tests run at every stage. Selecting S05 or S06 does not hide the parity checks you added.","Local results are necessary, but publication and a fresh clone will check whether the same version is available to someone else."],"steps":[{"title":"Read earlier checks within the S07 run","html":"<p class=\"explain\">Within the same S07 run, read hexadecimal and signed rows, including your signed128 custom test. You need not redo every S05–S06 exercise. If you changed only the assigned parity block, those outputs should be preserved. The <code>lab.js</code> diff will later help identify what you actually touched.</p>"},{"title":"Input text is not the function’s numeric argument","html":"<p class=\"explain\"><code>parseByte</code> accepts ASCII decimal digits, leading or trailing spaces and leading zeroes when the value lies between 0 and 255 inclusive. Here <code>' 003 '</code> becomes the number 3. Empty text, plus or minus signs, fractions, hexadecimal notation and 256 are rejected. <code>parityBit8</code> then receives the number rather than the input field’s text.</p>"},{"title":"Custom tests in an earlier stage","html":"<p class=\"explain\">After adding S07 tests, an S06 run also includes your 3, 7 and 256 entries. Before implementation the first two are unimplemented; after completing the assigned mode they pass. Do not remove tests to recover the initial total of 37. The selected stage filters supplied checks but does not filter your CustomTests array.</p>"},{"title":"What checking all valid values establishes","html":"<p class=\"explain\">The exhaustive parity row checks all 256 valid integer values for the selected mode. It checks the current function’s calculated output over this finite domain. It does not automatically check every possible text input, authorship or publication. Validation and the later identity and reproduction steps provide different evidence.</p>"}],"connection":"Before publication, consider which errors parity detects and which can go unnoticed.","mistake":"A plausible total without inspecting rows may conceal a wrong selected mode or different custom tests.","prompt":"Show what is preserved and checked"},{"id":"error-patterns","title":"What can the parity bit reveal?","chapter":"05 · Check the result and its limits","start":2760,"end":3000,"rule":"A check has a specific purpose. Compare words of the same length and investigate what happens when bits in the transmitted word are flipped.","method":["Keep the established convention: eight data bits followed by a parity bit on the right. The transmitted word has nine bits.","Predict the outcome before reading the explanation. A flipped bit changes from 0 to 1 or from 1 to 0 at a specified position.","Separate detecting a mismatch from locating and correcting an error. Establish what each example permits you to conclude."],"steps":[{"title":"Predict three changes to the same word","html":"<p class=\"explain\">For data <code>00000011</code>, start from the valid word for your variant: A — <code>000000110</code>; B — <code>000000111</code>. The last bit is the check bit. Without calculating a replacement parity bit, imagine flipping the first data bit, the first two data bits and only the last bit. Will the check accept each received word? Record your prediction and reason before revealing the explanation.</p>"},{"title":"Flipping one data bit changes the total","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"One flipped data bit, the same expected parity\"><table><caption>One flipped data bit, the same expected parity</caption><thead><tr><th scope=\"col\">Variant</th><th scope=\"col\">Sent word</th><th scope=\"col\">Received word</th><th scope=\"col\">1 bits received</th><th scope=\"col\">Check</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>100000110</code></td><td>3</td><td>Odd: a mismatch is detected.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>100000111</code></td><td>4</td><td>Even: a mismatch is detected.</td></tr></tbody></table></div><p class=\"explain\">Check the received word against the known convention. Do not calculate and replace its received check bit: that would conceal the change you are investigating.</p>"},{"title":"Flipping two distinct bits preserves parity","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Two flips, a different word that passes the check\"><table><caption>Two flips, a different word that passes the check</caption><thead><tr><th scope=\"col\">Variant</th><th scope=\"col\">Sent word</th><th scope=\"col\">Received word</th><th scope=\"col\">1 bits received</th><th scope=\"col\">Check</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>110000110</code></td><td>4</td><td>Even: accepted although the data differ.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>110000111</code></td><td>5</td><td>Odd: accepted although the data differ.</td></tr></tbody></table></div><p class=\"explain\">The two positions are distinct. Each flip changes parity, so the second changes it back. Acceptance does not establish that the received word is identical to the sent word.</p>"},{"title":"The check bit can also be flipped","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Flipping only the check bit\"><table><caption>Flipping only the check bit</caption><thead><tr><th scope=\"col\">Variant</th><th scope=\"col\">Sent word</th><th scope=\"col\">Received word</th><th scope=\"col\">1 bits received</th><th scope=\"col\">Check</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>000000111</code></td><td>3</td><td>A mismatch is detected.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>000000110</code></td><td>2</td><td>A mismatch is detected.</td></tr></tbody></table></div><p class=\"explain\">The check cannot establish whether a data bit or the check bit changed. Several different positions could produce the same parity mismatch.</p>"},{"title":"State the limit precisely","html":"<p class=\"explain\">In this model, for a nine-bit word and flips at distinct positions, every odd number of flips changes parity and is detected. Every even number of flips preserves parity and passes this check. Simple parity neither locates nor corrects the error. We have not analysed insertions, deletions or other changes of length here.</p><p class=\"explain\">Compare your prediction with the three cases. Revising a prediction after checking it shows what you learnt; keep a precise explanation rather than the overstatement “parity detects every error”.</p>"}],"connection":"Record what you actually checked before the final publication.","mistake":"Do not call the nine-bit word a byte or treat passing parity as complete message integrity.","prompt":"I have a prediction; show the check","answer_after_attempt":true},{"id":"work-notes","title":"Prepare the explanation and Moodle record","chapter":"06 · Publish an identifiable version","start":3000,"end":3240,"rule":"Record facts already observed before the final commit. Complete the final SHA and fresh-clone results in Moodle after the operations that establish them.","method":["Briefly update PROJECT/README.md and PROJECT/evidence.md; retain your prediction and observation even when they differ.","Prepare the ten fields of the final record now in a working document or the Moodle editor. Mark unchecked fields explicitly as “complete after verification”.","Someone taking over the project should be able to identify the implemented mode, run instructions and actual limits of this version."],"steps":[{"title":"README describes the version being published","html":"<p class=\"explain\">In <code>PROJECT/README.md</code>, state the implemented S07 variant: A — <code>even</code> or B — <code>odd</code>. State that the other mode remains unimplemented and that S05/S06 are preserved if you checked this. Mark only completed progress steps; the fresh clone and submission come later.</p><p class=\"explain\">Run instructions: open <code>PROJECT/index.html</code> in a browser for the application and <code>PROJECT/tests.html</code> for tests; select S07 and your variant, then run the tests. The application updates when its input changes and has no Run button. No local server or additional libraries are required.</p>"},{"title":"Notes retain the checking process","html":"<p class=\"explain\">In the S07 section of <code>PROJECT/evidence.md</code>, record your variant, predictions for 3 and 7, observed results and rejection of 256. Retain the S06 tests and claim, initial hypothesis and conclusion. If you used AI in S07, briefly state what you clarified and how you checked it.</p><p class=\"explain\">For S06, enter the issue URL, PR URL and integration confirmation only if those operations occurred. Describe any incomplete state explicitly. Do not replace an incorrect initial hypothesis with one invented after seeing the result.</p>"},{"title":"Begin the final record before the last two minutes","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Prepare now, confirm after cloning\"><table><caption>Prepare now, confirm after cloning</caption><thead><tr><th scope=\"col\">Fields</th><th scope=\"col\">When to complete them</th></tr></thead><tbody><tr><th scope=\"row\">1, 3, 4 and 10</th><td>Personal repository, variant, run instructions and template URL can be prepared now.</td></tr><tr><th scope=\"row\">6, 7 and 9</th><td>The S06 claim, hypothesis/test/conclusion and source come from actual notes.</td></tr><tr><th scope=\"row\">2, 5 and 8</th><td>Prepare the labels now; complete the final SHA, three results and clone confirmation after verification.</td></tr></tbody></table></div><p class=\"explain\">You can also prepare expected results for field 5. Leave “observed in the fresh clone” blank until you run that copy.</p>"},{"title":"Avoid an identifier that changes through documentation","html":"<p class=\"explain\">Do not insert this project’s final SHA into <code>evidence.md</code> and then commit the file: that new commit has a different identifier. In this activity, record the final SHA and reproduction confirmation only in Moodle after the last commit and push.</p><p class=\"explain\">The project can retain an explanation of the checking method and results already obtained. Do not claim in advance that “the fresh clone passed”; after cloning, do not create an additional commit merely to add that confirmation.</p>"},{"title":"Keep the source and relevant limits","html":"<p class=\"explain\">In README and field 10, retain the shared template address: <a href=\"https://github.com/antonioclim/BBS-bit-byte-starter\">https://github.com/antonioclim/BBS-bit-byte-starter</a>. Field 1 contains a different address: your own repository.</p><p class=\"explain\">If blocked, state what you checked, what failed and what remains to be done. The record is mandatory with no separate mark; no PDF, screenshots or Gemini transcript are required.</p>"}],"connection":"Read the differences before selecting what belongs in the commit.","mistake":"Do not fill future fields with assumed results or confuse the shared source URL with your personal project URL.","prompt":"Prepare the documentation"},{"id":"diff-stage","title":"What belongs in the final version?","chapter":"06 · Publish an identifiable version","start":3240,"end":3360,"rule":"Saving changes a file; staging selects the version to enter a commit. The diff shows changes before they are recorded.","method":["Save the relevant files and check that you are on main in your own repository.","Reading the differences should confirm the requirement: assigned mode, retained tests and honest documentation. Do not change tests.js to conceal a result.","Select the relevant files, then read the staged version again before committing."],"steps":[{"title":"Check the location and branch","html":"<p class=\"explain\">In the VS Code terminal at the original project’s root, run the commands below. <code>origin</code> must point to your repository and the branch must be <code>main</code>. Publish directly on main in S07; you practised a branch and PR in S06. No new PR is required.</p><pre><code>git remote -v\ngit branch --show-current\ngit status</code></pre>"},{"title":"Read the differences with specific questions","html":"<p class=\"explain\">In Source Control, open each changed file. In <code>lab.js</code>, check only the assigned parity mode and preservation of hexadecimal conversion, the interpretation of 128 and validation. In <code>custom-tests.js</code>, check the existing tests and a single addition of the three required tests. README and evidence should describe facts, run instructions and the unimplemented mode’s limit.</p><p class=\"explain\"><code>git diff</code> shows tracked changes that have not yet been staged. New files appear in <code>git status</code> and must be opened separately; an empty diff does not establish that there are no new files.</p>"},{"title":"Stage the relevant files only","html":"<p class=\"explain\">Use <strong>+</strong> beside each relevant file in Source Control or run the block below from the repository root. Do not automatically select a whole computer folder or another project.</p><pre><code>git add PROJECT/lab.js PROJECT/custom-tests.js PROJECT/README.md PROJECT/evidence.md\ngit diff --cached\ngit status</code></pre>"},{"title":"Check the staged snapshot","html":"<p class=\"explain\"><code>git diff --cached</code> shows staged changes. If you saved a file again after staging it, that latest change may still be outside the selection; read the status and stage the relevant file again.</p><p class=\"explain\">If <code>tests.js</code> or another file changed accidentally, inspect it and retain useful work before correcting the situation. Do not use broad deletion or <code>reset --hard</code> merely to produce an apparently clean state.</p>"}],"connection":"Record the checked snapshot and publish it to your repository.","mistake":"A staged file is not yet published and does not necessarily include the latest edit.","prompt":"Read and select the changes"},{"id":"commit-push","title":"Record and publish on main","chapter":"06 · Publish an identifiable version","start":3360,"end":3480,"rule":"A commit records a local version. A successful push publishes those commits to main in your own repository.","method":["Complete the commit with checked code, tests and documentation. Do not commit confirmation of a clone that does not yet exist.","Push main to your own origin and read the operation’s result. A commit without a push is not the version available for cloning from GitHub.","If publication stops, keep the message and resolve its cause; do not claim success or use force push."],"steps":[{"title":"A message that explains the change","html":"<p class=\"explain\">In Source Control, enter a message such as <code>S07: parity and reproduction instructions</code> and use Commit after checking staging. The message describes the change without claiming a future check has already happened.</p><p class=\"explain\">The terminal alternative is:</p><pre><code>git commit -m &quot;S07: parity and reproduction instructions&quot;</code></pre>"},{"title":"Publish the checked branch","html":"<p class=\"explain\">Confirm you are still on <code>main</code>, then use <strong>Push</strong> in Source Control or the command below. If the interface shows Sync Changes, that can also retrieve changes; choose the explicit Push operation for this step.</p><pre><code>git push origin main\ngit status</code></pre>"},{"title":"Read the success and inspect the online repository","html":"<p class=\"explain\">After a successful push, open your own GitHub repository and select <code>main</code>. Check the last commit message and <code>PROJECT/lab.js</code>, <code>PROJECT/custom-tests.js</code>, <code>PROJECT/README.md</code> and <code>PROJECT/evidence.md</code>. A locally saved file omitted from the commit does not appear through pushing.</p><p class=\"explain\">For this route without additional changes, <code>git status</code> shows a clean state and main up to date with origin/main. No Actions are needed and there is no new PR awaiting approval.</p>"},{"title":"If pushing fails","html":"<p class=\"explain\">A rejection, authentication problem or lost connection must be resolved before claiming the version is published. Check the URL and account. If remote main changed meanwhile, read the message and clarify the history; do not overwrite it with force push.</p><p class=\"explain\">If you cannot finish now, retain the local commit and state the actual position in your record. Follow the course’s existing recovery arrangements without inventing results or adding a new Q07 access condition.</p>"}],"connection":"Identify the exact published commit, then check the same version from a separate copy.","mistake":"Committed and pushed are different states. A push error is not publication confirmation.","prompt":"Record and publish the version"},{"id":"final-id","title":"Identify the version being submitted","chapter":"06 · Publish an identifiable version","start":3480,"end":3600,"rule":"The repository address identifies the project. The branch names a line of work. The full SHA identifies the commit checked for this submission.","method":["After the last successful push, obtain the identifier from local main and check the same commit on GitHub.","In this repository, the full SHA-1 identifier contains 40 hexadecimal characters. Compare the entire string without generalising that length to every Git repository.","Enter the identifier in Moodle field 2 and retain it for comparison with the fresh clone."],"steps":[{"title":"Obtain the identifier after publication","html":"<p class=\"explain\">From the checked original copy, run:</p><pre><code>git branch --show-current\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">The branch must be <code>main</code>. Copy the entire final output, excluding the terminal prompt; do not use only its first characters. This identifies local HEAD, so successful pushing must be checked separately.</p>"},{"title":"Compare with main on GitHub","html":"<p class=\"explain\">In your own GitHub repository with <code>main</code> selected, open the latest commit and use its full-SHA copy option if shown. Compare it with the local output. A short prefix in a list helps navigation, but the record uses the entire identifier.</p><p class=\"explain\">If the commit differs, check the repository, branch and last push. Do not claim to have identified the published version until the difference is resolved.</p>"},{"title":"Repository, branch and commit play different roles","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"What each item identifies\"><table><caption>What each item identifies</caption><thead><tr><th scope=\"col\">Information</th><th scope=\"col\">Role in the submission</th></tr></thead><tbody><tr><th scope=\"row\">Personal repository URL</th><td>Where the project is and where to clone it from.</td></tr><tr><th scope=\"row\">main</th><td>The final published branch for this activity.</td></tr><tr><th scope=\"row\">Full SHA</th><td>The precise commit for which you report results.</td></tr></tbody></table></div><p class=\"explain\">A correct address does not establish that you copied the final commit; the same folder name does not establish that you are running the same version.</p>"},{"title":"A change requires a new check","html":"<p class=\"explain\">If you change code, tests or a required file, save, test, make a new commit and push. Copy the new SHA, check the new version in the separate copy and update the Moodle record. Do not keep results labelled with the old SHA as though they described the latest version.</p><p class=\"explain\">Do not make an additional change merely to enter the SHA into your own evidence file. Keep the final confirmation in Moodle.</p>"}],"connection":"Clone your own repository to a separate location and check the published version.","mistake":"git rev-parse HEAD alone does not establish that the commit reached the server or that the program works.","prompt":"Copy and check the full SHA"},{"id":"fresh-clone","title":"A fresh copy of your own repository","chapter":"07 · Reproduce the published version","start":3600,"end":3780,"rule":"A fresh clone retrieves published content. It can expose files or changes that worked locally but were omitted from the pushed commit.","method":["Copy your personal repository’s HTTPS URL rather than the shared template address.","Choose another parent directory outside the original project and open the clone in a separate VS Code window.","Do not manually copy files from the original project over the fresh clone: check what was published."],"steps":[{"title":"Choose a separate location","html":"<p class=\"explain\">For example, if the original is in <code>Documents/BTI_WORK/project-name</code>, create or choose <code>Documents/BTI_CHECK</code> as another parent directory. Do not choose a location inside the original repository or clone over an existing folder.</p><p class=\"explain\">Keep the original. The fresh clone checks publication; it does not move or delete your work.</p>"},{"title":"Clone through VS Code","html":"<p class=\"explain\">In GitHub, open your repository, use <strong>Code</strong> and copy its HTTPS URL. In VS Code, open the Command Palette and choose <strong>Git: Clone</strong>; paste the URL and select the new parent directory.</p><p class=\"explain\">When asked to open the clone, choose a new window if offered. If it opens in the same window, explicitly check the path before running commands.</p>"},{"title":"Terminal alternative","html":"<p class=\"explain\">From the new parent directory outside the original, replace the example URL with your own. The local name <code>BTI_REPRO</code> must not already exist. These commands are an alternative to Git: Clone; there is no need to clone twice.</p><pre><code>git clone https://github.com/YOUR_ACCOUNT/YOUR_REPOSITORY.git BTI_REPRO\ncd BTI_REPRO</code></pre>"},{"title":"Confirm what you opened","html":"<p class=\"explain\">Explorer should show the new clone’s root with <code>PROJECT</code>, <code>GUIDES</code> and <code>START.html</code>. Check its full path in the window or through File Explorer/Finder. Two clones can have the same folder name under different parent directories.</p><p class=\"explain\">If you cloned the template or reopened the original, stop this confirmation and choose the correct repository/path. Do not claim reproduction from a clone other than the one required.</p>"}],"connection":"In the fresh copy, compare origin, main, status and the full identifier.","mistake":"Another tab or window with the same name does not establish that you are in another directory.","prompt":"Create the separate copy"},{"id":"clone-identity","title":"Check the fresh copy’s identity","chapter":"07 · Reproduce the published version","start":3780,"end":3900,"rule":"The comparison is relevant only if the fresh clone comes from the same repository and runs main at the same commit without local changes.","method":["Run commands in the fresh clone’s terminal rather than a terminal left in the original project.","Check four distinct items: your own origin, main, a clean state and the same full SHA.","Version identity makes the comparison meaningful. Program results require a separate check."],"steps":[{"title":"Four checks from the fresh clone","html":"<p class=\"explain\">Open a terminal in the fresh clone’s window and run:</p><pre><code>git remote -v\ngit branch --show-current\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Before running commands, check the terminal’s directory. A window can contain an older terminal whose location has not changed automatically.</p>"},{"title":"Read each result","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Identity of the separate clone\"><table><caption>Identity of the separate clone</caption><thead><tr><th scope=\"col\">Check</th><th scope=\"col\">What to confirm</th></tr></thead><tbody><tr><th scope=\"row\">origin</th><td>The same personal repository’s URL; URLs with or without .git may identify the same repository.</td></tr><tr><th scope=\"row\">Branch</th><td>main.</td></tr><tr><th scope=\"row\">State</th><td>Working tree clean / no local changes.</td></tr><tr><th scope=\"row\">HEAD</th><td>The same full 40-character identifier as the final published version.</td></tr></tbody></table></div><p class=\"explain\">Compare the entire SHA from both copies. If origin uses an SSH address, check the account and repository identity rather than requiring textually identical URL formats.</p>"},{"title":"If the SHA or branch differs","html":"<p class=\"explain\">Check whether you cloned your repository, whether the last push succeeded and whether you selected <code>main</code>. A clone created before a new push can retain an old SHA. From a copy with no changes, an allowed update is:</p><pre><code>git switch main\ngit pull --ff-only\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">If the operation refuses to update or the copy has changes, read the situation before proceeding. Do not use destructive resets to conceal the difference.</p>"},{"title":"What these details establish and what they do not","html":"<p class=\"explain\">The same SHA identifies the same commit; a clean state avoids testing local edits added over it. These checks do not establish that every required file was included, that tests pass or who wrote the code.</p><p class=\"explain\">If you do not yet have the required version, describe the actual difference in field 8. Do not confirm “the same version” until you checked it.</p>"}],"connection":"Open the application and tests from this clone’s PROJECT folder.","mistake":"A correctly copied SHA in the record does not change the code running in an old browser tab.","prompt":"Compare the version identity"},{"id":"reproduction","title":"Run what someone else can retrieve","chapter":"07 · Reproduce the published version","start":3900,"end":4080,"rule":"Reproduction requires running files from the checked copy. Record results observed there together with the version they describe.","method":["Open PROJECT/index.html and PROJECT/tests.html from the fresh clone’s directory. Check the path in the browser address bar.","Select your assigned mode in the application and S07 plus the same variant in tests. Rerun 3, 7 and 256.","Complete observed Moodle results only after this run. An original-copy result cannot replace confirmation from the fresh clone."],"steps":[{"title":"The tabs open files from the fresh clone","html":"<p class=\"explain\">From File Explorer/Finder for the fresh clone, open <code>PROJECT/index.html</code> and separately <code>PROJECT/tests.html</code> in a browser. Check each tab’s address: its path must include the new parent directory. If VS Code shows HTML, you opened the source for editing rather than the application.</p><p class=\"explain\">These local pages need no server. You may close old tabs to avoid confusion. Do not copy files missing from publication over the clone.</p>"},{"title":"Check the application and run S07","html":"<p class=\"explain\">In the application, select your assigned parity and enter 3, 7 and 256 in turn. Check the separate parity bit, nine-bit word and rejection message for the invalid input. The application updates results as its input changes.</p><p class=\"explain\">In tests, select <strong>S07</strong> and <strong>A — even</strong> or <strong>B — odd</strong>, then use <strong>Run tests</strong>. With the supplied tests, the 128 test and exactly the three required tests, completing the assigned mode produces 48 passed, 0 failed and 0 not implemented. Additional tests can change the count.</p>"},{"title":"Confirm the three actual results","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Results to confirm in the fresh clone\"><table><caption>Results to confirm in the fresh clone</caption><thead><tr><th scope=\"col\">Input / operation</th><th scope=\"col\">Expected A — even</th><th scope=\"col\">Expected B — odd</th><th scope=\"col\">Observed in the fresh clone</th></tr></thead><tbody><tr><th scope=\"row\">3 / assigned mode</th><td>0</td><td>1</td><td>Complete after running.</td></tr><tr><th scope=\"row\">7 / the same mode</th><td>1</td><td>0</td><td>Complete after running.</td></tr><tr><th scope=\"row\">256 / parse-error</th><td><code>ERROR</code></td><td><code>ERROR</code></td><td>Enter the observed rejection.</td></tr></tbody></table></div><p class=\"explain\">The first two results are the number 0 or 1. For the invalid test, <code>ERROR</code> is the test’s rejection indicator; the application’s message can explain the error. Selecting the other mode can leave cases unimplemented and is outside your assigned requirement.</p>"},{"title":"When publication does not reproduce the original","html":"<p class=\"explain\">If a file is missing or the version is wrong, return to the original, correct the cause, test, commit and push. Check the new SHA in the separate copy, reload its files and repeat the tests. Update the Moodle SHA and results together.</p><p class=\"explain\">If a failure remains, record the input, expected result, observation and what you could not check. The fresh clone checks reproduction of the published version; it does not certify the code’s author. Do not make a new commit merely to put this confirmation in evidence.md.</p>"}],"connection":"Complete only the last details of the prepared record and verify submission.","mistake":"Do not report 48 passed merely because the lesson states that count. Read the actual results and tested version.","prompt":"Run from the fresh copy"},{"id":"submission","title":"Submit the record without assumed confirmations","chapter":"08 · Complete the project and assessment","start":4080,"end":4140,"rule":"The final record is mandatory, submitted as online text and has no separate mark. It identifies the version and documents checking without restricting Q07 access.","method":["Use the text prepared during minutes 50–60. Now complete the final SHA, fresh-clone results and actual reproduction confirmation.","Keep all ten fields, including the S06 claim’s source and template URL. Explicitly describe anything that remains blocked.","Save and check Moodle’s displayed submission status. Text present only in the editor does not confirm submission."],"steps":[{"title":"Where to enter the text","html":"<p class=\"explain\">Open the final S05–S07 assignment in the BTI Moodle course and choose the add/edit submission option. In its <strong>Online text</strong> editor, paste your completed record with the last confirmed details. Do not upload a PDF, screenshots or the entire Gemini chat.</p><p class=\"explain\">Use the language specified for your series. The fields identify your project; do not copy another student’s URL, SHA or results.</p>"},{"title":"Fields 1–5 identify the version and results","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"The first five fields\"><table><caption>The first five fields</caption><thead><tr><th scope=\"col\">Field</th><th scope=\"col\">Required content</th></tr></thead><tbody><tr><th scope=\"row\">1 · Personal repository</th><td>Your project URL without authentication details.</td></tr><tr><th scope=\"row\">2 · Final SHA</th><td>The full identifier published on main and confirmed in the fresh copy.</td></tr><tr><th scope=\"row\">3 · Variant</th><td>A — even or B — odd.</td></tr><tr><th scope=\"row\">4 · Run instructions</th><td>Application, tests, S07 stage and variant; actual particulars if applicable.</td></tr><tr><th scope=\"row\">5 · Three tests</th><td>3 and 7 in the assigned mode, then rejection of 256: expected and observed in the fresh copy.</td></tr></tbody></table></div><p class=\"explain\">Do not replace field 5 with a generic statement such as “all tests are green”. The three inputs and their results must be readable.</p>"},{"title":"Fields 6–10 retain investigation and provenance","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"The final five fields\"><table><caption>The final five fields</caption><thead><tr><th scope=\"col\">Field</th><th scope=\"col\">Required content</th></tr></thead><tbody><tr><th scope=\"row\">6 · S06 claim</th><td>One precise claim from Gemini or the prepared example.</td></tr><tr><th scope=\"row\">7 · Check</th><td>In 2–4 sentences: initial hypothesis, a test distinguishing explanations, expectation, observation and conclusion.</td></tr><tr><th scope=\"row\">8 · Reproduction</th><td>Separate directory, main, the same SHA, files opened from the fresh clone and actual results / failures.</td></tr><tr><th scope=\"row\">9 · Source</th><td>Gemini or the prepared example; if you used AI in S07, what you clarified and checked.</td></tr><tr><th scope=\"row\">10 · Template</th><td>https://github.com/antonioclim/BBS-bit-byte-starter</td></tr></tbody></table></div><p class=\"explain\">An incorrect initial hypothesis is not separately penalised. Describe the route to the conclusion honestly; do not invent an unobserved result.</p>"},{"title":"The complete text structure","html":"<p class=\"explain\">If you need a structure, copy the text below into the Moodle editor after replacing the dots with your own details. It has ten fields; keep every label.</p><pre><code>1. Personal repository URL: ...\n2. Full final SHA published on main: ...\n3. S07 variant: A — even / B — odd\n4. Run instructions: ...\n5. Tests from the fresh clone:\n   3, operation ...: expected ...; observed ...\n   7, the same operation: expected ...; observed ...\n   256, validation: expected rejection; observed ...\n6. Precise claim analysed in S06: ...\n7. Initial hypothesis, test and conclusion (2–4 sentences): ...\n8. Reproduction from a separate clone: directory ..., main, SHA ..., application and tests opened from the fresh clone; results / remaining failures ...\n9. Source: Gemini / prepared example from the guide. AI clarification in S07, if used: ...\n10. Starting template URL: ...</code></pre>"},{"title":"Check submission status","html":"<p class=\"explain\">Use <strong>Save changes</strong>. In the recommended configuration for this assignment, there is no separate “Submit assignment” button; saving finalises the submission. Return to the assignment page and check its displayed status and saved text.</p><p class=\"explain\">If the existing activity uses a separate submission button, follow that step and check the final status. The assignment remains mandatory without a separate mark or individual approval before Q07. Quiz access is not conditional on an automatic tick or manual review of this record.</p>"}],"connection":"Close the working materials and begin the individual assessment.","mistake":"An open editor, unsaved draft or confirmation copied from the model is not actual submission and checking.","prompt":"Complete and save the record"},{"id":"quiz-transition","title":"Q07: interpret the question before answering","chapter":"08 · Complete the project and assessment","start":4140,"end":4200,"rule":"Q07 lasts 15 minutes and carries up to 50 internal marks, equivalent to 0.50 real points. The entire S05–S07 block remains worth at most 1 real point.","method":["Work individually without Gemini, other AI tools or classmates’ help. The shared reference sheet remains permitted.","Each question specifies its parity mode. Follow that mode even if your project implements the other variant.","The quiz checks understanding of the described situations with permitted support. It does not automatically inspect repositories or certify execution or authorship."],"steps":[{"title":"Separate practical work from the quiz","html":"<p class=\"explain\">During minutes 70–85, open Q07. Close the extended lesson, simulator, Gemini and other working materials. Keep only the shared reference sheet permitted for assessment. There is one attempt and a 15-minute limit; follow Moodle’s displayed timer.</p><p class=\"explain\">The final submission is mandatory, but Q07 access does not depend on individual project approval. Describe any blockage in the record and apply the course’s existing arrangements.</p>"},{"title":"The question’s mode determines the answer","html":"<p class=\"explain\">Before calculating, read whether the question asks for <code>even</code> or <code>odd</code>. Separate the data byte, check bit and transmitted word. Do not automatically apply your project’s variant to a question specifying the other mode.</p><p class=\"explain\">For an error question, establish which bits change and which check is used. State only the conclusion that check supports.</p>"},{"title":"Reading, navigation and submission","html":"<p class=\"explain\">Complete both responses in each CLOZE item. Navigation is free: you can return to an item during the attempt. Check your answers before <strong>Submit all and finish</strong>; detailed feedback is released after assessment closes for all groups.</p><p class=\"explain\">Each of the five selected questions carries 10 internal marks. Q07’s total of 50 converts to at most 0.50 real points; the project record has no additional mark.</p>"},{"title":"What remains from the three seminars","html":"<p class=\"explain\">In S05 you took over a project and published a first change. In S06 you investigated a problem, tested a claim and integrated a fix. In S07 you turned a requirement into a testable rule and checked the published version from a fresh copy.</p><p class=\"explain\">Even if you forget a command, retain the questions: what does the problem require, what do I expect to observe, what did I check, what are the check’s limits and which version lets someone else reproduce the result? The last five minutes, 85–90, are for this recap.</p>"}],"connection":"Complete S07 with the project, history and checking method, then return to the subject’s wider progression.","mistake":"A quiz with a permitted reference does not automatically certify the project or permit AI or classmates’ help.","prompt":"Prepare for Q07"}],"math_checks":[],"rehearsal":[]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s07-complete-lesson-v1-en-GB')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s07-complete-lesson-v1-en-GB',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Example hidden</span></div><section class="example" id="example-${i}" aria-label="Worked example" hidden></section><p class="connection"><b>Next.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
