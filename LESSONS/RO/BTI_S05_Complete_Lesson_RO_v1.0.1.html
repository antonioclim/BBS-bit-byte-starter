torul unui test. La S07 vom rezolva cerința individuală și vom reproduce rezultatul din copia publicată. Astăzi rămânem cu propria copie, hexazecimalul verificat și informația de reluare.</p>"}],"connection":"Păstrăm același repository pentru S06; următoarea activitate va porni de la versiunea verificată astăzi.","mistake":"Testul și proiectul furnizează dovezi diferite. Un punctaj bun la Q05 nu confirmă singur finalizarea depozitului propriu.","prompt":"Afișați următorul pas"}],"math_checks":[],"rehearsal":[]}</script>

'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s05-complete-lesson-v1-ro')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s05-complete-lesson-v1-ro',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Exemplul este ascuns</span></div><section class="example" id="example-${i}" aria-label="Exemplu rezolvat" hidden></section><p class="connection"><b>Legătura cu tema următoare.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Prezentare pe teme':'Citire continuă';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Reluați pas cu pas';return f<p.steps.length-1?'Următorul pas al rezolvării':'Reluați exemplul ↺';}
function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Exemplul este ascuns':state.all[i]?`Toți cei ${p.steps.length} pași sunt afișați`:`Pasul ${f+1} din ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'REZOLVARE COMPLETĂ':`PASUL ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Pasul anterior</button><button data-action="all" data-index="${i}">Rezolvarea completă</button><button data-action="hide" data-index="${i}">Ascundeți exemplul</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Reveniți la metodă ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Cuprinsul lecției':'← Tema anterioară';$('nextBtn').textContent=state.index===pages.length-1?'Reluați lecția ↺':'Tema următoare →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Reveniți la lecție':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Panou suplimentar. Butonul Tema următoare revine la lecție și trece la tema următoare.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Exemplul este ascuns':'Exemplul este afișat'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Tema ${state.index+1} din ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Exemplul este ascuns până când solicitați afișarea.':state.all[state.index]?`Toți cei ${pages[state.index].steps.length} pași sunt afișați.`:`Este afișat pasul ${state.frames[state.index]+1} din ${pages[state.index].steps.length}.`}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lecția a fost reluată. Toate exemplele rezolvate sunt ascunse.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Citire continuă: toate metodele sunt vizibile; fiecare exemplu se deschide separat.':'Prezentare: câte o temă pe ecran.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Reveniți la lecție</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['byte','hex','git'].includes(which)){h=s05Panel(which);}
else if(which==='map'){h=panelHead("Cuprinsul lecției")+`<p>Citim proiectul, anticipăm comportamentul, implementăm o singură funcție și verificăm rezultatul. Urmărim apoi modificarea din fișierul salvat în index, în commitul local și în depozitul GitHub.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Prezentați câte o temă":"Citiți lecția continuu"}</button><button data-command="tools">Instrumente de verificare</button><button data-command="reference">Fișa comună</button><button data-command="help">Ajutor și afișare</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">Parcursul propus pentru 90 de minute alocă 75 de minute proiectului, 10 minute testului Q05 și cinci minute încheierii. Pentru acest ritm, instrumentele trebuie pregătite înainte de seminar. Duratele nu au fost măsurate pentru fiecare grupă.</p></div>`;}
else if(which==='help'){h=panelHead('Citire, navigare și afișare')+`<p><b>Explicațiile sunt vizibile de la început.</b> Apăsați E sau butonul verde pentru a parcurge exemplul pe pași. Săgeata spre dreapta trece la tema următoare chiar dacă exemplul nu este terminat. Parcursul complet afișează toate etapele după propria încercare.</p><p><a href="BTI_S05_Lesson_Text_RO_v1.0.1.html">Deschideți textul complet pentru citire</a>. Conține aceleași explicații și exemple și funcționează fără JavaScript. Păstrați cele două fișiere în același folder după descărcare. În Moodle, deschideți textul pentru citire folosind legătura disponibilă în resursa seminarului.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Mărimea textului lecției: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− și A+ schimbă mărimea cu cinci puncte procentuale. Puteți introduce și un procent exact. Derulați explicațiile mai lungi și tabelele late. Alegem mărimea pentru ecranul și distanța reale.</p><div class="panel-controls"><button data-command="theme">Comutați tema luminoasă/întunecată</button><button data-command="fullscreen">Ecran complet</button><button data-command="blank">Ascundeți ecranul (B)</button><button data-command="tools">Instrumente și cronometru</button></div><h2>Taste</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Comenzi prin litere: activate':'Comenzi prin litere: dezactivate'}</button></div><p class="small">Dezactivați comenzile prin litere dacă interferează cu introducerea textului sau comenzile vocale. Săgețile, Escape și butoanele rămân disponibile.</p><p>← / →: tema anterioară / următoare. E: afișează exemplul sau etapa următoare. Shift+E: etapa anterioară. H: ascunde exemplul. M: cuprins. F: ecran complet. B: ascunde ecranul. Escape: revine la lecție sau restabilește focalizarea tastaturii.</p><p class="small">În câmpurile unui formular, săgețile își păstrează rolul de editare. Escape revine la lecție. Alt+← / Alt+→ permit navigarea și dintr-un câmp.</p><h2>Ce învățăm și de ce</h2><p>Completăm o funcție pentru reprezentarea unui octet într-un proiect existent. Cerința precisă pentru intrare și ieșire ne permite să anticipăm un rezultat, să schimbăm funcția și să vedem ce demonstrează fiecare test.</p><p>După ce uităm comenzile, trebuie să ne rămână diferențele: Save actualizează fișierul de lucru, Stage selectează versiunea lui, Commit o înregistrează local, iar Push transmite commiturile existente. După push verificăm fișierul real pe GitHub.</p><h2>Legătura cu S06–S07</h2><p>În S06 investigăm un defect prin ipoteză și teste. În S07 rezolvăm o cerință individuală și reproducem rezultatul. În S05 obținem copia proiectului, prima funcție completată și metoda de lucru.</p><h2>Exersare și evaluare</h2><p>Scriem propria predicție și încercare înainte să afișăm răspunsuri explicate sau să folosim un instrument. Clarificarea opțională prin Gemini vine după încercare; îi verificăm afirmațiile și nu îl folosim în Q05. În Q05 folosim numai fișa comună existentă și materialele anunțate în curs. Închidem instrumentele lecției și răspunsurile explicate. Q05 valorează cel mult 0,2 puncte la punctajul de seminar; cele trei teste ale proiectului valorează împreună cel mult 1 punct. Nota la test nu certifică autorul modificării unui depozit.</p><h2>Convențiile instrumentelor</h2><p>Parserul zecimal reproduce proiectul inițial: cifre zecimale, eventuale spații înainte și după și un număr întreg între 0 și 255. Nu acceptă intrare hexazecimală, exponenți sau semne. Limita suplimentară de 128 de caractere aparține numai acestui instrument didactic. Panoul Git este o simulare, fără legătură cu fișierele sau contul nostru.</p><p class="small">Fișierele descărcate funcționează fără internet. Pentru tipărirea tuturor explicațiilor și etapelor folosiți textul pentru citire.</p></div>`;}
else if(which==='reference'){h=panelHead("Fișa comună")+S05REFERENCE+'</div>';}
else if(which==='tools'){const u=S05UI;h=panelHead("Instrumente de verificare")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="byte">${u.byteTitle}</button><button data-command="hex">${u.hexTitle}</button><button data-command="git">${u.gitTitle}</button><button data-command="reference">Fișa comună</button></div><h2>Cronometru pentru exersare</h2><p>Cronometrul nu afișează răspunsuri, nu trece la altă temă și nu controlează timpul unui test Moodle.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4500">75 min</button><button data-command="timerPause">Pauză / reluare</button><button data-command="timerOff">Ascundeți cronometrul</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S05UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S05UI.errors[err.code||err.message]||S05UI.unexpectedError;box.textContent=message;say(S05UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS05Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Timpul a expirat · ':timer.running?'Exercițiu · ':'Pauză · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('Browserul nu a permis afișarea pe ecran complet. Folosiți comanda proprie a browserului pentru ecran complet.');}}
function blank(){const open=$('blank').hidden;$('blank').hidden=!open;$('app').inert=open;if(open)$('blank').focus();else $('stage').focus({preventScroll:true});}
function command(cmd){if(cmd==='shortcuts'){state.shortcuts=!state.shortcuts;applyPrefs();openPanel('help');return;}if(cmd==='return'){go(state.index,{keep:true});return;}if(cmd==='reading'){mode();return;}if(cmd==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyPrefs();return;}if(cmd==='fullscreen'){fullscreen();return;}if(cmd==='blank'){blank();return;}if(cmd==='timerPause'){timerPause();return;}if(cmd==='timerOff'){timer.running=false;$('timerReadout').hidden=true;return;}openPanel(cmd);}
$('mapBtn').onclick=()=>openPanel('map');$('helpBtn').onclick=()=>openPanel('help');$('toolsBtn').onclick=()=>openPanel('tools');$('modeBtn').onclick=mode;$('fullBtn').onclick=fullscreen;$('smaller').onclick=()=>setScale(state.scale-5);$('larger').onclick=()=>setScale(state.scale+5);$('scaleInput').addEventListener('change',e=>setScale(e.target.value));$('scaleInput').addEventListener('keydown',e=>{if(e.key==='Enter'){setScale(e.target.value);$('stage').focus();}});$('prevBtn').onclick=()=>navigate(-1);$('nextBtn').onclick=()=>navigate(1);$('revealBtn').onclick=()=>reveal();$('blank').onclick=blank;
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.go!==undefined){go(Number(btn.dataset.go));return;}if(btn.dataset.action){const i=Number(btn.dataset.index);state.index=i;const a=btn.dataset.action;if(a==='reveal')reveal(i);else if(a==='hide')hide(i);else if(a==='back')back(i);else if(a==='all')fullWorking(i);else if(a==='theory'){scrollToNode($('topic-'+pages[i].id));updateNav();}return;}if(btn.dataset.scale!==undefined){setScale(btn.dataset.scale);const r=$('fontRange');if(r)r.value=state.scale;return;}if(btn.dataset.timer){startTimer(btn.dataset.timer);return;}if(btn.dataset.command)command(btn.dataset.command);});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!$('blank').hidden){if(['escape','b','enter',' '].includes(k)){e.preventDefault();blank();}return;}if(k==='escape'){e.preventDefault();if(state.panel)go(state.index,{keep:true});else{e.target.blur?.();$('stage').focus({preventScroll:true});}return;}if(e.altKey&&(k==='arrowright'||k==='arrowleft')){e.preventDefault();navigate(k==='arrowright'?1:-1);return;}if(e.ctrlKey||e.altKey||e.metaKey)return;if(!state.shortcuts&&['e','h','m','f','b','+','=','-','−'].includes(k))return;if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(k==='arrowright'||k==='pagedown'){e.preventDefault();if(!e.repeat)navigate(1);}else if(k==='arrowleft'||k==='pageup'){e.preventDefault();if(!e.repeat)navigate(-1);}else if(k==='e'){e.preventDefault();if(e.shiftKey)back();else reveal();}else if(k==='h'){e.preventDefault();if(!state.panel)hide();}else if(k==='m'){e.preventDefault();openPanel('map');}else if(k==='f'){e.preventDefault();fullscreen();}else if(k==='b'){e.preventDefault();blank();}else if(k==='+'||k==='='){e.preventDefault();setScale(state.scale+5);}else if(k==='-'||k==='−'){e.preventDefault();setScale(state.scale-5);}});
$('stage').addEventListener('scroll',()=>{if(!state.reading||state.panel||scrollGuard)return;clearTimeout(scrollTask);scrollTask=setTimeout(()=>{const r=$('stage').getBoundingClientRect();let chosen=state.index;for(let i=0;i<pages.length;i++){const a=$('topic-'+pages[i].id).getBoundingClientRect();if(a.top<=r.top+Math.min(120,r.height*.25)&&a.bottom>r.top+20)chosen=i;}if(chosen!==state.index){state.index=chosen;updateNav();}},80);});

const S05REFERENCE="<section id=\"format-reference\"><h2>Fișa comună de referință<\/h2><p>Aceasta păstrează conținutul fișei comune din proiectul v0.4.0. O folosim în practică și la Q05 conform regulilor comunicate în curs. Include și noțiuni pentru S06–S07; ele nu sunt cerințe de implementare pentru astăzi. La Q05 închidem lecția extinsă, instrumentele de calcul și AI; păstrăm numai fișa permisă.<\/p><section class=\"section\"><h2>Opt biți de date<\/h2><p><strong>Intrare:<\/strong> întreg zecimal u între 0 și 255 inclusiv. Sunt acceptate spațiile de la începutul și de la sfârșitul intrării și zerourile inițiale. Sunt respinse intrarea goală, textul nenumeric, numerele negative, valorile fracționare și valoarea 256.<\/p><p><strong>Binar:<\/strong> exact opt poziții, cu ponderile 128, 64, 32, 16, 8, 4, 2 și 1. <strong>Hexazecimal:<\/strong> exact două caractere, cu A–F majuscule; fiecare caracter descrie patru biți, deoarece 16 = 2⁴. 255 = 15 × 16 + 15 → FF.<\/p><p><strong>Complement față de doi (two’s complement):<\/strong> s = u dacă u &lt; 128; s = u − 256 dacă u ≥ 128. Interval cu semn: −128…127. Biții rămân aceiași; se schimbă interpretarea. Prima pondere devine −128.<\/p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Opt biți de date\"><table><caption>Opt biți de date<\/caption><thead><tr><th scope=\"col\">u<\/th><th scope=\"col\">Binar<\/th><th scope=\"col\">Hex<\/th><th scope=\"col\">s<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>00000000<\/td><td>00<\/td><td>0<\/td><\/tr><tr><td>5<\/td><td>00000101<\/td><td>05<\/td><td>5<\/td><\/tr><tr><td>127<\/td><td>01111111<\/td><td>7F<\/td><td>127<\/td><\/tr><tr><td>128<\/td><td>10000000<\/td><td>80<\/td><td>−128<\/td><\/tr><tr><td>129<\/td><td>10000001<\/td><td>81<\/td><td>−127<\/td><\/tr><tr><td>255<\/td><td>11111111<\/td><td>FF<\/td><td>−1<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"section\"><h2>Bitul de paritate este separat<\/h2><p>k = numărul biților 1 din date. <strong>Paritate pară: p = k % 2.<\/strong> <strong>Paritate impară: p = 1 − (k % 2).<\/strong> Operatorul % dă restul împărțirii. p are valoarea 0 sau 1. Bitul p se adaugă la dreapta celor opt biți de date; cuvântul transmis are nouă biți.<\/p><p>Modificarea unui singur bit sau a unui număr impar de biți schimbă paritatea. Inversarea unui număr par de biți în poziții distincte păstrează paritatea. Verificarea de paritate semnalează nepotrivirea parității, fără a localiza sau corecta eroarea.<\/p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Bitul de paritate este separat\"><table><caption>Bitul de paritate este separat<\/caption><thead><tr><th scope=\"col\">Date<\/th><th scope=\"col\">k<\/th><th scope=\"col\">A: paritate pară<\/th><th scope=\"col\">B: paritate impară<\/th><\/tr><\/thead><tbody><tr><td>3 · 00000011<\/td><td>2<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>7 · 00000111<\/td><td>3<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"section\"><h2>Operațiile Git și rezultatul lor<\/h2><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Operațiile Git și rezultatul lor\"><table><caption>Operațiile Git și rezultatul lor<\/caption><thead><tr><th scope=\"col\">Operație<\/th><th scope=\"col\">Rezultat<\/th><\/tr><\/thead><tbody><tr><td>Save<\/td><td>Fișier salvat pe calculator.<\/td><\/tr><tr><td>Diff<\/td><td>Diferențe între stările comparate. <code>git diff<\/code>: schimbări neselectate.<\/td><\/tr><tr><td>Stage<\/td><td>Conținut selectat pentru includerea în următorul commit. <code>git diff --cached<\/code>: selecția.<\/td><\/tr><tr><td>Commit<\/td><td>Versiune înregistrată în istoricul local.<\/td><\/tr><tr><td>Push<\/td><td>Commituri trimise către repository-ul online.<\/td><\/tr><tr><td>Clone<\/td><td>Copie locală cu istoric și legătură origin.<\/td><\/tr><tr><td>Issue<\/td><td>Problemă descrisă prin pașii de reproducere și rezultatele așteptate și observate.<\/td><\/tr><tr><td>Branch<\/td><td>Ramură care permite pregătirea separată a modificărilor.<\/td><\/tr><tr><td>Pull request<\/td><td>Modificare justificată și propusă pentru integrare.<\/td><\/tr><tr><td>Merge + pull<\/td><td>Integrare online, apoi <code>git pull --ff-only<\/code> actualizează main local.<\/td><\/tr><\/tbody><\/table><\/div><p><code>origin<\/code> este numele legăturii către repository-ul online. <code>main<\/code> este ramura principală. <code>git status<\/code> arată starea; <code>git remote -v<\/code> arată adresa; <code>git branch --show-current<\/code> arată ramura; <code>git rev-parse HEAD<\/code> arată identificatorul complet. Starea locală curată nu dovedește singură publicarea. Dacă editați după stage, modificarea nouă trebuie selectată din nou ca să intre în commit.<\/p><\/section>\n<section class=\"section\"><h2>Ce verificați și ce puteți concluziona<\/h2><p><strong>Investigație:<\/strong> ipoteză proprie → afirmație din Gemini sau din exemplul pregătit → test cu rezultat așteptat calculat independent → rezultat obținut → concluzie. Un contraexemplu infirmă o afirmație universală. Testele la prag și retestarea cazurilor deja corecte previn concluziile pripite.<\/p><p><strong>Reproducere:<\/strong> ultimul commit și push → clonare separată → main și același SHA complet → aplicație și teste din copia nouă. SHA-ul final se copiază în Moodle după publicare.<\/p><p><strong>Evaluare:<\/strong> individual, fără AI sau ajutorul colegilor; această fișă este permisă. Q05: 10 min, maximum 0,20 puncte; Q06: 10 min, maximum 0,30; Q07: 15 min, maximum 0,50. Total ≤ 1 punct la seminar. Tema finală este obligatorie, fără punctaj separat.<\/p><\/section>\n<\/section>";

tă: indexul diferă de HEAD local", "outgoing": "Commituri locale încă netransmise", "clean": "Fișierul de lucru și indexul sunt fără modificări", "published": "HEAD local a fost transmis", "noChange": "Acțiunea nu a modificat starea simulată.", "gitLimit": "Un spațiu de lucru fără modificări nu arată dacă am publicat commiturile locale. Simularea nu include modificări concurente la distanță, conflicte, autentificare, proceduri automate (hooks) sau erori de rețea; verificăm separat depozitul real.", "resultReady": "Rezultatul comparației este afișat.", "unexpectedError": "Comparația nu a putut fi încheiată. Verificați intrarea și încercați din nou.", "errorPrefix": "Intrarea nu poate fi prelucrată: ", "errors": {"INPUT_TOO_LONG": "Folosiți cel mult 128 de caractere în acest instrument didactic. Introduceți un număr întreg zecimal între 0 și 255.", "INVALID_BYTE_INPUT": "Introduceți numai cifre zecimale, cu eventuale spații înainte și după. Analiza intrării (parsing) nu acceptă semne, valori cu parte fracționară, exponenți sau prefixul 0x.", "BYTE_RANGE": "Numărul întreg zecimal trebuie să fie între 0 și 255 inclusiv. O valoare din afara intervalului nu este convertită automat într-o valoare acceptată.", "INVALID_GIT_ACTION": "Alegeți Save, Stage, Commit, Push sau Reset în această simulare.", "INVALID_GIT_STATE": "Starea simulării este invalidă. Reinițializați simularea înainte de a continua.", "SIMULATION_LIMIT": "Simularea a ajuns la limita numerelor de versiune. Reinițializați-o înainte de a continua."}};
'use strict';

// Pure teaching helpers. They do not read or change files, Git or GitHub.
function s05Error(code) {
  const error = new Error(code);
  error.code = code;
  throw error;
}

function parseByteInput(raw) {
  const input = String(raw);
  if (input.length > 128) s05Error('INPUT_TOO_LONG');
  const text = input.trim();
  if (!/^\d+$/.test(text)) s05Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s05Error('BYTE_RANGE');
  return value;
}

function byteRepresentation(raw) {
  const value = parseByteInput(raw);
  return {
    value,
    binary: value.toString(2).padStart(8, '0'),
    hex: value.toString(16).padStart(2, '0').toUpperCase()
  };
}

function hexStages(raw) {
  const value = parseByteInput(raw);
  const base16 = value.toString(16);
  const padded = base16.padStart(2, '0');
  return {value, base16, padded, uppercase: padded.toUpperCase()};
}

function createGitState() {
  return {
    working: 'v0', index: 'v0',
    head: {id: 'c0', snapshot: 'v0'},
    remote: {id: 'c0', snapshot: 'v0'},
    history: [{id: 'c0', snapshot: 'v0', parent: null}],
    revision: 0, commitNumber: 0, lastAction: 'reset', changed: false
  };
}

function s05GitState(state) {
  if (!state || typeof state !== 'object' || !Number.isSafeInteger(state.revision) || state.revision < 0 ||
      !Number.isSafeInteger(state.commitNumber) || state.commitNumber < 0 ||
      !/^v\d+$/.test(state.working) || !/^v\d+$/.test(state.index) ||
      !state.head || !state.remote || !Array.isArray(state.history) || state.history.length < 1 ||
      !state.history.every((item, i) => item && item.id === 'c' + i && /^v\d+$/.test(item.snapshot) && item.parent === (i ? 'c' + (i - 1) : null)) ||
      state.commitNumber !== state.history.length - 1 || state.head.id !== 'c' + state.commitNumber ||
      state.head.snapshot !== state.history[state.commitNumber].snapshot ||
      !state.history.some(item => item.id === state.remote.id && item.snapshot === state.remote.snapshot)) s05Error('INVALID_GIT_STATE');
  return state;
}

function gitSummary(state) {
  const current = s05GitState(state);
  const remoteIndex = current.history.findIndex(item => item.id === current.remote.id);
  const outgoingCount = current.history.length - remoteIndex - 1;
  const unstaged = current.working !== current.index;
  const staged = current.index !== current.head.snapshot;
  return {
    working: current.working, index: current.index,
    localHEAD: {...current.head}, remoteHEAD: {...current.remote},
    unstaged, staged, outgoing: outgoingCount > 0, outgoingCount,
    workspaceClean: !unstaged && !staged,
    published: current.head.id === current.remote.id,
    lastAction: current.lastAction, changed: current.changed,
    simulation: true
  };
}

function gitStep(state, action) {
  if (!['save', 'stage', 'commit', 'push', 'reset'].includes(action)) s05Error('INVALID_GIT_ACTION');
  s05GitState(state);
  if (action === 'reset') return createGitState();
  const next = {
    ...state, head: {...state.head}, remote: {...state.remote},
    history: state.history.map(item => ({...item})), lastAction: action, changed: false
  };
  if (action === 'save') {
    if (next.revision >= Number.MAX_SAFE_INTEGER) s05Error('SIMULATION_LIMIT');
    next.revision++;
    next.working = 'v' + next.revision;
    next.changed = true;
  } else if (action === 'stage') {
    next.changed = next.index !== next.working;
    next.index = next.working;
  } else if (action === 'commit') {
    if (next.index !== next.head.snapshot) {
      next.commitNumber++;
      const item = {id: 'c' + next.commitNumber, snapshot: next.index, parent: next.head.id};
      next.history.push(item);
      next.head = {id: item.id, snapshot: item.snapshot};
      next.changed = true;
    }
  } else if (action === 'push') {
    next.changed = next.remote.id !== next.head.id;
    next.remote = {...next.head};
  }
  return next;
}

function s05GitMarkup(state){const u=S05UI,r=gitSummary(state),yn=x=>x?u.yes:u.no;return `<div class="table-scroll" tabindex="0" role="region" aria-label="${u.gitCaption}"><table><caption>${u.gitCaption}</caption><thead><tr><th scope="col">${u.place}</th><th scope="col">${u.snapshot}</th><th scope="col">${u.commitId}</th></tr></thead><tbody><tr><th scope="row">${u.working}</th><td>${r.working}</td><td>${u.none}</td></tr><tr><th scope="row">${u.index}</th><td>${r.index}</td><td>${u.none}</td></tr><tr><th scope="row">${u.head}</th><td>${r.localHEAD.snapshot}</td><td>${r.localHEAD.id}</td></tr><tr><th scope="row">${u.remote}</th><td>${r.remoteHEAD.snapshot}</td><td>${r.remoteHEAD.id}</td></tr></tbody></table></div><p>${u.unstaged}: <b>${yn(r.unstaged)}</b>.</p><p>${u.staged}: <b>${yn(r.staged)}</b>.</p><p>${u.outgoing}: <b>${r.outgoingCount}</b>.</p><p>${u.clean}: <b>${yn(r.workspaceClean)}</b>. ${u.published}: <b>${yn(r.published)}</b>.</p>${!r.changed&&r.lastAction!=='reset'?`<p>${u.noChange}</p>`:''}`;}
function bindS05Panel(){const u=S05UI,b=$('byteForm');if(b)b.onsubmit=e=>{e.preventDefault();showTool(()=>{const r=byteRepresentation($('byteValue').value);return `<p>${u.value}: <b>${r.value}</b>.</p><p>${u.binary}: <span class="numeral">${r.binary}</span>.</p><p>${u.hex}: <span class="numeral">${r.hex}</span>.</p>`;});};
 const h=$('hexForm');if(h)h.onsubmit=e=>{e.preventDefault();showTool(()=>{const r=hexStages($('hexValue').value);return `<p>${u.value}: <b>${r.value}</b>.</p><div class="table-scroll" tabindex="0" role="region" aria-label="${u.stageCaption}"><table><caption>${u.stageCaption}</caption><thead><tr><th scope="col">${u.operation}</th><th scope="col">${u.result}</th></tr></thead><tbody><tr><th scope="row"><code>u.toString(16)</code></th><td><code>'${r.base16}'</code></td></tr><tr><th scope="row"><code>.padStart(2, '0')</code></th><td><code>'${r.padded}'</code></td></tr><tr><th scope="row"><code>.toUpperCase()</code></th><td><code>'${r.uppercase}'</code></td></tr></tbody></table></div>`;});};
 $('panelRoot').querySelectorAll('button[data-git]').forEach(button=>{button.onclick=()=>showTool(()=>{teachingGitState=gitStep(teachingGitState,button.dataset.git);return s05GitMarkup(teachingGitState);});});
