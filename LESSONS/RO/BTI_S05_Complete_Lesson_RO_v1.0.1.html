<script id="lessonData" type="application/json">{"title":"Prima modificare verificată și publicată","version":"1.0.1","language":"ro","duration_seconds":4500,"quiz_separate_minutes":10,"font_min":20,"font_max":200,"pages":[{"id":"start","title":"Preiei un proiect și publici prima ta schimbare","chapter":"01 · Punctul de pornire","start":0,"end":180,"rule":"În S05 preiei un proiect BTI existent, completezi o singură funcție și verifici versiunea care ajunge în repository-ul tău GitHub. Reprezentarea hexazecimală este problema concretă prin care înveți acest circuit de lucru.","method":["În S01–S04 ai lucrat cu reprezentări și condiții verificabile. Acum o cerință BTI trebuie să devină comportament corect într-un program, apoi o schimbare identificabilă în istoricul proiectului.","Folosim același proiect în S05–S07. Astăzi completăm doar toHex8; investigația interpretării cu semn și paritatea rămân pentru seminariile următoare.","După ce uiți meniurile, trebuie să poți stabili ce ai schimbat, cum ai verificat și unde se află versiunea. Aceste întrebări rămân utile la o temă, într-o echipă sau când reiei lucrul după două săptămâni."],"steps":[{"title":"Ce vei avea la final","html":"<p class=\"explain\">Vei avea un repository în contul tău, o copie locală cu istoricul Git și o modificare publicată: reprezentarea unui octet prin exact două caractere hexazecimale majuscule. Vei păstra câteva însemnări în proiect, ca să poți relua lucrul la S06.<\/p>"},{"title":"Aceeași valoare, forme diferite","html":"<p class=\"explain\">Un număr poate fi scris în zecimal, binar sau hexazecimal fără să-i schimbi valoarea. Programul trebuie să respecte și formatul cerut: numărul de caractere și folosirea majusculelor. Acesta este un exemplu de cerință pe care o putem testa precis.<\/p>"},{"title":"Unde există schimbarea?","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Primele repere ale lucrului cu Git\"><table><caption>Primele repere ale lucrului cu Git<\/caption><thead><tr><th scope=\"col\">Acțiune<\/th><th scope=\"col\">Efectul imediat<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Salvezi un fișier<\/th><td>Conținutul se schimbă pe calculator.<\/td><\/tr><tr><th scope=\"row\">Faci commit<\/th><td>Git înregistrează local conținutul selectat.<\/td><\/tr><tr><th scope=\"row\">Faci push<\/th><td>Trimiți commiturile către repository-ul de la distanță.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Vom introduce și pasul de selectare, numit <em>stage<\/em>. Pentru moment, reține că salvarea, commitul și push-ul sunt acțiuni distincte.<\/p>"},{"title":"Cum împărțim cele 90 de minute","html":"<p class=\"explain\">Primele 75 de minute sunt pentru pregătire, proiect, verificare și publicare. Urmează 10 minute pentru Q05 individual și 5 minute pentru încheiere. Ritmul presupune instrumentele pregătite înainte de seminar; explicațiile rămân disponibile și după activitate.<\/p>"}],"connection":"Începem prin a recunoaște instrumentele și conturile în care lucrăm.","mistake":"O bifă sau un rezultat verde nu spune singur unde se află codul și cine l-a scris. Trebuie să poți explica pașii și să arăți versiunea publicată.","prompt":"Arată primul pas"},{"id":"preflight","title":"Verifici pregătirea și separi instrumentele","chapter":"01 · Punctul de pornire","start":180,"end":600,"rule":"Git păstrează versiunile; GitHub găzduiește repository-ul; VS Code este editorul; browserul deschide aplicația, testele și serviciile online. Fiecare are un rol distinct.","method":["Verificarea de la început ne ajută să distingem o problemă de pregătire de o problemă din cod. Nu instalăm biblioteci pentru acest proiect și nu construim un server.","Ai nevoie de Git, VS Code, un browser, contul tău GitHub și accesul la cursul BTI din Moodle. Accesul la Gemini este opțional în S05.","Pe un calculator folosit de mai mulți studenți, identitatea autorului și autentificarea sunt două lucruri diferite. Folosește sesiunea proprie conform procedurii laboratorului."],"steps":[{"title":"Recunoști rolurile","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Instrumentele folosite în S05\"><table><caption>Instrumentele folosite în S05<\/caption><thead><tr><th scope=\"col\">Instrument<\/th><th scope=\"col\">Ce face în activitate<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Git<\/th><td>Păstrează istoricul local și transferă commituri către un remote.<\/td><\/tr><tr><th scope=\"row\">GitHub<\/th><td>Găzduiește copia ta și permite verificarea commitului publicat.<\/td><\/tr><tr><th scope=\"row\">VS Code<\/th><td>Deschide folderul, editează fișiere și oferă interfața Source Control.<\/td><\/tr><tr><th scope=\"row\">Browser<\/th><td>Rulează paginile HTML locale și deschide GitHub sau Moodle.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Instalarea VS Code nu înlocuiește instalarea Git. Aplicația de lucru se deschide direct din fișier: nu cere Node.js, Python sau Live Server.<\/p>"},{"title":"Verifici Git în terminal","html":"<p class=\"explain\">În VS Code alege <strong>Terminal → New Terminal<\/strong>. Copiază comanda de mai jos în terminal, apoi apasă Enter; nu o introduce într-un fișier JavaScript.<\/p><pre><code>git --version<\/code><\/pre><p class=\"explain\">Rezultatul trebuie să înceapă cu <code>git version<\/code>. Comanda verifică instalarea; nu creează un repository și nu te autentifică pe GitHub. Dacă Git nu este recunoscut, redeschide VS Code după instalarea pregătită; dacă problema rămâne, semnaleaz-o.<\/p>"},{"title":"Verifici conturile","html":"<p class=\"explain\">În browser deschide GitHub și verifică numele utilizatorului din meniul contului. Deschide apoi <code>online.ase.ro<\/code> și cursul BTI al grupei. La clone sau push, VS Code poate cere o autentificare separată; verifică și atunci ce cont autorizezi.<\/p>"},{"title":"Alegi directorul părinte","html":"<p class=\"explain\">Folosește un loc ușor de regăsit, de exemplu <code>Documents/BTI<\/code>. La clone, Git va crea în el folderul repository-ului. Alege o locație păstrată după ieșirea din sesiune și reține diferența dintre directorul părinte și folderul proiectului.<\/p>"},{"title":"Pregătești identitatea, fără să o confunzi cu accesul","html":"<p class=\"explain\">Un commit are un nume și un email de autor. Le vom configura local după clonare. Dacă alegi o adresă <code>noreply<\/code>, copiaz-o exact din GitHub <strong>Settings → Emails<\/strong>. Numele și emailul nu schimbă contul autentificat pentru push. Pe un calculator partajat, urmează procedura laboratorului dacă apare contul altcuiva.<\/p>"}],"connection":"Cu instrumentele pregătite, creăm copia care va primi schimbările tale.","mistake":"Nu porni un repository gol ca înlocuitor al copiei cerute. Nu introduce parole sau tokenuri în cod ori în comenzile din fișierele proiectului.","prompt":"Verifică primul reper"},{"id":"template","title":"Creezi repository-ul tău din template","chapter":"02 · Copia proprie","start":600,"end":900,"rule":"Template-ul oferă punctul comun de pornire. Repository-ul nou aparține contului tău și va păstra schimbările tale; nu lucrezi în repository-ul comun al seriei.","method":["Copia comună ne permite să pornim de la aceeași aplicație și aceeași cerință. Repository-ul propriu face posibilă verificarea unei versiuni fără să amestecăm lucrările studenților.","Crearea din template preia fișierele de pornire într-un repository nou. Nu trebuie să înveți acum toate opțiunile GitHub: identifici sursa, owner-ul, ramura și adresa rezultatului.","La finalul acestui pas trebuie să poți spune care este sursa comună și care este adresa copiei tale. Aceasta din urmă va fi folosită la clone și push."],"steps":[{"title":"Recunoști sursa comună","html":"<p class=\"explain\">În browser deschide <a href=\"https://github.com/antonioclim/BBS-bit-byte-starter\">BBS-bit-byte-starter<\/a>. În rădăcină trebuie să recunoști <code>PROJECT<\/code>, <code>GUIDES<\/code> și <code>START.html<\/code>. Acest material a fost construit pentru starterul v0.4.0 verificat; nu modifica sursa comună.<\/p>"},{"title":"Creezi copia","html":"<p class=\"explain\">Alege <strong>Use this template → Create a new repository<\/strong>. La <strong>Owner<\/strong> selectează contul tău. Folosește numele indicat grupei sau, dacă nu există o regulă de nume, unul ușor de recunoscut, precum <code>bti-byte-lab<\/code>. Preia numai ramura implicită; nu bifa includerea tuturor ramurilor.<\/p>"},{"title":"Alegi vizibilitatea comunicată grupei","html":"<p class=\"explain\">Urmează regula de vizibilitate din curs. Un repository public poate fi citit prin link; la unul privat, trimiterea linkului nu acordă automat acces altcuiva. Vizibilitatea nu schimbă pașii locali pentru salvare, commit și push.<\/p>"},{"title":"Verifici rezultatul, înainte de clone","html":"<p class=\"explain\">După creare, antetul și adresa trebuie să conțină <code>CONTUL_TAU/REPOSITORY_UL_TAU<\/code>. Verifică din nou cele trei repere din rădăcină. Dacă lipsește <strong>Use this template<\/strong>, verifică linkul și conectarea și semnalează problema; nu înlocui pe cont propriu acest pas cu un repository gol.<\/p>"}],"connection":"Copiem acum URL-ul repository-ului propriu și îl clonăm în VS Code.","mistake":"Dacă adresa arată încă antonioclim/BBS-bit-byte-starter, privești sursa comună. Copia pentru lucru trebuie să fie în contul tău.","prompt":"Arată pașii din browser"},{"id":"clone","title":"Clonezi copia ta și verifici origin","chapter":"02 · Copia proprie","start":900,"end":1200,"rule":"Clone aduce fișierele și istoricul Git într-un folder local și configurează legătura numită de obicei origin. Pentru această activitate, origin trebuie să indice repository-ul tău.","method":["Un ZIP îți oferă fișiere pentru citire; clone pregătește și istoricul, și legătura prin care vei publica. De aceea folosim clone pentru lucru.","Lucrăm în rădăcina repository-ului clonat: acolo vezi direct PROJECT, GUIDES și START.html. Comenzile Git se rulează în terminalul acestui folder.","Verificarea origin înainte de editare previne confuzia dintre sursa comună și destinația propriilor commituri. Identitatea autorului se configurează după ce folderul corect este deschis."],"steps":[{"title":"Copiezi URL-ul corect","html":"<p class=\"explain\">În <strong>repository-ul tău<\/strong> de pe GitHub alege <strong>Code → HTTPS<\/strong> și copiază URL-ul terminat în <code>.git<\/code>. Verifică numele contului din adresă. Acesta trebuie să fie al tău.<\/p>"},{"title":"Folosești Git: Clone în VS Code","html":"<p class=\"explain\">Deschide Command Palette cu <strong>Ctrl+Shift+P<\/strong> pe Windows/Linux sau <strong>Cmd+Shift+P<\/strong> pe macOS. Alege <strong>Git: Clone<\/strong>, introdu URL-ul copiat și selectează directorul părinte pregătit. La final alege <strong>Open<\/strong> pentru folderul creat. Dacă apare întrebarea de încredere, verifică întâi că ai deschis proiectul furnizat în copia ta.<\/p>"},{"title":"Verifici folderul, ramura și destinația","html":"<p class=\"explain\">În VS Code trebuie să vezi direct <code>PROJECT<\/code>, <code>GUIDES<\/code> și <code>START.html<\/code>. Deschide <strong>Terminal → New Terminal<\/strong> și rulează comenzile, câte una:<\/p><pre><code>git status\ngit remote -v\ngit branch --show-current<\/code><\/pre><p class=\"explain\">La început te aștepți la ramura <code>main<\/code>, o stare locală curată și adresa ta la <code>origin<\/code>, pentru fetch și push. <code>origin<\/code> este un nume local pentru remote, nu numele utilizatorului și nici o dovadă a autentificării.<\/p>"},{"title":"Configurezi autorul numai pentru acest repository","html":"<p class=\"explain\">În același terminal, înlocuiește textele din ghilimele cu numele și emailul alese, apoi rulează:<\/p><pre><code>git config user.name &quot;Numele ales&quot;\ngit config user.email &quot;ADRESA_EMAIL_ALEASA_EXACT&quot;\ngit config --get user.name\ngit config --get user.email<\/code><\/pre><p class=\"explain\">Primele două comenzi nu afișează de obicei nimic la reușită; ultimele două arată valorile. Fără <code>--global<\/code>, configurația se aplică numai acestui repository. Ea nu schimbă contul autentificat pentru push.<\/p>"},{"title":"Rezolvi o confuzie de folder înainte de editare","html":"<p class=\"explain\">Dacă <code>git status<\/code> spune <code>not a git repository<\/code>, deschide prin <strong>File → Open Folder<\/strong> folderul clonat, nu părintele lui. Dacă <code>origin<\/code> arată template-ul comun, ai clonat sursa; deschide propria copie într-un folder separat. Nu continua presupunând că push-ul va găsi automat destinația potrivită.<\/p>"}],"connection":"În copia verificată, identificăm fișierele pe care le vom rula și modifica.","mistake":"Nu folosi git init într-un folder greșit pentru a face să dispară mesajul. Clona corectă conține deja repository-ul și istoricul.","prompt":"Arată pașii din VS Code"},{"id":"project-files","title":"Găsești fișierele și deschizi aceeași copie","chapter":"03 · Observi înainte să modifici","start":1200,"end":1440,"rule":"Editorul și browserul trebuie să folosească aceeași copie locală. PROJECT/lab.js conține logica de modificat; PROJECT/index.html arată aplicația; PROJECT/tests.html verifică etapa aleasă.","method":["Un proiect existent nu se citește integral înainte de prima schimbare. Identifici punctul de pornire, funcția vizată, testele și locul însemnărilor.","Această lecție poate fi descărcată separat din Moodle. Fișierele PROJECT și GUIDES se află în repository-ul clonat, nu lângă fișierul acestei lecții.","Vom separa observarea unui rezultat de verificarea lui. Aplicația poate afișa și funcții pregătite pentru etapele viitoare, care nu sunt încă încheiate."],"steps":[{"title":"Harta minimă a proiectului","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișierele pe care le recunoști în copia clonată\"><table><caption>Fișierele pe care le recunoști în copia clonată<\/caption><thead><tr><th scope=\"col\">Fișier<\/th><th scope=\"col\">Rol<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">PROJECT/index.html<\/th><td>Deschide aplicația în browser.<\/td><\/tr><tr><th scope=\"row\">PROJECT/tests.html<\/th><td>Deschide testele locale în browser.<\/td><\/tr><tr><th scope=\"row\">PROJECT/lab.js<\/th><td>Conține funcțiile; în S05 modifici numai return-ul din toHex8.<\/td><\/tr><tr><th scope=\"row\">PROJECT/evidence.md<\/th><td>Păstrează însemnările proprii și informațiile pentru reluare.<\/td><\/tr><tr><th scope=\"row\">PROJECT/README.md<\/th><td>Explică pornirea și progresul proiectului.<\/td><\/tr><tr><th scope=\"row\">GUIDES/RO/S05.html<\/th><td>Ghidul S05 din copia clonată.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Nu confunda <code>PROJECT/README.md<\/code> cu README-ul din rădăcina repository-ului. Folosim fișierul din <code>PROJECT<\/code> pentru progresul aplicației.<\/p>"},{"title":"Deschizi aplicația, nu codul HTML","html":"<p class=\"explain\">În managerul de fișiere — File Explorer pe Windows, Finder pe macOS sau aplicația distribuției Linux — intră în folderul clonat, apoi în <code>PROJECT<\/code>. Deschide <code>index.html<\/code> cu browserul. Dacă îl vezi ca text în VS Code, l-ai deschis pentru editare; folosește deschiderea cu browserul din managerul de fișiere.<\/p>"},{"title":"Deschizi testele și ghidul local","html":"<p class=\"explain\">Din același folder <code>PROJECT<\/code>, deschide <code>tests.html<\/code> într-un al doilea tab. Dacă ai nevoie de ghidul proiectului, mergi în folderul clonat <code>GUIDES<\/code>, apoi <code>RO<\/code> și deschide <code>S05.html<\/code>. Verifică în adresa taburilor că toate provin din același folder clonat.<\/p>"},{"title":"Observi ce este furnizat și ce rămâne de făcut","html":"<p class=\"explain\">În VS Code deschide <code>PROJECT/lab.js<\/code>. Validarea, conversia binară și numărarea biților 1 sunt furnizate. <code>toHex8<\/code> întoarce încă <code>null<\/code>. Interpretarea cu semn are un defect didactic pentru S06, iar paritatea este sarcina S07. În S05 nu le remediem și nu le completăm.<\/p>"}],"connection":"Înainte de a rula exemplele, formulezi propria predicție.","mistake":"Două foldere cu același nume pot conține versiuni diferite. Verifică locația din browser și folderul din VS Code, nu numai titlul paginii.","prompt":"Arată harta proiectului"},{"id":"prediction","title":"Prezici înainte să rulezi","chapter":"03 · Observi înainte să modifici","start":1440,"end":1620,"rule":"Scrie mai întâi ce te aștepți să obții. Predicția proprie ne permite să comparăm o regulă înțeleasă cu un rezultat observat, chiar dacă prima încercare este greșită.","method":["Pentru această scurtă încercare folosește cunoștințele tale despre un octet. Amână rularea, Gemini și dezvăluirea răspunsurilor până ai notat o predicție.","Lucrezi cu trei intrări: 0, 5 și 255. Pentru fiecare propui reprezentarea binară pe opt biți și reprezentarea hexazecimală pe două caractere.","Păstrează încercarea în secțiunea S05 pentru limba grupei din PROJECT/evidence.md. O comparație sinceră este mai utilă decât rescrierea predicției după ce vezi rezultatul."],"steps":[{"title":"Încercarea ta, fără răspunsuri afișate","html":"<p class=\"explain\">Pentru <strong>0, 5 și 255<\/strong>, scrie în <code>PROJECT/evidence.md<\/code>: intrare → binar pe opt biți → hexazecimal pe două caractere. Adaugă o propoziție despre cum ai raționat. Nu rula încă aplicația și nu deschide cadrele următoare până nu ai o încercare proprie.<\/p>"},{"title":"Compari după încercare","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Verificarea predicțiilor pentru un octet\"><table><caption>Verificarea predicțiilor pentru un octet<\/caption><thead><tr><th scope=\"col\">Intrare zecimală<\/th><th scope=\"col\">Binar pe opt biți<\/th><th scope=\"col\">Hexazecimal pe două caractere<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">0<\/th><td><code>00000000<\/code><\/td><td><code>00<\/code><\/td><\/tr><tr><th scope=\"row\">5<\/th><td><code>00000101<\/code><\/td><td><code>05<\/code><\/td><\/tr><tr><th scope=\"row\">255<\/th><td><code>11111111<\/code><\/td><td><code>FF<\/code><\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Compară fiecare coloană cu ce ai scris. Dacă ai omis zerourile de la început, valoarea poate fi aceeași, dar formatul cerut nu este complet.<\/p>"},{"title":"Explici diferența dintre valoare și format","html":"<p class=\"explain\">La intrarea 5, forma binară <code>101<\/code> reprezintă valoarea corectă, însă aici cerem <code>00000101<\/code>. Similar, forma hexazecimală <code>5<\/code> trebuie afișată ca <code>05<\/code>. Zerourile din stânga completează lungimea fără să schimbe valoarea.<\/p>"},{"title":"Păstrezi ce ai învățat din comparație","html":"<p class=\"explain\">Sub predicția inițială notează ce ai corectat și de ce. De exemplu, poți scrie că ai identificat valoarea, dar ai omis lungimea fixă. Aceasta este o însemnare din proiect, nu o temă nouă, un screenshot sau un document separat de depus.<\/p>"}],"connection":"Acum rulăm baza furnizată, ca să știm de unde pornim înainte de editare.","mistake":"Nu copia rezultatul afișat de program în câmpul „așteptat” ca dovadă că este corect. Stabilește așteptarea din cerință și compară apoi.","prompt":"Am o predicție; compar răspunsurile","answer_after_attempt":true},{"id":"baseline","title":"Rulezi baseline înainte de modificare","chapter":"03 · Observi înainte să modifici","start":1620,"end":1920,"rule":"Baseline verifică baza furnizată. În starterul verificat are 26 PASS; selectarea S05 adaugă cinci verificări hexazecimale care sunt PENDING înainte de implementare.","method":["Un rezultat inițial ne ajută să distingem o problemă deja existentă de una introdusă prin editare. De aceea testăm înainte și după schimbare.","Selectezi explicit etapa în pagina tests.html. Testele etapelor S06 și S07 au scopuri suplimentare și nu stabilesc dacă S05 este încheiat.","Numerele de mai jos descriu starterul v0.4.0 cu lista de teste proprii nemodificată. Dacă adaugi un test propriu, numărul rândurilor crește."],"steps":[{"title":"Rulezi baza furnizată","html":"<p class=\"explain\">În browser, în tabul deschis din copia clonată pentru <code>PROJECT/tests.html<\/code>, alege etapa <strong>Baza furnizată / baseline<\/strong>. Apasă <strong>Rulează testele<\/strong>. În această pagină există un buton de rulare; aplicația se actualizează direct când schimbi intrarea.<\/p>"},{"title":"Citești rezultatul inițial","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Starea starterului înainte de editare\"><table><caption>Starea starterului înainte de editare<\/caption><thead><tr><th scope=\"col\">Etapă selectată<\/th><th scope=\"col\">PASS<\/th><th scope=\"col\">FAIL<\/th><th scope=\"col\">PENDING<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">baseline<\/th><td>26<\/td><td>0<\/td><td>0<\/td><\/tr><tr><th scope=\"row\">S05<\/th><td>26<\/td><td>0<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">După baseline poți selecta <strong>S05<\/strong> și rula din nou. Cele cinci rânduri <code>PENDING<\/code> sunt patru verificări punctuale pentru hexazecimal și o verificare a tuturor celor 256 de intrări valide. Funcția întoarce încă <code>null<\/code>.<\/p>"},{"title":"Observi aplicația separat de teste","html":"<p class=\"explain\">În <code>PROJECT/index.html<\/code> introdu pe rând valorile din predicție. Reprezentarea binară este furnizată, iar hexazecimalul este încă neimplementat. Poți schimba limba din selector. Rezultatele se actualizează la schimbarea intrării; aplicația nu are un buton Run.<\/p>"},{"title":"Dacă punctul de pornire nu corespunde","html":"<p class=\"explain\">Dacă baseline are un eșec sau lipsesc fișiere, verifică mai întâi folderul, pagina deschisă și dacă ai editat deja ceva. Reîncarcă pagina și citește primul rând problematic. Nu modifica testele pentru a ascunde diferența. Păstrează observația și semnalează problema dacă este în copia furnizată.<\/p>"}],"connection":"Cu punctul de pornire verificat, formulăm regula conversiei hexazecimale.","mistake":"PENDING înseamnă aici „funcția nu este implementată”, nu „nota este în așteptare”. Rezultatele locale nu sunt note Moodle.","prompt":"Arată rularea inițială"},{"id":"hex-rule","title":"Dintr-un octet în două cifre hexazecimale","chapter":"04 · Cerința devine cod","start":1920,"end":2220,"rule":"O cifră hexazecimală reprezintă patru biți. Un octet de opt biți se poate scrie prin două cifre: prima are ponderea 16, iar a doua ponderea 1.","method":["Baza 16 folosește cifrele 0…9 și literele A…F. În aplicație alegem majuscule pentru o afișare uniformă.","Pentru un întreg u între 0 și 255, scriem u = 16q + r, cu q și r între 0 și 15. Cele două cifre corespund lui q și r.","Această regulă îți permite să verifici rezultatul fără să îl copiezi din program. Legătura cu binarul este directă: grupezi biții în două grupuri de câte patru."],"steps":[{"title":"De ce sunt suficiente două cifre","html":"<p class=\"explain\">Două poziții în baza 16 oferă <code>16 × 16 = 256<\/code> combinații. Acestea acoperă exact cele 256 de valori ale unui octet fără semn, de la 0 la 255 inclusiv. Două cifre hexazecimale nu înseamnă doi biți: fiecare cifră reprezintă patru biți.<\/p>"},{"title":"Calculezi cifra din stânga și cifra din dreapta","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Exemple suplimentare de conversie\"><table><caption>Exemple suplimentare de conversie<\/caption><thead><tr><th scope=\"col\">u<\/th><th scope=\"col\">Descompunere în baza 16<\/th><th scope=\"col\">Cifrele rezultate<\/th><th scope=\"col\">Binar pe opt biți<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">31<\/th><td><code>31 = 16 × 1 + 15<\/code><\/td><td><code>1F<\/code><\/td><td><code>00011111<\/code><\/td><\/tr><tr><th scope=\"row\">160<\/th><td><code>160 = 16 × 10 + 0<\/code><\/td><td><code>A0<\/code><\/td><td><code>10100000<\/code><\/td><\/tr><tr><th scope=\"row\">254<\/th><td><code>254 = 16 × 15 + 14<\/code><\/td><td><code>FE<\/code><\/td><td><code>11111110<\/code><\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Numerele din descompunere sunt valori zecimale; în coloana rezultat, fiecare este înlocuit prin cifra corespunzătoare din baza 16.<\/p>"},{"title":"Verifici prin grupuri de patru biți","html":"<p class=\"explain\">Pentru 160, separi <code>10100000<\/code> în <code>1010 | 0000<\/code>. Primul grup corespunde cifrei <code>A<\/code>, al doilea cifrei <code>0<\/code>; obții <code>A0<\/code>. Pentru 254, <code>1111 | 1110<\/code> dă <code>FE<\/code>. Separarea este o metodă de verificare, nu o schimbare a biților.<\/p>"},{"title":"Reconstruiești valoarea","html":"<p class=\"explain\">Verifici în sens invers: pentru <code>A0<\/code>, valoarea este <code>10 × 16 + 0 = 160<\/code>; pentru <code>1F<\/code>, <code>1 × 16 + 15 = 31<\/code>. Dacă valoarea reconstruită diferă de intrare, conversia este greșită, chiar dacă rezultatul are două caractere.<\/p>"}],"connection":"Transformăm acum regula matematică într-un contract precis al funcției.","mistake":"Lungimea și valoarea sunt condiții diferite. Un șir cu două caractere poate avea lungimea corectă și să reprezinte totuși alt număr.","prompt":"Arată regula și exemplele"},{"id":"hex-contract","title":"Stabilești contractul lui toHex8","chapter":"04 · Cerința devine cod","start":2220,"end":2400,"rule":"toHex8 primește un număr întreg validat în intervalul 0…255 și întoarce un șir cu exact două caractere hexazecimale majuscule. Păstrăm apelul validateByte(u).","method":["Contractul spune ce trebuie să primească și să producă funcția. Nu confundăm textul introdus în interfață cu numărul transmis funcției.","Validarea intrării este deja furnizată. Modificarea S05 trebuie să completeze rezultatul pentru intrările valide fără să slăbească respingerea argumentelor invalide.","Folosim un șir pentru că formatul face parte din rezultat: zerourile din stânga și literele majuscule trebuie păstrate exact."],"steps":[{"title":"Intrarea interfeței și argumentul funcției","html":"<p class=\"explain\">În aplicație introduci un întreg <strong>zecimal<\/strong> între 0 și 255. <code>parseByte<\/code> transformă textul valid în număr. Spațiile de la margini și zerourile inițiale sunt acceptate; notația <code>0xFF<\/code> nu este o intrare zecimală acceptată de acest câmp. <code>toHex8<\/code> primește numărul rezultat, nu textul din câmp.<\/p>"},{"title":"Condițiile rezultatului","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Contractul funcției toHex8\"><table><caption>Contractul funcției toHex8<\/caption><thead><tr><th scope=\"col\">Condiție<\/th><th scope=\"col\">Ce verificăm<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Domeniu<\/th><td>Argument numeric întreg, de la 0 la 255 inclusiv.<\/td><\/tr><tr><th scope=\"row\">Tip rezultat<\/th><td>Șir de caractere, nu număr.<\/td><\/tr><tr><th scope=\"row\">Lungime<\/th><td>Exact două caractere.<\/td><\/tr><tr><th scope=\"row\">Alfabet<\/th><td>Cifre hexazecimale 0…9 și A…F.<\/td><\/tr><tr><th scope=\"row\">Valoare<\/th><td>Șirul reprezintă aceeași valoare ca intrarea.<\/td><\/tr><tr><th scope=\"row\">Validare<\/th><td>Apelul validateByte(u) rămâne în funcție.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Numele <code>toHex8<\/code> indică reprezentarea unui octet de opt biți; ieșirea hexazecimală are două caractere, nu opt.<\/p>"},{"title":"Valoare corectă, format incomplet","html":"<p class=\"explain\">La intrarea 5, șirul <code>\"5\"<\/code> nu satisface lungimea, iar numărul <code>5<\/code> nu satisface nici tipul rezultatului. La intrarea 255, șirul <code>\"ff\"<\/code> are valoarea și lungimea potrivite, dar nu majusculele cerute. Contractul solicită îndeplinirea tuturor condițiilor.<\/p>"},{"title":"Păstrezi limita modificării","html":"<p class=\"explain\">În <code>PROJECT/lab.js<\/code>, lucrezi numai în funcția <code>toHex8(u)<\/code>. Păstrezi <code>validateByte(u);<\/code> și înlocuiești return-ul neimplementat. Nu schimbi <code>parseByte<\/code>, <code>tests.js<\/code>, interpretarea cu semn sau paritatea. Astfel, putem atribui schimbarea unui scop precis.<\/p>"}],"connection":"Ai acum suficiente condiții pentru o încercare de implementare.","mistake":"Nu elimina validarea doar fiindcă aplicația filtrează intrarea. Funcția este testată și direct cu argumente numerice invalide.","prompt":"Arată condițiile contractului"},{"id":"edit","title":"Completezi funcția după o încercare proprie","chapter":"04 · Cerința devine cod","start":2400,"end":2820,"rule":"Combinăm conversia în baza 16, completarea din stânga până la două caractere și transformarea în majuscule. Încearcă mai întâi să legi aceste operații în funcția existentă.","method":["Folosim operații oferite de JavaScript, dar fiecare are un rol verificabil în contract. Nu este suficient să memorăm o linie care pare să funcționeze.","Deschizi PROJECT/lab.js în VS Code și cauți funcția toHex8(u). Păstrezi validarea și înlocuiești numai return null;","Scrie o încercare proprie înainte să dezvălui soluția completă. După comparație, explică ce operație asigură valoarea, lungimea și majusculele."],"steps":[{"title":"Încercarea ta: legi trei operații","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Operații disponibile pentru încercare\"><table><caption>Operații disponibile pentru încercare<\/caption><thead><tr><th scope=\"col\">Operație<\/th><th scope=\"col\">Rol<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><code>toString(16)<\/code><\/th><td>Reprezintă numărul în baza 16 ca text.<\/td><\/tr><tr><th scope=\"row\"><code>padStart(2, '0')<\/code><\/th><td>Completează la început cu zero până la lungimea doi, dacă este necesar.<\/td><\/tr><tr><th scope=\"row\"><code>toUpperCase()<\/code><\/th><td>Transformă literele în majuscule.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">În <code>PROJECT/lab.js<\/code>, în <code>toHex8(u)<\/code>, păstrează <code>validateByte(u);<\/code> și propune o expresie pentru return în loc de <code>null<\/code>. Citește operațiile de la stânga la dreapta. Încearcă înainte să deschizi cadrul cu linia completă.<\/p>"},{"title":"Urmărești efectul fiecărei operații","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Rezultatele intermediare ale conversiei\"><table><caption>Rezultatele intermediare ale conversiei<\/caption><thead><tr><th scope=\"col\">Intrare<\/th><th scope=\"col\">După toString(16)<\/th><th scope=\"col\">După padStart<\/th><th scope=\"col\">După toUpperCase<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">5<\/th><td><code>\"5\"<\/code><\/td><td><code>\"05\"<\/code><\/td><td><code>\"05\"<\/code><\/td><\/tr><tr><th scope=\"row\">31<\/th><td><code>\"1f\"<\/code><\/td><td><code>\"1f\"<\/code><\/td><td><code>\"1F\"<\/code><\/td><\/tr><tr><th scope=\"row\">160<\/th><td><code>\"a0\"<\/code><\/td><td><code>\"a0\"<\/code><\/td><td><code>\"A0\"<\/code><\/td><\/tr><tr><th scope=\"row\">254<\/th><td><code>\"fe\"<\/code><\/td><td><code>\"fe\"<\/code><\/td><td><code>\"FE\"<\/code><\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\"><code>padStart<\/code> nu adaugă un zero dacă șirul are deja două caractere. Ghilimelele din tabel arată că rezultatele intermediare sunt șiruri.<\/p>"},{"title":"Compari cu o implementare completă","html":"<p class=\"explain\">După încercarea ta, poți compara return-ul cu următoarea linie. Înlocuiește <strong>numai<\/strong> <code>return null;<\/code> din <code>toHex8<\/code>; apelul de validare de deasupra rămâne.<\/p><pre><code>return u.toString(16).padStart(2, &#x27;0&#x27;).toUpperCase();<\/code><\/pre><p class=\"explain\">Punctul leagă următoarea operație de rezultatul celei anterioare. Parantezele sunt apeluri de metode, iar punctul și virgula încheie instrucțiunea return.<\/p>"},{"title":"De ce lungimea este exact doi aici","html":"<p class=\"explain\"><code>padStart(2, '0')<\/code> asigură o lungime de cel puțin doi; nu taie un șir prea lung. Lungimea este exact doi în acest contract deoarece validarea limitează numărul la 0…255, iar reprezentarea în baza 16 are cel mult două cifre. Validarea și formatarea lucrează împreună.<\/p>"},{"title":"Verifici editarea înainte să rulezi","html":"<p class=\"explain\">Citește funcția încă o dată: validarea este intactă, există un singur return de rezultat în locul celui neimplementat, iar celelalte funcții nu s-au schimbat. Verifică ghilimelele, punctele și parantezele. Nu copia etichetele sau delimitatorii blocului de cod în fișier.<\/p>"}],"connection":"Salvăm fișierul și reîncărcăm paginile care folosesc codul.","mistake":"O linie copiată poate produce rezultatul corect fără să o înțelegi. Explică efectul fiecărei operații și de ce intervalul validat contează pentru lungime.","prompt":"Am încercat; arată verificarea","answer_after_attempt":true},{"id":"save-reload","title":"Salvezi și reîncarci: codul nou ajunge în browser","chapter":"05 · Verifici comportamentul","start":2820,"end":3000,"rule":"Editarea schimbă textul din editor; salvarea îl scrie în fișier; reîncărcarea paginii face browserul să citească fișierul actualizat. Niciuna dintre acestea nu creează un commit.","method":["Browserul nu urmărește automat editările făcute în VS Code. Pentru acest proiect local, salvezi lab.js și reîncarci atât aplicația, cât și testele.","Dacă vezi în continuare rezultatul inițial, verifici întâi salvarea și locația copiei. Nu compensezi o pagină veche prin noi schimbări în cod.","Verificarea manuală este un control rapid al afișării. În pasul următor folosim testele pentru contractul complet pe domeniul valid."],"steps":[{"title":"Salvezi în VS Code","html":"<p class=\"explain\">Cu <code>PROJECT/lab.js<\/code> deschis, folosește <strong>Ctrl+S<\/strong> sau <strong>Cmd+S<\/strong>. Verifică dispariția indicatorului de fișier nesalvat. Modificarea este acum în copia locală; nu este încă înregistrată într-un commit și nici publicată pe GitHub.<\/p>"},{"title":"Reîncarci ambele taburi locale","html":"<p class=\"explain\">În browser reîncarcă <code>PROJECT/index.html<\/code>, apoi <code>PROJECT/tests.html<\/code>. Verifică adresa fiecărui tab: trebuie să provină din folderul clonat pe care îl editezi. Selectarea din nou a etapei și rularea testelor fără reload poate folosi codul încărcat anterior.<\/p>"},{"title":"Verifici patru rezultate rapide","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Control manual după salvare și reload\"><table><caption>Control manual după salvare și reload<\/caption><thead><tr><th scope=\"col\">Intrare<\/th><th scope=\"col\">Hexazecimal cerut<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">0<\/th><td><code>00<\/code><\/td><\/tr><tr><th scope=\"row\">5<\/th><td><code>05<\/code><\/td><\/tr><tr><th scope=\"row\">128<\/th><td><code>80<\/code><\/td><\/tr><tr><th scope=\"row\">255<\/th><td><code>FF<\/code><\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Introdu valorile în câmpul zecimal al aplicației, pe rând. Aceste cazuri acoperă zero, completarea cu zero, o valoare din a doua jumătate a domeniului și limita superioară. Nu modificăm astăzi interpretarea cu semn afișată alături.<\/p>"},{"title":"Dacă afișarea nu este cea așteptată","html":"<p class=\"explain\">Dacă hexazecimalul este încă neimplementat, verifică salvarea și copia deschisă. Dacă apare <code>5<\/code> în loc de <code>05<\/code>, verifică completarea lungimii; pentru <code>ff<\/code>, verifică majusculele. Dacă pagina raportează o eroare JavaScript, citește mesajul și linia indicată în consola browserului; verifică întâi sintaxa return-ului și păstrarea structurii funcției.<\/p>"}],"connection":"Cu paginile actualizate, rulăm explicit etapa S05.","mistake":"Rezultatul vechi dintr-un tab nu dovedește că fișierul salvat este greșit. Confirmă întâi că browserul a recitit aceeași copie.","prompt":"Arată circuitul salvare–reload"},{"id":"stage-tests","title":"Rulezi S05 și citești fiecare diferență","chapter":"05 · Verifici comportamentul","start":3000,"end":3240,"rule":"După implementare, etapa S05 din starterul verificat trebuie să aibă 31 PASS, fără FAIL sau PENDING. Verifică etapa, intrarea, așteptarea și rezultatul, nu numai culoarea.","method":["S05 include baza furnizată și verificările hexazecimale. Un eșec al bazei după editare poate arăta o modificare accidentală care nu aparține cerinței.","Un test compară rezultatul obținut cu o așteptare stabilită separat. Dacă ele diferă, încercăm să explicăm diferența înainte să corectăm.","Nu cerem finalizarea S06 sau S07 astăzi. Testele acelor etape includ comportamente suplimentare intenționat neîncheiate."],"steps":[{"title":"Selectezi etapa potrivită","html":"<p class=\"explain\">În <code>PROJECT/tests.html<\/code> reîncărcat alege <strong>S05 · Hexazecimal<\/strong>, apoi apasă <strong>Rulează testele<\/strong>. Citește sumarul și verifică primul rând care nu este PASS. Lista de teste proprii trebuie să fie cea furnizată dacă vrei să compari exact numărul rândurilor cu tabelul de mai jos.<\/p>"},{"title":"Compari înainte și după","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Verificarea etapei S05 cu testele proprii nemodificate\"><table><caption>Verificarea etapei S05 cu testele proprii nemodificate<\/caption><thead><tr><th scope=\"col\">Stare a proiectului<\/th><th scope=\"col\">PASS<\/th><th scope=\"col\">FAIL<\/th><th scope=\"col\">PENDING<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Înainte de implementare<\/th><td>26<\/td><td>0<\/td><td>5<\/td><\/tr><tr><th scope=\"row\">După implementare corectă<\/th><td>31<\/td><td>0<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Cele cinci verificări noi devin PASS. Una dintre ele compară funcția cu rezultatul așteptat pentru fiecare întreg din 0…255, nu numai pentru valorile vizibile în rândurile punctuale.<\/p>"},{"title":"Citești un eșec ca pe o informație","html":"<p class=\"explain\">Exemplu: dacă testul pentru 5 așteaptă <code>\"05\"<\/code>, iar funcția întoarce <code>\"5\"<\/code>, conversia valorii poate fi corectă, dar lipsește completarea lungimii. Dacă rezultatul este <code>null<\/code>, funcția este încă neimplementată. Corectezi cauza identificată, salvezi, reîncarci și rulezi din nou S05.<\/p>"},{"title":"Delimitezi verificarea curentă","html":"<p class=\"explain\">Textul general al aplicației descrie starea inițială a starterului și poate rămâne vizibil după completarea hexazecimalului. Folosește rezultatele etapei S05 pentru progresul de astăzi. Un eșec din S06 ori un PENDING din S07 nu transformă automat o implementare S05 corectă într-una incorectă.<\/p>"}],"connection":"Precizăm acum ce susțin testele și ce mai trebuie verificat prin Git.","mistake":"Nu schimba rezultatul așteptat ori tests.js numai pentru a obține verde. O astfel de schimbare ar ascunde problema în loc să completeze cerința.","prompt":"Arată citirea rezultatelor"},{"id":"test-meaning","title":"Ce dovedesc testele și ce verificăm separat","chapter":"05 · Verifici comportamentul","start":3240,"end":3420,"rule":"Testele susțin o afirmație despre comportamentul codului încărcat. Ele nu arată singure cine l-a scris, dacă ai făcut commit sau dacă versiunea a ajuns pe GitHub.","method":["Pentru un domeniu finit putem verifica exhaustiv toate intrările valide. În acest proiect, verificarea hexazecimală acoperă 256 de valori.","Această verificare este mai puternică decât câteva exemple favorabile, dar nu este o dovadă a întregii activități. Fișierul testat, istoricul local și repository-ul de la distanță trebuie identificate separat.","Păstrăm însemnări scurte și commituri clare, fără capturi de ecran, PDF-uri sau aprobări individuale suplimentare. În S05 nu se cere un assignment nou."],"steps":[{"title":"Un rând poate verifica 256 de intrări","html":"<p class=\"explain\">Sumarul <code>31 PASS<\/code> numără rânduri de verificare, nu numai apeluri ale funcției. Rândul „Hexazecimal: toate cele 256 de valori” verifică fiecare întreg din domeniu și raportează dacă toate rezultatele coincid cu așteptarea. Numărul rândurilor și numărul cazurilor evaluate sunt repere diferite.<\/p>"},{"title":"Exhaustiv pentru domeniul valid, cu limite explicite","html":"<p class=\"explain\">Rezultatul 256/256 susține că această funcție, încărcată în pagina de teste, produce reprezentarea așteptată pentru toate intrările valide ale octetului. Respingerea unor argumente invalide este verificată separat. Acest rezultat nu evaluează orice program posibil, orice mediu sau autoratul codului.<\/p>"},{"title":"Legi afirmația de verificarea potrivită","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce verificare răspunde fiecărei întrebări\"><table><caption>Ce verificare răspunde fiecărei întrebări<\/caption><thead><tr><th scope=\"col\">Întrebare<\/th><th scope=\"col\">Verificare relevantă<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Funcția respectă cerința S05?<\/th><td>Rulezi etapa S05 din aceeași copie salvată și reîncărcată.<\/td><\/tr><tr><th scope=\"row\">Ce linii am schimbat?<\/th><td>Citești diff în Source Control.<\/td><\/tr><tr><th scope=\"row\">Ce conținut este înregistrat local?<\/th><td>Verifici commitul și conținutul lui.<\/td><\/tr><tr><th scope=\"row\">Ce versiune a ajuns pe GitHub?<\/th><td>Verifici după push commitul și fișierul din repository-ul propriu.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Q05 verifică înțelegerea reprezentării și a stărilor Git. Nu citește automat repository-ul și nu înlocuiește pașii de publicare.<\/p>"},{"title":"Pregătești explicația proprie","html":"<p class=\"explain\">Înainte de publicare, trebuie să poți explica de ce <code>toString(16)<\/code> schimbă reprezentarea, ce adaugă <code>padStart<\/code> și de ce păstrăm validarea. Mai departe, vei nota concis ce ai observat și vei citi diferențele înainte de commit.<\/p>"}],"connection":"Completăm însemnările și README-ul, apoi inspectăm diferențele înainte de stage, commit și push.","mistake":"„Testele trec” și „schimbarea este publicată” sunt afirmații diferite. Fiecare are nevoie de verificarea care îi corespunde.","prompt":"Arată limitele verificării"},{"id":"work-notes","title":"Însemnări scurte, care ne ajută să reluăm lucrul","chapter":"06 · Păstrăm rezultatul și explicația","start":3420,"end":3600,"rule":"Scriem ce am anticipat, ce am observat și ce am schimbat. Câteva rânduri utile sunt suficiente; însemnările fac parte din proiect și vor fi publicate odată cu el.","method":["Deschidem PROJECT/evidence.md și completăm numai secțiunea RO · S05, păstrând predicția făcută înainte de rulare. O predicție greșită rămâne vizibilă alături de concluzia verificată.","Actualizăm PROJECT/README.md în limba grupei: după testele trecute, bifăm numai funcționalitatea hexazecimală și testele verificate. Publicarea are o instrucțiune separată, fără bifă anticipată. S06 și S07 rămân etape viitoare.","Pregătim și informația de reluare înainte de commit. Confirmarea publicării se poate completa numai după verificarea GitHub; o completare ulterioară cere un nou commit și push."],"steps":[{"title":"Predicția și rezultatul se păstrează împreună","html":"<p class=\"explain\">În <code>PROJECT/evidence.md<\/code> găsești rubricile S05 deja pregătite. La „Predicție înainte să rulez” păstrezi ce ai scris inițial. La rezultatul observat notezi două sau trei comparații relevante: intrare, așteptat, obținut. Dacă la început ai omis zero-ul din față, scrii că regula cere două caractere și arăți ce ai verificat după modificare.<\/p><p class=\"explain\">Nu rescrii trecutul ca să pară că ai știut răspunsul de la început. Tocmai diferența dintre predicție și observație arată ce ai înțeles din activitate.<\/p>"},{"title":"Explicăm schimbarea, fără să copiem lecția","html":"<p class=\"explain\">La „Ce am modificat în lab.js și de ce” explici într-o frază rolurile celor trei operații: conversia în baza 16, completarea la stânga și majusculele. Menționezi că ai păstrat <code>validateByte(u)<\/code>. Nu copiezi toate paginile lecției și nu transcrii o conversație AI.<\/p><p class=\"explain\">Exemplu de lungime potrivită: „Am completat rezultatul din toHex8. Am păstrat validarea și am verificat lungimea, literele și cazurile de la capetele intervalului.” Completezi apoi propriile observații, fără să declari un test pe care nu l-ai rulat.<\/p>"},{"title":"README îi permite altcuiva să deschidă proiectul","html":"<p class=\"explain\">În <code>PROJECT/README.md<\/code> păstrezi instrucțiunile de pornire: deschiderea <code>PROJECT/index.html<\/code>, apoi <code>PROJECT/tests.html<\/code> și selectarea S05. După ce testele S05 au trecut, înlocuiește numai linia S05 din lista de progres cu cele două rânduri de mai jos; păstrează liniile S06 și S07.<\/p><pre><code>- [x] S05: hexazecimal pe două caractere și testele verificate.\nPublicarea S05 o verific pe GitHub după Push.<\/code><\/pre><p class=\"explain\">Prima linie confirmă funcționalitatea și testele deja verificate. A doua este o instrucțiune pentru pasul care urmează; nu declară commitul sau push-ul deja efectuate. Confirmăm publicarea numai după operația reușită și citirea propriei copii GitHub.<\/p><p class=\"explain\">README trebuie să descrie versiunea ta. Dacă menționezi o limitare, precizezi etapa: funcțiile pentru seminariile viitoare sunt încă în starea inițială. Faptul că ai terminat hexazecimalul nu înseamnă că întregul proiect este terminat.<\/p>"},{"title":"Pregătim reluarea și salvăm","html":"<p class=\"explain\">Completezi rubricile „Ce îmi trebuie ca să reiau lucrul”: URL-ul copiei tale, folderul local, etapa încheiată și ramura <code>main<\/code>. Prima verificare va fi deschiderea copiei potrivite și citirea stării Git. Salvezi ambele fișiere Markdown înainte să le selectezi pentru commit.<\/p><p class=\"explain\">Rubrica de confirmare a publicării rămâne de verificat până după push. Dacă o completezi după verificarea GitHub, salvezi și publici această completare într-un nou commit. În S05 nu încărcăm o temă suplimentară în Moodle; aceste rânduri rămân în proiect.<\/p>"}],"connection":"Citim diferențele înainte să alegem ce intră în istoric.","mistake":"Nu bifăm etape viitoare și nu scriem „publicat” înainte să verificăm copia de pe GitHub.","prompt":"Arată următorul pas"},{"id":"diff","title":"Citim schimbarea înainte de commit","chapter":"07 · De la fișier la versiune publicată","start":3600,"end":3780,"rule":"Diff arată diferența dintre două stări. Îl folosim pentru a explica ce s-a schimbat și pentru a observa dacă am modificat mai mult decât cere S05.","method":["În VS Code deschidem Source Control, apoi fiecare fișier din Changes. Privim atât codul cât și însemnările; numele fișierului singur nu descrie conținutul modificat.","În lab.js trebuie să recunoaștem schimbarea din toHex8 și validarea păstrată. Celelalte funcții rămân ca în punctul de pornire.","Separăm diff-ul fișierelor neselectate de diff-ul selecției pentru commit. După stage vom citi și al doilea."],"steps":[{"title":"Deschidem comparația din Source Control","html":"<p class=\"explain\">În bara laterală VS Code alegi <strong>Source Control<\/strong>. Sub <strong>Changes<\/strong> apeși <code>PROJECT/lab.js<\/code>. Editorul de diferențe poate afișa versiunile alăturat sau într-o singură coloană, în funcție de setări. În ambele moduri cauți liniile eliminate și adăugate, apoi citești funcția întreagă în jurul lor.<\/p><p class=\"explain\">Culorile sunt un sprijin. Semnele <code>−<\/code>/<code>+<\/code> și textul liniilor explică schimbarea și când culorile sunt greu de distins.<\/p>"},{"title":"Diferența esențială din toHex8","html":"<pre><code>@@ function toHex8(u) @@\n   validateByte(u);\n-  return null;\n+  return u.toString(16).padStart(2, &#x27;0&#x27;).toUpperCase();<\/code><\/pre><p class=\"explain\">Acesta este un fragment explicativ al diferenței, nu cod de copiat ca atare în fișier. Semnul minus indică linia eliminată; plusul indică linia adăugată. <code>validateByte(u)<\/code> apare ca linie de context și rămâne în funcție.<\/p><p class=\"explain\">Comentariile TODO pot fi păstrate sau actualizate scurt. Nu modifici <code>asSigned8<\/code>, <code>parityBit8<\/code>, parsarea intrării ori testele furnizate ca să obții artificial un rezultat verde. Astăzi cerința este numai <code>toHex8<\/code>.<\/p>"},{"title":"Verificăm și fișierele de explicații","html":"<p class=\"explain\">Deschizi diff-ul <code>PROJECT/README.md<\/code> și al <code>PROJECT/evidence.md<\/code>. Cauți observațiile proprii, etapa S05 și adresa copiei tale. Rubricile celorlalte limbi sau etape se păstrează. Dacă ai adăugat testul opțional, citești și diferența din <code>PROJECT/custom-tests.js<\/code>.<\/p><p class=\"explain\">Un fișier apărut neașteptat în listă cere o explicație înainte să fie inclus. Poate fi o schimbare accidentală sau un fișier de lucru care nu aparține proiectului. Selectăm conținutul relevant, fără să folosim mecanic „toate fișierele”.<\/p>"},{"title":"Aceeași distincție în terminal","html":"<p class=\"explain\"><strong>Unde rulează:<\/strong> în terminalul VS Code deschis în rădăcina copiei tale, unde există direct <code>PROJECT<\/code> și <code>GUIDES<\/code>. Comenzile de mai jos citesc starea și diferențele; nu creează un commit.<\/p><pre><code>git status\ngit diff -- PROJECT/lab.js\ngit diff --cached<\/code><\/pre><p class=\"explain\"><code>git diff<\/code> compară fișierele de lucru cu selecția curentă. <code>git diff --cached<\/code> compară selecția cu ultimul commit. Dacă încă nu ai selectat nimic, a doua comandă poate să nu afișeze diferențe; asta nu înseamnă că toate fișierele sunt neschimbate.<\/p>"}],"connection":"Alegem explicit conținutul care va forma următorul commit.","mistake":"Un diff gol într-o singură comparație nu dovedește lipsa tuturor schimbărilor. Întrebăm mereu ce două stări sunt comparate.","prompt":"Arată următorul pas"},{"id":"stage","title":"Stage: alegem conținutul pentru următorul commit","chapter":"07 · De la fișier la versiune publicată","start":3780,"end":3900,"rule":"Selectarea pentru commit păstrează conținutul din acel moment. Dacă salvezi încă o editare după stage, ea nu intră automat în selecția deja pregătită.","method":["În Source Control folosim plusul de lângă fiecare fișier relevant și verificăm mutarea în Staged Changes.","Citirea selecției este ultima verificare a conținutului propus. Dacă am editat după stage, selectăm din nou noul conținut înainte de commit.","Exemplul v0/v1/v2 explică o stare Git; nu cere două modificări suplimentare sau completarea funcțiilor viitoare."],"steps":[{"title":"Selectăm numai fișierele relevante","html":"<p class=\"explain\">În <strong>Changes<\/strong> apeși <strong>+<\/strong> lângă <code>PROJECT/lab.js<\/code>, <code>PROJECT/README.md<\/code> și <code>PROJECT/evidence.md<\/code>. Dacă ai modificat testul opțional, selectezi și <code>PROJECT/custom-tests.js<\/code>. Fișierele apar în <strong>Staged Changes<\/strong>. Acolo deschizi încă o dată diferențele.<\/p><p class=\"explain\">Această selecție îi spune lui Git ce conținut să înregistreze în commit. Încă nu ai creat o versiune în istoric și încă nu ai trimis schimbarea pe GitHub.<\/p>"},{"title":"Un exemplu precis: v0, v1 și v2","html":"<p class=\"explain\">Numim <strong>v0<\/strong> funcția inițială, cu <code>return null;<\/code>. <strong>v1<\/strong> este funcția hexazecimală completată. <strong>v2<\/strong> este aceeași funcție corectă, căreia îi adăugăm ulterior un comentariu scurt. Etichetele sunt doar nume pentru conținut, nu versiuni oficiale ale kitului.<\/p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce conține fiecare stare locală\"><table><caption>Ce conține fiecare stare locală<\/caption><thead><tr><th scope=\"col\">Acțiune<\/th><th scope=\"col\">Fișier salvat<\/th><th scope=\"col\">Selecție pentru commit<\/th><th scope=\"col\">Ultimul commit<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Punctul de pornire<\/th><td>v0<\/td><td>v0<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Salvez v1<\/th><td>v1<\/td><td>v0<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Selectez v1: stage<\/th><td>v1<\/td><td>v1<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Salvez o editare nouă v2<\/th><td>v2<\/td><td>v1<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Fac commit fără să selectez din nou<\/th><td>v2<\/td><td>v1<\/td><td>v1<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">După ultima linie, commitul conține v1 și fișierul salvat conține v2. Diferența v2 față de v1 rămâne neselectată. Același fișier poate avea atât schimbări selectate cât și schimbări neselectate.<\/p>"},{"title":"Dacă vrem ca v2 să intre în commit","html":"<p class=\"explain\">Înainte de commit, selectezi din nou fișierul și citești noua selecție. În VS Code, plusul pentru schimbarea rămasă actualizează conținutul pregătit. Dacă ai făcut deja commit cu v1, selectezi v2 și faci un nou commit. Astfel poți publica ambele versiuni fără să pierzi modificarea.<\/p><p class=\"explain\">În parcursul obișnuit S05 este suficient să salvezi toate editările dorite, să le selectezi și apoi să faci commit. Exemplul ne arată de ce trebuie să repetăm stage când edităm după selecție.<\/p>"},{"title":"Alternativa din terminal","html":"<p class=\"explain\"><strong>Unde rulează:<\/strong> numai în terminalul rădăcinii copiei tale. Alegi această variantă în locul plusurilor din interfață; nu este o etapă suplimentară obligatorie.<\/p><pre><code>git add PROJECT/lab.js PROJECT/README.md PROJECT/evidence.md\ngit diff --cached\ngit status<\/code><\/pre><p class=\"explain\">Dacă ai schimbat <code>custom-tests.js<\/code>, îl adaugi explicit. Comanda <code>git add<\/code> poate fi repetată pentru un fișier modificat după stage: selecția acelui fișier va conține noua versiune salvată. Verifici rezultatul, apoi continui cu commit.<\/p>"}],"connection":"Înregistrăm acum versiunea selectată, cu un mesaj care explică schimbarea.","mistake":"Stage nu urmărește automat toate salvările viitoare ale fișierului. O schimbare salvată după stage cere o nouă selecție.","prompt":"Arată următorul pas"},{"id":"commit","title":"Commit: înregistrăm o versiune locală","chapter":"07 · De la fișier la versiune publicată","start":3900,"end":4020,"rule":"Commitul înregistrează conținutul selectat în istoricul local, împreună cu un mesaj și identitatea autorului. Publicarea către GitHub va fi pasul următor.","method":["Înainte de commit verificăm Staged Changes și mesajul. În laborator identitatea autorului se configurează local, numai pentru copia noastră.","Un mesaj util spune ce comportament am schimbat. Nu pretinde că am terminat S06/S07 sau că toate testele posibile au trecut.","După commit citim starea și istoricul local. Un director curat nu înseamnă singur că GitHub are aceeași versiune."],"steps":[{"title":"Verificăm identitatea autorului","html":"<p class=\"explain\">Dacă la primul commit apare <strong>Author identity unknown<\/strong>, revii la identitatea pregătită. În terminalul rădăcinii copiei tale verifici numele și emailul. Pe un cont de laborator partajat configurezi numai acest repository, fără <code>--global<\/code>. Înlocuiești exemplele cu valorile alese înainte să rulezi comenzile.<\/p><pre><code>git config user.name &quot;Numele meu&quot;\ngit config user.email &quot;ADRESA_MEA_ALEASA&quot;\ngit config --get user.name\ngit config --get user.email<\/code><\/pre><p class=\"explain\">Adresa poate fi cea <code>noreply<\/code> furnizată de GitHub în Settings → Emails; o copiezi exact din propriul cont. Numele și emailul autorului nu stabilesc contul cu care vei face autentificarea pentru push.<\/p>"},{"title":"Scriem mesajul și facem commit","html":"<p class=\"explain\">În Source Control scrii un mesaj precum <code>S05: afisare hexazecimala pe doua caractere<\/code>. Verifici că fișierele dorite sunt în <strong>Staged Changes<\/strong>, apoi alegi <strong>Commit<\/strong>. Dacă interfața propune selectarea automată a tuturor schimbărilor, oprești acel pas și revezi selecția; vrem să știm ce conține versiunea.<\/p><p class=\"explain\">Mesajul explică scopul. Diferența de cod arată implementarea, iar însemnările păstrează verificările. Împreună, acestea fac versiunea mai ușor de înțeles la următoarea deschidere.<\/p>"},{"title":"Verificăm versiunea înregistrată","html":"<p class=\"explain\">Din terminalul rădăcinii copiei tale poți verifica istoricul și starea prin comenzile de mai jos. Comanda <code>git log -1 --oneline<\/code> arată ultimul commit și mesajul său; nu afișează o verificare a paginii GitHub.<\/p><pre><code>git status\ngit log -1 --oneline<\/code><\/pre><p class=\"explain\">Dacă toate editările dorite au fost selectate înainte de commit, fișierele de lucru pot fi curate. Commitul este tot local. Dacă ai păstrat v2 după un stage al lui v1, va rămâne o diferență locală: citești acea diferență și o selectezi pentru un nou commit dacă vrei s-o păstrezi în istoric.<\/p>"},{"title":"„Nothing to commit” are nevoie de context","html":"<p class=\"explain\">Acest mesaj poate însemna că ai înregistrat deja schimbarea. Poate însemna și că editezi alt folder sau că nu ai salvat fișierul. Verifici tabul editorului, folderul deschis, <code>git status<\/code> și ultimul commit; nu repeți la întâmplare butoanele.<\/p><p class=\"explain\">În alternativa din terminal, după ce ai verificat selecția, comanda este <code>git commit -m \"S05: afisare hexazecimala pe doua caractere\"<\/code>. O execuți numai în propria copie, ca alternativă la Commit din Source Control.<\/p>"}],"connection":"Trimitem commitul către origin și verificăm unde a ajuns.","mistake":"Un commit reușit și „working tree clean” nu sunt dovezi suficiente de publicare.","prompt":"Arată următorul pas"},{"id":"push","title":"Push: trimitem commitul către propria copie GitHub","chapter":"07 · De la fișier la versiune publicată","start":4020,"end":4140,"rule":"Push trimite commiturile către repository-ul indicat. În această activitate trimitem către propria copie, pe main; nu publicăm site-ul prin GitHub Pages.","method":["Verificăm mai întâi origin și ramura: trebuie să fie copia noastră și main. Nu trimitem schimbări în șablonul comun.","Folosim Push din Source Control sau comanda explicită din terminal. Urmărim rezultatul operației și încheiem autentificarea contului potrivit dacă este cerută.","Dacă push este respins, păstrăm mesajul și verificăm cauza. O comandă de forțare nu este un pas normal de remediere pentru această activitate."],"steps":[{"title":"Verificăm destinația înainte de trimitere","html":"<p class=\"explain\">În terminalul rădăcinii copiei tale rulezi comenzile de citire. La <code>origin<\/code>, atât adresa fetch cât și adresa push trebuie să indice <strong>contul tău<\/strong> și repository-ul propriu. Ramura pentru acest parcurs este <code>main<\/code>.<\/p><pre><code>git remote -v\ngit branch --show-current\ngit status<\/code><\/pre><p class=\"explain\">Dacă origin indică <code>antonioclim/BBS-bit-byte-starter<\/code>, ai deschis probabil clona șablonului. Revii la propria copie într-un folder separat. Verificarea destinației este mai simplă decât repararea unei activități făcute în proiectul greșit.<\/p>"},{"title":"Alegem Push și citim rezultatul","html":"<p class=\"explain\">În Source Control deschizi meniul de acțiuni și alegi <strong>Push<\/strong>. Denumirea sau locul comenzii poate varia între versiunile VS Code. Pentru prima trimitere poate apărea autentificarea GitHub: verifici contul înainte să continui. Identitatea autorului configurată pentru commit nu înlocuiește această autentificare.<\/p><p class=\"explain\">Urmărești dacă operația s-a încheiat sau a afișat o eroare. Abia apoi treci în browser. Faptul că ai apăsat Push nu dovedește că trimiterea a reușit.<\/p>"},{"title":"Alternativa explicită din terminal","html":"<p class=\"explain\"><strong>Unde rulează:<\/strong> în terminalul rădăcinii copiei tale, după commit și după verificarea adresei origin. Comanda precizează atât destinația cât și ramura.<\/p><pre><code>git push origin main\ngit status<\/code><\/pre><p class=\"explain\">Git trimite commiturile necesare ramurii; nu trimite direct o editare salvată care încă nu există într-un commit. În exemplul v1/v2, dacă ai înregistrat numai v1, push poate publica v1 în timp ce v2 rămâne doar o editare locală. Pentru v2 ai nevoie de stage, commit și apoi push.<\/p>"},{"title":"Dacă apare o eroare, o delimităm","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Mesaje întâlnite și verificarea potrivită\"><table><caption>Mesaje întâlnite și verificarea potrivită<\/caption><thead><tr><th scope=\"col\">Situație<\/th><th scope=\"col\">Ce verificăm<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Acces refuzat / repository not found<\/th><td>Adresa origin, contul autentificat și dreptul de acces la copia proprie.<\/td><\/tr><tr><th scope=\"row\">Commitul există local, dar push nu s-a încheiat<\/th><td>Conectivitatea și mesajul operației. Schimbarea nu se pierde dacă există în istoricul local.<\/td><\/tr><tr><th scope=\"row\">Push respins deoarece online există altă schimbare<\/th><td>Mesajul complet și stările celor două copii, înainte să alegem sincronizarea.<\/td><\/tr><tr><th scope=\"row\">Everything up-to-date<\/th><td>Ramura și destinația. Poate să nu existe un commit nou pe main; verificăm și istoricul.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Cerem ajutor pornind de la mesajul concret, fără force push sau ștergeri. Nu introducem parole ori tokenuri în fișierele proiectului sau în însemnări.<\/p>"}],"connection":"Deschidem propria pagină GitHub și verificăm funcția în commitul publicat.","mistake":"Push lucrează cu commituri. Salvarea, selectarea sau apăsarea butonului fără succesul operației nu sunt echivalente cu publicarea.","prompt":"Arată următorul pas"},{"id":"published-check","title":"Verificăm versiunea de pe GitHub","chapter":"07 · De la fișier la versiune publicată","start":4140,"end":4200,"rule":"Confirmarea se face în copia GitHub proprie, pe ramura potrivită, citind commitul și fișierul modificat. O stare locală curată are un sens mai restrâns.","method":["Reîncărcăm pagina copiei proprii și verificăm ownerul, repository-ul și main.","Citim mesajul commitului și toHex8 din PROJECT/lab.js. Verificăm și publicarea însemnărilor pe care vrem să le putem relua.","Dacă completăm acum o confirmare în evidence.md, ea este o nouă schimbare: salvăm, selectăm, facem commit și push."],"steps":[{"title":"Ajungem la copia potrivită","html":"<p class=\"explain\">În browser deschizi <strong>repository-ul tău<\/strong>, nu pagina șablonului. Reîncarci pagina și verifici numele din antet și selectorul de ramură <code>main<\/code>. Mesajul commitului S05 trebuie să fie vizibil în istoricul acelei ramuri; dacă ai mai făcut un commit pentru însemnări, acesta poate apărea primul.<\/p><p class=\"explain\">Într-o copie privată, această vizualizare este posibilă pentru contul cu acces. Un URL trimis altcuiva nu îi acordă singur dreptul să citească proiectul.<\/p>"},{"title":"Citim fișierul, nu doar mesajul","html":"<p class=\"explain\">Deschizi <code>PROJECT/lab.js<\/code> pe GitHub și cauți <code>toHex8<\/code>. Confirmi că linia implementată există, că validarea a rămas și că funcțiile viitoare sunt păstrate. Apoi verifici <code>PROJECT/README.md<\/code> și <code>PROJECT/evidence.md<\/code>. Un mesaj frumos nu poate înlocui conținutul versiunii.<\/p><p class=\"explain\">Pentru o identificare precisă poți vedea ultimul identificator local prin <code>git rev-parse HEAD<\/code> și îl poți compara cu commitul de pe GitHub. Nu este necesară o captură de ecran sau o depunere Moodle suplimentară în S05.<\/p>"},{"title":"Confirmarea scrisă trebuie și ea publicată","html":"<p class=\"explain\">Acum poți completa rubrica din <code>evidence.md<\/code>: ai verificat copia online și ai găsit modificarea. Dacă o editezi acum, fișierul devine din nou schimbat local. Îl salvezi, citești diff-ul, îl selectezi, faci un commit scurt pentru confirmare și push. Reîncarci apoi GitHub pentru a verifica și această însemnare.<\/p><p class=\"explain\">Nu scrii în fișier identificatorul propriului commit final: editarea fișierului ar cere un commit nou. În S07 identificatorul final va merge în Moodle, după ultimul commit și push.<\/p>"}],"connection":"Păstrăm o informație scurtă de reluare pentru seminarul următor.","mistake":"„Working tree clean” descrie fișierele locale și selecția față de commit. Nu dovedește singur existența commitului în GitHub.","prompt":"Arată următorul pas"},{"id":"resume","title":"Peste două săptămâni: de unde reluăm?","chapter":"08 · Reluăm și verificăm ce am înțeles","start":4200,"end":4320,"rule":"O notă de reluare identifică proiectul, copia locală și prima verificare. Este utilă când nu ne mai amintim folderul sau ultima etapă terminată.","method":["Recitim informația pregătită în evidence.md: URL, folder local, main, S05 și prima verificare.","Nu depindem exclusiv de folderul din laborator. Modificările înregistrate și trimise există în propria copie GitHub.","La S06 vom investiga o problemă; la S07 vom rezolva cerința individuală și vom reproduce rezultatul. Nu începem acum soluțiile lor."],"steps":[{"title":"Recitim fișa înainte să închidem","html":"<p class=\"explain\">În <code>PROJECT/evidence.md<\/code> trebuie să recunoști patru lucruri: adresa repository-ului tău, folderul folosit astăzi, etapa S05 și ramura <code>main<\/code>. Prima acțiune este clară: deschizi copia potrivită și verifici starea. Dacă ai completat nota acum, repeți salvarea, stage, commit și push pentru ea.<\/p><p class=\"explain\">Folderul local ajută pe același calculator. URL-ul copiei proprii rămâne punctul de pornire dacă folosești alt calculator sau dacă folderul laboratorului nu mai este disponibil.<\/p>"},{"title":"Prima verificare la următoarea întâlnire","html":"<p class=\"explain\">Dacă redeschizi copia existentă, citești <code>git status<\/code>, <code>git remote -v<\/code> și ramura înainte să schimbi ceva. Dacă ai alt calculator, clonezi propria copie într-un folder separat, deschizi aplicația și rulezi etapa deja terminată. Astfel afli dacă ai proiectul și versiunea așteptate.<\/p><p class=\"explain\">Nu înlocuiești automat o copie cu modificări locale și nu ștergi un folder doar pentru că nu îl recunoști. Starea citită întâi spune ce ai de păstrat sau de sincronizat.<\/p>"},{"title":"Ce ne rămâne după ce uităm comenzile","html":"<p class=\"explain\">Trebuie să putem răspunde la patru întrebări: ce am schimbat, cum am verificat, în ce versiune există și unde o regăsesc? Pentru pașii exacți putem reciti ghidul. În S06 folosim aceeași disciplină pentru o ipoteză și un test; în S07 verificăm dacă rezultatul poate fi refăcut din copia publicată.<\/p><p class=\"explain\">Închiderea seminarului nu cere alt document. Nota scurtă și commiturile sunt suficiente pentru continuitatea lucrului; quizul individual va verifica înțelegerea unor situații și reprezentări.<\/p>"}],"connection":"Verificăm printr-o predicție scurtă dacă distingem fișierul, selecția, commitul și copia GitHub.","mistake":"Un folder reținut din memorie este fragil. Păstrăm adresa copiei și citim starea înainte de continuare.","prompt":"Arată următorul pas"},{"id":"git-transfer","title":"Un minut de predicție: ce versiune ajunge unde?","chapter":"08 · Reluăm și verificăm ce am înțeles","start":4320,"end":4380,"rule":"Mai întâi reconstruim singuri succesiunea, apoi deschidem comparația. Folosim cele patru locuri în care poate exista conținutul unui proiect.","method":["Răspundem înainte să deschidem pașii următori. Putem nota doar etichetele v0, v1 și v2; nu avem de executat aceste editări în proiect.","Comparăm apoi fiecare loc, fără să folosim „am salvat” ca explicație universală.","Exemplul este o verificare publică pentru învățare, fără notă și fără o încărcare Moodle separată."],"steps":[{"title":"Întâi răspunsul tău","html":"<p class=\"explain\">Punct de pornire: v0 în fișierul local, selecție, ultimul commit și copia GitHub. Salvezi v1 și o selectezi pentru commit. Mai adaugi un comentariu, salvezi v2 și faci commit fără să selectezi din nou. Ce versiune se găsește acum în fiecare dintre cele patru locuri?<\/p><p class=\"explain\">Apoi selectezi conținutul nou, faci încă un commit și un push reușit către propria <code>main<\/code>. Ce s-a schimbat? Încearcă să justifici fiecare răspuns înainte să deschizi comparația. Nu este necesar să rulezi această succesiune ca exercițiu suplimentar.<\/p>"},{"title":"Comparația, după încercare","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Succesiunea completă v0 → v1 → v2\"><table><caption>Succesiunea completă v0 → v1 → v2<\/caption><thead><tr><th scope=\"col\">Acțiune<\/th><th scope=\"col\">Fișier local<\/th><th scope=\"col\">Selecție<\/th><th scope=\"col\">Commit local<\/th><th scope=\"col\">GitHub<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Salvez v1<\/th><td>v1<\/td><td>v0<\/td><td>v0<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Selectez v1<\/th><td>v1<\/td><td>v1<\/td><td>v0<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Salvez v2 fără o nouă selecție<\/th><td>v2<\/td><td>v1<\/td><td>v0<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Fac commit<\/th><td>v2<\/td><td>v1<\/td><td>v1<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Selectez v2 și fac alt commit<\/th><td>v2<\/td><td>v2<\/td><td>v2<\/td><td>v0<\/td><\/tr><tr><th scope=\"row\">Push reușit către propria main<\/th><td>v2<\/td><td>v2<\/td><td>v2<\/td><td>v2<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Primul commit conține v1, iar schimbarea v2 rămâne în fișierul local. Noul stage și noul commit înregistrează v2. Push trimite istoricul necesar astfel încât ramura GitHub să ajungă la v2, în ipoteza că operația reușește către destinația corectă.<\/p>"},{"title":"Ce justifică concluzia despre GitHub?","html":"<p class=\"explain\">După commitul cu v2, starea locală poate fi curată în timp ce GitHub încă păstrează v0. Acesta este un contraexemplu suficient pentru afirmația „curat local înseamnă publicat”. După push verificăm propria pagină, ramura și conținutul commitului.<\/p><p class=\"explain\">Dacă ai greșit predicția, identifică operația al cărei efect l-ai extins prea mult. De exemplu, save schimbă fișierul de lucru, nu selecția deja făcută; commit înregistrează selecția, nu orice editare existentă pe disc.<\/p>"}],"connection":"O clarificare AI opțională poate fi verificată la fel: alegem o afirmație și un caz care o pune la încercare.","mistake":"Nu ghicim starea din ultimul buton apăsat. Urmărim separat fișierul, selecția, commitul și destinația push.","prompt":"Arată comparația după încercarea mea","answer_after_attempt":true},{"id":"gemini","title":"Gemini, opțional: verificăm o afirmație","chapter":"08 · Reluăm și verificăm ce am înțeles","start":4380,"end":4440,"rule":"O explicație AI ne poate ajuta să formulăm un test. Întâi încercăm singuri, apoi alegem o afirmație precisă și o verificăm în proiect.","method":["Această clarificare este opțională în S05. Dacă nu folosim Gemini sau nu avem acces, folosim exemplul didactic pregătit, fără cont și fără transcriere.","Deschidem sprijinul numai după ce am scris propria judecată. O afirmație generală despre cod trebuie confruntată cu rezultatul cerut.","În minutul disponibil alegem o singură întrebare. Investigația completă cu ipoteză și test va fi activitatea S06."],"steps":[{"title":"Întâi judecata ta","html":"<p class=\"explain\">Fără să consulți un răspuns nou, răspunde: „Pentru un întreg valid din intervalul 0–255, <code>u.toString(16)<\/code> îndeplinește singur cerința de exact două caractere hexazecimale majuscule?” Scrie da sau nu și alege două intrări care ar putea deosebi afirmația de cerință.<\/p><p class=\"explain\">Nu este o a doua implementare obligatorie și nu înlocuiește testele S05. Este un mod scurt de a decide dacă o sugestie sună plauzibil sau chiar corespunde contractului funcției.<\/p>"},{"title":"Trei prompturi din care alegem unul","html":"<p class=\"explain\">După încercarea proprie poți folosi Gemini gratuit, dacă ai acces. Alegi un singur prompt și adaptezi partea despre predicția ta. Nu este nevoie să trimiți întregul proiect.<\/p><pre><code>Am o funcție care primește un întreg valid între 0 și 255 și trebuie să întoarcă exact două caractere hexazecimale majuscule. Cred că [scriu predicția mea]. Explică-mi dacă toString(16) este suficient și propune două cazuri prin care să verific afirmația, fără să îmi scrii funcția completă.<\/code><\/pre><pre><code>Am salvat o editare după ce selectasem deja fișierul pentru commit. Eu cred că [scriu ce cred că intră în commit]. Explică-mi ce ar compara git diff și git diff --cached în această situație. Aș vrea să verific explicația, nu doar să memorez comenzi.<\/code><\/pre><pre><code>Testele S05 sunt verzi. Eu cred că acest lucru dovedește [scriu concluzia mea]. Ce susțin efectiv aceste rezultate și ce concluzii despre autor, publicare sau cazuri neverificate ar depăși observația?<\/code><\/pre>"},{"title":"Alternativa pregătită este un exemplu didactic","html":"<p class=\"explain\"><strong>Afirmație pregătită pentru verificare, nu citat din Gemini:<\/strong> „Conversia cu <code>toString(16)<\/code> este suficientă, deoarece am obținut un text în baza 16.” Alegem intrările <code>0<\/code> și <code>31<\/code>. Pentru contractul aplicației așteptăm <code>00<\/code> și <code>1F<\/code>. Numai conversia produce <code>0<\/code> și <code>1f<\/code>.<\/p><p class=\"explain\">Prima intrare arată diferența de lungime; a doua arată diferența dintre litere mici și majuscule. Afirmația confundă scrierea în baza 16 cu formatarea exactă cerută. Un singur contraexemplu ar fi suficient să o infirme; cele două ne arată două aspecte diferite ale cerinței.<\/p>"},{"title":"Păstrăm concluzia, apoi închidem AI pentru quiz","html":"<p class=\"explain\">Dacă ai folosit clarificarea, poți nota scurt afirmația verificată și concluzia în propriile însemnări S05. Nu se cere conversația, captură sau alt fișier. Rezultatul important este să poți explica ce caz ai ales și ce anume a arătat.<\/p><p class=\"explain\">La Q05 folosirea Gemini, a altui AI sau a ajutorului colegilor nu este permisă. Referința comună deja anunțată rămâne permisă. Trecem de la sprijinul pentru învățare la verificarea individuală.<\/p>"}],"connection":"Încheiem pregătirea și intrăm în Q05, păstrând numai resursa permisă.","mistake":"O afirmație AI nu se verifică prin aprobarea unui al doilea AI. Alegem un caz, stabilim rezultatul așteptat și comparăm observația.","prompt":"Arată sprijinul după încercarea mea","answer_after_attempt":true},{"id":"quiz-transition","title":"Q05 individual, apoi recapitularea","chapter":"09 · Evaluarea și încheierea","start":4440,"end":4500,"rule":"Q05 verifică individual reprezentări și situații Git. Contribuie cu maximum 0,20 puncte reale; nu verifică automat codul sau publicarea repository-ului.","method":["La minutul 75 deschidem Q05 din cursul Moodle. Quizul durează 10 minute, are o singură încercare și patru întrebări selectate, fiecare cu două subrăspunsuri.","Lucrăm individual, fără AI sau colegi. Folosim numai referința comună deja permisă și comunicată; acest set de pagini explicative nu este o nouă resursă permisă la quiz.","În minutele 85–90 recapitulăm cerința, verificarea și diferența dintre salvare, commit și push. Nu adăugăm o temă S05."],"steps":[{"title":"Înainte să începem încercarea","html":"<p class=\"explain\">Accesezi <strong>Q05 din cursul Moodle real<\/strong>, conform indicației grupei. Închizi Gemini sau alt AI și îndepărtezi sprijinul nepermis. Rămâne disponibilă numai fișa comună de referință anunțată. Citești instrucțiunea și intervalul afișat în Moodle înainte să începi încercarea.<\/p><p class=\"explain\">Cele 10 minute sunt pentru răspunsurile individuale. Dacă nu găsești activitatea ori accesul este blocat, semnalezi imediat situația; nu folosești un link sau o parolă dedusă din alte grupe.<\/p>"},{"title":"Ce înseamnă punctajul","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Structura Q05\"><table><caption>Structura Q05<\/caption><thead><tr><th scope=\"col\">Element<\/th><th scope=\"col\">Regulă<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Întrebări selectate<\/th><td>4, fiecare cu 2 subrăspunsuri: 8 în total.<\/td><\/tr><tr><th scope=\"row\">Ponderi brute<\/th><td>6 + 6 + 4 + 4 = 20.<\/td><\/tr><tr><th scope=\"row\">Durată și încercări<\/th><td>10 minute; o încercare.<\/td><\/tr><tr><th scope=\"row\">Contribuție reală<\/th><td>Maximum 0,20 puncte pentru Q05.<\/td><\/tr><tr><th scope=\"row\">S05–S07<\/th><td>Maximum 1 punct real în total: 0,20 + 0,30 + 0,50.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Navigarea este liberă, iar feedbackul este amânat. Conținutul exact al referinței și setările de acces rămân cele comunicate în curs. Nu confundăm cele 20 de puncte brute cu 20 de puncte din nota disciplinei.<\/p>"},{"title":"Răspunsul din quiz și formatul aplicației","html":"<p class=\"explain\">În întrebările hexazecimale Q05, literele mici sunt acceptate alături de majuscule. Acest lucru nu schimbă cerința programului: <code>toHex8<\/code> trebuie să întoarcă exact două caractere <strong>majuscule<\/strong>. Modul în care se recunoaște un răspuns la quiz și contractul unei funcții software sunt reguli diferite.<\/p><p class=\"explain\">Un rezultat bun în Q05 arată răspunsuri corecte la întrebările selectate. Nu certifică automat autorul codului, testele rulate sau existența unui push. Aceste lucruri au fost urmărite în parcursul proiectului.<\/p>"},{"title":"Ultimele cinci minute: ce păstrăm?","html":"<p class=\"explain\">După quiz, în minutele <strong>85–90<\/strong>, putem explica fără lista de comenzi: un octet fără semn are 256 de valori; două caractere hexazecimale descriu cei opt biți; un rezultat software are un contract de format; o schimbare trebuie verificată și identificată într-o versiune. Salvarea, stage, commit și push au efecte distincte.<\/p><p class=\"explain\">La S06 vom investiga o problemă și vom verifica o ipoteză cu ajutorul unui test. La S07 vom rezolva cerința individuală și vom reproduce rezultatul din copia publicată. Astăzi rămânem cu propria copie, hexazecimalul verificat și informația de reluare.<\/p>"}],"connection":"Păstrăm același repository pentru S06; următoarea activitate va porni de la versiunea verificată astăzi.","mistake":"Quizul și proiectul furnizează dovezi diferite. Nu deducem un repository complet doar dintr-un punctaj Q05 bun.","prompt":"Arată următorul pas"}],"math_checks":[],"rehearsal":[]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
