const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s06-complete-lesson-v1-ro')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s06-complete-lesson-v1-ro',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Exemplul este ascuns</span></div><section class="example" id="example-${i}" aria-label="Exemplu rezolvat" hidden></section><p class="connection"><b>Legătura cu tema următoare.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Prezentare pe teme':'Citire continuă';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Reia pas cu pas';return f<p.steps.length-1?'Următorul pas al rezolvării':'Reia exemplul ↺';}
function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Exemplul este ascuns':state.all[i]?`Toți cei ${p.steps.length} pași sunt afișați`:`Pasul ${f+1} din ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'REZOLVARE COMPLETĂ':`PASUL ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Pasul anterior</button><button data-action="all" data-index="${i}">Rezolvarea completă</button><button data-action="hide" data-index="${i}">Ascunde exemplul</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Revino la metodă ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Cuprinsul lecției':'← Tema anterioară';$('nextBtn').textContent=state.index===pages.length-1?'Reia lecția ↺':'Tema următoare →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Revino la lecție':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Panou suplimentar. Butonul Tema următoare revine la lecție și trece la tema următoare.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Exemplul este ascuns':'Exemplul este afișat'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Tema ${state.index+1} din ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Exemplul este ascuns până când îl ceri.':state.all[state.index]?`Toți cei ${pages[state.index].steps.length} pași sunt afișați.`:`Este afișat pasul ${state.frames[state.index]+1} din ${pages[state.index].steps.length}.`}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lecția a fost reluată. Toate exemplele rezolvate sunt ascunse.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Citire continuă: toate metodele sunt vizibile; fiecare exemplu se deschide separat.':'Prezentare: câte o temă pe ecran.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Revino la lecție</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['signed','boundary','integration'].includes(which)){h=s06Panel(which);}
else if(which==='map'){h=panelHead("Cuprinsul lecției")+`<p>Reluăm proiectul, formulăm ipoteza proprie și verificăm pragul interpretării cu semn. Consultăm Gemini sau exemplul pregătit, testăm afirmația și urmărim remedierea prin ramură, pull request, merge și actualizarea main local.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Prezint\u0103 c\u00e2te o tem\u0103":"Cite\u0219te lec\u021bia continuu"}</button><button data-command="tools">Instrumente de verificare</button><button data-command="reference">Fișa comună</button><button data-command="help">Ajutor și afișare</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">Parcursul propus pentru 90 de minute alocă 75 de minute proiectului, 10 minute testului Q06 și cinci minute încheierii. Pentru acest ritm, instrumentele trebuie pregătite înainte de seminar. Duratele nu au fost măsurate pentru fiecare grupă.</p></div>`;}
else if(which==='help'){h=panelHead('Citire, navigare și afișare')+`<p><b>Explicațiile sunt vizibile de la început.</b> Apasă E sau butonul verde pentru a parcurge exemplul pe pași. Săgeata spre dreapta trece la tema următoare chiar dacă exemplul nu este terminat. Parcursul complet afișează toate etapele după propria încercare.</p><p><a href="BTI_S06_Lesson_Text_RO_v1.0.0.html">Deschide textul complet pentru citire</a>. Conține aceleași explicații și exemple și funcționează fără JavaScript. Păstrează cele două fișiere în același folder după descărcare. În Moodle folosim și linkul separat către textul pentru citire.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Mărimea textului lecției: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− și A+ schimbă mărimea cu cinci puncte procentuale. Poți introduce și un procent exact. Derulează explicațiile mai lungi și tabelele late. Alegem mărimea pentru ecranul și distanța reale.</p><div class="panel-controls"><button data-command="theme">Comută tema luminoasă/întunecată</button><button data-command="fullscreen">Ecran complet</button><button data-command="blank">Ascunde ecranul (B)</button><button data-command="tools">Instrumente și cronometru</button></div><h2>Taste</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Comenzi prin litere: activate':'Comenzi prin litere: dezactivate'}</button></div><p class="small">Dezactivează comenzile prin litere dacă interferează cu introducerea textului sau comenzile vocale. Săgețile, Escape și butoanele rămân disponibile.</p><p>← / →: tema anterioară / următoare. E: afișează exemplul sau etapa următoare. Shift+E: etapa anterioară. H: ascunde exemplul. M: cuprins. F: ecran complet. B: ascunde ecranul. Escape: revine la lecție sau restabilește focalizarea tastaturii.</p><p class="small">În câmpurile unui formular, săgețile își păstrează rolul de editare. Escape revine la lecție. Alt+← / Alt+→ permit navigarea și dintr-un câmp.</p><h2>Ce învățăm și de ce</h2><p>Completăm o funcție pentru reprezentarea unui octet într-un proiect existent. Cerința precisă pentru intrare și ieșire ne permite să anticipăm un rezultat, să schimbăm funcția și să vedem ce demonstrează fiecare test.</p><p>După ce uităm comenzile, trebuie să ne rămână diferențele: Save actualizează fișierul de lucru, Stage selectează versiunea lui, Commit o înregistrează local, iar Push transmite commiturile existente. După push verificăm fișierul real pe GitHub.</p><h2>Legătura cu S06–S07</h2><p>În S06 investigăm un defect prin ipoteză și teste. În S07 rezolvăm o cerință individuală și reproducem rezultatul. În S06 obținem copia proiectului, prima funcție completată și metoda de lucru.</p><h2>Exersare și evaluare</h2><p>Scriem propria predicție și încercare înainte să afișăm răspunsuri explicate sau să folosim un instrument. Clarificarea opțională prin Gemini vine după încercare; îi verificăm afirmațiile și nu îl folosim în Q06. În Q06 folosim numai fișa comună existentă și materialele anunțate în curs. Închidem instrumentele lecției și răspunsurile explicate. Q06 valorează cel mult 0,2 puncte reale; cele trei teste ale proiectului valorează împreună cel mult 1 punct. Nota la test nu certifică autorul modificării unui repository.</p><h2>Convențiile instrumentelor</h2><p>Parserul zecimal reproduce proiectul starter: cifre zecimale, eventuale spații înainte și după și un număr întreg între 0 și 255. Nu acceptă intrare hexazecimală, exponenți sau semne. Limita suplimentară de 128 de caractere aparține numai acestui instrument didactic. Panoul Git este o simulare, fără legătură cu fișierele sau contul nostru.</p><p class="small">Fișierele descărcate funcționează fără internet. Pentru tipărirea tuturor explicațiilor și etapelor folosește textul pentru citire.</p></div>`;}
else if(which==='reference'){h=panelHead("Fișa comună")+S06REFERENCE+'</div>';}
else if(which==='tools'){const u=S06UI;h=panelHead("Instrumente de verificare")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="signed">${u.signedTitle}</button><button data-command="boundary">${u.boundaryTitle}</button><button data-command="integration">${u.integrationTitle}</button><button data-command="reference">Fișa comună</button></div><h2>Cronometru pentru exersare</h2><p>Cronometrul nu afișează răspunsuri, nu trece la altă temă și nu controlează timpul unui test Moodle.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4500">75 min</button><button data-command="timerPause">Pauză / continuă</button><button data-command="timerOff">Ascunde cronometrul</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S06UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S06UI.errors[err.code||err.message]||S06UI.unexpectedError;box.textContent=message;say(S06UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS06Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Timpul a expirat · ':timer.running?'Exercițiu · ':'Pauză · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('Browserul nu a permis afișarea pe ecran complet. Folosește comanda lui pentru ecran complet.');}}
function blank(){const open=$('blank').hidden;$('blank').hidden=!open;$('app').inert=open;if(open)$('blank').focus();else $('stage').focus({preventScroll:true});}
function command(cmd){if(cmd==='shortcuts'){state.shortcuts=!state.shortcuts;applyPrefs();openPanel('help');return;}if(cmd==='return'){go(state.index,{keep:true});return;}if(cmd==='reading'){mode();return;}if(cmd==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyPrefs();return;}if(cmd==='fullscreen'){fullscreen();return;}if(cmd==='blank'){blank();return;}if(cmd==='timerPause'){timerPause();return;}if(cmd==='timerOff'){timer.running=false;$('timerReadout').hidden=true;return;}openPanel(cmd);}
$('mapBtn').onclick=()=>openPanel('map');$('helpBtn').onclick=()=>openPanel('help');$('toolsBtn').onclick=()=>openPanel('tools');$('modeBtn').onclick=mode;$('fullBtn').onclick=fullscreen;$('smaller').onclick=()=>setScale(state.scale-5);$('larger').onclick=()=>setScale(state.scale+5);$('scaleInput').addEventListener('change',e=>setScale(e.target.value));$('scaleInput').addEventListener('keydown',e=>{if(e.key==='Enter'){setScale(e.target.value);$('stage').focus();}});$('prevBtn').onclick=()=>navigate(-1);$('nextBtn').onclick=()=>navigate(1);$('revealBtn').onclick=()=>reveal();$('blank').onclick=blank;
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.go!==undefined){go(Number(btn.dataset.go));return;}if(btn.dataset.action){const i=Number(btn.dataset.index);state.index=i;const a=btn.dataset.action;if(a==='reveal')reveal(i);else if(a==='hide')hide(i);else if(a==='back')back(i);else if(a==='all')fullWorking(i);else if(a==='theory'){scrollToNode($('topic-'+pages[i].id));updateNav();}return;}if(btn.dataset.scale!==undefined){setScale(btn.dataset.scale);const r=$('fontRange');if(r)r.value=state.scale;return;}if(btn.dataset.timer){startTimer(btn.dataset.timer);return;}if(btn.dataset.command)command(btn.dataset.command);});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!$('blank').hidden){if(['escape','b','enter',' '].includes(k)){e.preventDefault();blank();}return;}if(k==='escape'){e.preventDefault();if(state.panel)go(state.index,{keep:true});else{e.target.blur?.();$('stage').focus({preventScroll:true});}return;}if(e.altKey&&(k==='arrowright'||k==='arrowleft')){e.preventDefault();navigate(k==='arrowright'?1:-1);return;}if(e.ctrlKey||e.altKey||e.metaKey)return;if(!state.shortcuts&&['e','h','m','f','b','+','=','-','−'].includes(k))return;if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(k==='arrowright'||k==='pagedown'){e.preventDefault();if(!e.repeat)navigate(1);}else if(k==='arrowleft'||k==='pageup'){e.preventDefault();if(!e.repeat)navigate(-1);}else if(k==='e'){e.preventDefault();if(e.shiftKey)back();else reveal();}else if(k==='h'){e.preventDefault();if(!state.panel)hide();}else if(k==='m'){e.preventDefault();openPanel('map');}else if(k==='f'){e.preventDefault();fullscreen();}else if(k==='b'){e.preventDefault();blank();}else if(k==='+'||k==='='){e.preventDefault();setScale(state.scale+5);}else if(k==='-'||k==='−'){e.preventDefault();setScale(state.scale-5);}});
$('stage').addEventListener('scroll',()=>{if(!state.reading||state.panel||scrollGuard)return;clearTimeout(scrollTask);scrollTask=setTimeout(()=>{const r=$('stage').getBoundingClientRect();let chosen=state.index;for(let i=0;i<pages.length;i++){const a=$('topic-'+pages[i].id).getBoundingClientRect();if(a.top<=r.top+Math.min(120,r.height*.25)&&a.bottom>r.top+20)chosen=i;}if(chosen!==state.index){state.index=chosen;updateNav();}},80);});

const S06REFERENCE="<section id=\"format-reference\"><h2>Fișa comună de referință</h2><p>Aceasta păstrează integral conținutul fișei comune din proiectul v0.4.0. O folosim în practică și la Q06 conform regulilor comunicate în curs. Include și paritatea, pe care o vom implementa la S07. La Q06 închidem lecția extinsă, instrumentele și AI; păstrăm numai fișa permisă. Rezultatele de la prag sunt deja în această fișă: quizul verifică înțelegerea cu sprijinul anunțat.</p><section class=\"section\"><h2>Opt biţi de date</h2><p><strong>Intrare:</strong> întreg zecimal u între 0 şi 255 inclusiv. Spaţiile de la capete şi zerourile iniţiale sunt acceptate; golul, textul, numerele negative, fracţiile şi 256 sunt respinse.</p><p><strong>Binar:</strong> exact opt poziţii, cu ponderile 128, 64, 32, 16, 8, 4, 2 şi 1. <strong>Hexazecimal:</strong> exact două caractere, cu A–F majuscule; fiecare caracter descrie patru biţi, deoarece 16 = 2⁴. 255 = 15 × 16 + 15 → FF.</p><p><strong>Complement faţă de doi:</strong> s = u dacă u &lt; 128; s = u − 256 dacă u ≥ 128. Interval cu semn: −128…127. Biţii rămân aceiaşi; se schimbă interpretarea. Prima pondere devine −128.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișa comună de referință\"><table><caption>Fișa comună de referință</caption><thead><tr><th scope=\"col\">u</th><th scope=\"col\">Binar</th><th scope=\"col\">Hex</th><th scope=\"col\">s</th></tr></thead><tbody><tr><td>0</td><td>00000000</td><td>00</td><td>0</td></tr><tr><td>5</td><td>00000101</td><td>05</td><td>5</td></tr><tr><td>127</td><td>01111111</td><td>7F</td><td>127</td></tr><tr><td>128</td><td>10000000</td><td>80</td><td>−128</td></tr><tr><td>129</td><td>10000001</td><td>81</td><td>−127</td></tr><tr><td>255</td><td>11111111</td><td>FF</td><td>−1</td></tr></tbody></table></div></section><section class=\"section\"><h2>Bitul de paritate este separat</h2><p>k = numărul biţilor 1 din date. <strong>Paritate pară: p = k % 2.</strong> <strong>Paritate impară: p = 1 − (k % 2).</strong> Operatorul % dă restul împărţirii. p este 0 sau 1. Adăugat la dreapta: 8 biţi de date + p = un cuvânt de 9 biţi.</p><p>O schimbare de bit sau un număr impar de schimbări modifică paritatea. Un număr par o poate păstra. Paritatea simplă nu localizează şi nu corectează eroarea.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișa comună de referință\"><table><caption>Fișa comună de referință</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">k</th><th scope=\"col\">A: paritate pară</th><th scope=\"col\">B: paritate impară</th></tr></thead><tbody><tr><td>3 · 00000011</td><td>2</td><td>0</td><td>1</td></tr><tr><td>7 · 00000111</td><td>3</td><td>1</td><td>0</td></tr></tbody></table></div></section><section class=\"section\"><h2>Operaţiile Git şi rezultatul lor</h2><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișa comună de referință\"><table><caption>Fișa comună de referință</caption><thead><tr><th scope=\"col\">Operaţie</th><th scope=\"col\">Ce obţii</th></tr></thead><tbody><tr><td>Save</td><td>Fişier scris local.</td></tr><tr><td>Diff</td><td>Diferenţe între stările comparate. <code>git diff</code>: schimbări neselectate.</td></tr><tr><td>Stage</td><td>Conţinut selectat pentru următorul commit. <code>git diff --cached</code>: selecţia.</td></tr><tr><td>Commit</td><td>Versiune în istoricul local.</td></tr><tr><td>Push</td><td>Commituri trimise către repository-ul online.</td></tr><tr><td>Clone</td><td>Copie locală cu istoric şi legătură origin.</td></tr><tr><td>Issue</td><td>Problemă descrisă, cu paşi şi rezultate.</td></tr><tr><td>Branch</td><td>Linie separată de lucru.</td></tr><tr><td>Pull request</td><td>Schimbare explicată, propusă pentru integrare.</td></tr><tr><td>Merge + pull</td><td>Integrare online, apoi <code>git pull --ff-only</code> actualizează main local.</td></tr></tbody></table></div><p><code>origin</code> este numele legăturii către repository-ul online. <code>main</code> este ramura principală. <code>git status</code> arată starea; <code>git remote -v</code> arată adresa; <code>git branch --show-current</code> arată ramura; <code>git rev-parse HEAD</code> arată identificatorul complet. Starea locală curată nu dovedeşte singură publicarea. Dacă editezi după stage, schimbarea nouă trebuie selectată din nou ca să intre în commit.</p></section><section class=\"section\"><h2>Ce verifici şi ce poţi concluziona</h2><p><strong>Investigaţie:</strong> ipoteză proprie → afirmaţie Gemini/exemplu pregătit → test cu rezultat aşteptat → rezultat obţinut → concluzie. Un contraexemplu infirmă o afirmaţie universală. Testele la prag şi retestarea cazurilor deja corecte previn concluziile pripite.</p><p><strong>Reproducere:</strong> ultimul commit şi push → clonare separată → main şi acelaşi SHA complet → aplicaţie şi teste din copia nouă. SHA-ul final se copiază în Moodle după publicare.</p><p><strong>Evaluare:</strong> individual, fără AI/colegi; această fişă este permisă. Q05: 10 min, maximum 0,20 puncte; Q06: 10 min, maximum 0,30; Q07: 15 min, maximum 0,50. Total ≤ 1 punct. Tema finală este obligatorie, fără punctaj separat.</p></section></section>";

'use strict';

// Pure teaching helpers: no files, Git repositories, authentication or network.
// The 128-character limit belongs to these lesson tools, not the project parser.
function s06Error(code) {
  const error = new Error(code);
  error.code = code;
  throw error;
}

function parseByteInput(raw) {
  const input = String(raw);
  if (input.length > 128) s06Error('INPUT_TOO_LONG');
  const text = input.trim();
  if (!/^\d+$/.test(text)) s06Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s06Error('BYTE_RANGE');
  return value;
}

function signedRepresentation(raw) {
  const value = parseByteInput(raw);
  const bits = [128, 64, 32, 16, 8, 4, 2, 1].map(weight => Math.floor(value / weight) % 2);
  const unsignedWeights = [128, 64, 32, 16, 8, 4, 2, 1];
  const signedWeights = [-128, 64, 32, 16, 8, 4, 2, 1];
  return {
    value, binary: bits.join(''), unsigned: value,
    signed: bits.reduce((sum, bit, index) => sum + bit * signedWeights[index], 0),
    bitweights: bits.map((bit, index) => ({
      bit, unsignedWeight: unsignedWeights[index], signedWeight: signedWeights[index],
      unsignedTerm: bit * unsignedWeights[index], signedTerm: bit * signedWeights[index]
    }))
  };
}

function boundaryComparison(raw) {
  const representation = signedRepresentation(raw);
  const value = representation.value;
  const buggy = value > 128 ? value - 256 : value;
  const fixed = value >= 128 ? value - 256 : value;
  const expected = representation.signed;
  return {value, binary: representation.binary, buggy, fixed, expected,
    buggyPasses: buggy === expected, fixedPasses: fixed === expected,
    resultDifference: buggy !== fixed};
}

function createIntegrationState() {
  return {
    currentBranch: 'main', working: 'v0', index: 'v0',
    localMain: {id: 'c0', snapshot: 'v0'}, remoteMain: {id: 'c0', snapshot: 'v0'},
    fixHEAD: null, remoteFix: null, prStatus: 'none', prHead: null,
    history: [{id: 'c0', snapshot: 'v0', parents: []}],
    revision: 0, commitNumber: 0, lastAction: 'reset', changed: false
  };
}

function s06IntegrationState(state) {
  const snapshot = value => typeof value === 'string' && /^v\d+$/.test(value) &&
    Number.isSafeInteger(Number(value.slice(1))) && Number(value.slice(1)) <= state.revision;
  if (!state || typeof state !== 'object' || !['main', 'fix-signed8'].includes(state.currentBranch) ||
      !snapshot(state.working) || !snapshot(state.index) ||
      !Number.isSafeInteger(state.revision) || state.revision < 0 ||
      !Number.isSafeInteger(state.commitNumber) || state.commitNumber < 0 ||
      !['none', 'open', 'merged'].includes(state.prStatus) ||
      !Array.isArray(state.history) || state.history.length !== state.commitNumber + 1 ||
      !state.history.every((item, i) => item && item.id === 'c' + i && snapshot(item.snapshot) &&
        Array.isArray(item.parents) && new Set(item.parents).size === item.parents.length && item.parents.every(parent =>
          state.history.slice(0, i).some(earlier => earlier.id === parent)) &&
        (i === 0 ? item.parents.length === 0 && item.snapshot === 'v0' : item.parents.length >= 1 && item.parents.length <= 2))) {
    s06Error('INVALID_INTEGRATION_STATE');
  }
  const validRef = ref => ref && state.history.some(item => item.id === ref.id && item.snapshot === ref.snapshot);
  if (!validRef(state.localMain) || !validRef(state.remoteMain) ||
      (state.fixHEAD !== null && !validRef(state.fixHEAD)) ||
      (state.remoteFix !== null && !validRef(state.remoteFix)) ||
      (state.currentBranch === 'fix-signed8' && state.fixHEAD === null) ||
      (state.prStatus !== 'none' && (state.remoteFix === null || state.prHead !== state.remoteFix.id)) ||
      (state.prStatus === 'none' && state.prHead !== null) ||
      (state.prStatus === 'merged' && state.history.find(item => item.id === state.remoteMain.id).parents.length !== 2)) {
    s06Error('INVALID_INTEGRATION_STATE');
  }
  return state;
}

function integrationSummary(state) {
  const current = s06IntegrationState(state);
  const head = current.currentBranch === 'main' ? current.localMain : current.fixHEAD;
  const unstaged = current.working !== current.index;
  const staged = current.index !== head.snapshot;
  const mergeCommit = current.history.find(item => item.id === current.remoteMain.id);
  return {
    currentBranch: current.currentBranch, working: current.working, index: current.index,
    currentHEAD: {...head}, localMain: {...current.localMain}, remoteMain: {...current.remoteMain},
    fixHEAD: current.fixHEAD && {...current.fixHEAD}, remoteFix: current.remoteFix && {...current.remoteFix},
    prStatus: current.prStatus, prHead: current.prHead,
    unstaged, staged, workspaceClean: !unstaged && !staged,
    fixPublished: Boolean(current.fixHEAD && current.remoteFix && current.fixHEAD.id === current.remoteFix.id),
    mainUpdated: current.localMain.id === current.remoteMain.id,
    integratedRemotely: current.prStatus === 'merged',
    mergeParents: mergeCommit.parents.slice(),
    lastAction: current.lastAction, changed: current.changed, simulation: true
  };
}

function integrationStep(state, action) {
  const actions = ['branch', 'save', 'stage', 'commit', 'push', 'openPR', 'merge', 'switchMain', 'pull', 'reset'];
  if (!actions.includes(action)) s06Error('INVALID_INTEGRATION_ACTION');
  s06IntegrationState(state);
  if (action === 'reset') return createIntegrationState();
  const next = {
    ...state, localMain: {...state.localMain}, remoteMain: {...state.remoteMain},
    fixHEAD: state.fixHEAD && {...state.fixHEAD}, remoteFix: state.remoteFix && {...state.remoteFix},
    history: state.history.map(item => ({...item, parents: item.parents.slice()})),
    lastAction: action, changed: false
  };
  const summary = integrationSummary(state);
  const requireFix = () => {
    if (next.currentBranch !== 'fix-signed8') s06Error('FIX_BRANCH_REQUIRED');
  };
  const addCommit = (snapshot, parents) => {
    if (next.commitNumber >= Number.MAX_SAFE_INTEGER) s06Error('SIMULATION_LIMIT');
    const item = {id: 'c' + (++next.commitNumber), snapshot, parents};
    next.history.push(item);
    return {id: item.id, snapshot: item.snapshot};
  };
  if (action === 'branch') {
    if (next.currentBranch !== 'main' || next.fixHEAD !== null || next.prStatus !== 'none') s06Error('BRANCH_ALREADY_CREATED');
    next.fixHEAD = {...next.localMain};
    next.currentBranch = 'fix-signed8';
    // A new branch at the same commit preserves existing working/index notes.
    next.changed = true;
  } else if (action === 'save') {
    requireFix();
    if (next.prStatus === 'merged') s06Error('PR_ALREADY_MERGED');
    if (next.revision >= Number.MAX_SAFE_INTEGER) s06Error('SIMULATION_LIMIT');
    next.working = 'v' + (++next.revision);
    next.changed = true;
  } else if (action === 'stage') {
    requireFix();
    next.changed = next.index !== next.working;
    next.index = next.working;
  } else if (action === 'commit') {
    requireFix();
    if (next.prStatus === 'merged') s06Error('PR_ALREADY_MERGED');
    if (next.index !== next.fixHEAD.snapshot) {
      next.fixHEAD = addCommit(next.index, [next.fixHEAD.id]);
      next.changed = true;
    }
  } else if (action === 'push') {
    requireFix();
    if (next.prStatus === 'merged') s06Error('PR_ALREADY_MERGED');
    next.changed = !next.remoteFix || next.remoteFix.id !== next.fixHEAD.id;
    next.remoteFix = {...next.fixHEAD};
    if (next.prStatus === 'open') next.prHead = next.remoteFix.id;
  } else if (action === 'openPR') {
    if (next.prStatus !== 'none') s06Error('PR_ALREADY_EXISTS');
    if (!next.remoteFix || next.remoteFix.id === next.remoteMain.id) s06Error('PUBLISHED_CHANGE_REQUIRED');
    next.prStatus = 'open'; next.prHead = next.remoteFix.id; next.changed = true;
  } else if (action === 'merge') {
    if (next.prStatus !== 'open') s06Error('OPEN_PR_REQUIRED');
    // A GitHub merge changes the remote repository, not the local files.
    next.remoteMain = addCommit(next.remoteFix.snapshot, [next.remoteMain.id, next.remoteFix.id]);
    next.prStatus = 'merged'; next.changed = true;
  } else if (action === 'switchMain') {
    if (!summary.workspaceClean) s06Error('DIRTY_WORKSPACE');
    next.changed = next.currentBranch !== 'main';
    next.currentBranch = 'main';
    next.working = next.localMain.snapshot;
    next.index = next.localMain.snapshot;
  } else if (action === 'pull') {
    if (next.currentBranch !== 'main') s06Error('MAIN_BRANCH_REQUIRED');
    if (!summary.workspaceClean) s06Error('DIRTY_WORKSPACE');
    const ancestors = new Set();
    const visit = id => {
      if (ancestors.has(id)) return;
      ancestors.add(id);
      next.history.find(item => item.id === id).parents.forEach(visit);
    };
    visit(next.remoteMain.id);
    if (!ancestors.has(next.localMain.id)) s06Error('FAST_FORWARD_REQUIRED');
    next.changed = next.localMain.id !== next.remoteMain.id;
    next.localMain = {...next.remoteMain};
    next.working = next.localMain.snapshot;
    next.index = next.localMain.snapshot;
  }
  s06IntegrationState(next);
  return next;
}

 if(which==='signed'||which==='boundary'){const signed=which==='signed',prefix=signed?'signed':'boundary';return panelHead(signed?u.signedTitle:u.boundaryTitle)+`<p>${u.attempt}</p><form id="${prefix}Form"><div class="form-grid"><label>${u.decimal}<input id="${prefix}Value" value="${signed?'192':'128'}" maxlength="128" inputmode="numeric" autocomplete="off" spellcheck="false"></label><label>${u.prediction}<input id="${prefix}Prediction" value="" maxlength="20" inputmode="text" autocomplete="off" spellcheck="false" aria-required="true"></label></div>${s06FormButtons()}</form>${s06AnswerBox()}</div>`;}
