<script id="lessonData" type="application/json">{"title":"O ipoteză, un test și o remediere explicată","version":"1.0.0","language":"ro","duration_seconds":4500,"quiz_separate_minutes":10,"font_min":20,"font_max":200,"pages":[{"id":"start","start":0,"end":180,"title":"O explicație devine utilă când o putem verifica","chapter":"01 · Reluăm proiectul S05","rule":"În S06 investighezi o interpretare greșită a unui octet. Scrii întâi ce crezi că o provoacă, consulți Gemini sau exemplul pregătit, verifici o afirmație și păstrezi remedierea în proiectul tău.","method":["S05 ne-a lăsat o funcție completată și o versiune publicată. Acum continuăm aceeași clonă; nu începem din nou de la starter.","Interpretarea cu semn leagă noțiunile BTI de investigarea unui program: rezultatul așteptat vine din definiție, iar rezultatul obținut vine din rulare.","După ce uiți comenzile, păstrează întrebările: ce trebuia să se întâmple, ce am observat, ce explicații sunt posibile și ce test le deosebește?"],"steps":[{"title":"Cazul pe care îl investigăm","html":"<p class=\"explain\">Aplicația arată aceiași opt biți în mai multe moduri. Interpretarea cu semn conține un defect didactic declarat. Nu tratăm fiecare rezultat afișat ca pe o regulă corectă; îl comparăm cu definiția. Hexazecimalul tău din S05 rămâne în proiect.<\/p>"},{"title":"Ce vei putea explica la final","html":"<p class=\"explain\">Vei putea justifica interpretarea cu semn, reproduce problema la prag, arăta un test care infirmă o afirmație prea largă și explica unde există schimbarea după commit, push, merge și pull. Nu este suficient să ai o linie de cod corectă dacă nu poți arăta de ce.<\/p>"},{"title":"Unde păstrezi lucrul","html":"<p class=\"explain\">Editezi fișierele din clona proprie în VS Code, rulezi aplicația și testele din acea clonă în browser și folosești propriul repository GitHub pentru issue și pull request. Păstrezi câteva rânduri în <code>PROJECT/evidence.md<\/code>; nu depui un assignment Moodle suplimentar pentru S06.<\/p>"},{"title":"Cele 90 de minute","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Traseul S06\"><table><caption>Traseul S06<\/caption><thead><tr><th scope=\"col\">Interval<\/th><th scope=\"col\">Activitate<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">0–75 min<\/th><td>Investigație, test, remediere și integrare în propria copie<\/td><\/tr><tr><th scope=\"row\">75–85 min<\/th><td>Q06 individual, maximum 0,30 puncte reale<\/td><\/tr><tr><th scope=\"row\">85–90 min<\/th><td>Concluzie și completarea confirmărilor observate; commit/push scurt dacă notele s-au schimbat<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Ipoteza inițială poate fi greșită. O păstrezi și explici ce observație te-a făcut să o revizuiești. Q06 are propria evaluare; quizul nu certifică singur că repository-ul este complet.<\/p>"}],"connection":"Pornim de la o copie identificată și de la comportamentul corect din S05.","mistake":"Nu înlocui proiectul propriu cu o copie de soluție. Avem nevoie de legătura dintre observațiile tale și schimbarea ta.","prompt":"Arată traseul de lucru"},{"id":"resume","start":180,"end":480,"title":"Regăsești clona, ramura și punctul de pornire","chapter":"01 · Reluăm proiectul S05","rule":"Folderul, origin și ramura sunt trei informații diferite. Le verifici înainte de a rula sau modifica proiectul, ca să nu testezi o copie și să publici alta.","method":["Folosești fișa de reluare S05 din evidence.md. Dacă folderul nu mai există, clonezi din nou propriul repository publicat; nu creezi alt repository din template.","Actualizezi main doar după ce ai citit starea și ai păstrat orice modificare utilă. Un pull pe o stare neclară nu rezolvă identificarea copiei.","Rulezi întâi S05, apoi S06. Astfel separi o problemă de reluare de defectul nou pe care vrem să îl investigăm."],"steps":[{"title":"Deschide copia indicată în evidence.md","html":"<p class=\"explain\">În VS Code folosește <strong>File → Open Folder<\/strong> și alege folderul din fișa S05. În Explorer trebuie să vezi direct <code>PROJECT<\/code>, <code>GUIDES<\/code> și <code>START.html<\/code>. Deschide <code>PROJECT/evidence.md<\/code> și citește repository-ul, ramura și prima verificare notate atunci.<\/p>"},{"title":"Identifică starea înainte de pull","html":"<p class=\"explain\"><strong>Unde se copiază: terminalul VS Code, deschis în rădăcina repository-ului.<\/strong><\/p><pre><code>git status\ngit remote -v\ngit branch --show-current<\/code><\/pre><p class=\"explain\">Recunoști propria adresă la <code>origin<\/code> și ramura <code>main<\/code>. Dacă sunt modificări neînregistrate, citește diferențele. Păstrează lucrul util printr-un commit justificat sau clarifică-l cu noi înainte de schimbarea ramurii. Nu șterge fișiere doar pentru a obține o stare curată.<\/p>"},{"title":"Actualizează numai după verificarea stării","html":"<p class=\"explain\"><strong>Unde se copiază: terminalul VS Code, după ce modificările utile au fost păstrate și starea este clară.<\/strong><\/p><pre><code>git switch main\ngit pull --ff-only\ngit status<\/code><\/pre><p class=\"explain\">„Already up to date” este normal. <code>--ff-only<\/code> refuză actualizarea dacă istoricul nu poate avansa direct. Păstrează mesajul și clarifică situația; nu folosi force push sau reset pentru a ascunde diferența. Acest pull preia din copia ta online, nu aduce automat schimbările ulterioare ale template-ului comun.<\/p>"},{"title":"Confirmă că S05 este punctul de pornire","html":"<p class=\"explain\">Din File Explorer sau Finder deschide <code>PROJECT/tests.html<\/code> din această clonă. Reîncarcă pagina, selectează <strong>S05 · Hexazecimal<\/strong> și apasă <strong>Rulează testele<\/strong>. Cu lista furnizată și fără teste suplimentare ai <strong>31 trecute, 0 eșuate, 0 neimplementate<\/strong>. Dacă rezultatul diferă, citește primul test; nu presupune încă defectul S06.<\/p>"},{"title":"Când reluarea este blocată","html":"<p class=\"explain\">Dacă lipsesc hexazecimalul publicat, autentificarea sau folderul, păstrează starea reală și anunță blocajul concret. Nu amesteca un ZIP nou al starterului cu clona S05. Identitatea autorului Git este separată de autentificarea GitHub. Ritmul planificat presupune pregătirea acestor lucruri înaintea seminarului.<\/p>"}],"connection":"Avem o versiune cunoscută; calculăm acum interpretarea cu semn.","mistake":"Un tab vechi de browser poate rula cod vechi. Verifică folderul și reîncarcă, nu numai numele proiectului din tab.","prompt":"Arată verificările de reluare"},{"id":"signed-rule","start":480,"end":720,"title":"Aceiași biți, alte ponderi","chapter":"02 · Definiția înaintea programului","rule":"Pentru un octet în complement față de doi, primul bit are ponderea −128, iar celelalte ponderi sunt 64, 32, 16, 8, 4, 2 și 1. Biții nu se schimbă când schimbăm interpretarea.","method":["Intrarea aplicației rămâne un întreg zecimal fără semn, de la 0 la 255. Rezultatul cu semn este o interpretare a acelor opt biți, nu altă intrare cerută utilizatorului.","Calculăm așteptarea fără să întrebăm programul. Așa putem recunoaște și un rezultat afișat greșit.","Regula pe cazuri este utilă în cod; ponderile explică de ce regula este corectă."],"steps":[{"title":"Compară ponderile celor opt poziții","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ponderile unui octet, de la stânga la dreapta\"><table><caption>Ponderile unui octet, de la stânga la dreapta<\/caption><thead><tr><th scope=\"col\">Interpretare<\/th><th scope=\"col\">b7<\/th><th scope=\"col\">b6<\/th><th scope=\"col\">b5<\/th><th scope=\"col\">b4<\/th><th scope=\"col\">b3<\/th><th scope=\"col\">b2<\/th><th scope=\"col\">b1<\/th><th scope=\"col\">b0<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Fără semn<\/th><td>128<\/td><td>64<\/td><td>32<\/td><td>16<\/td><td>8<\/td><td>4<\/td><td>2<\/td><td>1<\/td><\/tr><tr><th scope=\"row\">Cu semn<\/th><td>-128<\/td><td>64<\/td><td>32<\/td><td>16<\/td><td>8<\/td><td>4<\/td><td>2<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Fiecare pondere se adună numai dacă bitul de pe acea poziție este 1. Schimbarea de pondere a lui b7 face diferența.<\/p>"},{"title":"Un caz din fiecare jumătate","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Două exemple calculate din ponderi\"><table><caption>Două exemple calculate din ponderi<\/caption><thead><tr><th scope=\"col\">u<\/th><th scope=\"col\">Biți<\/th><th scope=\"col\">Fără semn<\/th><th scope=\"col\">Cu semn<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">64<\/th><td>01000000<\/td><td>64<\/td><td>64<\/td><\/tr><tr><th scope=\"row\">192<\/th><td>11000000<\/td><td>128 + 64 = 192<\/td><td>−128 + 64 = −64<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">La 192 păstrezi șirul <code>11000000<\/code>. Nu îl rescrii pentru a produce −64; citești aceiași biți cu alte ponderi.<\/p>"},{"title":"De unde vine scăderea lui 256","html":"<p class=\"explain\">Când primul bit este 1, contribuția lui trece de la +128 la −128. Diferența este <code>−128 − 128 = −256<\/code>. Prin urmare scazi 256 din valoarea fără semn. Când primul bit este 0, contribuția lui rămâne zero și valoarea nu se schimbă.<\/p>"},{"title":"Regula și domeniul rezultatului","html":"<p class=\"explain\"><strong>Regula:<\/strong> <code>s = u<\/code> pentru <code>0 ≤ u &lt; 128<\/code>; <code>s = u − 256<\/code> pentru <code>128 ≤ u ≤ 255<\/code>. Rezultatul cu semn aparține intervalului <code>−128…127<\/code>. Funcția primește un număr deja validat; nu relaxăm validarea ca să rezolvăm interpretarea.<\/p>"}],"connection":"Aplică regula înainte să vezi rezultatele programului.","mistake":"Complementul față de doi descrie o interpretare pe un număr fix de biți. Nu înseamnă că orice număr afișat după o conversie este automat corect.","prompt":"Arată ponderile și regula"},{"id":"signed-prediction","start":720,"end":900,"title":"Predicția ta pentru prag și vecini","chapter":"02 · Definiția înaintea programului","rule":"Scrie rezultatele așteptate înainte de rulare. Ai nevoie de o referință independentă pentru a decide dacă un rezultat este corect.","method":["Calculezi pentru 0, 127, 128, 129 și 255. Primele și ultimele valori nu înlocuiesc verificarea locului unde regula schimbă cazul.","Separi șirul binar de numărul cu semn. Același test poate compara două rezultate și poate localiza mai bine problema.","Păstrezi predicția chiar dacă o corectezi ulterior; diferența față de observație explică investigația."],"steps":[{"title":"Încearcă înainte să deschizi răspunsul","html":"<p class=\"explain\">În secțiunea S06 din <code>PROJECT/evidence.md<\/code> scrie pentru <strong>0, 127, 128, 129 și 255<\/strong> șirul de opt biți și interpretarea cu semn așteptată. Folosește ponderile sau regula pe cazuri. Încă nu introduce valorile în aplicație. Întreabă-te: pentru care intrare se schimbă cazul?<\/p>"},{"title":"Compară cu rezultatele deduse","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Predicțiile S06 din definiție\"><table><caption>Predicțiile S06 din definiție<\/caption><thead><tr><th scope=\"col\">u<\/th><th scope=\"col\">Biți<\/th><th scope=\"col\">Calcul cu semn<\/th><th scope=\"col\">s<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">0<\/th><td>00000000<\/td><td>0<\/td><td>0<\/td><\/tr><tr><th scope=\"row\">127<\/th><td>01111111<\/td><td>64 + 32 + 16 + 8 + 4 + 2 + 1<\/td><td>127<\/td><\/tr><tr><th scope=\"row\">128<\/th><td>10000000<\/td><td>−128<\/td><td>-128<\/td><\/tr><tr><th scope=\"row\">129<\/th><td>10000001<\/td><td>−128 + 1<\/td><td>-127<\/td><\/tr><tr><th scope=\"row\">255<\/th><td>11111111<\/td><td>−128 + 127<\/td><td>-1<\/td><\/tr><\/tbody><\/table><\/div>"},{"title":"La prag se schimbă interpretarea","html":"<p class=\"explain\">Din 127 în 128 treci de la <code>01111111<\/code> la <code>10000000<\/code>. Valoarea fără semn crește cu 1, dar interpretarea cu semn trece din 127 în −128. Acesta este locul unde cele două cazuri ale definiției se întâlnesc. Nu ai modificat programul ca să obții această așteptare.<\/p>"},{"title":"Un rând de notițe, nu un document nou","html":"<p class=\"explain\"><strong>Unde se copiază: PROJECT/evidence.md, secțiunea RO · S06; completează cu propriul calcul.<\/strong><\/p><pre><code>Predicție înainte de rulare: u = [valoare]; binar = [opt biți]; cu semn = [număr].\nJustificare din definiție: [ponderi / cazul aplicabil].\nRezultat observat după rulare: [completez ulterior].<\/code><\/pre><p class=\"explain\">Poți scrie lista pe un singur rând pentru cele cinci intrări. Nu înlocui „așteptat” cu rezultatul aplicației când nu coincid.<\/p>"}],"connection":"Rulăm aceleași intrări și citim diferența, fără să edităm codul.","mistake":"Un rezultat așteptat copiat după rulare nu mai este o predicție. Notează momentul și păstrează calculul inițial.","prompt":"Arată verificarea după încercarea mea","answer_after_attempt":true},{"id":"reproduce","start":900,"end":1080,"title":"Reproduci defectul înainte să îl repari","chapter":"03 · Observație și ipoteză","rule":"Un defect este reproductibil când putem preciza copia, intrarea, rezultatul așteptat și rezultatul obținut. Nu modificăm codul în timp ce stabilim această observație.","method":["Folosești aplicația din clona S05, nu fișierul din arhiva lecției și nu altă copie cu același nume.","Nu confundăm o afișare binară corectă cu o interpretare cu semn corectă. Verificăm fiecare rezultat față de predicția lui.","Testele S06 sunt cumulative. Două verificări eșuate pot descrie aceeași intrare defectă."],"steps":[{"title":"Deschide aplicația locală din copia proprie","html":"<p class=\"explain\">Din File Explorer sau Finder deschide <code>PROJECT/index.html<\/code> în browser și reîncarcă pagina. Alege limba grupei la <strong>Limba / Language<\/strong>. Introdu pe rând 0, 127, 128, 129 și 255 în câmpul zecimal. Rezultatele se actualizează la schimbarea intrării; aplicația nu are buton Run.<\/p>"},{"title":"Compară rezultatele separat","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Observația din proiectul S05 înaintea remedierii S06\"><table><caption>Observația din proiectul S05 înaintea remedierii S06<\/caption><thead><tr><th scope=\"col\">u<\/th><th scope=\"col\">Binar obținut<\/th><th scope=\"col\">Cu semn așteptat<\/th><th scope=\"col\">Cu semn obținut<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">0<\/th><td>00000000<\/td><td>0<\/td><td>0<\/td><\/tr><tr><th scope=\"row\">127<\/th><td>01111111<\/td><td>127<\/td><td>127<\/td><\/tr><tr><th scope=\"row\">128<\/th><td>10000000<\/td><td>-128<\/td><td>128<\/td><\/tr><tr><th scope=\"row\">129<\/th><td>10000001<\/td><td>-127<\/td><td>-127<\/td><\/tr><tr><th scope=\"row\">255<\/th><td>11111111<\/td><td>-1<\/td><td>-1<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Pentru 128, câmpul <strong>Binar · exact opt biți<\/strong> este corect, iar <strong>Cu semn · complement față de doi<\/strong> nu coincide cu definiția. Ai observat două rezultate diferite ale aceleiași rulări.<\/p>"},{"title":"Rulează etapa S06","html":"<p class=\"explain\">În celălalt tab deschide <code>PROJECT/tests.html<\/code> din aceeași clonă, reîncarcă, selectează <strong>S06 · Interpretare cu semn<\/strong> și apasă <strong>Rulează testele<\/strong>. Cu S05 completat și lista furnizată, înainte de noul test propriu, aștepți <strong>34 trecute / 2 eșuate / 0 neimplementate<\/strong>. Citește rândul pentru 128 și rândul pentru toate cele 256 de valori.<\/p>"},{"title":"Ce spun cele două eșecuri","html":"<p class=\"explain\">Un rând verifică individual 128. Alt rând verifică întregul domeniu și raportează <code>255/256; 128: 128 / -128<\/code>. Ele indică aceeași intrare defectă, nu două cauze independente. Notează observația în <code>evidence.md<\/code> și păstrează testele neschimbate. Paritatea este pentru S07 și nu intră în această etapă.<\/p>"}],"connection":"Observația este stabilită; scrii propria explicație înainte de asistență.","mistake":"Nu corecta expected în tests.js ca să dispară eșecul. Rezultatul așteptat vine din definiție, nu din codul defect.","prompt":"Arată pașii de reproducere"},{"id":"hypothesis","start":1080,"end":1320,"title":"Ipoteza ta și o observație care ar putea să o infirme","chapter":"03 · Observație și ipoteză","rule":"Ipoteza este o explicație posibilă, nu un rezultat deja demonstrat. O formulăm astfel încât să putem spune ce observație ar susține-o și ce observație ar contrazice-o.","method":["Scrii înainte să consulți Gemini și înainte să inspectezi linia de remediat. Altfel ai reformula soluția în loc să păstrezi gândirea inițială.","Este acceptabil să presupui greșit dacă păstrezi ipoteza și justifici revizuirea. Nu inventezi o ipoteză „perfectă” după ce ai văzut cauza.","Distingi observația — ce s-a afișat — de cauza propusă. O singură observație poate avea mai multe explicații posibile."],"steps":[{"title":"Scrie fără să deschizi exemplele","html":"<p class=\"explain\">În rubrica <strong>Ipoteza mea înainte să consult Gemini<\/strong> din <code>PROJECT/evidence.md<\/code> scrie una sau două propoziții: „Bănuiesc că … deoarece am observat …”. Adaugă ce ai verifica pentru a putea greși: „Ipoteza ar fi contrazisă dacă …”. Nu deschide încă <code>asSigned8<\/code> și nu cere soluția.<\/p>"},{"title":"Două explicații posibile, nu răspunsuri de copiat","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Exemple de ipoteze după încercarea proprie\"><table><caption>Exemple de ipoteze după încercarea proprie<\/caption><thead><tr><th scope=\"col\">Explicație posibilă<\/th><th scope=\"col\">Predicție observabilă<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Afișarea binară pierde primul bit la 128.<\/th><td>Șirul afișat pentru 128 va fi diferit de 10000000.<\/td><\/tr><tr><th scope=\"row\">Alegerea cazului cu semn tratează greșit exact pragul.<\/th><td>Șirul poate rămâne corect, dar rezultatul cu semn poate fi greșit numai la prag.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Aceste exemple sunt pentru comparație. Păstrează ce ai scris tu înainte; nu înlocui ipoteza cu una care sună mai bine.<\/p>"},{"title":"Folosește observația deja obținută","html":"<p class=\"explain\">Ai observat <code>10000000<\/code> pentru 128. Această probă contrazice explicația precisă „afișarea pierde primul bit la 128”. Nu dovedește că orice cod de afișare este corect în orice situație. Este compatibilă cu o problemă în interpretarea cu semn, dar nu a identificat încă linia defectă.<\/p>"},{"title":"Păstrează ipoteza și revizuirea separat","html":"<p class=\"explain\"><strong>Unde se copiază: PROJECT/evidence.md, secțiunea S06; completează pe scurt.<\/strong><\/p><pre><code>Ipoteza mea înainte de consultare: ...\nObservația care ar contrazice-o: ...\nCe știu din rularea de până acum: ...\nCe rămâne de verificat: ...<\/code><\/pre><p class=\"explain\">Nu avem o penalizare practică separată pentru o ipoteză inițială greșită. Cerința este să putem urmări de ce ai păstrat sau ai schimbat explicația.<\/p>"}],"connection":"Issue-ul păstrează problema și ipoteza înainte de remediere.","mistake":"„AI spune că…” nu este o ipoteză proprie scrisă înainte de consultare. Păstrează ordinea reală a activității.","prompt":"Arată exemplele după ipoteza mea","answer_after_attempt":true},{"id":"issue","start":1320,"end":1680,"title":"Issue: de ce este necesară o schimbare","chapter":"03 · Observație și ipoteză","rule":"Un issue descrie problema, reproducerea și ce știm deocamdată. Nu modifică fișierele proiectului și nu înseamnă că remedierea există deja.","method":["Păstrăm legătura dintre comportamentul greșit și schimbarea de mai târziu. Titlul singur nu permite reproducerea.","Lucrăm în repository-ul propriu. Nu trimitem issue sau PR către template-ul comun pentru acest exercițiu.","Păstrăm incertitudinea: ipoteza este inițială, iar concluzia finală se completează după verificare."],"steps":[{"title":"Deschide Issues în repository-ul tău","html":"<p class=\"explain\">În browser deschide URL-ul propriu din <code>evidence.md<\/code>. Verifică proprietarul din adresă. Alege <strong>Issues → New issue<\/strong>; dacă apare o listă de formulare, folosește varianta generală sau disponibilă în copia ta. Titlu posibil: <strong>Interpretarea cu semn la pragul unui octet<\/strong>.<\/p>"},{"title":"Completează descrierea cu observațiile tale","html":"<p class=\"explain\"><strong>Unde se copiază: descrierea noului issue pe GitHub; înlocuiește rubricile înainte de publicare.<\/strong><\/p><pre><code>Problemă: intrare [u]; așteptat [s]; obținut [rezultat].\nReproducere: PROJECT/index.html din clona S05; introduc [u].\nBinar observat: [șirul de opt biți].\nIpoteza inițială, înainte de consultare: [ipoteza mea].\nTest care ar putea să o infirme: [intrare, rezultat urmărit].\nConcluzie deocamdată: [ce este stabilit și ce rămâne incert].<\/code><\/pre>"},{"title":"Publică și păstrează adresa issue-ului","html":"<p class=\"explain\">Trimite issue-ul cu butonul disponibil în formular, apoi verifică titlul și repository-ul. Copiază URL-ul paginii rezultate în rubrica <strong>URL issue<\/strong> din <code>PROJECT/evidence.md<\/code>. Păstrează ipoteza în forma inițială. O concluzie nouă poate fi adăugată ulterior fără să pretinzi că era cunoscută de la început.<\/p>"},{"title":"Dacă Issues lipsește","html":"<p class=\"explain\">Verifică întâi că ești în copia ta. Proprietarul poate avea opțiunea <strong>Settings → General → Features → Issues<\/strong>. Dacă setările sau politica o blochează, păstrează același text în <code>evidence.md<\/code>, notează „issue încă nepublicat” și anunță blocajul. Poți continua investigația cu acea înregistrare; nu inventa un URL și nu declara pasul încheiat.<\/p>"}],"connection":"Avem propria ipoteză înregistrată; acum cerem sau citim o explicație.","mistake":"Issue-ul descrie de ce schimbăm ceva. Commitul va păstra ce am schimbat; sunt funcții diferite.","prompt":"Arată pașii pentru issue"},{"id":"gemini","start":1680,"end":1980,"title":"Gemini sau exemplul pregătit: aceeași investigație","chapter":"04 · O afirmație verificată","rule":"În S06 investigarea unei explicații asistate este cerută. Poți folosi accesul Gemini disponibil fără abonament plătit sau un exemplu didactic pregătit; în ambele cazuri verifici tu afirmația.","method":["Sursa răspunsului se notează corect. Exemplul pregătit nu este o conversație reală Gemini și nu se prezintă ca atare.","Cerem întrebări și teste, nu o soluție de copiat înainte de investigație. Dacă răspunsul oferă cod imediat, nu sărim peste afirmație și test.","Nu consumăm intervalul creând conturi sau așteptând o limită. Alternativa pregătită are aceeași cerință și nu aduce o penalizare."],"steps":[{"title":"Verifică ordinea înainte de consultare","html":"<p class=\"explain\">Ai păstrat în <code>evidence.md<\/code> ipoteza proprie și așteptarea din definiție? Dacă nu, oprește-te și scrie-le acum. Alege apoi Gemini în browser sau exemplul pregătit. Pentru fiecare cale vei selecta o afirmație, vei prezice un rezultat, vei rula testul și vei scrie o concluzie. Nu ai nevoie de transcript sau capturi.<\/p>"},{"title":"Promptul principal, dacă ai acces","html":"<p class=\"explain\"><strong>Unde se copiază: câmpul de prompt Gemini, după completarea rubricilor.<\/strong><\/p><pre><code>Investighez interpretarea unui octet fără semn în complement față de doi pe 8 biți.\nIpoteza mea înainte de consultare: [ipoteza].\nPentru 127, 128, 129 și 255 aștept [rezultate] și observ [rezultate].\nNu da încă un cod de înlocuire. Propune două explicații posibile și un test care le deosebește.\nSepară șirul binar de interpretarea cu semn și definiția de presupunerile despre implementare.<\/code><\/pre><p class=\"explain\">Deschide <a href=\"https://gemini.google.com/\" target=\"_blank\" rel=\"noopener\">Gemini în browser<\/a> cu accesul disponibil. Nu presupunem un model, un număr garantat de prompturi sau acces automat prin adresa ASE. Dacă accesul nu funcționează, folosește exemplul de mai jos.<\/p>"},{"title":"Alternativa pregătită: explicație de investigat","html":"<p class=\"explain\"><strong>Text didactic pregătit pentru lecție; nu este un citat dintr-o conversație Gemini.<\/strong> Citește-l după ipoteza proprie:<\/p><p class=\"explain\">„Șirul de opt biți și interpretarea cu semn sunt rezultate diferite. Compară 127, 128 și 129, urmărind separat șirul și numărul. Dacă șirul este corect, dar valoarea cu semn nu este, verifică alegerea cazului din regula cu semn. Observațiile sugerează unde să cauți; remedierea trebuie încă verificată în cod și prin teste.”<\/p><p class=\"explain\">Alege o afirmație din acest text. Continuă cu propria predicție și propria rulare; exemplul nu a rulat proiectul tău.<\/p>"},{"title":"Alternativa pregătită: o generalizare de contestat","html":"<p class=\"explain\"><strong>Al doilea text didactic, tot fără atribuire unui răspuns real Gemini:<\/strong> „Funcția dă rezultatele cu semn corecte pentru 0 și 255, deci funcționează pentru toate valorile unui octet. Dacă o altă valoare pare greșită, verifică mai întâi afișarea binară.”<\/p><p class=\"explain\">Poți alege această afirmație în locul primeia. Nu accepta concluzia universală doar pentru că ai două exemple favorabile. Pagina următoare te ajută să formulezi un test precis înainte de rulare.<\/p>"},{"title":"Un prompt suplimentar, numai dacă este util","html":"<p class=\"explain\"><strong>Unde se copiază: Gemini, ca întrebare opțională după primul răspuns.<\/strong><\/p><pre><code>Afirmația precisă aleasă este: [afirmația].\nAm verificat: [intrări și rezultate].\nCe contraexemplu ar putea să o infirme? Propune un test și justifică așteptarea din definiție.\nSpune ce nu putem concluziona numai din aceste exemple.<\/code><\/pre><p class=\"explain\">Un singur răspuns util și o afirmație verificată sunt suficiente. În <code>evidence.md<\/code> notează sincer <strong>Gemini<\/strong> sau <strong>exemplu pregătit din ghid<\/strong>. Nu cumpăra acces pentru acest pas.<\/p>"}],"connection":"Transformăm o propoziție din răspuns într-o afirmație verificabilă.","mistake":"O explicație nu este dovada unei rulări. Sursa răspunsului nu poate înlocui observația din copia ta.","prompt":"Arată prompturile și alternativa după ipoteza mea","answer_after_attempt":true},{"id":"claim","start":1980,"end":2280,"title":"Alege o afirmație suficient de precisă","chapter":"04 · O afirmație verificată","rule":"O afirmație verificabilă precizează ce ar trebui să observăm. „Răspunsul este bun” sau „programul are o problemă” nu sunt destul de precise pentru testul de azi.","method":["Alegi o singură afirmație din răspunsul Gemini sau din exemplul pregătit. Nu ai de rezumat întreaga conversație.","Stabilești așteptarea din definiție înainte să rulezi. Înregistrarea trebuie să permită compararea așteptat–obținut.","O concluzie limitată la probe este mai corectă decât „AI a avut dreptate” fără precizarea afirmației."],"steps":[{"title":"Alege înainte de exemplele rezolvate","html":"<p class=\"explain\">Selectează din răspunsul consultat o propoziție precisă. În <code>evidence.md<\/code> scrie sursa, afirmația, intrarea pe care o vei folosi și ce rezultat ar susține-o sau ar contrazice-o. Așteptarea ta trebuie justificată din definiție. Nu deschide încă explicația testului de pe această pagină.<\/p>"},{"title":"Exemplu: separarea celor două rezultate","html":"<p class=\"explain\">Afirmație posibilă: <strong>„La aceeași intrare, șirul binar poate fi corect, iar interpretarea cu semn greșită.”<\/strong> Pentru proiectul de față alegi 128 și verifici ambele ieșiri. Aștepți din definiție <code>10000000<\/code> și <code>−128<\/code>. Înainte de remediere observi <code>10000000<\/code> și <code>128<\/code>. Această rulare arată chiar separarea afirmată.<\/p>"},{"title":"Exemplu: afirmația despre toate valorile","html":"<p class=\"explain\">Afirmație posibilă: <strong>„Dacă 0 și 255 sunt corecte, funcția este corectă pentru toate intrările.”<\/strong> Aceasta se referă la 256 de intrări. Un singur contraexemplu o infirmă: la 128 aștepți −128 și observi 128. Două exemple corecte nu justifică restul intervalului.<\/p>"},{"title":"Concluzia și limita ei","html":"<p class=\"explain\"><strong>Unde se copiază: PROJECT/evidence.md, câmpurile S06 pentru afirmație, predicție, test și concluzie.<\/strong><\/p><pre><code>Sursa: [Gemini / exemplu pregătit].\nAfirmația: [o singură propoziție].\nÎnainte de rulare aștept: [intrare, ieșire și justificare].\nDupă rulare observ: [rezultatul real].\nConcluzie: [susținută / contrazisă / încă incertă], deoarece [...].\nAcest test nu dovedește: [...].<\/code><\/pre><p class=\"explain\">Un caz poate susține afirmația precisă despre acel caz. Nu certifică automat toate funcțiile, toate intrările sau remedierea încă nerealizată. Dacă afirmația rămâne ambiguă, reformuleaz-o înainte de test.<\/p>"}],"connection":"Verificăm că testul ales poate într-adevăr deosebi explicațiile.","mistake":"Nu scrie „test trecut” numai pentru că afirmația descrie ce ai observat. Compară separat corectitudinea programului și corectitudinea afirmației despre program.","prompt":"Arată exemplele după afirmația mea","answer_after_attempt":true},{"id":"discriminating-test","start":2280,"end":2520,"title":"Un test care deosebește două explicații","chapter":"04 · O afirmație verificată","rule":"Dacă două explicații prezic același rezultat pentru testul ales, acel test nu le deosebește. Caută o intrare sau o observație pentru care predicțiile diferă.","method":["Pragul și vecinii lui sunt mai informativi decât repetarea unui exemplu favorabil.","Alege ieșirea urmărită: binarul, interpretarea cu semn sau ambele. „Verific 128” fără a spune ce citești este incomplet.","Un test infirmă o predicție precisă, dar nu identifică automat o anumită linie de cod."],"steps":[{"title":"Propune testul înainte de matricea de exemple","html":"<p class=\"explain\">Folosește două explicații posibile din investigația ta. Scrie pentru același test ce ar prezice fiecare. Dacă predicțiile sunt identice, schimbă intrarea sau urmărește și o altă ieșire. Notează de ce testul ar putea să le deosebească, apoi rulează din copia ta.<\/p>"},{"title":"Matricea unui exemplu la 128","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Predicții diferite pentru aceeași intrare\"><table><caption>Predicții diferite pentru aceeași intrare<\/caption><thead><tr><th scope=\"col\">Explicație<\/th><th scope=\"col\">Binar la 128<\/th><th scope=\"col\">Cu semn la 128<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Afișarea pierde primul bit.<\/th><td>Diferit de 10000000.<\/td><td>Numărul afișat, singur, nu identifică afișarea binară.<\/td><\/tr><tr><th scope=\"row\">Interpretarea exclude pragul din cazul negativ.<\/th><td>Poate rămâne 10000000.<\/td><td>Poate rămâne 128 în loc de −128.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Observația <code>10000000<\/code> contrazice prima predicție precisă. Rezultatul cu semn greșit este compatibil cu a doua explicație; pentru cauza exactă urmează inspecția implementării.<\/p>"},{"title":"De ce verifici și 127, 129","html":"<p class=\"explain\">127 trebuie să rămână 127, iar 129 trebuie să fie −127. Dacă numai 128 este greșit, problema este compatibilă cu o excludere a egalității la prag. Dacă toate valorile din jumătatea superioară ar fi greșite, ai căuta o problemă mai largă. Tiparul observațiilor restrânge explicațiile; nu le înlocuiește cu certitudine automată.<\/p>"},{"title":"Rulează și păstrează concluzia reală","html":"<p class=\"explain\">Reîncarcă <code>PROJECT/index.html<\/code>, introdu valorile alese și citește ieșirile indicate în testul tău. Completează în <code>evidence.md<\/code> intrarea, așteptat, obținut și explicația păstrată sau revizuită. Poți reutiliza o observație deja înregistrată, dar spune că provine din acea rulare; nu pretinde o rulare nouă.<\/p>"}],"connection":"Păstrăm cazul-limită într-un test care va rula din nou după remediere.","mistake":"Nu deduce „toată afișarea este corectă” dintr-un singur șir corect. Concluzia trebuie să păstreze domeniul testului.","prompt":"Arată analiza după testul meu propus","answer_after_attempt":true},{"id":"custom-test","start":2520,"end":2760,"title":"Testul propriu pentru 128, înaintea remedierii","chapter":"05 · Păstrăm proba și remediem","rule":"Un test de regresie păstrează cazul care a expus problema. Îl rulăm înaintea remedierii ca să vedem eșecul și după remediere ca să verificăm că nu mai apare.","method":["Adaugi un obiect în CustomTests din custom-tests.js. Nu modifici tests.js și nu elimini testele furnizate.","Rezultatul cu semn este un număr. expected: -128 și expected: \"-128\" au tipuri diferite; testul le deosebește.","Un test propriu rulează la fiecare etapă selectată, nu numai în S06. Înțelegerea acestei reguli evită eliminarea greșită a unui test util."],"steps":[{"title":"Deschide lista existentă","html":"<p class=\"explain\">În VS Code deschide <code>PROJECT/custom-tests.js<\/code>. Găsește <code>globalThis.CustomTests = [<\/code> și obiectul furnizat pentru binary 255. Păstrează-l. Dacă ai deja propriul test pentru interpretarea cu semn, cu intrarea 128, nu îl duplica; verifică structura și valoarea așteptată. Pentru această activitate avem nevoie de un singur asemenea test.<\/p>"},{"title":"Adaugă obiectul în interiorul listei","html":"<p class=\"explain\"><strong>Unde se copiază: în lista CustomTests din PROJECT/custom-tests.js, înainte de ];.<\/strong><\/p><pre><code>{ label: &#x27;Pragul interpretării cu semn&#x27;, input: 128, operation: &#x27;signed&#x27;, expected: -128 }<\/code><\/pre><p class=\"explain\">Pune virgulă după obiectul precedent pentru a separa cele două obiecte. <code>expected: -128<\/code> nu are ghilimele. Eticheta este descrierea testului; <code>operation: 'signed'<\/code> alege funcția, iar <code>input<\/code> și <code>expected<\/code> definesc comparația.<\/p>"},{"title":"Salvează, reîncarcă și vezi eșecul util","html":"<p class=\"explain\">Salvează fișierul cu <strong>Ctrl+S / Cmd+S<\/strong>. Reîncarcă tabul cu <code>PROJECT/tests.html<\/code>, selectează S06 și rulează. Înaintea corectării ai <strong>34 trecute / 3 eșuate / 0 neimplementate<\/strong>, dacă ai exact lista furnizată și acest test nou. Rândul propriu așteaptă −128 și obține 128. Cele trei eșecuri detectează aceeași intrare greșită.<\/p>"},{"title":"Dacă nu vezi rândul sau tipul nu coincide","html":"<p class=\"explain\">Dacă rândul lipsește, verifică dacă ai salvat fișierul corect și ai reîncărcat tabul din aceeași clonă. Un mesaj că <code>custom-tests.js<\/code> nu s-a încărcat cere verificarea virgulelor, ghilimelelor și parantezelor. Dacă actual este numărul −128, dar expected este textul <code>'-128'<\/code>, corectează tipul așteptării justificat din cerință; nu schimba așteptarea ca să copiezi rezultatul defect.<\/p>"},{"title":"De ce S05 poate raporta acum un eșec","html":"<p class=\"explain\">Testele proprii se execută la toate etapele. După adăugarea acestui test, înaintea remedierii, S05 raportează <strong>31 trecute / 1 eșuat<\/strong>, deși hexazecimalul este corect. După remediere va raporta <strong>32 trecute / 0 eșuate<\/strong>. Totalurile se schimbă dacă ai alte teste proprii. Acesta nu este un motiv să ștergi testul cu semn.<\/p>"}],"connection":"Ai testul care eșuează; pregătești ramura pe care păstrezi remedierea.","mistake":"Nu accepta un rezultat verde obținut prin ștergerea testului sau prin expected: 128. Am pierde chiar proba problemei.","prompt":"Arată adăugarea și verificarea testului"},{"id":"branch","start":2760,"end":3000,"title":"O ramură pentru remediere, în aceeași clonă","chapter":"05 · Păstrăm proba și remediem","rule":"Ramura este un nume pentru o linie de lucru din istoricul Git. Nu este un folder nou și nu publică automat modificările.","method":["Ai pornit de la main verificat la început. Notițele și testul nou sunt modificări intenționate ale investigației; încă nu ai făcut commit.","Crearea unei ramuri la același commit păstrează aceste modificări în copia de lucru. Nu rulezi pull acum pe starea cu modificări.","Ramura va permite unui PR să compare remedierea cu main și să explice integrarea."],"steps":[{"title":"Citește starea modificărilor intenționate","html":"<p class=\"explain\"><strong>Unde se copiază: terminalul VS Code, rădăcina repository-ului.<\/strong><\/p><pre><code>git status\ngit branch --show-current<\/code><\/pre><p class=\"explain\">Ramura de pornire este <code>main<\/code>. Poți vedea <code>PROJECT/evidence.md<\/code> și <code>PROJECT/custom-tests.js<\/code> modificate: sunt însemnările și testul tocmai adăugat. Citește diferențele dacă apare alt fișier. Nu este nevoie să faci pull din nou în această stare.<\/p>"},{"title":"Creează și activează ramura","html":"<p class=\"explain\"><strong>Unde se copiază: terminalul VS Code, după identificarea modificărilor intenționate.<\/strong><\/p><pre><code>git switch -c fix/signed-boundary\ngit branch --show-current\ngit status<\/code><\/pre><p class=\"explain\"><code>switch -c<\/code> creează ramura la commitul curent și o activează. Rezultatul verificării numelui trebuie să fie <code>fix/signed-boundary<\/code>. Fără schimbarea commitului de pornire, fișierele modificate rămân disponibile pentru remediere.<\/p>"},{"title":"Ruta prin interfața VS Code","html":"<p class=\"explain\">Dacă preferi interfața, deschide Command Palette cu <strong>Ctrl+Shift+P / Cmd+Shift+P<\/strong>, caută <strong>Git: Create Branch<\/strong>, introdu <code>fix/signed-boundary<\/code> și confirmă. Verifică numele ramurii în bara de stare. Folosește una dintre cele două rute; nu crea două ramuri doar pentru că ai văzut ambele explicații.<\/p>"},{"title":"Dacă ramura există deja sau schimbarea este refuzată","html":"<p class=\"explain\">O ramură existentă poate conține o încercare anterioară. Citește <code>git status<\/code> și clarifică istoricul înainte de <code>git switch fix/signed-boundary<\/code>. Dacă schimbarea ar suprascrie lucrul, păstrează mesajul și cere să inspectăm situația. Nu șterge ramura și nu folosi reset ca să obții numele așteptat. Numele singur nu dovedește că ești pe versiunea corectă.<\/p>"}],"connection":"Investigația și testul sunt păstrate; inspectăm funcția și corectăm pragul.","mistake":"Înainte de commit, notițele și testul sunt în fișierele locale. Ramura nouă nu le-a publicat și nu a creat o copie separată a folderului.","prompt":"Arată crearea ramurii"},{"id":"fix","start":3000,"end":3300,"title":"Remedierea cea mai mică justificată de definiție","chapter":"05 · Păstrăm proba și remediem","rule":"Compară condiția din asSigned8 cu cele două cazuri ale definiției. Corectează tratarea pragului și păstrează validarea, hexazecimalul S05 și funcțiile rezervate S07.","method":["Deschizi implementarea după propria ipoteză și după testul care reproduce problema. Acum inspecția codului poate explica observația.","O schimbare de un caracter poate modifica un caz important. Dimensiunea mică a diff-ului nu elimină nevoia de verificare.","Nu schimbăm simultan afișarea, validarea și testele. Păstrăm o legătură clară între cauza găsită și remediere."],"steps":[{"title":"Încearcă întâi compararea cu definiția","html":"<p class=\"explain\">În VS Code deschide <code>PROJECT/lab.js<\/code> și găsește <code>function asSigned8(u)<\/code>. Ai deja ipoteza, testul și eșecul înregistrate. Citește condiția și răspunde înainte de soluția următoare: pentru 128, programul alege același caz ca pentru 127 sau ca pentru 129? Ce cere definiția? Modifică numai dacă poți justifica diferența.<\/p>"},{"title":"Cauza exactă a pragului exclus","html":"<p class=\"explain\"><strong>Linia inițială de citit în asSigned8, nu de copiat peste remediere.<\/strong><\/p><pre><code>return u &gt; 128 ? u - 256 : u;<\/code><\/pre><p class=\"explain\"><code>&gt;<\/code> este fals pentru 128. Programul păstrează deci <code>u<\/code>, deși definiția cere cazul cu scăderea lui 256. Pentru 129 condiția este adevărată și rezultatul este corect. Tiparul 127 corect, 128 greșit, 129 corect are acum o explicație în implementare.<\/p>"},{"title":"Linia justificată, după încercarea ta","html":"<p class=\"explain\"><strong>Unde se copiază: în PROJECT/lab.js, înlocuiește numai linia return din asSigned8.<\/strong><\/p><pre><code>return u &gt;= 128 ? u - 256 : u;<\/code><\/pre><p class=\"explain\">Păstrează <code>validateByte(u);<\/code> de deasupra. <code>&gt;=<\/code> include 128 în cazul care scade 256. Nu schimba <code>toHex8<\/code>, <code>parseByte<\/code>, <code>toBinary8<\/code> sau <code>parityBit8<\/code>. Comentariile S07 și rezultatele neimplementate pentru paritate rămân.<\/p>"},{"title":"Salvează și formulează verificarea următoare","html":"<p class=\"explain\">Salvează cu <strong>Ctrl+S / Cmd+S<\/strong>. Browserul nu execută codul nesalvat și nu preia automat salvarea: urmează reîncărcarea aplicației și testelor. Predicția ta pentru 128 este acum −128; vecinii 127 și 129 trebuie să rămână 127 și −127. Rezultatele 0 și 255 trebuie să rămână 0 și −1. Nu declara remedierea verificată până nu ai rulat.<\/p>"},{"title":"Ce înveți din schimbarea aceasta","html":"<p class=\"explain\">Nu „facem numărul negativ” printr-un artificiu în afișare. Punem implementarea în acord cu definiția pentru domeniul valid. Un test care eșua înainte și trece după schimbare va susține remedierea; rerularea vecinilor și a întregului domeniu va verifica dacă am păstrat comportamentul anterior.<\/p>"}],"connection":"Rerulăm aplicația, testul propriu și etapa S06 din codul salvat.","mistake":"Nu trata paritatea neimplementată ca pe un defect S06 și nu o completa acum. Etapa selectată stabilește ce verificăm.","prompt":"Arată explicația după încercarea mea","answer_after_attempt":true},{"id":"retest","title":"Retestăm și citim ce s-a schimbat","chapter":"05 · Verificăm remedierea","start":3300,"end":3480,"rule":"Un test păstrat înainte și după schimbare arată ce problemă reproduce și dacă remedierea o elimină. Rerulăm și comportamentele care erau deja corecte.","method":["Salvăm PROJECT/lab.js, apoi reîncărcăm aplicația și pagina de teste din propria clonă. Testele rulate pe o altă copie nu descriu fișierele pe care le vom publica.","Selectăm S06 și citim rezultatele individuale, inclusiv testul propriu pentru 128. Numărăm rezultatele numai după ce verificăm ce teste sunt incluse.","Comparăm înainte și după, apoi verificăm că hexazecimalul și validarea au rămas corecte. Paritatea este cerința seminarului următor."],"steps":[{"title":"Salvăm, reîncărcăm, verificăm copia","html":"<p class=\"explain\">În VS Code salvezi <code>PROJECT/lab.js<\/code> cu <strong>Ctrl+S<\/strong> sau <strong>Cmd+S<\/strong>. În browser reîncarci <code>PROJECT/index.html<\/code> și <code>PROJECT/tests.html<\/code> din folderul propriu. În aplicație alegi limba grupei; în pagina de teste alegi etapa <strong>S06<\/strong> și apeși <strong>Rulează testele<\/strong>. Pagina nu preia automat o schimbare nesalvată din editor.<\/p><p class=\"explain\">Dacă rezultatul a rămas vechi, verifici calea fișierului deschis, salvarea și reîncărcarea înainte să modifici din nou funcția. Un rezultat neașteptat poate veni și dintr-o copie greșită.<\/p>"},{"title":"Comparația de la prag și de la vecinii lui","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Aceleași intrări, înainte și după remediere\"><table><caption>Aceleași intrări, înainte și după remediere<\/caption><thead><tr><th scope=\"col\">Intrare u<\/th><th scope=\"col\">Așteptat cu semn<\/th><th scope=\"col\">Înainte<\/th><th scope=\"col\">După<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">127<\/th><td>127<\/td><td>127<\/td><td>127<\/td><\/tr><tr><th scope=\"row\">128<\/th><td>−128<\/td><td>128<\/td><td>−128<\/td><\/tr><tr><th scope=\"row\">129<\/th><td>−127<\/td><td>−127<\/td><td>−127<\/td><\/tr><tr><th scope=\"row\">255<\/th><td>−1<\/td><td>−1<\/td><td>−1<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">La 128 urmărești separat binarul <code>10000000<\/code> și valoarea cu semn <code>−128<\/code>. Biții nu au fost schimbați; a fost corectată condiția care decide interpretarea. Testul propriu cu <code>expected: -128<\/code> trece acum. Rezultatul așteptat rămâne același ca înainte de remediere.<\/p>"},{"title":"Numărul testelor are sens numai împreună cu lista","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Numere pentru testele furnizate și exact testul propriu obligatoriu\"><table><caption>Numere pentru testele furnizate și exact testul propriu obligatoriu<\/caption><thead><tr><th scope=\"col\">Etapă<\/th><th scope=\"col\">Înainte de remediere<\/th><th scope=\"col\">După remediere<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">S06<\/th><td>34 trecute · 3 eșuate · 0 neimplementate<\/td><td>37 trecute · 0 eșuate · 0 neimplementate<\/td><\/tr><tr><th scope=\"row\">S05<\/th><td>31 trecute · 1 eșuat · 0 neimplementate<\/td><td>32 trecute · 0 eșuate · 0 neimplementate<\/td><\/tr><tr><th scope=\"row\">baseline<\/th><td>26 trecute · 1 eșuat · 0 neimplementate<\/td><td>27 trecute · 0 eșuate · 0 neimplementate<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Testele proprii rulează în orice etapă. De aceea, după adăugarea testului cu semn, inclusiv S05 și baseline detectează problema. Cele trei eșecuri S06 observă aceeași intrare defectă prin verificări diferite: cazul furnizat, verificarea tuturor valorilor și testul tău. Alte teste proprii schimbă totalurile.<\/p>"},{"title":"Ce susțin rezultatele și unde ne oprim","html":"<p class=\"explain\">În lista S06 citești și verificările hexazecimale, binare și ale intrărilor invalide. Rândul pentru toate cele 256 de valori cu semn compară întregul domeniu numeric admis cu referința testelor. Pentru această funcție și acest domeniu este o verificare mai puternică decât câteva exemple.<\/p><p class=\"explain\">Nu rezultă că orice utilizare viitoare sau orice fișier al aplicației este corect. Nu modifici <code>tests.js<\/code> și nu completezi paritatea ca să obții un rezultat favorabil într-o etapă viitoare. Păstrezi testul de regresie: dacă defectul revine, testul trebuie să îl arate.<\/p>"}],"connection":"Păstrăm observațiile reale în însemnări și explicăm versiunea curentă în README.","mistake":"Nu ștergem testul care a detectat problema și nu schimbăm rezultatul așteptat ca să obținem verde.","prompt":"Arată următorul pas"},{"id":"work-notes","title":"Însemnările descriu ce am făcut, nu ce urmează","chapter":"06 · Păstrăm explicația","start":3480,"end":3780,"rule":"Înregistrăm ipoteza inițială, afirmația verificată și rezultatele reale. O operație viitoare rămâne „de completat” până când o efectuăm și o verificăm.","method":["În PROJECT/evidence.md completăm secțiunea RO · S06. Ipoteza scrisă înainte de consultare se păstrează, chiar dacă am revizuit-o.","În PROJECT/README.md descriem pornirea, comportamentul corectat și starea curentă a integrării. Bifa pentru S06 se completează după PR, pull și testele din main.","Salvăm cele două fișiere înainte de commitul remedierii. URL-ul PR-ului și confirmarea integrării vor fi completate după Q06, în închiderea seminarului."],"steps":[{"title":"Legăm afirmația de observație","html":"<p class=\"explain\">În <code>PROJECT/evidence.md<\/code> completezi numai secțiunea limbii grupei. Păstrezi problema observată, ipoteza ta inițială și sursa folosită: <strong>Gemini<\/strong> sau <strong>răspunsul didactic de rezervă<\/strong>. Dacă ai folosit exemplul pregătit, nu îl prezinți ca răspuns primit de tine de la Gemini.<\/p><p class=\"explain\">Scrii afirmația precisă aleasă, predicția ei, intrarea testului și rezultatul. La concluzie precizezi ce explicație susține observația și ce nu ai verificat. Câteva rânduri sunt suficiente; nu transcrii conversația și nu pregătești capturi de ecran.<\/p>"},{"title":"Păstrăm înainte și după, fără să rescriem trecutul","html":"<p class=\"explain\"><strong>Model scurt pentru rubricile S06 din PROJECT/evidence.md; păstrezi numai rezultatele pe care le-ai observat.<\/strong><\/p><pre><code>Test de regresie: input 128; expected -128.\nÎnainte de remediere: observed 128, eșuat.\nDupă remediere: observed -128, trecut.\nConcluzia mea, raportată la afirmația aleasă: [completez].\nURL issue: [adresa reală a issue-ului meu].\nURL pull request: de completat după crearea PR-ului.\nConfirmare merge / main local / pull: de verificat după integrare.<\/code><\/pre><p class=\"explain\">Înlocuiești parantezele cu datele tale. Dacă un rezultat diferă, îl notezi și revii la test sau funcție. „De completat” este starea corectă pentru PR înainte să existe; nu inventezi un număr de PR sau o integrare deja încheiată.<\/p>"},{"title":"README descrie versiunea pe care o putem porni","html":"<p class=\"explain\">În <code>PROJECT/README.md<\/code> păstrezi pașii de deschidere pentru <code>PROJECT/index.html<\/code> și <code>PROJECT/tests.html<\/code>. Precizezi că selectăm etapa S06 și reîncărcăm paginile după salvarea JavaScript. Adaugi scurt: „Interpretarea cu semn include acum pragul 128; testul de regresie trece pe ramura de remediere. Integrarea în main urmează.”<\/p><p class=\"explain\">Bifa S05 rămâne cea verificată anterior. Bifa S06 rămâne încă nebifată, deoarece descrierea ei include PR integrat și main local actualizat. Paritatea rămâne pentru S07. README trebuie să arate starea reală, nu toate rezultatele finale ale planului.<\/p>"},{"title":"De ce există o completare după Q06","html":"<p class=\"explain\">Commitul pe care îl pregătim acum include ipoteza, afirmația, testele, concluzia și issue-ul real. Nu poate include confirmarea unui PR pe care încă nu l-am creat. Vom verifica integrarea codului în main înainte de Q06; în minutele <strong>85–90<\/strong> completăm URL-ul real al PR-ului, confirmarea și prima verificare pentru S07.<\/p><p class=\"explain\">Dacă aceste rânduri sau README se schimbă, salvăm și facem un scurt commit de documentare cu push pe main. Este aceeași activitate, fără o depunere Moodle suplimentară. Dacă integrarea a rămas blocată, păstrăm starea incompletă și problema concretă.<\/p>"}],"connection":"Citirea diferențelor ne arată exact ce versiune vom înregistra.","mistake":"Nu trecem operații viitoare drept fapte încheiate și nu înlocuim ipoteza inițială cu explicația finală.","prompt":"Arată următorul pas"},{"id":"diff-stage","title":"Citim diferențele și selectăm patru fișiere","chapter":"07 · Înregistrăm pe ramură","start":3780,"end":3900,"rule":"Stage selectează conținutul pentru următorul commit. Citim înainte ce s-a schimbat și păstrăm remedierea, testul și explicația în aceeași versiune.","method":["În Source Control verificăm ramura fix/signed-boundary și deschidem diferențele. Schimbarea codului rămâne în asSigned8; validarea și soluția S05 se păstrează.","Selectăm PROJECT/lab.js, PROJECT/custom-tests.js, PROJECT/README.md și PROJECT/evidence.md. Nu selectăm automat fișiere străine activității.","După Stage citim Staged Changes. Dacă edităm din nou un fișier, verificăm diferența și îl selectăm din nou înainte de commit."],"steps":[{"title":"Mai întâi verificăm ramura și schimbarea de cod","html":"<p class=\"explain\">Deschizi <strong>Source Control<\/strong> în VS Code. Bara de stare trebuie să arate <code>fix/signed-boundary<\/code>. Apeși <code>PROJECT/lab.js<\/code> din <strong>Changes<\/strong> ca să vezi diff-ul. În cod, verifici modificarea condiției din <code>asSigned8<\/code> și că <code>validateByte(u)<\/code> a rămas acolo.<\/p><p class=\"explain\">Nu introduci o funcție nouă pentru paritate, nu elimini validarea și nu rescrii <code>toHex8<\/code>. Diff-ul ne permite să vedem și o schimbare accidentală, pe care o simplă rulare cu 128 o poate rata.<\/p>"},{"title":"Citirea celor patru fișiere are un scop","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce trebuie să putem explica înainte de Stage\"><table><caption>Ce trebuie să putem explica înainte de Stage<\/caption><thead><tr><th scope=\"col\">Fișier<\/th><th scope=\"col\">Ce citim în diferență<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\"><code>PROJECT/lab.js<\/code><\/th><td>Condiția care include pragul 128; celelalte comportamente păstrate.<\/td><\/tr><tr><th scope=\"row\"><code>PROJECT/custom-tests.js<\/code><\/th><td>Testul propriu cu operation signed și expected numeric −128; exemplele existente păstrate.<\/td><\/tr><tr><th scope=\"row\"><code>PROJECT/evidence.md<\/code><\/th><td>Ipoteză, sursă, afirmație, predicție, rezultate, concluzie și issue real; PR și integrare încă de verificat.<\/td><\/tr><tr><th scope=\"row\"><code>PROJECT/README.md<\/code><\/th><td>Instrucțiuni de pornire și stare curentă, fără bifa prematură a integrării.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Salvezi fișierele înainte să le selectezi. Dacă vezi un fișier neașteptat, îi citești numele și diferența; nu îl incluzi doar fiindcă apare în listă.<\/p>"},{"title":"Alegem conținutul, nu numai numele fișierelor","html":"<p class=\"explain\">Apeși <strong>+<\/strong> lângă fiecare dintre cele patru fișiere. Ele apar în <strong>Staged Changes<\/strong>. Deschizi și această listă: ea descrie conținutul care va intra în commit. Stage nu publică pe GitHub și nu încheie încă un commit.<\/p><p class=\"explain\">Dacă mai modifici <code>evidence.md<\/code> după Stage, fișierul poate apărea în ambele liste: versiunea selectată și editarea ulterioară. Salvezi, citești diferența nouă și apeși din nou <strong>+<\/strong> pentru conținutul pe care îl dorești în commit.<\/p>"},{"title":"Aceeași verificare, dacă folosim terminalul","html":"<p class=\"explain\"><strong>Alternativă la butoanele Stage: terminalul VS Code, deschis în rădăcina propriei clone.<\/strong><\/p><pre><code>git branch --show-current\ngit status\ngit diff\ngit add PROJECT/lab.js PROJECT/custom-tests.js PROJECT/README.md PROJECT/evidence.md\ngit diff --staged\ngit status<\/code><\/pre><p class=\"explain\">Comanda <code>git diff --staged<\/code> arată diferența selectată. Nu rulezi și comenzile de commit sau push până nu ai citit-o. Pentru traseul de azi, ramura afișată trebuie să fie <code>fix/signed-boundary<\/code>. Dacă starea este alta, identifici cauza înainte să continui.<\/p>"}],"connection":"Commitul va înregistra conținutul selectat în istoricul local al ramurii.","mistake":"Nu folosim selecția tuturor fișierelor ca înlocuitor pentru citirea diferențelor.","prompt":"Arată următorul pas"},{"id":"commit","title":"Commitul păstrează remedierea local","chapter":"07 · Înregistrăm pe ramură","start":3900,"end":3960,"rule":"Un commit înregistrează versiunea selectată și mesajul ei în istoricul local. Pe ramura de remediere, el nu schimbă încă main și nu publică pe GitHub.","method":["În Source Control introducem un mesaj scurt care spune ce problemă am corectat.","Folosim Commit simplu după citirea Staged Changes. Nu acceptăm automat includerea unor modificări neselectate.","Verificăm ramura, ultimul commit și starea rămasă. Commitul este o înregistrare locală, pe care o vom publica în pasul următor."],"steps":[{"title":"Mesajul spune ce s-a schimbat","html":"<p class=\"explain\">În câmpul de mesaj din <strong>Source Control<\/strong> scrii <code>S06: corectarea pragului interpretarii cu semn<\/code>, sau o formulare scurtă echivalentă. Mesajul trebuie să fie util când revenim la istoric: precizează problema, nu doar „gata” sau „update”.<\/p><p class=\"explain\">Pe bara de stare verifici încă o dată <code>fix/signed-boundary<\/code>. La începutul acestei operații, cele patru fișiere citite se află în <strong>Staged Changes<\/strong>.<\/p>"},{"title":"Înregistrăm numai conținutul citit","html":"<p class=\"explain\">Alegi <strong>Commit<\/strong>. Dacă VS Code anunță că nu există schimbări selectate și propune să le selecteze automat, revii la Stage și citești lista; nu ocolești verificarea. Dacă apare o eroare despre identitatea autorului, verifici configurarea numelui și a adresei pentru propria clonă.<\/p><p class=\"explain\">Identitatea autorului commitului și autentificarea pe GitHub sunt lucruri diferite. O eroare la acest pas nu se rezolvă prin inventarea unui commit reușit în însemnări.<\/p>"},{"title":"Alternativa în terminal și verificarea","html":"<p class=\"explain\"><strong>Alternativă la butonul Commit: terminalul VS Code, din rădăcina propriei clone, după Stage.<\/strong><\/p><pre><code>git commit -m &quot;S06: corectarea pragului interpretarii cu semn&quot;\ngit log -1 --oneline\ngit status\ngit branch --show-current<\/code><\/pre><p class=\"explain\">Dacă ai făcut deja commit din interfață, rulezi numai cele trei comenzi de verificare, nu un al doilea commit. Citești mesajul și ramura. Un commit reușit are o identificare în istoric; o listă de fișiere salvată pe calculator nu este același lucru.<\/p>"},{"title":"Starea curată nu înseamnă integrare","html":"<p class=\"explain\">Dacă nu mai sunt alte modificări, copia de lucru este curată. Remedierea există acum în istoricul local al <code>fix/signed-boundary<\/code>. <code>main<\/code> local nu a primit commitul doar pentru că am creat o ramură și am lucrat pe ea.<\/p><p class=\"explain\">Nici <code>main<\/code> de pe GitHub nu s-a schimbat. Păstrezi această distincție și când uiți numele comenzilor: înregistrarea locală, publicarea ramurii și integrarea sunt operații separate.<\/p>"}],"connection":"Publicăm ramura proprie, apoi cerem integrarea ei în main prin PR.","mistake":"Nu confundăm un commit reușit sau o stare curată cu publicarea pe GitHub.","prompt":"Arată următorul pas"},{"id":"push","title":"Publicăm ramura și verificăm unde apare","chapter":"08 · Publicăm și integrăm","start":3960,"end":4080,"rule":"Publish Branch sau push trimite commiturile pe ramura de pe GitHub. Publicarea lui fix/signed-boundary nu integrează automat remedierea în main.","method":["În VS Code publicăm ramura nouă folosind Publish Branch. Dacă are deja legătură cu ramura online, folosim Push.","Verificăm că origin este repository-ul propriu și că publicarea a reușit. Un mesaj de eroare rămâne un blocaj real.","În browser alegem fix/signed-boundary și citim commitul și fișierul. Nu verificăm numai pagina main, care încă nu include remedierea."],"steps":[{"title":"Publish Branch este pasul pentru ramura nouă","html":"<p class=\"explain\">În VS Code alegi <strong>Publish Branch<\/strong> pentru <code>fix/signed-boundary<\/code>. Dacă se cere autentificare, verifici că intri în contul tău GitHub, apoi revii la VS Code. Dacă ramura are deja legătură online, folosești <strong>Push<\/strong> din meniul Source Control.<\/p><p class=\"explain\">Nu alegi crearea unui repository nou: lucrezi în copia proprie folosită în S05. <strong>Publish Branch<\/strong> publică ramura actuală. Dacă interfața oferă <strong>Sync Changes<\/strong>, reține că aceasta combină operații; pentru acest pas folosim Push explicit.<\/p>"},{"title":"Alternativa în terminal arată destinația","html":"<p class=\"explain\"><strong>Alternativă la Publish Branch: terminalul VS Code, din rădăcina propriei clone.<\/strong><\/p><pre><code>git remote -v\ngit branch --show-current\ngit push -u origin fix/signed-boundary<\/code><\/pre><p class=\"explain\">În <code>git remote -v<\/code>, <code>origin<\/code> trebuie să indice copia ta, nu template-ul <code>antonioclim/BBS-bit-byte-starter<\/code>. <code>-u<\/code> stabilește legătura dintre ramura locală și cea publicată. Dacă publicarea din interfață a reușit deja, nu este nevoie să o repeți prin terminal.<\/p>"},{"title":"Verificarea din browser este pe ramura potrivită","html":"<p class=\"explain\">Deschizi pe GitHub repository-ul propriu. În selectorul de ramură alegi <code>fix/signed-boundary<\/code>. Verifici mesajul ultimului commit și deschizi <code>PROJECT/lab.js<\/code>: condiția corectată trebuie să fie prezentă. Poți citi și testul propriu și însemnările publicate pe această ramură.<\/p><p class=\"explain\">Selectorul implicit poate arăta <code>main<\/code>. Dacă rămâi acolo înainte de merge, este normal să vezi versiunea anterioară. Nu înseamnă că push a integrat automat schimbarea și nici că fișierul local este greșit.<\/p>"},{"title":"Dacă push nu reușește","html":"<p class=\"explain\">Citești mesajul: autentificare, drepturi, conexiune sau destinație greșită sunt probleme diferite. Păstrezi commitul local, verifici contul și adresa propriei copii și semnalezi blocajul. Nu modifici origin spre repository-ul comun ca să găsești o altă destinație.<\/p><p class=\"explain\">Nu folosești force push ca soluție generală. Până când ai confirmat ramura online, starea corectă este „commit local; publicare blocată”. Continuarea și recuperarea se fac conform regulilor deja comunicate, fără inventarea unei integrări sau a unei condiții noi de notare.<\/p>"}],"connection":"PR-ul va compara ramura publicată cu main din același repository propriu.","mistake":"Nu confundăm publicarea ramurii cu schimbarea lui main și nu verificăm o altă copie GitHub.","prompt":"Arată următorul pas"},{"id":"pull-request","title":"PR-ul leagă problema de schimbare","chapter":"08 · Publicăm și integrăm","start":4080,"end":4200,"rule":"Un pull request compară două ramuri și păstrează explicația integrării propuse. În această activitate ambele ramuri aparțin repository-ului nostru.","method":["Pe GitHub deschidem un PR cu base main și compare fix/signed-boundary, ambele în propria copie.","Legăm issue-ul real și descriem testul, remedierea și concluzia investigației. PR-ul propriu nu înseamnă că un coleg a revizuit schimbarea.","Citim Files changed înainte de integrare. Crearea PR-ului nu execută singură testele locale și nu înseamnă merge."],"steps":[{"title":"Alegem baza și ramura comparată","html":"<p class=\"explain\">În repository-ul tău GitHub alegi <strong>Pull requests → New pull request<\/strong>, sau bannerul <strong>Compare &amp; pull request<\/strong>. Verifici <strong>base: main<\/strong> și <strong>compare: fix/signed-boundary<\/strong>. Proprietarul și repository-ul trebuie să fie copia ta în ambele poziții.<\/p><p class=\"explain\">Nu trimiți remedierea spre template-ul comun. Copia creată din template are istorie proprie. Dacă pagina spune că nu există nimic de comparat, verifici ramurile și commitul publicat; nu creezi un PR gol doar pentru a obține o adresă.<\/p>"},{"title":"Descriere scurtă, cu datele proprii","html":"<p class=\"explain\"><strong>În descrierea PR-ului propriu de pe GitHub; înlocuiești parantezele înainte de Create pull request.<\/strong><\/p><pre><code>Problema: interpretarea cu semn a intrării 128.\nIssue: [URL-ul real al issue-ului meu].\nRemediere: condiția include exact pragul 128; validarea și hexazecimalul sunt păstrate.\nTest de regresie: input 128, expected -128; înainte 128, după -128.\nTeste rulate din clona mea: [etapa și rezultatele observate].\nAfirmația verificată, sursa și concluzia: [completez scurt].<\/code><\/pre><p class=\"explain\">Titlul poate fi „S06: corectarea pragului interpretării cu semn”. URL-ul issue-ului este adresa completă a problemei deschise în repository-ul tău. Dacă folosești și <code>#NUMĂR<\/code>, înlocuiești NUMĂR cu numărul real din același repository.<\/p>"},{"title":"Citim Files changed înainte de merge","html":"<p class=\"explain\">După <strong>Create pull request<\/strong>, deschizi fila <strong>Files changed<\/strong>. Citești diferența de cod, testul și cele două fișiere de documentare. Compari cu ce ai selectat și înregistrat local. Nu trebuie să apară o soluție S07 sau fișiere care nu țin de activitate.<\/p><p class=\"explain\">Dacă ai declarat în descriere că testele au trecut, trebuie să le fi rulat în copia ta. PR-ul nu rulează automat aceste teste. În această activitate nu avem nevoie de un rezultat GitHub Actions ca să înlocuiască verificarea locală.<\/p>"},{"title":"Ce învățăm dintr-un PR propriu","html":"<p class=\"explain\">Păstrezi adresa reală a PR-ului în fila browserului; o vom introduce în însemnări după Q06. Acum PR-ul documentează problema, schimbarea și verificările pe care le declari. El este încă <strong>Open<\/strong>, iar main nu a primit remedierea.<\/p><p class=\"explain\">Îți citești propria propunere înainte de integrare. Acesta este un exercițiu de explicare și integrare, fără să pretindem o revizie independentă de către un coleg. Nu așteptăm aprobarea individuală a fiecărui PR de către noi, dacă setările repository-ului permit integrarea proprie.<\/p>"}],"connection":"Integrăm numai după citirea diferenței și verificăm rezultatul Merged.","mistake":"Nu inversăm base și compare și nu prezentăm un PR deschis drept remediere integrată.","prompt":"Arată următorul pas"},{"id":"merge","title":"Merge schimbă main de pe GitHub","chapter":"08 · Publicăm și integrăm","start":4200,"end":4290,"rule":"Integrarea PR-ului adaugă remedierea în main online. Nu modifică automat ramura main din clona locală.","method":["În PR alegem metoda Create a merge commit, apoi Merge pull request și Confirm merge.","Verificăm că PR-ul este Merged și citim condiția corectată pe main online. Closed singur nu confirmă integrarea.","Păstrăm issue-ul până la verificarea din main local. Dacă setările blochează integrarea, păstrăm starea și identificăm blocajul."],"steps":[{"title":"Alegem metoda de integrare","html":"<p class=\"explain\">În PR-ul propriu, după citirea <strong>Files changed<\/strong>, deschizi meniul de lângă butonul de merge. Alegi <strong>Create a merge commit<\/strong>, dacă această metodă este disponibilă și nu este deja selectată. Apoi apeși <strong>Merge pull request<\/strong> și <strong>Confirm merge<\/strong>.<\/p><p class=\"explain\">Pentru traseul de azi păstrăm un commit de integrare vizibil în istoric. Nu alegi o altă metodă doar pentru că este afișată prima. Nu trebuie să ștergi ramura în acest moment ca să demonstrezi integrarea.<\/p>"},{"title":"Merged are un sens precis","html":"<p class=\"explain\">Citești starea PR-ului: trebuie să fie <strong>Merged<\/strong>. Un PR poate fi și <strong>Closed<\/strong> fără merge; închiderea simplă nu dovedește că remedierea a ajuns în main. Din pagina repository-ului alegi <code>main<\/code> și verifici <code>PROJECT/lab.js<\/code> și commitul de integrare.<\/p><p class=\"explain\">Acum remedierea există în main <strong>online<\/strong>. VS Code poate arăta în continuare ramura de remediere, iar main local poate păstra versiunea anterioară. Browserul și clona nu se actualizează reciproc fără operații Git.<\/p>"},{"title":"Issue-ul păstrează legătura cu remedierea","html":"<p class=\"explain\">Issue-ul real și PR-ul propriu rămân legate prin adresele introduse în descriere. După merge mai avem de actualizat main local și de rulat testele din acea copie. La închiderea de după Q06 adăugăm rezultatul complet și închidem issue-ul, dacă nu s-a închis automat printr-o legătură folosită în PR.<\/p><p class=\"explain\">Închiderea issue-ului este o organizare a problemei. Ea nu ține locul testului, nu face merge și nu actualizează clona locală. Chiar dacă issue-ul s-a închis automat, verificarea main local rămâne de făcut.<\/p>"},{"title":"Dacă butonul sau metoda este blocată","html":"<p class=\"explain\">Citești mesajul exact: metoda de merge indisponibilă, restricție de ramură, conflict sau verificare cerută de setări. Nu schimbi pe ascuns setările și nu ocolești o regulă prin force push. Păstrezi PR-ul, commitul și descrierea problemei; semnalezi blocajul pentru recuperare.<\/p><p class=\"explain\">Nu declari main integrat cât timp PR-ul este doar deschis sau închis fără merge. Blocajul nu introduce o aprobare individuală nouă pentru Q06 și nu schimbă tacit punctajul. Însemnările vor arăta starea efectivă.<\/p>"}],"connection":"Revenim în clona proprie și aducem main local la versiunea integrată.","mistake":"Nu confundăm Closed cu Merged și nu presupunem că merge-ul online a făcut și pull local.","prompt":"Arată următorul pas"},{"id":"pull","title":"Revenim pe main și actualizăm clona","chapter":"09 · Verificăm integrarea locală","start":4290,"end":4380,"rule":"Switch main schimbă ramura locală activă. Pull aduce integrarea din propriul origin; apoi verificăm fișierele efective din acea copie.","method":["În VS Code verificăm că nu au rămas modificări neînregistrate. Nu schimbăm ramura cu însemnări noi amestecate fără să înțelegem starea.","Revenim pe main și executăm git pull --ff-only din rădăcina clonei. Main local înaintează la main online dacă starea permite.","Citim ramura, starea și istoricul. O eroare pull nu este dovadă de integrare și nu se ascunde prin reset --hard."],"steps":[{"title":"Verificăm starea înainte să schimbăm ramura","html":"<p class=\"explain\">Revii în VS Code la <strong>aceeași clonă proprie<\/strong>. În Source Control verifici să nu mai fie modificări neînregistrate din activitate. Commitul remedierii trebuie să existe, iar push și merge să fi fost confirmate. În acest moment nu completăm încă rubricile finale PR/merge/pull în fișiere; le păstrăm pentru închiderea de după Q06.<\/p><p class=\"explain\">Dacă vezi o editare nouă, îi citești diferența și identifici când a apărut. Nu ștergi fișierul și nu schimbi ramura forțat ca să obții o listă curată.<\/p>"},{"title":"Switch și pull, din rădăcina copiei proprii","html":"<p class=\"explain\"><strong>În terminalul VS Code, deschis în rădăcina propriei clone, după merge reușit și verificarea stării.<\/strong><\/p><pre><code>git status\ngit switch main\ngit pull --ff-only\ngit branch --show-current\ngit status\ngit log -3 --oneline<\/code><\/pre><p class=\"explain\"><code>git switch main<\/code> te aduce pe ramura main din clona existentă; nu creează un folder nou. <code>git pull --ff-only<\/code> preia din origin și permite numai actualizarea prin avansare directă a ramurii. Dacă operația reușește, integrarea online devine disponibilă în main local.<\/p>"},{"title":"Ce citim după operații","html":"<p class=\"explain\"><code>git branch --show-current<\/code> trebuie să afișeze <code>main<\/code>. În istoric identifici commitul de integrare și schimbarea S06; în <code>PROJECT/lab.js<\/code> citești condiția care include 128. În <code>PROJECT/custom-tests.js<\/code> trebuie să fie testul tău. Starea curată confirmă că nu ai alte schimbări locale, nu că ai rulat testele din această ramură.<\/p><p class=\"explain\">Origin este copia ta, creată în S05. Acest pull nu aduce automat modificările pe care noi le-am face ulterior în template-ul comun.<\/p>"},{"title":"Dacă actualizarea este refuzată","html":"<p class=\"explain\">Păstrezi mesajul și verifici: ești în clona potrivită, PR-ul este Merged, origin este copia ta, iar main local nu are o istorie divergentă? <code>--ff-only<\/code> refuză să creeze automat o integrare nouă când avansarea directă nu este posibilă. Rezolvăm cauza concretă înainte să afirmăm că main local este actualizat.<\/p><p class=\"explain\">Nu folosești <code>reset --hard<\/code> sau force push pentru a ascunde situația. Codul și însemnările existente rămân păstrate; dacă recuperarea nu încape acum, notezi operația blocată și continui evaluarea după regulile comunicate.<\/p>"}],"connection":"Testăm main local după integrare, din fișierele actualizate ale clonei.","mistake":"Nu verificăm doar remedierea de pe ramură și nu presupunem că un pull nereușit a actualizat main.","prompt":"Arată următorul pas"},{"id":"integrated-check","title":"Verificăm versiunea integrată, nu o amintire","chapter":"09 · Verificăm integrarea locală","start":4380,"end":4440,"rule":"Verificarea finală a codului se face pe main local după pull. Istoricul, fișierele și testele trebuie să descrie aceeași versiune.","method":["Confirmăm main în VS Code, salvarea fișierelor și calea paginilor locale. Reîncărcăm înainte de teste.","Rerulăm S06 din copia actualizată. Testul propriu pentru 128 trebuie să treacă, împreună cu verificările anterioare.","Deosebim publicarea pe ramură, integrarea online și actualizarea locală. Închiderea de după Q06 va adăuga numai documentarea evenimentelor deja observate."],"steps":[{"title":"Fișierele provin din main local","html":"<p class=\"explain\">În VS Code vezi <code>main<\/code> în bara de stare. În browser deschizi sau reîncarci <code>PROJECT/index.html<\/code> și <code>PROJECT/tests.html<\/code> din aceeași clonă actualizată. Verifici că nu ai rămas pe o copie ZIP sau pe un alt folder deschis la începutul seminarului.<\/p><p class=\"explain\">Pagina din browser poate avea încă vechiul JavaScript încărcat. Reîncărcarea face parte din verificare; faptul că ai făcut pull nu schimbă singur o pagină deja deschisă.<\/p>"},{"title":"Rularea S06 se repetă după integrare","html":"<p class=\"explain\">În <code>PROJECT/tests.html<\/code> alegi <strong>S06<\/strong> și rulezi. Pentru testele furnizate și exact testul propriu obligatoriu, rezultatul este <strong>37 trecute, 0 eșuate, 0 neimplementate<\/strong>. Citești rândul testului cu <code>input: 128<\/code>, <code>expected: -128<\/code> și rezultatul <code>−128<\/code>.<\/p><p class=\"explain\">Dacă ai adăugat și alte teste, totalul diferă; criteriul este ca verificările pertinente să treacă. Nu înlocuiești lista reală cu numărul modelului. Verifici și că hexazecimalul și validarea au rămas corecte.<\/p>"},{"title":"Localizăm schimbarea în patru momente","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Operația și locul în care există remedierea\"><table><caption>Operația și locul în care există remedierea<\/caption><thead><tr><th scope=\"col\">După operație<\/th><th scope=\"col\">Ce există acum<\/th><th scope=\"col\">Ce nu rezultă automat<\/th><\/tr><\/thead><tbody><tr><th scope=\"row\">Commit pe <code>fix/signed-boundary<\/code><\/th><td>Versiunea în istoricul local al ramurii.<\/td><td>Publicare pe GitHub.<\/td><\/tr><tr><th scope=\"row\">Publish Branch / push<\/th><td>Aceeași ramură și pe GitHub.<\/td><td>Integrare în main.<\/td><\/tr><tr><th scope=\"row\">Merge al PR-ului<\/th><td>Remedierea în main online.<\/td><td>Actualizare a main local.<\/td><\/tr><tr><th scope=\"row\">Switch main + pull reușit<\/th><td>Remedierea în main local.<\/td><td>Testare din copia actualizată.<\/td><\/tr><\/tbody><\/table><\/div><p class=\"explain\">Ultima rulare adaugă dovada comportamentului din copia integrată. Acest lanț ne ajută să reluăm lucrul de pe alt calculator sau să explicăm de ce două copii arată diferit.<\/p>"},{"title":"Ce rămâne de documentat","html":"<p class=\"explain\">Înainte de Q06, codul este deja verificat în main local dacă toți pașii au reușit. Însemnările publicate pot avea încă rubricile PR și merge/pull marcate „de completat”; acest lucru a fost declarat înainte de commit. La închidere introducem adresele și confirmările reale, apoi publicăm completarea.<\/p><p class=\"explain\">Dacă un pas este blocat, identifici starea precisă: commit local, ramură online, PR deschis sau main local neactualizat. Nu declari activitatea completă și nu fabrici rezultate. Q06 rămâne evaluarea individuală stabilită, fără o aprobare personală nouă înainte de acces.<\/p>"}],"connection":"La minutul 75 trecem la Q06; după evaluare încheiem însemnările și publicăm numai completarea lor.","mistake":"Nu folosim teste rulate înainte de merge ca dovadă că versiunea din main local a fost verificată.","prompt":"Arată următorul pas"},{"id":"quiz-transition","title":"Q06, apoi închidem corect activitatea","chapter":"10 · Evaluăm și pregătim reluarea","start":4440,"end":4500,"rule":"Q06 verifică individual înțelegerea investigației și a traseului Git, cu fișa comună permisă. Rezultatul testului Moodle nu certifică singur proiectul sau autoratul.","method":["În minutele 75–85 rezolvăm Q06 în Moodle: 10 minute, o încercare, maximum 30 de puncte interne, adică 0,30 puncte reale.","Închidem lecția extinsă, instrumentele și AI; păstrăm numai fișa comună de referință deja permisă. Nu folosim ajutorul colegilor.","În minutele 85–90 completăm confirmările reale, bifa README și prima verificare pentru S07. Dacă documentarea s-a schimbat, facem commit și push pe main."],"steps":[{"title":"Ne pregătim pentru evaluarea individuală","html":"<p class=\"explain\">Deschizi <strong>Q06<\/strong> în cursul Moodle al grupei. Ai <strong>10 minute<\/strong> și <strong>o încercare<\/strong>. Sunt patru întrebări selectate, cu câte două răspunsuri, și maximum <strong>30<\/strong> de puncte interne. În contribuția S05–S07, maximumul Q06 este <strong>0,30 puncte reale<\/strong>.<\/p><p class=\"explain\">Navigarea între întrebări este liberă. Citești fiecare cerință și verifici că ai completat ambele răspunsuri înainte de trimiterea încercării. Setările reale și intervalul grupei sunt cele comunicate în Moodle.<\/p>"},{"title":"Resursa permisă rămâne aceeași","html":"<p class=\"explain\">Închizi lecția extinsă, simulările și fila Gemini înainte de încercare. Păstrezi numai <strong>fișa comună de referință comunicată în curs<\/strong>. Nu consulți colegii și nu ceri AI răspunsuri la evaluare. Permisiunea pentru fișă nu se extinde automat la toate resursele care au fost disponibile în activitatea practică.<\/p><p class=\"explain\">Q06 verifică înțelegerea în aceste condiții de lucru. Un punctaj bun nu dovedește singur că ai publicat repository-ul sau că ai realizat personal fiecare operație. Păstrăm distincte rezultatul evaluării și starea reală a proiectului.<\/p>"},{"title":"După Q06 completăm numai evenimentele observate","html":"<p class=\"explain\">În minutele <strong>85–90<\/strong> revii la <code>PROJECT/evidence.md<\/code>. Introduci URL-ul real al PR-ului și confirmi merge, revenirea pe main, pull și testele <strong>numai dacă au reușit<\/strong>. În <code>PROJECT/README.md<\/code> bifezi S06 numai după verificarea întregii linii și înlocuiești starea de integrare în așteptare cu rezultatul real.<\/p><p class=\"explain\">La „Prima verificare la S07” scrii: identific propria clonă, verific main și origin, citesc starea Git și rulez S06 înainte de cerința nouă. Dacă integrarea și testele din main au fost confirmate, adaugi concluzia și PR-ul real în issue, apoi îl închizi dacă este încă deschis. Dacă ai un blocaj, scrii operația și mesajul relevante; nu bifezi finalizarea. Nu încărcăm o temă Moodle suplimentară pentru S06.<\/p>"},{"title":"Publicăm completarea și păstrăm metoda","html":"<p class=\"explain\"><strong>Numai dacă documentarea s-a schimbat și main este actualizat: terminalul VS Code, din rădăcina clonei, după salvare și citirea diferenței.<\/strong><\/p><pre><code>git branch --show-current\ngit diff -- PROJECT/evidence.md PROJECT/README.md\ngit add PROJECT/evidence.md PROJECT/README.md\ngit diff --staged\ngit commit -m &quot;S06: consemnarea integrarii si pregatirea reluarii&quot;\ngit push origin main\ngit status<\/code><\/pre><p class=\"explain\">Ramura trebuie să fie <code>main<\/code>. Acest scurt ciclu publică însemnările despre operații deja efectuate; nu cere o nouă implementare sau o depunere separată. Verifici pe GitHub că ultima completare apare în main. Dacă nu există schimbări, nu creezi un commit gol; dacă integrarea este blocată, păstrezi starea și organizezi recuperarea.<\/p><p class=\"explain\">Cu ce rămânem: definim așteptarea, formulăm o ipoteză, alegem un test care poate să o infirme și urmărim în ce copie există schimbarea. Metoda este utilă și pentru praguri fiscale, limite de vârstă sau validări; explicația fluentă se verifică prin observații.<\/p>"}],"connection":"S06 se încheie aici. În S07 vom rezolva cerința individuală și vom verifica reproducerea versiunii finale.","mistake":"Nu presupunem că nota Moodle confirmă integrarea și nu lăsăm completările reale doar în fișiere locale.","prompt":"Arată următorul pas"}],"math_checks":[],"rehearsal":[]}</script>
<script>
'use strict';
