erință permisă. Testul are o singură tentativă și durata de 15 minute; urmăriți timpul afișat de Moodle.</p><p class=\"explain\">Fișa finală este obligatorie, fără aprobare individuală ca cerință de acces la Q07. Dacă există un blocaj, descrieți-l în fișă și urmați regulile cursului.</p>"}, {"title": "Modul din întrebare decide răspunsul", "html": "<p class=\"explain\">Înainte de calcul, citiți dacă enunțul cere <code>even</code> sau <code>odd</code>. Deosebiți octetul de date, bitul de control și cuvântul transmis. Respectați modul din întrebare, chiar dacă diferă de varianta proiectului propriu.</p><p class=\"explain\">Pentru o întrebare despre eroare, identificați biții modificați și verificarea folosită. Formulați numai concluzia susținută de acea verificare.</p>"}, {"title": "Citirea, navigarea și trimiterea", "html": "<p class=\"explain\">Completați ambele răspunsuri din fiecare item CLOZE. Navigarea este liberă: puteți reveni la un item în timpul încercării. Verificați răspunsurile înainte de <strong>Trimite tot și termină</strong>; feedbackul detaliat se publică după încheierea evaluării pentru toate grupele.</p><p class=\"explain\">Cele cinci întrebări selectate valorează câte 10 puncte în Moodle. Maximumul Q07 de 50 corespunde unei contribuții de 0,50 puncte la punctajul de seminar; fișa proiectului nu adaugă punctaj separat.</p>"}, {"title": "Ce ne rămâne din cele trei seminarii", "html": "<p class=\"explain\">În S05 ați preluat un proiect și ați publicat prima modificare. În S06 ați investigat o problemă, ați testat o afirmație și ați integrat remedierea. În S07 ați formulat o regulă verificabilă dintr-o cerință și ați testat versiunea publicată dintr-o copie nouă.</p><p class=\"explain\">Păstrați întrebările utile dincolo de comenzi: ce cere problema, ce rezultat așteptați, ce ați verificat, care sunt limitele verificării și din ce versiune poate reproduce altcineva rezultatul? Ultimele cinci minute, 85–90, sunt rezervate acestei recapitulări.</p>"}], "connection": "Încheiem S07 cu proiectul, istoricul și metoda de verificare, apoi revenim la parcursul disciplinei.", "mistake": "Permisiunea de a consulta fișa comună nu include folosirea AI sau ajutorul colegilor. Rezultatul testului nu certifică automat proiectul.", "prompt": "Pregătiți Q07"}], "math_checks": [], "rehearsal": []}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s07-complete-lesson-v1-ro')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s07-complete-lesson-v1-ro',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Exemplul este ascuns</span></div><section class="example" id="example-${i}" aria-label="Exemplu rezolvat" hidden></section><p class="connection"><b>Legătura cu tema următoare.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Prezentare pe teme':'Citire continuă';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Reluați pas cu pas';return f<p.steps.length-1?'Următorul pas al rezolvării':'Reluați exemplul ↺';}
function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Exemplul este ascuns':state.all[i]?`Toți cei ${p.steps.length} pași sunt afișați`:`Pasul ${f+1} din ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'REZOLVARE COMPLETĂ':`PASUL ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Pasul anterior</button><button data-action="all" data-index="${i}">Rezolvarea completă</button><button data-action="hide" data-index="${i}">Ascundeți exemplul</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Reveniți la metodă ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Cuprinsul lecției':'← Tema anterioară';$('nextBtn').textContent=state.index===pages.length-1?'Reluați lecția ↺':'Tema următoare →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Reveniți la lecție':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Panou suplimentar. Butonul Tema următoare revine la lecție și trece la tema următoare.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Exemplul este ascuns':'Exemplul este afișat'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Tema ${state.index+1} din ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Exemplul rămâne ascuns până când solicitați afișarea lui.':state.all[state.index]?`Toți cei ${pages[state.index].steps.length} pași sunt afișați.`:`Este afișat pasul ${state.frames[state.index]+1} din ${pages[state.index].steps.length}.`}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lecția a fost reluată. Toate exemplele rezolvate sunt ascunse.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Citire continuă: toate metodele sunt vizibile; fiecare exemplu se deschide separat.':'Prezentare: câte o temă pe ecran.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Reveniți la lecție</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['parity','errors','publication'].includes(which)){h=s07Panel(which);}
else if(which==='map'){h=panelHead("Cuprinsul lecției")+`<p>Continuăm proiectul propriu din S06, prezicem bitul de paritate, scriem teste și implementăm individual modul atribuit. Publicăm main, verificăm identitatea și rulăm proiectul într-o clonă nouă înainte de predarea finală și Q07.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Prezentați câte o temă":"Citiți lecția continuu"}</button><button data-command="tools">Instrumente de verificare</button><button data-command="reference">Fișa comună</button><button data-command="help">Ajutor și afișare</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">Parcursul propus pentru 90 de minute alocă 70 de minute proiectului și pregătirii predării, 15 minute testului Q07 și cinci minute încheierii. Ritmul presupune S06 și instrumentele pregătite. Duratele nu au fost măsurate pentru fiecare grupă.</p></div>`;}
else if(which==='help'){h=panelHead('Citire, navigare și afișare')+`<p><b>Explicațiile sunt vizibile de la început.</b> Apăsați E sau butonul de rezolvare pentru a parcurge exemplul pe pași. Săgeata spre dreapta trece la tema următoare chiar dacă exemplul nu este terminat. Parcursul complet afișează toate etapele după propria încercare.</p><p><a href="BTI_S07_Lesson_Text_RO_v1.0.0.html">Deschideți versiunea integrală pentru lectură</a>. Conține aceleași explicații și exemple și funcționează fără JavaScript. După descărcare, păstrați cele două fișiere în același director. În Moodle folosim și linkul separat către textul pentru citire.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Mărimea textului lecției: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− și A+ schimbă mărimea cu cinci puncte procentuale. Puteți introduce și un procent exact. Derulați explicațiile lungi și tabelele late. Alegem mărimea pentru ecranul și distanța reale.</p><div class="panel-controls"><button data-command="theme">Comutați între tema luminoasă și cea întunecată</button><button data-command="fullscreen">Ecran complet</button><button data-command="blank">Ascundeți ecranul (B)</button><button data-command="tools">Instrumente și cronometru</button></div><h2>Taste</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Comenzi prin litere: activate':'Comenzi prin litere: dezactivate'}</button></div><p class="small">Dezactivați comenzile prin litere dacă interferează cu introducerea textului sau comenzile vocale. Săgețile, Escape și butoanele rămân disponibile.</p><p>← / →: tema anterioară / următoare. E: afișează exemplul sau etapa următoare. Shift+E: etapa anterioară. H: ascunde exemplul. M: cuprins. F: ecran complet. B: ascunde ecranul. Escape: revine la lecție sau restabilește focalizarea tastaturii.</p><p class="small">În câmpurile unui formular, săgețile își păstrează rolul de editare. Escape revine la lecție. Alt+← / Alt+→ permit navigarea și dintr-un câmp.</p><h2>Ce învățăm și de ce</h2><p>Rezolvăm individual o cerință precisă: bitul de paritate pentru modul atribuit. Mai întâi prezicem rezultatele, apoi scriem testele și implementarea. Verificăm ce erori detectează regula și ce rămâne nedetectat.</p><p>După ce uităm comenzile, ne rămân trei întrebări: ce ar trebui să obținem, ce versiune am publicat și poate o copie nouă să reproducă rezultatul?</p><h2>Legătura cu S05 și S06</h2><p>Păstrăm aceeași copie proprie, cu funcția hexazecimală din S05 și remedierea pragului 128 din S06. În S07 publicăm pe main; am exersat deja ramura și pull request în S06. Nu avem nevoie de un nou PR pentru această cerință.</p><h2>Exersare și evaluare</h2><p>Scriem propria predicție și regula înainte să afișăm explicațiile. Gemini este opțional pentru clarificări în S07, după încercarea proprie. Verificăm orice afirmație prin teste. În Q07 nu folosim AI sau colegi; păstrăm numai fișa comună permisă și închidem lecția extinsă și instrumentele. Q07 durează 15 minute și contribuie cu maximum 0,50 puncte la punctajul de seminar. Contribuția cumulată a Q05–Q07 este de maximum un punct.</p><p>Fișa finală se depune obligatoriu ca text online (Online text), cu exact zece rubrici și fără punctaj separat. Nu condiționează accesul la Q07 de o aprobare individuală. Rezultatul testului nu certifică rularea proiectului sau autorul modificării.</p><h2>Convențiile instrumentelor</h2><p>Parserul reproduce intrarea zecimală din proiect: cifre, eventuale spații înainte și după, un întreg între 0 și 255. Limita suplimentară de 128 de caractere aparține numai instrumentului didactic. Cuvântul pentru paritate are nouă biți: opt pentru date și unul adăugat în dreapta. Laboratorul de erori pornește numai de la un cuvânt valid pentru modul ales.</p><p>Panoul de publicare este o simulare cu două fișiere și copii numerotate. Nu rulează Git, proiectul sau testele și nu accesează GitHub. Compararea identităților nu dovedește că aplicația funcționează.</p><p class="small">Fișierele descărcate funcționează fără internet. Pentru tipărirea tuturor explicațiilor și etapelor folosiți versiunea pentru lectură.</p></div>`;}
else if(which==='reference'){h=panelHead("Fișa comună")+S07REFERENCE+'</div>';}
else if(which==='tools'){const u=S07UI;h=panelHead("Instrumente de verificare")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="parity">${u.parityTitle}</button><button data-command="errors">${u.errorTitle}</button><button data-command="publication">${u.publicationTitle}</button><button data-command="reference">Fișa comună</button></div><h2>Cronometru pentru exersare</h2><p>Cronometrul nu afișează răspunsuri, nu trece la altă temă și nu controlează timpul unui test Moodle.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4200">70 min</button><button data-command="timerPause">Pauză / Continuare</button><button data-command="timerOff">Ascundeți cronometrul</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S07UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S07UI.errors[err.code||err.message]||S07UI.unexpectedError;box.textContent=message;say(S07UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS07Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Timpul a expirat · ':timer.running?'Exercițiu · ':'Pauză · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}

const S07REFERENCE="<section id=\"format-reference\"><h2>Fișa comună de referință<\/h2><p>Această fișă reia noțiunile și regulile din fișa comună a proiectului v0.4.0. O puteți consulta în timpul activității practice și la Q07, conform regulilor comunicate în curs. La Q07 închideți lecția extinsă, instrumentele și aplicațiile AI și păstrați numai fișa permisă. Evaluarea verifică înțelegerea cu acest sprijin; nu certifică realizarea proiectului sau autorul codului.<\/p><section class=\"section\"><h2>Opt biți de date<\/h2><p><strong>Intrare:<\/strong> întreg zecimal u între 0 și 255 inclusiv. Sunt acceptate spațiile de la începutul și de la sfârșitul intrării și zerourile inițiale. Sunt respinse intrarea goală, textul nenumeric, numerele negative, valorile fracționare și valoarea 256.<\/p><p><strong>Binar:<\/strong> exact opt poziții, cu ponderile 128, 64, 32, 16, 8, 4, 2 și 1. <strong>Hexazecimal:<\/strong> exact două caractere, cu A–F majuscule; fiecare caracter descrie patru biți, deoarece 16 = 2⁴. 255 = 15 × 16 + 15 → FF.<\/p><p><strong>Complement față de doi (two’s complement):<\/strong> s = u dacă u &lt; 128; s = u − 256 dacă u ≥ 128. Interval cu semn: −128…127. Biții rămân aceiași; se schimbă interpretarea. Prima pondere devine −128.<\/p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Opt biți de date\"><table><caption>Opt biți de date<\/caption><thead><tr><th scope=\"col\">u<\/th><th scope=\"col\">Binar<\/th><th scope=\"col\">Hex<\/th><th scope=\"col\">s<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>00000000<\/td><td>00<\/td><td>0<\/td><\/tr><tr><td>5<\/td><td>00000101<\/td><td>05<\/td><td>5<\/td><\/tr><tr><td>127<\/td><td>01111111<\/td><td>7F<\/td><td>127<\/td><\/tr><tr><td>128<\/td><td>10000000<\/td><td>80<\/td><td>−128<\/td><\/tr><tr><td>129<\/td><td>10000001<\/td><td>81<\/td><td>−127<\/td><\/tr><tr><td>255<\/td><td>11111111<\/td><td>FF<\/td><td>−1<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"section\"><h2>Bitul de paritate este separat<\/h2><p>k = numărul biților 1 din date. <strong>Paritate pară: p = k % 2.<\/strong> <strong>Paritate impară: p = 1 − (k % 2).<\/strong> Operatorul % dă restul împărțirii. p are valoarea 0 sau 1. Bitul p se adaugă la dreapta celor opt biți de date; cuvântul transmis are nouă biți.<\/p><p>Modificarea unui singur bit sau a unui număr impar de biți schimbă paritatea. Inversarea unui număr par de biți în poziții distincte păstrează paritatea. Verificarea de paritate semnalează nepotrivirea parității, fără a localiza sau corecta eroarea.<\/p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Bitul de paritate este separat\"><table><caption>Bitul de paritate este separat<\/caption><thead><tr><th scope=\"col\">Date<\/th><th scope=\"col\">k<\/th><th scope=\"col\">A: paritate pară<\/th><th scope=\"col\">B: paritate impară<\/th><\/tr><\/thead><tbody><tr><td>3 · 00000011<\/td><td>2<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>7 · 00000111<\/td><td>3<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><\/section>\n<section class=\"section\"><h2>Operațiile Git și rezultatul lor<\/h2><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Operațiile Git și rezultatul lor\"><table><caption>Operațiile Git și rezultatul lor<\/caption><thead><tr><th scope=\"col\">Operație<\/th><th scope=\"col\">Rezultat<\/th><\/tr><\/thead><tbody><tr><td>Save<\/td><td>Fișier salvat pe calculator.<\/td><\/tr><tr><td>Diff<\/td><td>Diferențe între stările comparate. <code>git diff<\/code>: schimbări neselectate.<\/td><\/tr><tr><td>Stage<\/td><td>Conținut selectat pentru includerea în următorul commit. <code>git diff --cached<\/code>: selecția.<\/td><\/tr><tr><td>Commit<\/td><td>Versiune înregistrată în istoricul local.<\/td><\/tr><tr><td>Push<\/td><td>Commituri trimise către repository-ul online.<\/td><\/tr><tr><td>Clone<\/td><td>Copie locală cu istoric și legătură origin.<\/td><\/tr><tr><td>Issue<\/td><td>Problemă descrisă prin pașii de reproducere și rezultatele așteptate și observate.<\/td><\/tr><tr><td>Branch<\/td><td>Ramură care permite pregătirea separată a modificărilor.<\/td><\/tr><tr><td>Pull request<\/td><td>Modificare justificată și propusă pentru integrare.<\/td><\/tr><tr><td>Merge + pull<\/td><td>Integrare online, apoi <code>git pull --ff-only<\/code> actualizează main local.<\/td><\/tr><\/tbody><\/table><\/div><p><code>origin<\/code> este numele legăturii către repository-ul online. <code>main<\/code> este ramura principală. <code>git status<\/code> arată starea; <code>git remote -v<\/code> arată adresa; <code>git branch --show-current<\/code> arată ramura; <code>git rev-parse HEAD<\/code> arată identificatorul complet. Starea locală curată nu dovedește singură publicarea. Dacă editați după stage, modificarea nouă trebuie selectată din nou ca să intre în commit.<\/p><\/section>\n<section class=\"section\"><h2>Ce verificați și ce puteți concluziona<\/h2><p><strong>Investigație:<\/strong> ipoteză proprie → afirmație din Gemini sau din exemplul pregătit → test cu rezultat așteptat calculat independent → rezultat obținut → concluzie. Un contraexemplu infirmă o afirmație universală. Testele la prag și retestarea cazurilor deja corecte previn concluziile pripite.<\/p><p><strong>Reproducere:<\/strong> ultimul commit și push → clonare separată → main și același SHA complet → aplicație și teste din copia nouă. SHA-ul final se copiază în Moodle după publicare.<\/p><p><strong>Evaluare:<\/strong> individual, fără AI sau ajutorul colegilor; această fișă este permisă. Q05: 10 min, maximum 0,20 puncte; Q06: 10 min, maximum 0,30; Q07: 15 min, maximum 0,50. Total ≤ 1 punct la seminar. Tema finală este obligatorie, fără punctaj separat.<\/p><\/section>\n<\/section>";

function s07Error(code) { const error = new Error(code); error.code = code; throw error; }
function parseByteInput(raw) {

  const text = input.trim();
  if (!/^\d+$/.test(text)) s07Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s07Error('BYTE_RANGE');
  return value;
}

function parityPrediction(raw, mode) {
  const value = parseByteInput(raw); s07Mode(mode);
  const binary = value.toString(2).padStart(8, '0');
  const countOnes = [...binary].reduce((sum, bit) => sum + Number(bit), 0);
  const parity = mode === 'even' ? countOnes % 2 : 1 - countOnes % 2;
  return {value, binary, countOnes, mode, parity, totalOnes: countOnes + parity, word: binary + parity};

  const rulePasses = receivedOnes % 2 === target;
  return {originalWord, receivedWord, mode, flippedPositions: flippedPositions.slice().sort((a,b)=>a-b),
    flips: selected.size, originalOnes, receivedOnes, rulePasses, detected: !rulePasses,

    remoteMain: {...state.remoteMain, files: {...state.remoteMain.files}},

    history: state.history.map(item=>({...item, files: {...item.files}})), lastAction: action, changed: false};
  if (action === 'saveCode' || action === 'saveTest') {
    if (next.revision >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
    next.working[action === 'saveCode' ? 'code' : 'test'] = 'v' + (++next.revision); next.changed = true;

    const file = action === 'stageCode' ? 'code' : 'test';

    next.changed = next.index[file] !== next.working[file]; next.index[file] = next.working[file];

      next.history.push(item); next.localMain = {id: item.id, files: {...item.files}}; next.changed = true;
    }
  } else if (action === 'push') {
    next.changed = next.remoteMain.id !== next.localMain.id;
    next.remoteMain = {id: next.localMain.id, files: {...next.localMain.files}};
  } else if (action === 'clone') {
    if (next.cloneNumber >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
    next.freshClone = {id: next.remoteMain.id, files: {...next.remoteMain.files}, serial: ++next.cloneNumber}; next.changed = true;
  }

}
