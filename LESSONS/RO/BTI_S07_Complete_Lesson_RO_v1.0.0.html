<script id="lessonData" type="application/json">{"title": "O cerință individuală și o versiune verificată", "version": "1.0.0", "language": "ro", "duration_seconds": 4200, "quiz_separate_minutes": 15, "font_min": 20, "font_max": 200, "pages": [{"id": "start", "start": 0, "end": 120, "title": "Încheiem un proiect pe care îl poate rula și altcineva", "chapter": "01 · Reluăm rezultatul din S06", "rule": "În S07 implementați individual varianta de paritate atribuită, publicați versiunea finală și o testați dintr-o clonă nouă. Păstrați funcționalitatea din S05, remedierea din S06 și explicațiile și testele proprii.", "method": ["În S06 am folosit Git pentru înregistrarea și integrarea unei modificări. Acum îl folosim pentru a identifica versiunea depusă și pentru a permite altcuiva să preia aceeași versiune.", "Noțiunea BTI studiată este paritatea. Cerința de programare definește o funcție cu intrări și ieșiri precise, iar verificarea practică presupune repetarea testelor din versiunea publicată.", "Păstrați trei întrebări care vă ajută și fără memorarea sintaxei: ce rezultat cere definiția, ce test îl verifică și ce versiune conține implementarea testată?"], "steps": [{"title": "Cele două sensuri ale verificării", "html": "<p class=\"explain\">Paritatea verifică o proprietate a cuvântului de biți. Testarea unei clone noi verifică dacă fișierele publicate permit reproducerea rezultatului. Pentru fiecare procedură precizăm concluzia pe care o susține și limitele ei.</p>"}, {"title": "Unde continuă proiectul", "html": "<p class=\"explain\">Editați <code>PROJECT/lab.js</code>, <code>custom-tests.js</code>, <code>README.md</code> și <code>evidence.md</code> din aceeași clonă proprie. Nu creați încă un repository din șablon. Lecția Moodle actuală vă conduce prin S07; fișierele proiectului rămân ale dumneavoastră.</p>"}, {"title": "Ce depuneți", "html": "<p class=\"explain\">La final completați în Moodle o fișă cu exact zece rubrici: adresa proiectului, versiunea finală, varianta atribuită, instrucțiunile și rezultatele verificate, inclusiv investigația din S06. Fișa este obligatorie, fără punctaj separat. Nu se solicită PDF, capturi de ecran sau conversația integrală cu AI.</p>"}, {"title": "Cum folosim cele 90 de minute", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Traseul S07\"><table><caption>Traseul S07</caption><thead><tr><th scope=\"col\">Interval</th><th scope=\"col\">Activitate</th></tr></thead><tbody><tr><th scope=\"row\">0–70 min</th><td>Implementare, teste, publicare, clonare nouă și fișa finală</td></tr><tr><th scope=\"row\">70–85 min</th><td>Q07 individual, maximum 0,50 puncte la punctajul de seminar</td></tr><tr><th scope=\"row\">85–90 min</th><td>Recapitulare și ce păstrăm pentru alte proiecte</td></tr></tbody></table></div><p class=\"explain\">Contribuția cumulată a Q05, Q06 și Q07 este de maximum un punct la punctajul de seminar. Q07 are maximum 50 de puncte în Moodle, echivalente cu 0,50 puncte la seminar. Gemini este opțional în activitatea practică S07; în timpul Q07 nu sunt permise AI sau ajutorul colegilor. Explicațiile detaliate pot fi recitite după seminar.</p><p class=\"explain\"><strong>Timpii sunt estimări pentru organizarea seminarului, încă neverificate cu o grupă.</strong> Intervalele de lucru presupun că instrumentele sunt pregătite. Dacă întâmpinați un blocaj, notați problema și urmați procedura de recuperare stabilită în curs. Consemnați numai rezultatele pe care ați reușit să le verificați.</p>"}], "connection": "Mai întâi regăsim copia care conține remedierea integrată din S06.", "mistake": "Testele trecute într-un director nu confirmă automat că aceeași versiune a fost publicată.", "prompt": "Afișați punctul de pornire"}, {"id": "resume", "start": 120, "end": 360, "title": "Regăsiți copia proprie și main", "chapter": "01 · Reluăm rezultatul din S06", "rule": "Identificați directorul de lucru, adresa origin și ramura înainte de actualizare. Continuați pe main în proiectul S06, după ce remedierea a fost integrată și preluată local.", "method": ["Citiți fișa de reluare S06 din evidence.md. Directorul de lucru și adresa GitHub trebuie să identifice același proiect propriu.", "Dacă nu există modificări locale neînregistrate, reveniți pe main și preluați actualizările. Citiți și păstrați modificările utile înainte de schimbarea ramurii sau de pull.", "Comanda pull nu preia noile ghiduri din șablonul comun. Origin indică proiectul propriu, independent de șablon; pentru instrucțiuni folosiți lecția S07 actuală din Moodle."], "steps": [{"title": "Deschideți directorul din fișa de reluare", "html": "<p class=\"explain\">În VS Code folosiți <strong>File → Open Folder</strong> și selectați directorul folosit la încheierea S06. În Explorer trebuie să identificați <code>PROJECT</code>, <code>GUIDES</code> și <code>START.html</code>. Deschideți <code>PROJECT/evidence.md</code> și verificați adresa și starea consemnate atunci.</p>"}, {"title": "Citiți starea înainte de schimbare", "html": "<p class=\"explain\"><strong>Unde se copiază: terminalul VS Code, în rădăcina depozitului de cod propriu.</strong></p><pre><code>git status\ngit remote -v\ngit branch --show-current</code></pre><p class=\"explain\">Recunoașteți propria adresă la <code>origin</code>. Citiți fișierele modificate. Dacă există note S06 utile, încă nepublicate, înregistrați-le într-un commit adecvat înainte de actualizare. Păstrați munca; nu ștergeți modificările pentru a obține o stare aparent curată.</p>"}, {"title": "Actualizați main când starea este clară", "html": "<p class=\"explain\"><strong>Unde se copiază: același terminal, după păstrarea modificărilor utile.</strong></p><pre><code>git switch main\ngit pull --ff-only\ngit status</code></pre><p class=\"explain\">O actualizare directă sau mesajul „Already up to date” sunt normale. Dacă <code>--ff-only</code> refuză actualizarea deoarece istoricul este divergent, opriți operația și clarificați situația cu profesorul. Păstrați istoricul și nu folosiți force push sau reset pentru a ascunde diferența.</p>"}, {"title": "Dacă directorul nu mai există", "html": "<p class=\"explain\">Clonați din nou <strong>depozitul de cod publicat de dumneavoastră</strong> într-un director nou și verificați remedierea S06. Clonarea șablonului inițial ar readuce funcțiile necompletate. Dacă și versiunea publicată este incompletă, păstrați această constatare și recuperați lucrul lipsă; nu declarați etapa S06 încheiată.</p>"}], "connection": "Acum verificăm comportamentul anterior, înainte de testele de paritate.", "mistake": "Pull preia modificările din origin; nu transformă automat proiectul propriu într-o ediție nouă a șablonului comun.", "prompt": "Afișați pașii de reluare"}, {"id": "previous-check", "start": 360, "end": 600, "title": "Verificați ce era deja corect în S06", "chapter": "01 · Reluăm rezultatul din S06", "rule": "Înainte de implementarea parității, rularea S06 trebuie să confirme conversia hexazecimală din S05 și remedierea interpretării cu semn. Astfel, deosebiți o problemă anterioară de o funcție încă neimplementată.", "method": ["Deschideți aplicația și testele din directorul identificat. Verificați calea; o filă de browser deschisă anterior poate indica altă copie.", "După salvarea fișierelor JavaScript, reîncărcați pagina. Browserul trebuie să execute versiunea pe care o inspectați în VS Code.", "Păstrați testul propriu signed128. Acesta verifică dacă remedierea se menține după adăugarea unei funcții noi."], "steps": [{"title": "Deschideți fișierele locale identificate", "html": "<p class=\"explain\">Din File Explorer sau Finder deschideți <code>PROJECT/index.html</code> și <code>PROJECT/tests.html</code> din clona proprie. Citiți calea <code>file:</code> din browser. Pentru schimbarea limbii folosiți selectorul <strong>Limba / Language</strong>. Nu modificăm codul numai pentru a schimba limba.</p>"}, {"title": "Rulați S06 înainte de a adăuga testele S07", "html": "<p class=\"explain\">În pagina de teste selectați <strong>S06 · Interpretare cu semn</strong> și apăsați <strong>Rulați testele</strong>. Cu testele furnizate, exemplul binar original și testul propriu pentru 128, aveți <strong>37 trecute, 0 eșuate, 0 neimplementate</strong>. Testele suplimentare pot modifica totalul; citiți rezultatele fiecărui rând.</p>"}, {"title": "Verificați dacă remedierea a ajuns în main local", "html": "<p class=\"explain\">În aplicație, valoarea 128 trebuie interpretată cu semn ca −128. Dacă testul S06 eșuează, verificați mai întâi directorul, ramura și salvarea fișierelor. O remediere aflată numai într-un pull request, pe GitHub sau într-o altă clonă nu este neapărat prezentă în copia curentă. Reluați pașii de integrare S06 și consemnați cauza blocajului.</p>"}, {"title": "De ce textele aplicației pot descrie încă proiectul de pornire", "html": "<p class=\"explain\">Mesajul despre starea inițială este inclus în proiectul de pornire; el nu este calculat din implementarea proprie și poate rămâne afișat după remediere. Verificați rezultatele efective și testele. Ștergerea mesajului nu rezolvă funcția. În acest seminar nu refacem interfața.</p>"}], "connection": "Atribuim un singur mod de paritate și precizăm rezultatul cerut.", "mistake": "În această verificare încă nu ați adăugat cazurile S07. Mai târziu testele proprii de paritate vor rula și în etapele anterioare.", "prompt": "Afișați verificarea S06"}, {"id": "requirement", "start": 600, "end": 780, "title": "Cerința: un bit separat, pentru modul atribuit", "chapter": "02 · Din cerință în predicție", "rule": "Implementați numai modul atribuit în parityBit8(u, mode): A înseamnă even, paritate pară; B înseamnă odd, paritate impară. Funcția primește o valoare numerică validată și returnează numărul 0 sau 1.", "method": ["Numărăm biții 1 din cei opt biți de date și alegem un bit suplimentar astfel încât totalul să aibă paritatea cerută.", "Interfața anexează bitul la dreapta. Cuvântul rezultat are nouă biți: opt de date și unul de control. Un octet rămâne alcătuit din opt biți.", "Păstrați validarea și funcțiile deja completate. Modul neatribuit rămâne intenționat neimplementat. Varianta A/B stabilește sarcina proiectului; la Q07 respectați modul precizat în fiecare întrebare."], "steps": [{"title": "Notați modul primit", "html": "<p class=\"explain\">Scrieți la începutul secțiunii S07 din <code>PROJECT/evidence.md</code>: <strong>Varianta A — even</strong> sau <strong>Varianta B — odd</strong>, conform repartizării din seminar. Selectați aceeași variantă în aplicație și în pagina de teste. Nu schimbați varianta pentru a o potrivi rezultatelor obținute.</p>"}, {"title": "Separați datele, numărul de biți 1 și bitul de control", "html": "<p class=\"explain\">Numim <code>k</code> numărul de biți 1 din date și <code>p</code> bitul suplimentar. <code>k</code> poate fi un număr de la 0 la 8; <code>p</code> poate fi numai 0 sau 1. Pentru A, totalul <code>k + p</code> trebuie să fie par; pentru B trebuie să fie impar. Numărăm biții 1, nu valoarea zecimală a datelor.</p>"}, {"title": "Ce păstrează funcția și ce construiește interfața", "html": "<p class=\"explain\"><code>parityBit8</code> nu schimbă octetul <code>u</code> și nu întoarce șirul de nouă caractere. Întoarce numai bitul numeric. Interfața combină apoi cei opt biți din <code>toBinary8(u)</code> cu acest bit. Interpretarea cu semn rămâne aceeași funcție corectată în S06.</p>"}, {"title": "Cum vă ajută această delimitare", "html": "<p class=\"explain\">Precizarea intrării, ieșirii și a rolului fiecărei funcții face cerința mai ușor de verificat. La Q07 veți putea deosebi datele de bitul de control. Aceeași precizie ajută, în alte proiecte, la păstrarea formatelor și a comportamentului existent atunci când adăugați o funcție.</p>"}], "connection": "Preziceți două rezultate înainte de formule sau implementare.", "mistake": "Paritatea valorii zecimale și paritatea numărului de biți 1 sunt proprietăți diferite.", "prompt": "Consultați cerința exactă"}, {"id": "prediction", "start": 780, "end": 960, "title": "Întâi preziceți pentru 3 și 7", "chapter": "02 · Din cerință în predicție", "rule": "Înainte de a consulta tabelul completat sau de a modifica funcția, notați bitul suplimentar propus pentru varianta atribuită și justificați alegerea. Păstrați predicția pentru a o compara cu rezultatul observat.", "method": ["Aplicați definiția: după adăugarea bitului de control, numărul total de biți 1 trebuie să aibă paritatea atribuită.", "Notați încercarea în evidence.md, apoi consultați explicațiile. Păstrați predicția inițială alături de orice corectură ulterioară.", "O predicție inițială greșită nu este penalizată separat. Urmăriți raționamentul și observația care justifică revizuirea ei."], "steps": [{"title": "Încercarea proprie, înainte de consultarea răspunsului", "html": "<p class=\"explain\">Pentru <code>3 = 00000011</code> și <code>7 = 00000111</code>, notați varianta atribuită, numărul de biți 1 și bitul propus. Calculați apoi numărul total de biți 1 după adăugare. Nu modificați încă <code>lab.js</code> și consultați rezolvarea numai după formularea celor două predicții proprii.</p>"}, {"title": "Verificați numărătoarea", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Datele înaintea bitului de control\"><table><caption>Datele înaintea bitului de control</caption><thead><tr><th scope=\"col\">Valoare</th><th scope=\"col\">Opt biți de date</th><th scope=\"col\">k</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td><code>00000011</code></td><td>2</td></tr><tr><th scope=\"row\">7</th><td><code>00000111</code></td><td>3</td></tr></tbody></table></div><p class=\"explain\">Numărăm pozițiile care conțin 1. Zerourile din stânga păstrează lățimea de opt biți, dar nu contribuie la <code>k</code>. Cele două exemple au numărători de parități diferite, deși ambele valori zecimale sunt impare.</p>"}, {"title": "Comparați ambele moduri cu definiția", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Predicții justificate pentru A și B\"><table><caption>Predicții justificate pentru A și B</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">k</th><th scope=\"col\">A: p / total</th><th scope=\"col\">B: p / total</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td>2</td><td>0 / 2</td><td>1 / 3</td></tr><tr><th scope=\"row\">7</th><td>3</td><td>1 / 4</td><td>0 / 3</td></tr></tbody></table></div><p class=\"explain\">Pentru A și 3, cei doi biți 1 formează deja un total par, deci se adaugă 0. Pentru A și 7, cei trei biți 1 necesită încă un 1. Pentru B, alegerea opusă produce un total impar. Implementați numai varianta atribuită; ambele explicații ajută la înțelegerea definiției.</p>"}, {"title": "Păstrați nouă poziții și sensul fiecăreia", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Cuvinte formate prin anexare la dreapta\"><table><caption>Cuvinte formate prin anexare la dreapta</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">A: par</th><th scope=\"col\">B: impar</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td><code>000000110</code></td><td><code>000000111</code></td></tr><tr><th scope=\"row\">7</th><td><code>000001111</code></td><td><code>000001110</code></td></tr></tbody></table></div><p class=\"explain\">Ultimul caracter este bitul suplimentar. Primii opt sunt datele inițiale. Nu interpretați acest cuvânt ca pe rezultatul <code>asSigned8</code> și nu înlocuiți unul dintre cei opt biți cu paritatea.</p>"}, {"title": "256 nu primește un bit de paritate", "html": "<p class=\"explain\">În aceeași însemnare precizați: <strong>intrarea 256 trebuie respinsă</strong>. Un octet fără semn are valori între 0 și 255 inclusiv. Testul invalid verifică validarea, nu caută o paritate pentru 256. În lista de teste vom folosi operația <code>parse-error</code>.</p>"}], "connection": "Transformăm explicația într-o regulă care acoperă toate numărătorile.", "mistake": "Păstrați predicția inițială. Dacă o corectați, precizați ce ați schimbat și pe baza cărei observații.", "prompt": "Consultați verificarea după predicția proprie", "answer_after_attempt": true}, {"id": "parity-rule", "start": 960, "end": 1200, "title": "Deduceți regula din totalul cerut", "chapter": "02 · Din cerință în predicție", "rule": "Regula generală trebuie să acopere toate numerele posibile de biți 1, de la zero la opt. O deduceți din paritatea cerută a totalului și apoi o exprimați matematic.", "method": ["Înainte de formulă, descrieți alegerea bitului pentru o numărătoare pară și pentru una impară.", "Comparați regula propusă cu cele două predicții. O regulă care returnează același bit pentru orice intrare nu satisface ambele cazuri.", "Calculul se aplică datelor valide. Validarea intrării îl precedă, iar modul de paritate este verificat separat."], "steps": [{"title": "Precizați regula înainte de formulă", "html": "<p class=\"explain\">Completați în însemnări: „Dacă numărul de biți 1 este par, pentru modul meu adaug …; dacă este impar, adaug …”. Justificați paritatea totalului în ambele situații. Formulați întâi regula în cuvinte, apoi expresia JavaScript.</p>"}, {"title": "Restul împărțirii descrie paritatea numărării", "html": "<p class=\"explain\">Numim <code>r = k % 2</code> restul împărțirii lui <code>k</code> la 2. Pentru o numărătoare pară, <code>r</code> este 0; pentru o numărătoare impară, este 1. Aici <code>k</code> este un întreg nenegativ, deci această expresie este suficientă pentru cele două cazuri. Nu aplicăm <code>u % 2</code> valorii zecimale a datelor.</p>"}, {"title": "Deducerea pentru A și B", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Regula pentru fiecare paritate a numărării\"><table><caption>Regula pentru fiecare paritate a numărării</caption><thead><tr><th scope=\"col\">k</th><th scope=\"col\">r</th><th scope=\"col\">A: p</th><th scope=\"col\">B: p</th></tr></thead><tbody><tr><th scope=\"row\">par</th><td>0</td><td>0</td><td>1</td></tr><tr><th scope=\"row\">impar</th><td>1</td><td>1</td><td>0</td></tr></tbody></table></div><p class=\"explain\">Pentru A, alegem <code>p = k % 2</code>: o numărătoare impară primește încă un 1 și devine pară. Pentru B, alegem <code>p = 1 - (k % 2)</code>: o numărătoare pară primește un 1 și devine impară. Rezultatul fiecărei expresii este bitul numeric, nu totalul <code>k + p</code>.</p>"}, {"title": "Verificați și capetele numărării", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Niciun bit 1 și toți cei opt\"><table><caption>Niciun bit 1 și toți cei opt</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">Binar</th><th scope=\"col\">k</th><th scope=\"col\">A: p</th><th scope=\"col\">B: p</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td><code>00000000</code></td><td>0</td><td>0</td><td>1</td></tr><tr><th scope=\"row\">255</th><td><code>11111111</code></td><td>8</td><td>0</td><td>1</td></tr></tbody></table></div><p class=\"explain\">Regula nu necesită cazuri speciale pentru valoarea zero sau pentru octetul cu toți biții 1. Bitul se alege din paritatea totalului cerut. Pentru opt biți de date, <code>k</code> poate avea nouă valori, dar bitul suplimentar are numai două.</p>"}, {"title": "De ce două exemple nu sunt demonstrația completă", "html": "<p class=\"explain\">Exemplele 3 și 7 verifică cele două tipuri de numărătoare, însă justificarea generală este că orice <code>k</code> este par sau impar, iar regula acoperă ambele situații. Testul furnizat verifică și toate cele 256 de intrări valide. Distingem astfel justificarea matematică de verificarea implementării.</p>"}], "connection": "Scriem teste cu aceste așteptări înainte să implementăm regula.", "mistake": "Funcția returnează p. Nu returnează k, k + p sau un șir care conține cuvântul complet.", "prompt": "Consultați deducerea după încercarea proprie", "answer_after_attempt": true}, {"id": "custom-tests", "start": 1200, "end": 1440, "title": "Adăugați o singură dată cele trei teste proprii", "chapter": "03 · Teste înaintea implementării", "rule": "În custom-tests.js păstrați lista existentă și adăugați numai setul variantei atribuite: două cazuri valide și respingerea intrării 256. Stabiliți rezultatele așteptate din definiție, înainte de implementare.", "method": ["Păstrați exemplul binar inițial și testul pentru pragul 128 din S06. Adăugați verificările noi fără a elimina testele utile existente.", "Fiecare obiect conține label, input, operation și expected. Separați obiectele prin virgule. Fragmentul se introduce în lista existentă, fără o nouă declarație CustomTests.", "Nu modificați tests.js. Acesta include automat toate intrările CustomTests, inclusiv atunci când selectați o etapă anterioară."], "steps": [{"title": "Identificați locul din listă și păstrați intrările existente", "html": "<p class=\"explain\">În VS Code deschideți <code>PROJECT/custom-tests.js</code>. Găsiți lista <code>globalThis.CustomTests = [ ... ];</code>. Păstrați obiectele existente, inclusiv <code>operation: 'signed'</code> pentru 128 și exemplul <code>binary</code>. Adăugați o virgulă după ultimul obiect existent, apoi inserați blocul variantei dumneavoastră înainte de <code>];</code>.</p>"}, {"title": "A — even: obiectele care se adaugă", "html": "<p class=\"explain\"><strong>Unde se copiază: numai în lista existentă din PROJECT/custom-tests.js, dacă aveți varianta A.</strong></p><pre><code>{ label: 'A: doi biți 1', input: 3, operation: 'parity-even', expected: 0 },\n{ label: 'A: trei biți 1', input: 7, operation: 'parity-even', expected: 1 },\n{ label: 'Respinge 256', input: '256', operation: 'parse-error', expected: 'ERROR' }</code></pre><p class=\"explain\">Primele două rezultate sunt numere fără ghilimele. Al treilea folosește exact textul <code>'ERROR'</code>, convenția instrumentului de testare pentru respingerea intrării. Nu adăugați și setul B.</p>"}, {"title": "B — odd: obiectele care se adaugă", "html": "<p class=\"explain\"><strong>Unde se copiază: numai în lista existentă din PROJECT/custom-tests.js, dacă aveți varianta B.</strong></p><pre><code>{ label: 'B: doi biți 1', input: 3, operation: 'parity-odd', expected: 1 },\n{ label: 'B: trei biți 1', input: 7, operation: 'parity-odd', expected: 0 },\n{ label: 'Respinge 256', input: '256', operation: 'parse-error', expected: 'ERROR' }</code></pre><p class=\"explain\">Aceleași date cer biți opuși față de A, deoarece aici totalul trebuie să fie impar. Cazul invalid este identic pentru ambele variante: validarea octetului nu depinde de paritate.</p>"}, {"title": "Salvați și evitați dublarea testelor", "html": "<p class=\"explain\">Salvați cu <strong>Ctrl+S</strong> sau <strong>Cmd+S</strong>. Verificați lista: cele două intrări anterioare sunt păstrate, iar cele trei noi corespund unui singur mod. Păstrați și eventualele teste suplimentare utile; totalurile din lecție se referă la setul descris aici. La rulările următoare nu inserați din nou fragmentul.</p>"}], "connection": "Prima rulare arată ce este implementat și ce lipsește încă.", "mistake": "Păstrați numerele 0 sau 1 ca rezultate așteptate. Nu le înlocuiți cu text, valori booleene sau ieșirile unei funcții greșite.", "prompt": "Afișați cele trei teste"}, {"id": "initial-run", "start": 1440, "end": 1620, "title": "Citiți starea inițială fără să o numiți succes", "chapter": "03 · Teste înaintea implementării", "rule": "Rulați S07 pentru varianta atribuită înainte de implementare. Valoarea null corespunde stării Neimplementat; ea nu este nici numărul 0, nici un rezultat corect. Testul intrării invalide trebuie să treacă deja.", "method": ["Reîncărcați pagina de teste pentru a prelua lista salvată. Selectați S07 și varianta notată în evidence.md.", "Citiți starea fiecărui rând: trecut, eșuat sau neimplementat. Numărul total, fără aceste categorii, nu descrie suficient rezultatul.", "Păstrați rezultatele acestei rulări pentru comparația de după implementare. Nu modificați rezultatele așteptate pentru a ascunde o diferență."], "steps": [{"title": "Selectați etapa și modul înainte de rulare", "html": "<p class=\"explain\">În browser reîncărcați <code>PROJECT/tests.html</code>. La <strong>Etapa</strong> selectați S07; la <strong>Varianta S07</strong> selectați A — pară sau B — impară, conform atribuirii. Apăsați <strong>Rulați testele</strong>. Schimbarea unui selector recalculează și ea pagina, dar butonul vă oferă un pas explicit de verificare.</p>"}, {"title": "Totalurile pentru setul descris", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Înainte de implementarea parității\"><table><caption>Înainte de implementarea parității</caption><thead><tr><th scope=\"col\">Stare</th><th scope=\"col\">Trecute</th><th scope=\"col\">Eșuate</th><th scope=\"col\">Neimplementate</th></tr></thead><tbody><tr><th scope=\"row\">S07 fără cele trei teste noi</th><td>38</td><td>0</td><td>7</td></tr><tr><th scope=\"row\">S07 cu cele trei teste noi</th><td>39</td><td>0</td><td>9</td></tr></tbody></table></div><p class=\"explain\">Cele două cazuri noi de paritate adaugă două verificări neimplementate. Respingerea lui 256 adaugă un test trecut, deoarece validarea există deja. Cele șapte verificări de paritate furnizate includ cazuri individuale și un rând care testează toate intrările valide; un rând poate acoperi mai multe intrări.</p>"}, {"title": "Păstrați observația în evidence.md", "html": "<p class=\"explain\">Notați etapa, varianta, totalurile și rezultatele testelor proprii: 3 și 7 sunt încă neimplementate, iar 256 este respins. Dacă apare un eșec, citiți operația și cauza. Dacă paritatea era deja implementată, consemnați starea și istoricul reale. Nu reintroduceți artificial <code>null</code> pentru a fabrica o rulare inițială.</p>"}, {"title": "Dacă pagina nu încarcă testele", "html": "<p class=\"explain\">Verificați salvarea și sintaxa din <code>custom-tests.js</code>: o virgulă lipsă poate împiedica încărcarea întregii liste. Păstrați numele fișierelor și proprietăților. Dacă apare <strong>custom-tests.js nu s-a încărcat</strong>, verificați încărcarea listei; absența rândurilor nu înseamnă absența erorilor. Corectați cauza și reîncărcați pagina.</p>"}], "connection": "Acum formulați propria regulă pentru funcția pe care o completați.", "mistake": "Nu modificați tests.js și nu eliminați verificările neimplementate. Ele arată ce lipsește înainte de rezolvarea cerinței.", "prompt": "Afișați prima rulare"}, {"id": "own-rule", "start": 1620, "end": 1800, "title": "Scrieți regula proprie și verificați-o înainte de implementare", "chapter": "04 · Implementăm și explicăm", "rule": "Înainte de modificarea instrucțiunii return, corelați varianta atribuită, regula proprie și cele două predicții. Precizați în formulare intrarea folosită și rezultatul returnat.", "method": ["Folosiți k pentru numărul de biți 1. Rezultatul cerut este p, bitul suplimentar; acesta diferă de numărătoare și de valoarea datelor.", "Verificați regula pentru cele două numărători. Lungimea mică a unei expresii nu garantează corectitudinea ei.", "Consultați explicația după încercarea proprie. Păstrați revizuirile, astfel încât testele să poată fi puse în legătură cu raționamentul."], "steps": [{"title": "Încercarea proprie", "html": "<p class=\"explain\">În <code>evidence.md</code> formulați două-trei propoziții: „Modul meu este … . Dacă numărul de biți 1 este …, aleg …, pentru că … . Funcția trebuie să întoarcă …”. Scrieți apoi expresia propusă, înainte de a edita funcția, și comparați-o cu predicțiile pentru 3 și 7.</p>"}, {"title": "Separați numărătoarea de alegerea bitului", "html": "<p class=\"explain\"><code>countOnes8(u)</code> este furnizată. Primește un număr valid și întoarce câți biți 1 are reprezentarea de opt biți. O folosim pentru <code>k</code>; nu o rescriem și nu adăugăm manual câte un rezultat pentru fiecare valoare. Regula de paritate transformă această numărătoare în bitul suplimentar.</p>"}, {"title": "Expresiile și o verificare pe hârtie", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Regula verificată pe cele două numărători\"><table><caption>Regula verificată pe cele două numărători</caption><thead><tr><th scope=\"col\">Mod</th><th scope=\"col\">Expresie pentru p</th><th scope=\"col\">k = 2</th><th scope=\"col\">k = 3</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>k % 2</code></td><td>0</td><td>1</td></tr><tr><th scope=\"row\">B — odd</th><td><code>1 - (k % 2)</code></td><td>1</td><td>0</td></tr></tbody></table></div><p class=\"explain\">Restul împărțirii lui 2 la 2 este 0, iar restul împărțirii lui 3 la 2 este 1. Pentru B, scădem acest rest din 1. Înlocuirea simbolurilor cu aceste valori permite verificarea parității totalului.</p>"}, {"title": "Ce puteți explica fără să memorați expresia", "html": "<p class=\"explain\">Formula poate fi reconstruită din cele două parități posibile ale numărătorii și din totalul cerut. Urmărim înțelegerea cerinței, nu memorarea unei linii de cod. La Q07 poate fi cerut celălalt mod; deduceți răspunsul din definiție, chiar dacă proiectul implementează numai varianta atribuită.</p>"}], "connection": "Aplicăm regula numai în blocul modului atribuit.", "mistake": "Urmărim numărul de biți 1, nu paritatea valorii zecimale u.", "prompt": "Comparați regula proprie cu explicația", "answer_after_attempt": true}, {"id": "implement", "start": 1800, "end": 2100, "title": "Completați numai return-ul modului atribuit", "chapter": "04 · Implementăm și explicăm", "rule": "În parityBit8 păstrați validarea și cele două blocuri existente. Înlocuiți return null numai în blocul even pentru A sau odd pentru B. Salvați și verificați comportamentul.", "method": ["Scrieți implementarea pornind de la regula proprie, înainte de a consulta explicațiile de sprijin. Folosiți funcția countOnes8 furnizată.", "Implementarea este individuală. Folosiți explicațiile pentru a justifica expresia aleasă și testele pentru a verifica funcția salvată.", "Modul neatribuit rămâne intenționat null. Finalizați, publicați și reproduceți varianta atribuită, fără a extinde sarcina la ambele moduri."], "steps": [{"title": "Încercarea proprie în fișier", "html": "<p class=\"explain\">În VS Code deschideți <code>PROJECT/lab.js</code> și căutați <code>function parityBit8(u, mode)</code>. Citiți validarea și identificați blocul variantei atribuite. Folosiți regula proprie pentru a înlocui numai instrucțiunea <code>return null;</code>. Păstrați restul funcției și nu editați <code>tests.js</code>. Încercați să completați funcția înainte de a consulta explicațiile următoare.</p>"}, {"title": "Citiți indiciile pe rând, după încercarea proprie", "html": "<ol><li><strong>Regula:</strong> bitul întors trebuie să facă totalul <code>k + p</code> par pentru A sau impar pentru B. Verificați separat o numărătoare pară și una impară.</li><li><strong>Intrarea calculului:</strong> <code>countOnes8(u)</code> furnizează numărătoarea <code>k</code>. Valoarea zecimală <code>u</code> și numărul ei de biți 1 sunt lucruri diferite.</li><li><strong>Locul schimbării:</strong> lucrați numai în blocul variantei atribuite, păstrați validarea și folosiți expresia dedusă. Funcția trebuie să returneze numărul 0 sau 1, diferit de numărătoare și de cuvântul transmis.</li><li><strong>Verificarea:</strong> pentru 3 și 7, comparați rezultatul funcției cu predicția obținută prin numărare. Dacă apare o diferență, verificați modul, numărătoarea și tipul rezultatului. Păstrați rezultatul așteptat justificat prin definiție.</li></ol><p class=\"explain\">Opriți-vă la primul indiciu care vă permite să continuați. Formulele și exemplele explică regula; instrucțiunea de returnare pentru varianta atribuită o scrieți individual.</p>"}, {"title": "Exemplu analog: câte cutii de opt obiecte sunt necesare?", "html": "<p class=\"explain\"><strong>Exemplu de sprijin, fără sarcină suplimentară.</strong> Considerăm un număr întreg de obiecte între 0 și 255, deja validat. O cutie poate conține cel mult opt obiecte. Calculăm mai întâi numărul cutiilor pline și folosim restul pentru a decide dacă este necesară o cutie suplimentară. În acest exemplu se cere numărul de cutii, nu bitul de paritate.</p><pre><code>function boxesNeeded(itemCount) {\n  const fullBoxes = Math.floor(itemCount / 8);\n  const extraBox = itemCount % 8 === 0 ? 0 : 1;\n  return fullBoxes + extraBox;\n}</code></pre><p class=\"explain\">Pentru 16 obiecte sunt necesare două cutii pline, deci rezultatul este 2. Pentru 19 obiecte, cele două cutii pline și restul de trei obiecte necesită trei cutii. Pentru zero obiecte rezultatul este 0. Observați succesiunea: valoare intermediară → decizie conform cerinței → rezultat numeric.</p><p class=\"explain\">Fragmentul se poate evalua separat în JavaScript, dar nu se copiază în <code>PROJECT/lab.js</code> și nu se include într-un commit al proiectului. În S07, o funcție furnizată numără biții 1, iar regula alege numai 0 sau 1 pe baza parității totalului. Algoritmul cutiilor este un exemplu analog, fără a rezolva cerința de paritate.</p>"}, {"title": "Salvați și deschideți aplicația din aceeași copie", "html": "<p class=\"explain\">Salvați <code>lab.js</code>, reîncărcați <code>PROJECT/index.html</code> și selectați varianta atribuită. Introduceți 3 și 7 și comparați bitul suplimentar și cuvântul de nouă biți cu predicțiile. Pentru celălalt mod, mesajul <strong>Neimplementat încă</strong>, este normal pentru o cerință care completează numai varianta atribuită.</p>"}, {"title": "De ce un rezultat cu alt tip nu satisface contractul", "html": "<p class=\"explain\">Nu returnați <code>'0'</code>, <code>'1'</code>, <code>true</code> sau <code>false</code>. Testele compară strict valorile; tipul face parte din contract. Interfața poate afișa uneori ceva care pare plauzibil chiar dacă funcția a întors un șir. De aceea inspectăm și testele, nu numai forma textului din aplicație.</p>"}], "connection": "Dacă o explicație rămâne neclară, puteți cere o clarificare înainte de verificarea finală.", "mistake": "Păstrați validateByte și verificarea modului. Funcția returnează bitul de paritate, fără a construi cuvântul afișat.", "prompt": "Consultați sprijinul după încercarea proprie", "answer_after_attempt": true}, {"id": "optional-clarification", "start": 2100, "end": 2280, "title": "Gemini poate clarifica o regulă formulată prin încercarea proprie", "chapter": "04 · Implementăm și explicăm", "rule": "În S07 puteți consulta opțional Gemini, după formularea predicției și a regulii proprii. Solicitați o explicație verificabilă, fără cod, și consemnați afirmația verificată și metoda folosită.", "method": ["Dacă explicația este clară, continuați direct cu testele. Nu este necesar un cont sau un abonament AI pentru a finaliza cerința.", "Dacă folosiți Gemini, precizați varianta și regula proprie. Verificați răspunsul prin numărarea biților și prin rularea testelor, indiferent de tonul convingător al explicației.", "Implementarea S07 rămâne individuală. Nu se solicită transcrierea conversației; în timpul Q07 nu este permisă consultarea AI."], "steps": [{"title": "Alegeți ce anume doriți să clarificați", "html": "<p class=\"explain\">Înainte de a deschide Gemini, formulați o întrebare precisă: „Nu înțeleg de ce …” sau „Regula mea ar da …; vreau să verific …”. Dacă nu aveți o neclaritate, continuați fără AI și menționați acest lucru în însemnări. Consultarea nu este o cerință suplimentară.</p>"}, {"title": "Prompt după completarea regulii proprii", "html": "<p class=\"explain\"><strong>Unde se copiază: câmpul Gemini, numai dacă alegeți consultarea. Completați întâi rubricile dintre paranteze.</strong></p><pre><code>Pentru varianta mea [A-pară/B-impară], regula pe care am dedus-o este: [regula mea].\nPentru 00000011 și 00000111, verifică bitul suplimentar și explică de ce totalul are paritatea cerută.\nNu scrie codul. Păstrează separat cei opt biți de date și bitul de control.\nIndică o afirmație din explicație pe care o pot verifica singur prin numărare sau prin test.</code></pre><p class=\"explain\">Nu includeți parole, jetoane de acces sau date personale în prompt. Pentru clarificare sunt suficiente cerința, regula și cele două șiruri de biți.</p>"}, {"title": "Transformați explicația într-o verificare", "html": "<p class=\"explain\">Selectați o afirmație precisă și verificați-o prin numărarea biților și prin rezultatele aplicației. Pentru o afirmație generală, folosiți regula și testul exhaustiv furnizat. Dacă răspunsul confundă valoarea zecimală cu numărul de biți 1, ilustrați diferența prin 3 și 7.</p>"}, {"title": "Păstrați sursa corect, pe scurt", "html": "<p class=\"explain\">Pentru însemnarea S07 sunt suficiente sursa, afirmația sau întrebarea, verificarea și concluzia. Puteți scrie: „Nu am folosit AI în S07; am verificat regula prin numărare și teste”. Păstrați separat sursa investigației S06: răspunsul Gemini folosit efectiv sau alternativa didactică pregătită. Nu atribuiți unui serviciu un răspuns pe care nu l-ați primit.</p>"}], "connection": "Rulăm din nou aceleași teste, fără să modificăm așteptările.", "mistake": "Calitatea unui prompt nu confirmă rezultatul. Concluzia trebuie susținută prin verificarea efectuată și descrisă.", "prompt": "Consultați pașii de clarificare", "answer_after_attempt": true}, {"id": "retest", "start": 2280, "end": 2520, "title": "Rulați din nou aceleași teste după implementare", "chapter": "05 · Verificăm ce am păstrat", "rule": "Salvați fișierele, reîncărcați pagina și rulați S07 pentru varianta atribuită. Comparați aceleași rezultate așteptate cu valorile observate. Dacă implementarea este corectă, verificările anterior neimplementate trec acum.", "method": ["Nu adăugați din nou testele pentru 3, 7 și 256. Folosiți aceeași listă ca la rularea de dinaintea implementării.", "Pentru setul descris, rularea S07 după implementare indică 48 de verificări trecute, zero eșuate și zero neimplementate. Citiți și rezultatele individuale și rândul care acoperă toate intrările valide.", "Înregistrați etapa, varianta, intrarea, rezultatul așteptat și rezultatul observat. Confirmarea din noua clonă se completează în Moodle numai după clonare și testare."], "steps": [{"title": "Reîncărcați și rulați explicit testele", "html": "<p class=\"explain\">Salvați <code>lab.js</code> și <code>custom-tests.js</code>. Reîncărcați pagina de teste din copia inițială, selectați S07 și varianta atribuită și apăsați <strong>Rulați testele</strong>. Dacă aplicația și testele par să folosească versiuni diferite, verificați ambele căi <code>file:</code> și reîncărcați ambele file.</p>"}, {"title": "Comparați rezultatele setului complet", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"S07 după completarea modului atribuit\"><table><caption>S07 după completarea modului atribuit</caption><thead><tr><th scope=\"col\">Rulare</th><th scope=\"col\">Trecute</th><th scope=\"col\">Eșuate</th><th scope=\"col\">Neimplementate</th></tr></thead><tbody><tr><th scope=\"row\">S07 cu testele cerute</th><td>48</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"explain\">Acum trec cele nouă verificări de paritate anterior neimplementate: șapte furnizate și două proprii. Testul intrării invalide trecea deja. Totalul presupune exemplul binar inițial, signed128 și exact cele trei teste noi; testele suplimentare pot modifica numărul, fără să modifice cerința.</p>"}, {"title": "Verificați aplicația și cele trei cazuri", "html": "<p class=\"explain\">În aplicație introduceți 3 și 7 și citiți bitul de paritate și cuvântul complet. Introduceți apoi 256 și verificați respingerea intrării. Nu consemnați un bit pentru o intrare invalidă. În <code>evidence.md</code> completați tabelul <strong>intrare / operație / așteptat / obținut</strong> din această rulare. Acestea sunt rezultate din clona originală; nu sunt încă rezultate confirmate din noua clonă.</p>"}, {"title": "Dacă un test rămâne eșuat", "html": "<p class=\"explain\">Citiți primul rând care diferă: operația, rezultatul așteptat, valoarea observată și tipul ei. Verificați varianta selectată, blocul editat, salvarea și parantezele expresiei. Dacă funcția returnează text în loc de număr, corectați implementarea, păstrând testul. Dacă blocajul persistă, consemnați diferența observată și ce rămâne de verificat.</p><p class=\"explain\"><strong>Aprofundare opțională, fără test obligatoriu nou:</strong> alegeți un octet valid diferit de 3 și 7. Numărați biții 1, preziceți bitul pentru varianta atribuită și justificați alegerea intrării. Dacă verificați cazul în aplicație, comparați rezultatul cu predicția. Fișa Moodle păstrează aceleași trei teste obligatorii.</p>"}], "connection": "Confirmăm și comportamentul anterior și contractul intrării.", "mistake": "Trecerea testelor variantei atribuite nu demonstrează funcționarea celuilalt mod.", "prompt": "Comparați rezultatele după implementare"}, {"id": "regression", "start": 2520, "end": 2760, "title": "Noua funcție păstrează validarea și remedierea anterioară", "chapter": "05 · Verificăm ce am păstrat", "rule": "Rularea S07 include verificările anterioare. Testați funcția nouă și verificați dacă modificarea păstrează comportamentul existent. Deosebiți textul introdus în interfață de numărul validat primit de funcție.", "method": ["Citirea rezultatelor hexazecimale și a celor pentru interpretarea cu semn din S07 este o verificare de regresie (regression testing): funcționalitatea anterioară trebuie să rămână corectă.", "Testele proprii rulează în toate etapele. Selectarea S05 sau S06 nu ascunde testele de paritate adăugate.", "Rezultatele locale confirmă comportamentul copiei de lucru. Publicarea și testarea unei clone noi verifică dacă aceeași versiune poate fi preluată și rulată de altcineva."], "steps": [{"title": "Citiți verificările anterioare în rularea S07", "html": "<p class=\"explain\">În aceeași rulare S07, citiți rândurile pentru hexazecimal și interpretarea cu semn, inclusiv testul propriu pentru 128. Nu este necesară repetarea tuturor exercițiilor S05–S06. Rezultatele anterioare trebuie să rămână corecte dacă ați modificat numai blocul atribuit. Diferențele din <code>lab.js</code> vă permit să identificați ulterior modificările efectuate.</p>"}, {"title": "Intrarea text nu este argumentul numeric al funcției", "html": "<p class=\"explain\"><code>parseByte</code> acceptă cifre zecimale ASCII, spații la început sau la sfârșit și zerouri inițiale, dacă valoarea este între 0 și 255 inclusiv. Pentru exercițiul nostru, <code>' 003 '</code> devine numărul 3. Textul gol, semnul plus sau minus, fracțiile, notația hexazecimală și 256 sunt respinse. <code>parityBit8</code> primește apoi numărul, nu textul câmpului.</p>"}, {"title": "Testele proprii dintr-o etapă anterioară", "html": "<p class=\"explain\">După adăugarea testelor S07, rularea S06 include și cazurile proprii pentru 3, 7 și 256. Înainte de implementare, primele două sunt neimplementate; după implementarea variantei atribuite, ele trec. Păstrați testele chiar dacă totalul diferă de 37. Etapa selectată filtrează verificările furnizate, fără a filtra lista CustomTests.</p>"}, {"title": "Ce înseamnă verificarea tuturor valorilor valide", "html": "<p class=\"explain\">Rândul exhaustiv testează toate cele 256 de numere întregi valide pentru modul selectat. El verifică ieșirea funcției curente în acest domeniu finit. Nu verifică toate textele posibile, autorul codului sau publicarea. Aceste aspecte au verificări distincte, cu propriile limite.</p>"}], "connection": "Înainte de publicare discutăm ce erori poate detecta paritatea și care pot trece neobservate.", "mistake": "Un total corect fără rânduri citite poate ascunde un mod ales greșit sau teste suplimentare diferite.", "prompt": "Afișați verificările de regresie"}, {"id": "error-patterns", "title": "Ce poate observa bitul de paritate?", "chapter": "05 · Verificăm rezultatul și limitele sale", "start": 2760, "end": 3000, "rule": "Fiecare verificare urmărește o proprietate precisă. Comparăm cuvinte de aceeași lungime și analizăm efectul inversării biților în cuvântul transmis.", "method": ["Păstrați convenția aplicației: opt biți de date și un bit de paritate adăugat la dreapta formează cuvântul transmis de nouă biți.", "Preziceți rezultatul înainte de a consulta explicația. Inversarea unui bit înseamnă schimbarea lui 0 în 1 sau a lui 1 în 0, într-o anumită poziție.", "Deosebiți detectarea unei nepotriviri de identificarea poziției erorii și de corectarea ei. Precizați concluzia susținută de fiecare exemplu."], "steps": [{"title": "Prezicem trei modificări ale aceluiași cuvânt", "html": "<p class=\"explain\">Pentru datele <code>00000011</code>, porniți de la cuvântul valid al variantei atribuite: A — <code>000000110</code>; B — <code>000000111</code>. Ultimul bit este bitul de control. Fără a-l recalcula, analizați trei situații: inversarea primului bit de date, a primilor doi biți de date și numai a ultimului bit. Va fi acceptat fiecare cuvânt primit? Notați predicția și justificarea înainte de a consulta explicația.</p>"}, {"title": "Un bit de date inversat schimbă totalul", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Un bit de date inversat, aceeași paritate așteptată\"><table><caption>Un bit de date inversat, aceeași paritate așteptată</caption><thead><tr><th scope=\"col\">Variantă</th><th scope=\"col\">Cuvânt trimis</th><th scope=\"col\">Cuvânt primit</th><th scope=\"col\">Biți 1 în primit</th><th scope=\"col\">Verificare</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>100000110</code></td><td>3</td><td>Impar: semnalează nepotrivirea.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>100000111</code></td><td>4</td><td>Par: semnalează nepotrivirea.</td></tr></tbody></table></div><p class=\"explain\">Verificați paritatea cuvântului primit conform convenției cunoscute. Nu recalculați și nu înlocuiți bitul de control primit: această operație ar ascunde modificarea investigată.</p>"}, {"title": "Doi biți distincți inversați păstrează paritatea", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Două inversări, un cuvânt diferit care trece verificarea\"><table><caption>Două inversări, un cuvânt diferit care trece verificarea</caption><thead><tr><th scope=\"col\">Variantă</th><th scope=\"col\">Cuvânt trimis</th><th scope=\"col\">Cuvânt primit</th><th scope=\"col\">Biți 1 în primit</th><th scope=\"col\">Verificare</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>110000110</code></td><td>4</td><td>Par: verificarea acceptă, deși datele diferă.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>110000111</code></td><td>5</td><td>Impar: verificarea acceptă, deși datele diferă.</td></tr></tbody></table></div><p class=\"explain\">Cele două poziții sunt distincte. Prima inversare schimbă paritatea, iar a doua restabilește paritatea inițială. Prin urmare, acceptarea la verificare nu demonstrează identitatea mesajului primit cu cel trimis.</p>"}, {"title": "Controlul poate fi și el inversat", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Inversarea numai a bitului de control\"><table><caption>Inversarea numai a bitului de control</caption><thead><tr><th scope=\"col\">Variantă</th><th scope=\"col\">Cuvânt trimis</th><th scope=\"col\">Cuvânt primit</th><th scope=\"col\">Biți 1 în primit</th><th scope=\"col\">Verificare</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>000000111</code></td><td>3</td><td>Nepotrivire detectată.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>000000110</code></td><td>2</td><td>Nepotrivire detectată.</td></tr></tbody></table></div><p class=\"explain\">Verificarea nu poate deosebi schimbarea unui bit de date de schimbarea bitului de control. Inversarea mai multor poziții posibile poate produce aceeași nepotrivire de paritate.</p>"}, {"title": "Formulăm exact limita", "html": "<p class=\"explain\">În modelul cuvântului de nouă biți, inversările în poziții distincte au următorul efect: un număr impar schimbă paritatea și este detectat, iar un număr par păstrează paritatea și trece verificarea. Paritatea simplă nu localizează eroarea și nu o corectează. Analiza nu acoperă inserări, ștergeri sau alte modificări ale lungimii.</p><p class=\"explain\">Comparați predicția cu cele trei situații. Dacă o revizuiți după verificare, explicați motivul. Păstrați această concluzie precisă în locul generalizării „paritatea detectează toate erorile”.</p>"}], "connection": "Acum consemnăm ce am verificat efectiv, înainte de publicarea finală.", "mistake": "Cuvântul de nouă biți este diferit de un octet. Acceptarea parității nu confirmă integritatea completă a mesajului.", "prompt": "Verificați predicția privind erorile", "answer_after_attempt": true}, {"id": "work-notes", "title": "Pregătim explicațiile și textul pentru Moodle", "chapter": "06 · Publicăm o versiune identificabilă", "start": 3000, "end": 3240, "rule": "Consemnați observațiile efectuate înainte de commitul final. SHA-ul final și rezultatele din noua clonă se completează în Moodle după publicare și verificare.", "method": ["Actualizați concis PROJECT/README.md și PROJECT/evidence.md. Păstrați atât predicția, cât și rezultatul, inclusiv atunci când diferă.", "Pregătiți cele zece rubrici ale fișei finale într-un document de lucru sau în editorul Moodle. Marcați explicit rubricile încă neverificate: „de completat după verificare”.", "Instrucțiunile trebuie să permită persoanei care preia proiectul să identifice varianta implementată, modul de pornire și limitele versiunii."], "steps": [{"title": "README descrie versiunea pe care o publicăm", "html": "<p class=\"explain\">În <code>PROJECT/README.md</code> precizează varianta S07 implementată: A — <code>even</code> sau B — <code>odd</code>. Precizați că celălalt mod rămâne neimplementat și că S05/S06 sunt păstrate, dacă ați confirmat aceasta. Actualizați progresul numai pentru pașii deja făcuți; clonarea nouă și depunerea urmează.</p><p class=\"explain\">Pentru pornire, deschideți <code>PROJECT/index.html</code> în browser pentru aplicație și <code>PROJECT/tests.html</code> pentru teste. Selectați S07 și varianta atribuită și rulați testele. Aplicația actualizează rezultatele când modificați intrarea; nu are buton Run. Nu sunt necesare un server local sau biblioteci suplimentare.</p>"}, {"title": "Însemnările păstrează traseul verificării", "html": "<p class=\"explain\">În secțiunea S07 din <code>PROJECT/evidence.md</code> completați varianta, predicțiile pentru 3 și 7, rezultatele observate și respingerea lui 256. Păstrați testele, afirmația S06, ipoteza inițială și concluzia. Dacă ați folosit AI în S07, precizați concis ce ați clarificat și cum ați verificat explicația.</p><p class=\"explain\">Pentru S06, consemnați URL-urile issue-ului și PR-ului și confirmarea integrării numai dacă operațiile au avut loc. Descrieți explicit etapele incomplete. Păstrați ipoteza inițială, chiar dacă rezultatul a infirmat-o.</p>"}, {"title": "Începem fișa finală înainte de ultimele două minute", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce pregătim acum și ce confirmăm după clonare\"><table><caption>Ce pregătim acum și ce confirmăm după clonare</caption><thead><tr><th scope=\"col\">Rubrici</th><th scope=\"col\">Momentul completării</th></tr></thead><tbody><tr><th scope=\"row\">1, 3, 4 și 10</th><td>Repository propriu, variantă, pornire și URL-ul șablonului pot fi pregătite acum.</td></tr><tr><th scope=\"row\">6, 7 și 9</th><td>Afirmația S06, ipoteza/testul/concluzia și sursa provin din însemnările reale.</td></tr><tr><th scope=\"row\">2, 5 și 8</th><td>Pregătiți etichetele acum. După verificare completați SHA-ul final, cele trei rezultate și confirmarea noii clone.</td></tr></tbody></table></div><p class=\"explain\">Puteți pregăti și rezultatele așteptate pentru rubrica 5. Coloana „obținut în copia nouă” rămâne necompletată până rulați acea copie.</p>"}, {"title": "Evităm un identificator care se schimbă prin documentare", "html": "<p class=\"explain\">Nu introduce SHA-ul final al acestui proiect în <code>evidence.md</code> și apoi comite fișierul: noul commit va avea alt identificator. În această activitate, SHA-ul final și confirmarea reproducerii se consemnează numai în Moodle, după ultimul commit și push.</p><p class=\"explain\">Păstrați în proiect metoda de verificare și rezultatele deja observate. Nu declarați anticipat succesul noii clone și nu creați ulterior un commit numai pentru a adăuga confirmarea ei.</p>"}, {"title": "Păstrăm sursa și limitele relevante", "html": "<p class=\"explain\">În README și în rubrica 10 păstrați adresa șablonului comun: <a href=\"https://github.com/antonioclim/BBS-bit-byte-starter\">https://github.com/antonioclim/BBS-bit-byte-starter</a>. În rubrica 1 introduceți adresa depozitului de cod propriu.</p><p class=\"explain\">Dacă există un blocaj, precizați ce ați verificat, ce a eșuat și ce rămâne de făcut. Fișa este obligatorie și fără punctaj separat. Nu se solicită PDF, capturi de ecran sau conversația integrală cu Gemini.</p>"}], "connection": "Citim diferențele înainte să selectăm ce intră în commit.", "mistake": "Completați numai rezultate verificate și deosebiți URL-ul șablonului comun de URL-ul proiectului propriu.", "prompt": "Pregătiți documentarea"}, {"id": "diff-stage", "title": "Ce includem în versiunea finală?", "chapter": "06 · Publicăm o versiune identificabilă", "start": 3240, "end": 3360, "rule": "Salvarea actualizează fișierul local. Selectarea pentru commit (staging) stabilește conținutul care urmează să fie înregistrat. Comparația diferențelor (diff) arată ce s-a modificat.", "method": ["Salvați fișierele relevante și verificați că lucrați pe main în proiectul propriu.", "Comparați modificările cu cerința: varianta atribuită, testele păstrate și documentarea faptelor. Nu modificați tests.js pentru a ascunde un rezultat.", "Selectați fișierele relevante, apoi inspectați conținutul pregătit pentru commit."], "steps": [{"title": "Verificăm locul și ramura", "html": "<p class=\"explain\">Executați comenzile în terminalul VS Code, din directorul principal al proiectului inițial. <code>origin</code> trebuie să indice depozitul de cod propriu, iar ramura trebuie să fie <code>main</code>. În S07 publicați direct pe main; ramura și PR-ul au fost exersate în S06. Nu se cere un PR nou.</p><pre><code>git remote -v\ngit branch --show-current\ngit status</code></pre>"}, {"title": "Citirea diferențelor are întrebări concrete", "html": "<p class=\"explain\">În Source Control deschideți fiecare fișier modificat. În <code>lab.js</code> verificați implementarea variantei atribuite și păstrarea conversiei hexazecimale, a interpretării lui 128 și a validării. În <code>custom-tests.js</code> verificați păstrarea testelor și adăugarea o singură dată a celor trei cazuri. README și evidence trebuie să descrie faptele, pornirea și modul rămas neimplementat.</p><p class=\"explain\">Comanda <code>git diff</code> arată diferențele urmărite care încă nu sunt pregătite pentru commit. Fișierele noi se văd în <code>git status</code> și trebuie deschise separat; un diff gol nu demonstrează că nu există fișiere noi.</p>"}, {"title": "Pregătim numai fișierele relevante", "html": "<p class=\"explain\">Puteți apăsa <strong>+</strong> lângă fiecare fișier relevant din Source Control sau puteți folosi comenzile de mai jos din directorul principal al proiectului. Selectați numai fișierele acestei activități.</p><pre><code>git add PROJECT/lab.js PROJECT/custom-tests.js PROJECT/README.md PROJECT/evidence.md\ngit diff --cached\ngit status</code></pre>"}, {"title": "Verificăm instantaneul pregătit", "html": "<p class=\"explain\"><code>git diff --cached</code> afișează modificările pregătite pentru commit. O editare salvată după selectare poate rămâne în afara acestui conținut. Verificați starea și selectați din nou fișierul relevant.</p><p class=\"explain\">Dacă <code>tests.js</code> sau alt fișier a fost modificat accidental, inspectați diferența și păstrați munca utilă înainte de corectare. Nu folosiți ștergeri generale sau <code>reset --hard</code> pentru a obține o stare aparent curată.</p>"}], "connection": "Înregistrăm instantaneul verificat și îl publicăm în depozitul de cod propriu.", "mistake": "Selectarea pentru commit nu publică fișierul și poate să nu includă o editare ulterioară.", "prompt": "Citiți și selectați modificările"}, {"id": "commit-push", "title": "Înregistrăm și publicăm pe main", "chapter": "06 · Publicăm o versiune identificabilă", "start": 3360, "end": 3480, "rule": "Commitul înregistrează o versiune în istoricul local. După un push reușit, commiturile trimise sunt disponibile pe ramura main a proiectului propriu de pe GitHub.", "method": ["Înregistrați în commit codul, testele și documentarea verificate. Nu includeți confirmarea unei clonări care nu a fost efectuată.", "Trimiteți ramura main către origin și citiți rezultatul operației. Un commit local fără push nu poate fi preluat prin clonarea de pe GitHub.", "Dacă publicarea eșuează, păstrați mesajul și identificați cauza. Nu declarați operația reușită și nu folosiți force push."], "steps": [{"title": "Un mesaj care explică schimbarea", "html": "<p class=\"explain\">În Source Control scrieți un mesaj precum <code>S07: paritate si instructiuni de reproducere</code> și folosiți Commit după inspectarea conținutului selectat. Mesajul descrie modificarea, fără a declara efectuată o verificare viitoare.</p><p class=\"explain\">În terminal, alternativa este:</p><pre><code>git commit -m &quot;S07: paritate si instructiuni de reproducere&quot;</code></pre>"}, {"title": "Publicăm ramura verificată", "html": "<p class=\"explain\">Confirmați că vă aflați pe <code>main</code>, apoi folosiți <strong>Push</strong> în Source Control sau comanda de mai jos. Dacă interfața afișează Sync Changes, aceasta poate include și preluarea schimbărilor; pentru acest pas alegem operația explicită Push.</p><pre><code>git push origin main\ngit status</code></pre>"}, {"title": "Citim succesul și verificăm depozitul de cod online", "html": "<p class=\"explain\">După un push reușit, deschideți proiectul propriu pe GitHub și selectați <code>main</code>. Verificați mesajul ultimului commit și fișierele <code>PROJECT/lab.js</code>, <code>PROJECT/custom-tests.js</code>, <code>PROJECT/README.md</code> și <code>PROJECT/evidence.md</code>. Un fișier salvat local dar neinclus în commit nu apare prin push.</p><p class=\"explain\">Pentru traseul fără schimbări suplimentare, <code>git status</code> arată o stare curată și main la zi cu origin/main. Nu sunt necesare Actions și nu așteptăm aprobarea unui PR nou.</p>"}, {"title": "Dacă push-ul nu reușește", "html": "<p class=\"explain\">Dacă push este refuzat, autentificarea eșuează sau conexiunea lipsește, identificați cauza înainte de a declara versiunea publicată. Verificați URL-ul și contul. Dacă main de pe server s-a modificat, citiți mesajul și clarificați istoricul, fără a-l suprascrie prin force push.</p><p class=\"explain\">Dacă publicarea nu poate fi încheiată, păstrați commitul local și consemnați situația în fișă. Urmați procedura de recuperare a cursului. Blocajul nu introduce o condiție nouă de acces la Q07.</p>"}], "connection": "Identificăm exact commitul publicat, apoi verificăm aceeași versiune dintr-o copie separată.", "mistake": "„Committed” și „pushed” sunt două stări diferite. Un mesaj de eroare la push nu este o confirmare de publicare.", "prompt": "Înregistrați și publicați versiunea"}, {"id": "final-id", "title": "Identificatorul versiunii pe care o predăm", "chapter": "06 · Publicăm o versiune identificabilă", "start": 3480, "end": 3600, "rule": "URL-ul identifică proiectul, ramura indică o linie de dezvoltare, iar SHA-ul complet identifică exact commitul pentru care depuneți rezultatele.", "method": ["După ultimul push reușit, obțineți identificatorul commitului de pe main local și verificați același commit pe GitHub.", "În acest proiect, identificatorul complet SHA-1 are 40 de caractere hexazecimale. Comparați întregul șir; această lungime nu este o regulă pentru toate depozitele Git.", "Introduceți identificatorul în rubrica 2 din Moodle și folosiți-l pentru comparația cu noua clonă."], "steps": [{"title": "Obținem identificatorul după publicare", "html": "<p class=\"explain\">Din copia inițială verificată, executați:</p><pre><code>git branch --show-current\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Ramura trebuie să fie <code>main</code>. Copiați întregul rezultat al ultimei comenzi, fără promptul terminalului sau scurtarea identificatorului. Comanda identifică HEAD local; confirmarea publicării se verifică separat.</p>"}, {"title": "Comparăm cu main de pe GitHub", "html": "<p class=\"explain\">În propriul repository GitHub, cu <code>main</code> selectată, deschideți ultimul commit și copiați SHA-ul complet folosind opțiunea disponibilă. Comparați-l cu rezultatul local. Prefixul scurt dintr-o listă ajută la navigare, dar în fișă introduceți identificatorul complet.</p><p class=\"explain\">Dacă identificatorii diferă, verificați proiectul, ramura și ultimul push. Clarificați diferența înainte de a declara că ați identificat versiunea publicată.</p>"}, {"title": "Repository, ramură și commit au roluri diferite", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce identifică fiecare informație\"><table><caption>Ce identifică fiecare informație</caption><thead><tr><th scope=\"col\">Informație</th><th scope=\"col\">Rol în predare</th></tr></thead><tbody><tr><th scope=\"row\">URL repository propriu</th><td>Unde se găsește proiectul și de unde îl clonați.</td></tr><tr><th scope=\"row\">main</th><td>Ramura finală publicată pentru această activitate.</td></tr><tr><th scope=\"row\">SHA complet</th><td>Commitul precis pentru care declarați rezultatele.</td></tr></tbody></table></div><p class=\"explain\">O adresă corectă nu garantează că ați copiat commitul final, iar același nume de director nu demonstrează că rulați aceeași versiune.</p>"}, {"title": "După o schimbare avem o nouă verificare", "html": "<p class=\"explain\">Dacă modificați codul, testele sau alt fișier necesar, salvați, testați și publicați un nou commit. Preluați noul SHA, verificați versiunea în copia separată și actualizați fișa Moodle. Rezultatele asociate SHA-ului anterior nu descriu automat noua versiune.</p><p class=\"explain\">Nu creați un commit suplimentar numai pentru înscrierea propriului SHA final în evidence.md. Identificatorul final și confirmarea se consemnează în Moodle.</p>"}], "connection": "Clonați depozitul de cod propriu într-un loc separat pentru a verifica versiunea publicată.", "mistake": "git rev-parse HEAD nu demonstrează singur că acel commit a ajuns pe server sau că programul funcționează.", "prompt": "Copiați și verificați SHA-ul complet"}, {"id": "fresh-clone", "title": "O copie nouă, din depozitul de cod propriu", "chapter": "07 · Reproducem versiunea publicată", "start": 3600, "end": 3780, "rule": "Clonarea nouă preia conținutul publicat și poate evidenția fișiere sau modificări prezente numai în copia de lucru, care nu au fost incluse în commiturile trimise.", "method": ["Copiați URL-ul HTTPS al proiectului propriu, diferit de URL-ul șablonului comun.", "Alegeți un alt director părinte, în afara proiectului inițial, și deschideți noua clonă într-o fereastră separată VS Code.", "Nu transferați manual fișiere din copia de lucru în noua clonă. Scopul este verificarea conținutului publicat."], "steps": [{"title": "Alegem un loc separat", "html": "<p class=\"explain\">De exemplu, dacă proiectul original este în <code>Documents/BTI_LUCRU/numele-proiectului</code>, creați sau alegeți <code>Documents/BTI_VERIFICARE</code> ca director părinte separat. Clonați în afara proiectului inițial, într-un director care nu există deja.</p><p class=\"explain\">Păstrați originalul. Noua clonare este o verificare a publicării, nu o mutare sau ștergere a muncii depuse.</p>"}, {"title": "Clonăm din VS Code", "html": "<p class=\"explain\">În GitHub deschideți proiectul propriu și apăsați <strong>Code</strong> pentru a copia URL-ul HTTPS. În VS Code deschideți paleta de comenzi (Command Palette) și alegeți <strong>Git: Clone</strong>; introduceți URL-ul și selectați noul director părinte.</p><p class=\"explain\">Dacă interfața oferă opțiunea, deschideți clona într-o fereastră nouă. În orice caz, verificați calea înainte de a executa comenzile.</p>"}, {"title": "Alternativă prin terminal", "html": "<p class=\"explain\">Din directorul părinte nou, aflat în afara proiectului inițial, înlocuiți adresa din exemplu cu URL-ul propriu. Directorul local <code>BTI_REPRO</code> trebuie să nu existe deja. Comenzile sunt o alternativă la Git: Clone; nu este necesar să clonați de două ori.</p><pre><code>git clone https://github.com/CONTUL_TAU/REPOSITORY_UL_TAU.git BTI_REPRO\ncd BTI_REPRO</code></pre>"}, {"title": "Confirmăm ce am deschis", "html": "<p class=\"explain\">În Explorer trebuie să vedeți rădăcina noii clone cu <code>PROJECT</code>, <code>GUIDES</code> și <code>START.html</code>. Verificați calea completă din fereastră sau din File Explorer/Finder. Două clone pot avea același nume de director în directoare părinte diferite.</p><p class=\"explain\">Dacă ați clonat șablonul sau ați redeschis proiectul inițial, opriți verificarea și identificați adresa și calea corecte. Confirmați reproducerea numai din copia cerută.</p>"}], "connection": "În copia nouă comparăm origin, main, starea și identificatorul complet.", "mistake": "O altă filă de browser sau o fereastră cu același nume nu confirmă schimbarea directorului de lucru.", "prompt": "Creați copia separată"}, {"id": "clone-identity", "title": "Verificăm identitatea copiei noi", "chapter": "07 · Reproducem versiunea publicată", "start": 3780, "end": 3900, "rule": "Comparația este relevantă dacă noua clonă provine din același proiect, este pe main la același commit și nu are modificări locale.", "method": ["Executați comenzile în terminalul noii clone. Verificați directorul curent; un terminal deschis anterior poate indica proiectul inițial.", "Verificați separat adresa origin, ramura main, absența modificărilor locale și concordanța SHA-ului complet.", "Identificarea aceleiași versiuni permite comparația. Comportamentul programului trebuie verificat prin rulare."], "steps": [{"title": "Patru verificări din noua clonă", "html": "<p class=\"explain\">Deschideți un terminal în noua clonă și executați:</p><pre><code>git remote -v\ngit branch --show-current\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Înainte de executare verificați directorul curent al terminalului. Un terminal deschis anterior poate indica încă alt proiect.</p>"}, {"title": "Citim fiecare rezultat", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Identitatea clonei separate\"><table><caption>Identitatea clonei separate</caption><thead><tr><th scope=\"col\">Verificare</th><th scope=\"col\">Ce trebuie confirmat</th></tr></thead><tbody><tr><th scope=\"row\">origin</th><td>URL-ul aceluiași repository propriu; un URL cu sau fără .git poate desemna același repository.</td></tr><tr><th scope=\"row\">Ramură</th><td>main.</td></tr><tr><th scope=\"row\">Stare</th><td>Working tree clean / fără modificări locale.</td></tr><tr><th scope=\"row\">HEAD</th><td>Același identificator complet de 40 de caractere ca versiunea finală publicată.</td></tr></tbody></table></div><p class=\"explain\">Comparați SHA-ul complet din cele două copii. Dacă origin folosește o adresă SSH, verificați că identifică același cont și același proiect; formatul textual al URL-ului poate fi diferit.</p>"}, {"title": "Dacă SHA-ul sau ramura diferă", "html": "<p class=\"explain\">Verificați că ați clonat proiectul propriu, că ultimul push a reușit și că ați selectat <code>main</code>. O clonă obținută înaintea unui nou push poate avea un SHA vechi. Dintr-o copie fără modificări, o actualizare permisă este:</p><pre><code>git switch main\ngit pull --ff-only\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Dacă actualizarea este refuzată sau copia conține modificări, clarificați situația înainte de a continua. Păstrați munca și nu folosiți resetări distructive pentru a ascunde diferența.</p>"}, {"title": "Ce dovedesc și ce nu dovedesc aceste date", "html": "<p class=\"explain\">Același SHA identifică același commit. Absența modificărilor locale permite testarea acelei versiuni, fără editări suplimentare. Aceste informații nu confirmă includerea tuturor fișierelor necesare, trecerea testelor sau autorul codului.</p><p class=\"explain\">Dacă versiunea cerută nu este încă disponibilă, descrieți diferența în rubrica 8. Folosiți confirmarea „aceeași versiune” numai după verificare.</p>"}], "connection": "Deschidem aplicația și testele chiar din PROJECT al acestei clone.", "mistake": "Copierea SHA-ului în fișă nu schimbă versiunea executată de o filă de browser deschisă anterior.", "prompt": "Comparați identitatea versiunii"}, {"id": "reproduction", "title": "Rulăm ceea ce poate prelua altcineva", "chapter": "07 · Reproducem versiunea publicată", "start": 3900, "end": 4080, "rule": "Pentru reproducere, rulați fișierele din copia identificată. Consemnați rezultatele observate și versiunea din care provin.", "method": ["Deschideți PROJECT/index.html și PROJECT/tests.html din directorul noii clone și verificați calea în bara de adrese.", "Selectați varianta atribuită în aplicație și etapa S07 cu aceeași variantă în teste. Repetați cazurile pentru 3, 7 și 256.", "Completați rezultatele din fișa Moodle după această rulare. Rezultatele din copia de lucru nu confirmă comportamentul noii clone."], "steps": [{"title": "Taburile deschid fișierele noii clone", "html": "<p class=\"explain\">Din File Explorer/Finder, în directorul noii clone, deschideți <code>PROJECT/index.html</code> și separat <code>PROJECT/tests.html</code> în browser. Verificați calea fiecărei file: aceasta trebuie să includă noul director părinte. Sursa HTML afișată în VS Code nu este aplicația executată în browser.</p><p class=\"explain\">Paginile funcționează local, fără server. Pentru evitarea confuziei, puteți închide filele vechi. Nu copiați manual în noua clonă fișiere omise la publicare.</p>"}, {"title": "Verificăm aplicația și rulăm S07", "html": "<p class=\"explain\">În aplicație selectați varianta atribuită și introduceți, pe rând, 3, 7 și 256. Verificați bitul de paritate, cuvântul de nouă biți și respingerea intrării invalide. Rezultatele se actualizează la modificarea intrării.</p><p class=\"explain\">În pagina de teste selectați etapa <strong>S07</strong> și varianta <strong>A — even</strong> sau <strong>B — odd</strong>, apoi apăsați <strong>Rulați testele</strong>. Cu setul furnizat, testul 128 și exact cele trei teste cerute, după implementarea modului atribuit sunt 48 trecute, 0 eșuate și 0 neimplementate. Testele suplimentare pot schimba numărul.</p>"}, {"title": "Confirmăm cele trei rezultate efective", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Rezultate de confirmat în noua clonă\"><table><caption>Rezultate de confirmat în noua clonă</caption><thead><tr><th scope=\"col\">Intrare / operație</th><th scope=\"col\">Așteptat A — even</th><th scope=\"col\">Așteptat B — odd</th><th scope=\"col\">Obținut în noua clonă</th></tr></thead><tbody><tr><th scope=\"row\">3 / modul atribuit</th><td>0</td><td>1</td><td>Completați după rulare.</td></tr><tr><th scope=\"row\">7 / același mod</th><td>1</td><td>0</td><td>Completați după rulare.</td></tr><tr><th scope=\"row\">256 / parse-error</th><td><code>ERROR</code></td><td><code>ERROR</code></td><td>Completați respingerea observată.</td></tr></tbody></table></div><p class=\"explain\">La primele două teste, rezultatul este numărul 0 sau 1. La testul invalid, <code>ERROR</code> este indicatorul testului pentru respingerea intrării; textul mesajului din aplicație poate fi o explicație a erorii. Alegerea celuilalt mod poate lăsa cazuri neimplementate și nu este cerința atribuită.</p>"}, {"title": "Când publicarea nu reproduce originalul", "html": "<p class=\"explain\">Dacă lipsește un fișier sau versiunea este greșită, corectați în proiectul inițial, testați și publicați un nou commit. Actualizați copia separată, verificați noul SHA, reîncărcați paginile și repetați testele. Actualizați împreună identificatorul și rezultatele din Moodle.</p><p class=\"explain\">Dacă un test continuă să eșueze, consemnați intrarea, rezultatul așteptat, rezultatul observat și ceea ce nu a putut fi verificat. Noua clonă verifică reproducerea versiunii publicate; nu certifică autorul codului. Nu creați un commit suplimentar numai pentru această confirmare în evidence.md.</p>"}], "connection": "Completăm numai ultimele date ale fișei deja pregătite și verificăm depunerea.", "mistake": "Nu raportați 48 de teste trecute pe baza totalului indicat în lecție. Citiți rezultatele efective și identificați versiunea testată.", "prompt": "Rulați din copia nouă"}, {"id": "submission", "title": "Depunem fișa, fără confirmări presupuse", "chapter": "08 · Încheiem proiectul și evaluarea", "start": 4080, "end": 4140, "rule": "Fișa finală se depune obligatoriu ca text online și nu are punctaj separat. Ea identifică versiunea și consemnează verificarea; depunerea nu condiționează accesul la Q07.", "method": ["Folosiți textul pregătit în minutele 50–60. Completați acum SHA-ul final, rezultatele noii clone și constatarea efectivă privind reproducerea.", "Păstrați exact cele zece rubrici, inclusiv sursa afirmației S06 și URL-ul șablonului. Descrieți explicit eventualele etape rămase incomplete.", "Salvați și verificați starea afișată de Moodle. Prezența textului în editor nu confirmă depunerea."], "steps": [{"title": "Unde introducem textul", "html": "<p class=\"explain\">Deschideți activitatea finală S05–S07 din cursul BTI Moodle și opțiunea de adăugare sau editare a depunerii. În editorul de <strong>Text online</strong> introduceți fișa completată cu datele confirmate. Nu se solicită PDF, capturi de ecran sau conversația integrală cu Gemini.</p><p class=\"explain\">Folosiți limba comunicată pentru seria dumneavoastră. Completați rubricile cu datele proiectului propriu, fără a copia URL-ul, SHA-ul sau rezultatele unui coleg.</p>"}, {"title": "Rubricile 1–5 identifică versiunea și rezultatele", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Primele cinci rubrici\"><table><caption>Primele cinci rubrici</caption><thead><tr><th scope=\"col\">Rubrică</th><th scope=\"col\">Conținut necesar</th></tr></thead><tbody><tr><th scope=\"row\">1 · Repository propriu</th><td>URL-ul proiectului propriu, fără date de autentificare.</td></tr><tr><th scope=\"row\">2 · SHA final</th><td>Identificatorul complet publicat pe main și confirmat în copia nouă.</td></tr><tr><th scope=\"row\">3 · Variantă</th><td>A — even/pară sau B — odd/impară.</td></tr><tr><th scope=\"row\">4 · Pornire</th><td>Aplicația, testele, etapa S07 și varianta; particularități reale dacă există.</td></tr><tr><th scope=\"row\">5 · Trei teste</th><td>3 și 7 în modul atribuit, apoi respingerea lui 256: așteptat și obținut în copia nouă.</td></tr></tbody></table></div><p class=\"explain\">În rubrica 5 consemnați cele trei intrări și rezultatele lor. O afirmație generală precum „toate testele sunt verzi” nu oferă aceste informații.</p>"}, {"title": "Rubricile 6–10 păstrează investigația și proveniența", "html": "<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ultimele cinci rubrici\"><table><caption>Ultimele cinci rubrici</caption><thead><tr><th scope=\"col\">Rubrică</th><th scope=\"col\">Conținut necesar</th></tr></thead><tbody><tr><th scope=\"row\">6 · Afirmație S06</th><td>O afirmație precisă din Gemini sau din exemplul pregătit.</td></tr><tr><th scope=\"row\">7 · Verificare</th><td>În 2–4 propoziții: ipoteza inițială, testul care deosebește explicațiile, așteptat, obținut și concluzia.</td></tr><tr><th scope=\"row\">8 · Reproducere</th><td>Director separat, main, același SHA, fișiere deschise din noua clonă și rezultate / eșecuri reale.</td></tr><tr><th scope=\"row\">9 · Sursă</th><td>Gemini sau exemplul pregătit. Dacă ați folosit AI în S07, precizați clarificarea solicitată și verificarea efectuată.</td></tr><tr><th scope=\"row\">10 · Template</th><td>https://github.com/antonioclim/BBS-bit-byte-starter</td></tr></tbody></table></div><p class=\"explain\">O ipoteză inițială greșită nu este penalizată separat. Descrieți fidel drumul până la concluzie și nu completați rezultate neobținute.</p>"}, {"title": "Structura completă a textului", "html": "<p class=\"explain\">Dacă aveți nevoie de model, copiați structura de mai jos în editorul Moodle și înlocuiți punctele cu datele proprii. Păstrați exact cele zece rubrici și etichetele lor.</p><pre><code>1. URL repository propriu: ...\n2. SHA complet final publicat pe main: ...\n3. Varianta S07: A — even / B — odd\n4. Pornire: ...\n5. Teste din copia nouă:\n   3, operația ...: așteptat ...; obținut ...\n   7, aceeași operație: așteptat ...; obținut ...\n   256, validare: așteptat respingere; obținut ...\n6. Afirmația precisă analizată în S06: ...\n7. Ipoteza inițială, testul și concluzia (2–4 propoziții): ...\n8. Reproducere dintr-o clonă separată: director ..., main, SHA ..., aplicație și teste deschise din copia nouă; rezultate / eșecuri rămase ...\n9. Sursa: Gemini / exemplu pregătit din ghid. Clarificare AI în S07, dacă am folosit: ...\n10. URL template de pornire: ...</code></pre>"}, {"title": "Verificăm starea depunerii", "html": "<p class=\"explain\">Apăsați <strong>Salvați modificările</strong>. În configurația recomandată, salvarea finalizează depunerea fără un buton separat de trimitere. Reveniți la pagina activității și verificați starea și textul salvat.</p><p class=\"explain\">Dacă activitatea existentă are un buton separat de trimitere, efectuați și acel pas și verificați starea finală. Fișa este obligatorie și fără punctaj separat, dar nu necesită aprobare individuală înainte de Q07. Accesul la test nu depinde de completarea automată sau de evaluarea manuală a fișei.</p>"}], "connection": "Închidem materialele de lucru și intrăm în evaluarea individuală.", "mistake": "Un editor deschis, un text nesalvat sau o confirmare preluată din model nu atestă efectuarea verificărilor și depunerea fișei.", "prompt": "Completați și salvați fișa"}, {"id": "quiz-transition", "title": "Q07: interpretăm enunțul, apoi răspundem", "chapter": "08 · Încheiem proiectul și evaluarea", "start": 4140, "end": 4200, "rule": "Q07 durează 15 minute și are maximum 50 de puncte în Moodle, echivalente cu 0,50 puncte la punctajul de seminar. Contribuția cumulată a Q05–Q07 este de maximum un punct la seminar.", "method": ["Rezolvați individual, fără Gemini, alte instrumente AI sau ajutorul colegilor. Fișa comună de referință este permisă.", "Respectați modul de paritate precizat în fiecare întrebare, chiar dacă proiectul propriu implementează cealaltă variantă.", "Testul verifică înțelegerea unor situații descrise în enunț, cu sprijinul permis. El nu inspectează automat proiectul și nu certifică executarea lui sau autorul codului."], "steps": [{"title": "Separăm lucrul practic de test", "html": "<p class=\"explain\">În minutele 70–85 deschideți Q07. Închideți lecția extinsă, simulatorul, Gemini și celelalte materiale de lucru. Păstrați numai fișa comună de ref
