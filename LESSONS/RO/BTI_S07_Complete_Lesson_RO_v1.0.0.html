function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function say(text){$('live').textContent=text;}
function toast(text){clearTimeout(toastTask);$('toast').textContent=text;$('toast').hidden=false;toastTask=setTimeout(()=>$('toast').hidden=true,2300);say(text);}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem('bti-s07-complete-lesson-v1-ro')||'{}');if(Number.isFinite(p.scale))state.scale=Math.max(20,Math.min(200,p.scale));if(p.theme==='light'||p.theme==='dark')state.theme=p.theme;if(typeof p.shortcuts==='boolean')state.shortcuts=p.shortcuts;}catch(_){}}
function savePrefs(){try{localStorage.setItem('bti-s07-complete-lesson-v1-ro',JSON.stringify({scale:state.scale,theme:state.theme,shortcuts:state.shortcuts}));}catch(_){}}
function applyPrefs(){document.documentElement.style.setProperty('--scale',String(state.scale/100));document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.reading=String(state.reading);$('scaleInput').value=state.scale;savePrefs();}
function setScale(n){n=Number(n);if(!Number.isFinite(n)){ $('scaleInput').value=state.scale;return;}state.scale=Math.round(Math.max(20,Math.min(200,n)));applyPrefs();}
function cardMarkup(p,i){return `<article class="lesson" id="topic-${p.id}" data-index="${i}" aria-labelledby="title-${p.id}"><div class="eyebrow"><span>${esc(p.chapter)}</span><span class="time">${time(p.start)}–${time(p.end)} · ${i+1} / ${pages.length}</span></div><h1 id="title-${p.id}">${esc(p.title)}</h1><p class="rule">${esc(p.rule)}</p><ol class="method">${p.method.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol>${p.mistake?`<p class="warning">${esc(p.mistake)}</p>`:''}<div class="example-launch"><button class="primary" data-action="reveal" data-index="${i}">${esc(p.prompt)}</button><span class="state-label" id="label-${i}">Exemplul este ascuns</span></div><section class="example" id="example-${i}" aria-label="Exemplu rezolvat" hidden></section><p class="connection"><b>Legătura cu tema următoare.</b> ${esc(p.connection)}</p></article>`;}
function rebuildLesson(){ $('lessonRoot').innerHTML=pages.map(cardMarkup).join('');for(let i=0;i<pages.length;i++)updateExample(i);updateVisibility(); }
function updateVisibility(){pages.forEach((p,i)=>{ $('topic-'+p.id).hidden=!state.reading&&i!==state.index;});$('modeBtn').textContent=state.reading?'Prezentare pe teme':'Citire continuă';document.documentElement.dataset.reading=String(state.reading);}
function revealLabel(i){const p=pages[i],f=state.frames[i];if(f<0)return p.prompt;if(state.all[i])return 'Reia pas cu pas';return f<p.steps.length-1?'Următorul pas al rezolvării':'Reia exemplul ↺';}
function updateExample(i){const p=pages[i],f=state.frames[i],box=$('example-'+i);const trigger=document.querySelector(`.example-launch button[data-index="${i}"]`);if(trigger){trigger.textContent=revealLabel(i);trigger.setAttribute('aria-expanded',String(f>=0));trigger.setAttribute('aria-controls','example-'+i);}
$('label-'+i).textContent=f<0?'Exemplul este ascuns':state.all[i]?`Toți cei ${p.steps.length} pași sunt afișați`:`Pasul ${f+1} din ${p.steps.length}`;
if(f<0){box.hidden=true;box.innerHTML='';return;}
box.hidden=false;const frames=state.all[i]?p.steps:[p.steps[f]];
box.innerHTML=`<div class="example-head"><span class="example-kicker">${state.all[i]?'REZOLVARE COMPLETĂ':`PASUL ${f+1} / ${p.steps.length}`}</span><div class="example-tools"><button data-action="back" data-index="${i}">← Pasul anterior</button><button data-action="all" data-index="${i}">Rezolvarea completă</button><button data-action="hide" data-index="${i}">Ascunde exemplul</button></div></div>${frames.map(fr=>`<div class="work-frame"><h2>${esc(fr.title)}</h2>${fr.html}</div>`).join('')}<div class="example-bottom"><button class="primary" data-action="reveal" data-index="${i}">${esc(revealLabel(i))}</button><button data-action="theory" data-index="${i}">Revino la metodă ↑</button></div>`;}
function updateNav(){const p=pages[state.index];$('pageCaption').textContent=`${state.index+1} / ${pages.length}`;$('prevBtn').textContent=state.index===0?'← Cuprinsul lecției':'← Tema anterioară';$('nextBtn').textContent=state.index===pages.length-1?'Reia lecția ↺':'Tema următoare →';$('prevBtn').disabled=false;$('nextBtn').disabled=false;$('revealBtn').disabled=false;$('revealBtn').textContent=state.panel?'Revino la lecție':revealLabel(state.index);$('progress').style.width=((state.index+1)/pages.length*100)+'%';$('navStatus').textContent=state.panel?'Panou suplimentar. Butonul Tema următoare revine la lecție și trece la tema următoare.':`${p.chapter} · ${time(p.start)}–${time(p.end)} · ${state.frames[state.index]<0?'Exemplul este ascuns':'Exemplul este afișat'}`;}
function scrollToNode(node){if(!node)return;scrollGuard=true;const stage=$('stage');stage.scrollTop+=node.getBoundingClientRect().top-stage.getBoundingClientRect().top-16;setTimeout(()=>{scrollGuard=false;},100);}
function closePanel(){state.panel=null;$('panelRoot').hidden=true;$('lessonRoot').hidden=false;updateNav();}
function go(i,{keep=false,focus=true}={}){i=Number(i);if(!Number.isInteger(i))return;state.index=Math.max(0,Math.min(pages.length-1,i));closePanel();if(!keep){state.frames[state.index]=-1;state.all[state.index]=false;updateExample(state.index);}updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));if(focus)$('stage').focus({preventScroll:true});say(`Tema ${state.index+1} din ${pages.length}: ${pages[state.index].title}. ${state.frames[state.index]<0?'Exemplul este ascuns până când îl ceri.':state.all[state.index]?`Toți cei ${pages[state.index].steps.length} pași sunt afișați.`:`Este afișat pasul ${state.frames[state.index]+1} din ${pages[state.index].steps.length}.`}`);}
function navigate(delta){if(delta>0){if(state.index===pages.length-1){state.frames.fill(-1);state.all.fill(false);rebuildLesson();go(0);toast('Lecția a fost reluată. Toate exemplele rezolvate sunt ascunse.');}else go(state.index+1);}else if(state.index===0){openPanel('map');}else go(state.index-1);}
function reveal(i=state.index){i=Number(i);if(state.panel){go(state.index,{keep:true});return;}const p=pages[i];if(!p)return;state.index=i;if(state.all[i]||state.frames[i]>=p.steps.length-1){state.frames[i]=0;state.all[i]=false;}else state.frames[i]++;updateExample(i);updateNav();scrollToNode($('example-'+i));say(`${p.title}: ${p.steps[state.frames[i]].title}`);}
function hide(i=state.index){state.frames[i]=-1;state.all[i]=false;updateExample(i);updateNav();scrollToNode($('topic-'+pages[i].id));}
function back(i=state.index){if(state.panel){go(state.index,{keep:true});return;}state.all[i]=false;state.frames[i]=Math.max(-1,state.frames[i]-1);updateExample(i);updateNav();scrollToNode(state.frames[i]<0?$('topic-'+pages[i].id):$('example-'+i));}
function fullWorking(i=state.index){state.frames[i]=pages[i].steps.length-1;state.all[i]=true;updateExample(i);updateNav();scrollToNode($('example-'+i));}
function mode(){state.reading=!state.reading;closePanel();updateVisibility();updateNav();scrollToNode($('topic-'+pages[state.index].id));toast(state.reading?'Citire continuă: toate metodele sunt vizibile; fiecare exemplu se deschide separat.':'Prezentare: câte o temă pe ecran.');}
function panelHead(title){return `<div class="panel"><button class="return" data-command="return">← Revino la lecție</button><h1>${title}</h1>`;}
function openPanel(which){state.panel=which;$('lessonRoot').hidden=true;$('panelRoot').hidden=false;let h='';
if(['parity','errors','publication'].includes(which)){h=s07Panel(which);}
else if(which==='map'){h=panelHead("Cuprinsul lecției")+`<p>Continuăm proiectul propriu din S06, prezicem bitul de paritate, scriem teste și implementăm individual modul atribuit. Publicăm main, verificăm identitatea și rulăm proiectul într-o clonă nouă înainte de predarea finală și Q07.</p><div class="panel-controls"><button data-command="reading">${state.reading?"Prezint\u0103 c\u00e2te o tem\u0103":"Cite\u0219te lec\u021bia continuu"}</button><button data-command="tools">Instrumente de verificare</button><button data-command="reference">Fișa comună</button><button data-command="help">Ajutor și afișare</button></div><div class="map-grid">${pages.map((p,i)=>`<button class="map-item ${state.index===i?'active':''}" data-go="${i}">${i+1}. ${esc(p.title)}<span>${time(p.start)}–${time(p.end)}</span></button>`).join('')}</div><p class="small">Parcursul propus pentru 90 de minute alocă 70 de minute proiectului și pregătirii predării, 15 minute testului Q07 și cinci minute încheierii. Ritmul presupune S06 și instrumentele pregătite. Duratele nu au fost măsurate pentru fiecare grupă.</p></div>`;}
else if(which==='help'){h=panelHead('Citire, navigare și afișare')+`<p><b>Explicațiile sunt vizibile de la început.</b> Apasă E sau butonul verde pentru a parcurge exemplul pe pași. Săgeata spre dreapta trece la tema următoare chiar dacă exemplul nu este terminat. Parcursul complet afișează toate etapele după propria încercare.</p><p><a href="BTI_S07_Lesson_Text_RO_v1.0.0.html">Deschide textul complet pentru citire</a>. Conține aceleași explicații și exemple și funcționează fără JavaScript. Păstrează cele două fișiere în același folder după descărcare. În Moodle folosim și linkul separat către textul pentru citire.</p><div class="panel-controls"><button data-scale="20">20%</button><button data-scale="40">40%</button><button data-scale="60">60%</button><button data-scale="80">80%</button><button data-scale="100">100%</button><button data-scale="140">140%</button><button data-scale="200">200%</button></div><label for="fontRange">Mărimea textului lecției: 20–200%</label><input type="range" id="fontRange" min="20" max="200" step="5" value="${state.scale}" style="width:100%"><p class="small">A− și A+ schimbă mărimea cu cinci puncte procentuale. Poți introduce și un procent exact. Derulează explicațiile mai lungi și tabelele late. Alegem mărimea pentru ecranul și distanța reale.</p><div class="panel-controls"><button data-command="theme">Comută tema luminoasă/întunecată</button><button data-command="fullscreen">Ecran complet</button><button data-command="blank">Ascunde ecranul (B)</button><button data-command="tools">Instrumente și cronometru</button></div><h2>Taste</h2><div class="panel-controls"><button data-command="shortcuts" aria-pressed="${state.shortcuts}">${state.shortcuts?'Comenzi prin litere: activate':'Comenzi prin litere: dezactivate'}</button></div><p class="small">Dezactivează comenzile prin litere dacă interferează cu introducerea textului sau comenzile vocale. Săgețile, Escape și butoanele rămân disponibile.</p><p>← / →: tema anterioară / următoare. E: afișează exemplul sau etapa următoare. Shift+E: etapa anterioară. H: ascunde exemplul. M: cuprins. F: ecran complet. B: ascunde ecranul. Escape: revine la lecție sau restabilește focalizarea tastaturii.</p><p class="small">În câmpurile unui formular, săgețile își păstrează rolul de editare. Escape revine la lecție. Alt+← / Alt+→ permit navigarea și dintr-un câmp.</p><h2>Ce învățăm și de ce</h2><p>Rezolvăm individual o cerință precisă: bitul de paritate pentru modul atribuit. Mai întâi prezicem rezultatele, apoi scriem testele și implementarea. Verificăm ce erori detectează regula și ce rămâne nedetectat.</p><p>După ce uităm comenzile, ne rămân trei întrebări: ce ar trebui să obținem, ce versiune am publicat și poate o copie nouă să reproducă rezultatul?</p><h2>Legătura cu S05 și S06</h2><p>Păstrăm aceeași copie proprie, cu funcția hexazecimală din S05 și remedierea pragului 128 din S06. În S07 publicăm pe main; am exersat deja ramura și pull request în S06. Nu avem nevoie de un nou PR pentru această cerință.</p><h2>Exersare și evaluare</h2><p>Scriem propria predicție și regula înainte să afișăm explicațiile. Gemini este opțional pentru clarificări în S07, după încercarea proprie. Verificăm orice afirmație prin teste. În Q07 nu folosim AI sau colegi; păstrăm numai fișa comună permisă și închidem lecția extinsă și instrumentele. Q07 durează 15 minute și valorează cel mult 0,50 puncte reale. Q05–Q07 valorează împreună cel mult 1 punct.</p><p>Tema finală este obligatorie, cu zece câmpuri Online text și fără punctaj separat. Nu condiționează accesul la Q07 de o aprobare individuală. Nota la quiz nu certifică rularea proiectului sau autorul modificării.</p><h2>Convențiile instrumentelor</h2><p>Parserul reproduce intrarea zecimală din proiect: cifre, eventuale spații înainte și după, un întreg între 0 și 255. Limita suplimentară de 128 de caractere aparține numai instrumentului didactic. Cuvântul pentru paritate are nouă biți: opt pentru date și unul adăugat în dreapta. Laboratorul de erori pornește numai de la un cuvânt valid pentru modul ales.</p><p>Panoul de publicare este o simulare cu două fișiere și copii numerotate. Nu rulează Git, proiectul sau testele și nu accesează GitHub. Compararea identităților nu dovedește că aplicația funcționează.</p><p class="small">Fișierele descărcate funcționează fără internet. Pentru tipărirea tuturor explicațiilor și etapelor folosește textul pentru citire.</p></div>`;}
else if(which==='reference'){h=panelHead("Fișa comună")+S07REFERENCE+'</div>';}
else if(which==='tools'){const u=S07UI;h=panelHead("Instrumente de verificare")+`<p>${u.attempt}</p><div class="panel-controls"><button data-command="parity">${u.parityTitle}</button><button data-command="errors">${u.errorTitle}</button><button data-command="publication">${u.publicationTitle}</button><button data-command="reference">Fișa comună</button></div><h2>Cronometru pentru exersare</h2><p>Cronometrul nu afișează răspunsuri, nu trece la altă temă și nu controlează timpul unui test Moodle.</p><div class="panel-controls"><button data-timer="60">1 min</button><button data-timer="300">5 min</button><button data-timer="600">10 min</button><button data-timer="4200">70 min</button><button data-command="timerPause">Pauză / continuă</button><button data-command="timerOff">Ascunde cronometrul</button></div></div>`;}
else{go(state.index,{keep:true});return;}
$('panelRoot').innerHTML=h;$('stage').scrollTop=0;bindPanel();updateNav();$('stage').focus({preventScroll:true});}
function showTool(fn){const box=$('toolAnswer');box.hidden=false;try{box.classList.remove('tool-error');box.innerHTML=fn();say(S07UI.resultReady);}catch(err){box.classList.add('tool-error');const message=S07UI.errors[err.code||err.message]||S07UI.unexpectedError;box.textContent=message;say(S07UI.errorPrefix+message);}scrollToNode(box);}
function bindPanel(){bindS07Panel();const range=$('fontRange');if(range)range.oninput=()=>setScale(range.value);$('panelRoot').querySelectorAll('form input,form select,form textarea').forEach(el=>{const clear=()=>{const box=$('toolAnswer');if(box){box.hidden=true;box.textContent='';}};el.addEventListener('input',clear);el.addEventListener('change',clear);});}
function startTimer(seconds){seconds=Number(seconds);if(!Number.isFinite(seconds)||seconds<=0)return;timer={total:seconds,left:seconds,deadline:Date.now()+seconds*1000,running:true};$('timerReadout').hidden=false;tick();}
function tick(){if(timer.running){timer.left=Math.max(0,Math.ceil((timer.deadline-Date.now())/1000));if(timer.left===0)timer.running=false;}if(!$('timerReadout').hidden)$('timerReadout').textContent=(timer.left===0?'Timpul a expirat · ':timer.running?'Exercițiu · ':'Pauză · ')+time(timer.left);}
function timerPause(){if(timer.running){tick();timer.running=false;}else if(timer.left>0){timer.deadline=Date.now()+timer.left*1000;timer.running=true;}else {timer.left=timer.total;timer.deadline=Date.now()+timer.left*1000;timer.running=true;}$('timerReadout').hidden=false;tick();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(_){toast('Browserul nu a permis afișarea pe ecran complet. Folosește comanda lui pentru ecran complet.');}}
function blank(){const open=$('blank').hidden;$('blank').hidden=!open;$('app').inert=open;if(open)$('blank').focus();else $('stage').focus({preventScroll:true});}
function command(cmd){if(cmd==='shortcuts'){state.shortcuts=!state.shortcuts;applyPrefs();openPanel('help');return;}if(cmd==='return'){go(state.index,{keep:true});return;}if(cmd==='reading'){mode();return;}if(cmd==='theme'){state.theme=state.theme==='dark'?'light':'dark';applyPrefs();return;}if(cmd==='fullscreen'){fullscreen();return;}if(cmd==='blank'){blank();return;}if(cmd==='timerPause'){timerPause();return;}if(cmd==='timerOff'){timer.running=false;$('timerReadout').hidden=true;return;}openPanel(cmd);}
$('mapBtn').onclick=()=>openPanel('map');$('helpBtn').onclick=()=>openPanel('help');$('toolsBtn').onclick=()=>openPanel('tools');$('modeBtn').onclick=mode;$('fullBtn').onclick=fullscreen;$('smaller').onclick=()=>setScale(state.scale-5);$('larger').onclick=()=>setScale(state.scale+5);$('scaleInput').addEventListener('change',e=>setScale(e.target.value));$('scaleInput').addEventListener('keydown',e=>{if(e.key==='Enter'){setScale(e.target.value);$('stage').focus();}});$('prevBtn').onclick=()=>navigate(-1);$('nextBtn').onclick=()=>navigate(1);$('revealBtn').onclick=()=>reveal();$('blank').onclick=blank;
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.go!==undefined){go(Number(btn.dataset.go));return;}if(btn.dataset.action){const i=Number(btn.dataset.index);state.index=i;const a=btn.dataset.action;if(a==='reveal')reveal(i);else if(a==='hide')hide(i);else if(a==='back')back(i);else if(a==='all')fullWorking(i);else if(a==='theory'){scrollToNode($('topic-'+pages[i].id));updateNav();}return;}if(btn.dataset.scale!==undefined){setScale(btn.dataset.scale);const r=$('fontRange');if(r)r.value=state.scale;return;}if(btn.dataset.timer){startTimer(btn.dataset.timer);return;}if(btn.dataset.command)command(btn.dataset.command);});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!$('blank').hidden){if(['escape','b','enter',' '].includes(k)){e.preventDefault();blank();}return;}if(k==='escape'){e.preventDefault();if(state.panel)go(state.index,{keep:true});else{e.target.blur?.();$('stage').focus({preventScroll:true});}return;}if(e.altKey&&(k==='arrowright'||k==='arrowleft')){e.preventDefault();navigate(k==='arrowright'?1:-1);return;}if(e.ctrlKey||e.altKey||e.metaKey)return;if(!state.shortcuts&&['e','h','m','f','b','+','=','-','−'].includes(k))return;if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(k==='arrowright'||k==='pagedown'){e.preventDefault();if(!e.repeat)navigate(1);}else if(k==='arrowleft'||k==='pageup'){e.preventDefault();if(!e.repeat)navigate(-1);}else if(k==='e'){e.preventDefault();if(e.shiftKey)back();else reveal();}else if(k==='h'){e.preventDefault();if(!state.panel)hide();}else if(k==='m'){e.preventDefault();openPanel('map');}else if(k==='f'){e.preventDefault();fullscreen();}else if(k==='b'){e.preventDefault();blank();}else if(k==='+'||k==='='){e.preventDefault();setScale(state.scale+5);}else if(k==='-'||k==='−'){e.preventDefault();setScale(state.scale-5);}});
$('stage').addEventListener('scroll',()=>{if(!state.reading||state.panel||scrollGuard)return;clearTimeout(scrollTask);scrollTask=setTimeout(()=>{const r=$('stage').getBoundingClientRect();let chosen=state.index;for(let i=0;i<pages.length;i++){const a=$('topic-'+pages[i].id).getBoundingClientRect();if(a.top<=r.top+Math.min(120,r.height*.25)&&a.bottom>r.top+20)chosen=i;}if(chosen!==state.index){state.index=chosen;updateNav();}},80);});

const S07REFERENCE="<section id=\"format-reference\"><h2>Fișa comună de referință</h2><p>Aceasta păstrează integral conținutul fișei comune din proiectul v0.4.0. O folosim în practică și la Q07 conform regulilor comunicate în curs. La Q07 închidem lecția extinsă, instrumentele și AI; păstrăm numai fișa permisă. Fișa include rezultate și reguli utile: quizul verifică înțelegerea cu sprijinul anunțat, fără să certifice proiectul sau autoratul.</p><section class=\"section\"><h2>Opt biți de date</h2><p><strong>Intrare:</strong> întreg zecimal u între 0 și 255 inclusiv. Spațiile de la capete și zerourile inițiale sunt acceptate; golul, textul, numerele negative, fracțiile și 256 sunt respinse.</p><p><strong>Binar:</strong> exact opt poziții, cu ponderile 128, 64, 32, 16, 8, 4, 2 și 1. <strong>Hexazecimal:</strong> exact două caractere, cu A–F majuscule; fiecare caracter descrie patru biți, deoarece 16 = 2⁴. 255 = 15 × 16 + 15 → FF.</p><p><strong>Complement față de doi:</strong> s = u dacă u &lt; 128; s = u − 256 dacă u ≥ 128. Interval cu semn: −128…127. Biții rămân aceiași; se schimbă interpretarea. Prima pondere devine −128.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișa comună de referință\"><table><caption>Fișa comună de referință</caption><thead><tr><th scope=\"col\">u</th><th scope=\"col\">Binar</th><th scope=\"col\">Hex</th><th scope=\"col\">s</th></tr></thead><tbody><tr><td>0</td><td>00000000</td><td>00</td><td>0</td></tr><tr><td>5</td><td>00000101</td><td>05</td><td>5</td></tr><tr><td>127</td><td>01111111</td><td>7F</td><td>127</td></tr><tr><td>128</td><td>10000000</td><td>80</td><td>−128</td></tr><tr><td>129</td><td>10000001</td><td>81</td><td>−127</td></tr><tr><td>255</td><td>11111111</td><td>FF</td><td>−1</td></tr></tbody></table></div></section><section class=\"section\"><h2>Bitul de paritate este separat</h2><p>k = numărul biților 1 din date. <strong>Paritate pară: p = k % 2.</strong> <strong>Paritate impară: p = 1 − (k % 2).</strong> Operatorul % dă restul împărțirii. p este 0 sau 1. Adăugat la dreapta: 8 biți de date + p = un cuvânt de 9 biți.</p><p>O schimbare de bit sau un număr impar de schimbări modifică paritatea. Un număr par o poate păstra. Paritatea simplă nu localizează și nu corectează eroarea.</p><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișa comună de referință\"><table><caption>Fișa comună de referință</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">k</th><th scope=\"col\">A: paritate pară</th><th scope=\"col\">B: paritate impară</th></tr></thead><tbody><tr><td>3 · 00000011</td><td>2</td><td>0</td><td>1</td></tr><tr><td>7 · 00000111</td><td>3</td><td>1</td><td>0</td></tr></tbody></table></div></section><section class=\"section\"><h2>Operațiile Git și rezultatul lor</h2><div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Fișa comună de referință\"><table><caption>Fișa comună de referință</caption><thead><tr><th scope=\"col\">Operație</th><th scope=\"col\">Ce obții</th></tr></thead><tbody><tr><td>Save</td><td>Fișier scris local.</td></tr><tr><td>Diff</td><td>Diferențe între stările comparate. <code>git diff</code>: schimbări neselectate.</td></tr><tr><td>Stage</td><td>Conținut selectat pentru următorul commit. <code>git diff --cached</code>: selecția.</td></tr><tr><td>Commit</td><td>Versiune în istoricul local.</td></tr><tr><td>Push</td><td>Commituri trimise către repository-ul online.</td></tr><tr><td>Clone</td><td>Copie locală cu istoric și legătură origin.</td></tr><tr><td>Issue</td><td>Problemă descrisă, cu pași și rezultate.</td></tr><tr><td>Branch</td><td>Linie separată de lucru.</td></tr><tr><td>Pull request</td><td>Schimbare explicată, propusă pentru integrare.</td></tr><tr><td>Merge + pull</td><td>Integrare online, apoi <code>git pull --ff-only</code> actualizează main local.</td></tr></tbody></table></div><p><code>origin</code> este numele legăturii către repository-ul online. <code>main</code> este ramura principală. <code>git status</code> arată starea; <code>git remote -v</code> arată adresa; <code>git branch --show-current</code> arată ramura; <code>git rev-parse HEAD</code> arată identificatorul complet. Starea locală curată nu dovedește singură publicarea. Dacă editezi după stage, schimbarea nouă trebuie selectată din nou ca să intre în commit.</p></section><section class=\"section\"><h2>Ce verifici și ce poți concluziona</h2><p><strong>Investigație:</strong> ipoteză proprie → afirmație Gemini/exemplu pregătit → test cu rezultat așteptat → rezultat obținut → concluzie. Un contraexemplu infirmă o afirmație universală. Testele la prag și retestarea cazurilor deja corecte previn concluziile pripite.</p><p><strong>Reproducere:</strong> ultimul commit și push → clonare separată → main și același SHA complet → aplicație și teste din copia nouă. SHA-ul final se copiază în Moodle după publicare.</p><p><strong>Evaluare:</strong> individual, fără AI/colegi; această fișă este permisă. Q05: 10 min, maximum 0,20 puncte; Q06: 10 min, maximum 0,30; Q07: 15 min, maximum 0,50. Total ≤ 1 punct. Tema finală este obligatorie, fără punctaj separat.</p></section></section>";

// Pure teaching models: no files, real Git, authentication or network calls.
// The 128-character bound is a lesson UI limit, not the project parser's limit.
function s07Error(code) { const error = new Error(code); error.code = code; throw error; }
function parseByteInput(raw) {
  const input = String(raw);
  if (input.length > 128) s07Error('INPUT_TOO_LONG');
  const text = input.trim();
  if (!/^\d+$/.test(text)) s07Error('INVALID_BYTE_INPUT');
  const value = Number(text);
  if (!Number.isInteger(value) || value < 0 || value > 255) s07Error('BYTE_RANGE');
  return value;
}
function s07Mode(mode) { if (mode !== 'even' && mode !== 'odd') s07Error('INVALID_PARITY_MODE'); return mode; }
function parityPrediction(raw, mode) {
  const value = parseByteInput(raw); s07Mode(mode);
  const binary = value.toString(2).padStart(8, '0');
  const countOnes = [...binary].reduce((sum, bit) => sum + Number(bit), 0);
  const parity = mode === 'even' ? countOnes % 2 : 1 - countOnes % 2;
  return {value, binary, countOnes, mode, parity, totalOnes: countOnes + parity, word: binary + parity};
}
function parityErrorLab(originalWord, flippedPositions, mode) {
  s07Mode(mode);
  if (typeof originalWord !== 'string' || !/^[01]{9}$/.test(originalWord)) s07Error('INVALID_WORD');
  if (!Array.isArray(flippedPositions) || flippedPositions.some(p => !Number.isInteger(p) || p < 0 || p > 8) ||
      new Set(flippedPositions).size !== flippedPositions.length) s07Error('INVALID_FLIPS');
  const originalOnes = [...originalWord].reduce((sum, bit) => sum + Number(bit), 0);
  const target = mode === 'even' ? 0 : 1;
  if (originalOnes % 2 !== target) s07Error('ORIGINAL_PARITY_MISMATCH');
  const selected = new Set(flippedPositions);
  const receivedWord = [...originalWord].map((bit, index) => selected.has(index) ? String(1 - Number(bit)) : bit).join('');
  const receivedOnes = [...receivedWord].reduce((sum, bit) => sum + Number(bit), 0);
  const rulePasses = receivedOnes % 2 === target;
  return {originalWord, receivedWord, mode, flippedPositions: flippedPositions.slice().sort((a,b)=>a-b),
    flips: selected.size, originalOnes, receivedOnes, rulePasses, detected: !rulePasses,
    canLocate: false, canCorrect: false, simulation: true};
}

function createPublicationState() {
  return {working: {code: 'v0', test: null}, index: {code: 'v0', test: null},
    localMain: {id: 'c0', files: {code: 'v0', test: null}},
    remoteMain: {id: 'c0', files: {code: 'v0', test: null}}, freshClone: null,
    history: [{id: 'c0', files: {code: 'v0', test: null}, parent: null}],
    revision: 0, commitNumber: 0, cloneNumber: 0, lastAction: 'reset', changed: false};
}
function s07PublicationState(state) {
  if (!state || typeof state !== 'object' || !Number.isSafeInteger(state.revision) || state.revision < 0 ||
      !Number.isSafeInteger(state.commitNumber) || state.commitNumber < 0 || !Number.isSafeInteger(state.cloneNumber) || state.cloneNumber < 0 || !Array.isArray(state.history) ||
      state.history.length !== state.commitNumber + 1) s07Error('INVALID_PUBLICATION_STATE');
  const version = value => value === null || (typeof value === 'string' && /^v\d+$/.test(value) &&
    Number.isSafeInteger(Number(value.slice(1))) && Number(value.slice(1)) <= state.revision);
  const files = value => value && typeof value === 'object' && Object.keys(value).sort().join(',') === 'code,test' &&
    value.code !== null && version(value.code) && version(value.test);
  const same = (a,b) => a.code === b.code && a.test === b.test;
  if (!files(state.working) || !files(state.index) || !state.history.every((item, i) => item && item.id === 'c' + i &&
      files(item.files) && item.parent === (i === 0 ? null : 'c' + (i - 1))) ||
      state.history[0].files.code !== 'v0' || state.history[0].files.test !== null) s07Error('INVALID_PUBLICATION_STATE');
  const ref = value => value && state.history.some(item => value.id === item.id && files(value.files) && same(value.files, item.files));
  if (!ref(state.localMain) || !ref(state.remoteMain) || state.localMain.id !== 'c' + state.commitNumber ||
      Number(state.remoteMain.id.slice(1)) > Number(state.localMain.id.slice(1)) ||
      (state.freshClone !== null && (!Number.isSafeInteger(state.freshClone.serial) || state.freshClone.serial !== state.cloneNumber || !ref(state.freshClone) || Number(state.freshClone.id.slice(1)) > Number(state.remoteMain.id.slice(1)))))
    s07Error('INVALID_PUBLICATION_STATE');
  return state;
}
function publicationSummary(state) {
  const current = s07PublicationState(state);
  const copy = ref => ref && {id: ref.id, files: {...ref.files}, ...(ref.serial === undefined ? {} : {serial: ref.serial})};
  const same = (a,b) => a.code === b.code && a.test === b.test;
  const unstaged = !same(current.working, current.index), staged = !same(current.index, current.localMain.files);
  return {working: {...current.working}, index: {...current.index}, localMain: copy(current.localMain),
    remoteMain: copy(current.remoteMain), freshClone: copy(current.freshClone), unstaged, staged,
    workspaceClean: !unstaged && !staged, pushed: current.localMain.id === current.remoteMain.id,
    cloneMatchesPublished: Boolean(current.freshClone && current.freshClone.id === current.remoteMain.id),
    cloneMatchesLocal: Boolean(current.freshClone && current.freshClone.id === current.localMain.id),
    cloneHasTest: Boolean(current.freshClone && current.freshClone.files.test !== null),
    testsExecuted: false, testsPassed: null, lastAction: current.lastAction, changed: current.changed, simulation: true};
}
function publicationStep(state, action) {
  const actions = ['saveCode','saveTest','stageCode','stageTest','commit','push','clone','reset'];
  if (!actions.includes(action)) s07Error('INVALID_PUBLICATION_ACTION');
  s07PublicationState(state);
  if (action === 'reset') return createPublicationState();
  const next = { ...state, working: {...state.working}, index: {...state.index},
    localMain: {...state.localMain, files: {...state.localMain.files}},
    remoteMain: {...state.remoteMain, files: {...state.remoteMain.files}},
    freshClone: state.freshClone && {...state.freshClone, files: {...state.freshClone.files}},
    history: state.history.map(item=>({...item, files: {...item.files}})), lastAction: action, changed: false};
  if (action === 'saveCode' || action === 'saveTest') {
    if (next.revision >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
    next.working[action === 'saveCode' ? 'code' : 'test'] = 'v' + (++next.revision); next.changed = true;
  } else if (action === 'stageCode' || action === 'stageTest') {
    const file = action === 'stageCode' ? 'code' : 'test';
    if (next.working[file] === null) s07Error('FILE_NOT_SAVED');
    next.changed = next.index[file] !== next.working[file]; next.index[file] = next.working[file];
  } else if (action === 'commit') {
    if (publicationSummary(state).staged) {
      if (next.commitNumber >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
      const item = {id: 'c' + (++next.commitNumber), files: {...next.index}, parent: next.localMain.id};
      next.history.push(item); next.localMain = {id: item.id, files: {...item.files}}; next.changed = true;
    }
  } else if (action === 'push') {
    next.changed = next.remoteMain.id !== next.localMain.id;
    next.remoteMain = {id: next.localMain.id, files: {...next.localMain.files}};
  } else if (action === 'clone') {
    if (next.cloneNumber >= Number.MAX_SAFE_INTEGER) s07Error('SIMULATION_LIMIT');
    next.freshClone = {id: next.remoteMain.id, files: {...next.remoteMain.files}, serial: ++next.cloneNumber}; next.changed = true;
  }
  s07PublicationState(next); return next;
}
