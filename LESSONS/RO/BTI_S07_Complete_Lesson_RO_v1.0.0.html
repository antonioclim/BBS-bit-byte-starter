<script id="lessonData" type="application/json">{"title":"O cerință individuală și o versiune verificată","version":"1.0.0","language":"ro","duration_seconds":4200,"quiz_separate_minutes":15,"font_min":20,"font_max":200,"pages":[{"id":"start","start":0,"end":120,"title":"Încheiem un proiect pe care îl poate rula și altcineva","chapter":"01 · Reluăm rezultatul din S06","rule":"În S07 rezolvi individual cerința de paritate, publici versiunea finală și o verifici dintr-o clonă nouă. Păstrezi lucrul din S05 și remedierea din S06, împreună cu explicațiile și testele tale.","method":["Am folosit Git pentru a păstra și integra o schimbare. Acum îl folosim pentru a identifica exact versiunea pe care o predăm și pe care o poate prelua altcineva.","Noțiunea BTI este paritatea; cerința software este o funcție cu intrări și ieșiri precise; verificarea practică este reluarea testelor în copia publicată.","După ce uiți sintaxa, păstrează trei întrebări: ce rezultat cere definiția, ce test îl verifică și ce versiune conține acel rezultat?"],"steps":[{"title":"Cele două sensuri ale verificării","html":"<p class=\"explain\">Paritatea verifică o proprietate a unui cuvânt de biți. Clonarea nouă verifică dacă fișierele publicate permit reproducerea rezultatului. Vom explica ce dovedește fiecare verificare și ce nu putem deduce din ea.</p>"},{"title":"Unde continuă proiectul","html":"<p class=\"explain\">Editezi <code>PROJECT/lab.js</code>, <code>custom-tests.js</code>, <code>README.md</code> și <code>evidence.md</code> din aceeași clonă proprie. Nu creezi încă un repository din template. Lecția Moodle actuală te conduce prin S07; fișierele proiectului rămân ale tale.</p>"},{"title":"Ce predai","html":"<p class=\"explain\">La final completezi fișa Moodle cu zece câmpuri: repository, versiune finală, mod atribuit, instrucțiuni și rezultatele verificate, inclusiv investigația S06. Fișa este obligatorie și nu are punctaj separat. Nu cere PDF, capturi de ecran sau conversația integrală cu AI.</p>"},{"title":"Cum folosim cele 90 de minute","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Traseul S07\"><table><caption>Traseul S07</caption><thead><tr><th scope=\"col\">Interval</th><th scope=\"col\">Activitate</th></tr></thead><tbody><tr><th scope=\"row\">0–70 min</th><td>Implementare, teste, publicare, clonare nouă și fișa finală</td></tr><tr><th scope=\"row\">70–85 min</th><td>Q07 individual, maximum 0,50 puncte reale</td></tr><tr><th scope=\"row\">85–90 min</th><td>Recapitulare și ce păstrăm pentru alte proiecte</td></tr></tbody></table></div><p class=\"explain\">Q05, Q06 și Q07 valorează împreună maximum un punct real. Q07 are 50 de puncte brute, transformate în maximum 0,50 puncte reale. Consultarea Gemini în lucrul S07 este opțională; în Q07 nu folosim AI sau ajutorul colegilor. Explicațiile detaliate pot fi recitite și după seminar.</p><p class=\"explain\"><strong>Timpii sunt estimări pentru organizarea seminarului, încă neverificate cu o grupă.</strong> Intervalele de lucru presupun instrumentele pregătite. Dacă apare un blocaj, notează problema și urmează pașii de recuperare stabiliți în curs; descrie rezultatele pe care ai reușit să le verifici.</p>"}],"connection":"Mai întâi regăsim copia care conține remedierea integrată din S06.","mistake":"O pagină de teste verde într-un folder nu identifică automat versiunea publicată din alt folder.","prompt":"Arată punctul de pornire"},{"id":"resume","start":120,"end":360,"title":"Regăsești copia proprie și main","chapter":"01 · Reluăm rezultatul din S06","rule":"Identifici folderul, adresa origin și ramura înainte de actualizare. Continuăm main din proiectul S06, după ce remedierea a fost integrată și preluată local.","method":["Citește fișa de reluare S06 din evidence.md. Folderul de lucru și adresa GitHub trebuie să corespundă aceleiași copii proprii.","Când starea este curată, poți reveni pe main și prelua schimbările. Dacă există modificări utile, le citești și le păstrezi înainte de switch sau pull.","Nu presupune că pull aduce ghidurile noi din template-ul comun. Origin este repository-ul tău independent; urmăm lecția S07 actuală din Moodle."],"steps":[{"title":"Deschide folderul din fișa de reluare","html":"<p class=\"explain\">În VS Code folosește <strong>File → Open Folder</strong> și selectează folderul notat la încheierea S06. În Explorer trebuie să recunoști <code>PROJECT</code>, <code>GUIDES</code> și <code>START.html</code>. Deschide <code>PROJECT/evidence.md</code> și verifică adresa și starea lăsate atunci.</p>"},{"title":"Citește starea înainte de schimbare","html":"<p class=\"explain\"><strong>Unde se copiază: terminalul VS Code, în rădăcina repository-ului propriu.</strong></p><pre><code>git status\ngit remote -v\ngit branch --show-current</code></pre><p class=\"explain\">Recunoști propria adresă la <code>origin</code>. Citește orice fișier modificat. Dacă sunt note S06 utile încă nepublicate, păstrează-le printr-un commit potrivit înainte de actualizare; nu le șterge pentru a face starea să pară curată.</p>"},{"title":"Actualizează main când starea este clară","html":"<p class=\"explain\"><strong>Unde se copiază: același terminal, după păstrarea modificărilor utile.</strong></p><pre><code>git switch main\ngit pull --ff-only\ngit status</code></pre><p class=\"explain\">O actualizare directă sau mesajul „Already up to date” sunt normale. Dacă <code>--ff-only</code> refuză din cauza unui istoric divergent, oprește actualizarea și clarifică diferența cu noi. Nu folosi force push sau reset ca să ascunzi problema.</p>"},{"title":"Dacă folderul nu mai există","html":"<p class=\"explain\">Clonează din nou <strong>repository-ul tău publicat</strong> într-un folder nou și verifică remedierea S06. O clonă nouă din template-ul de pornire ar readuce funcțiile necompletate. Dacă și versiunea online este incompletă, păstrăm starea reală și recuperăm lucrul; nu pretindem că S06 este încheiat.</p>"}],"connection":"Acum verificăm comportamentul anterior, înainte de testele de paritate.","mistake":"Pull actualizează din origin; nu schimbă automat un proiect propriu într-o nouă ediție a template-ului.","prompt":"Arată reluarea copiei"},{"id":"previous-check","start":360,"end":600,"title":"Verifici ce era deja corect în S06","chapter":"01 · Reluăm rezultatul din S06","rule":"Înainte de paritate, rularea S06 trebuie să confirme hexazecimalul din S05 și remedierea interpretării cu semn. Separăm o problemă veche de o cerință încă neimplementată.","method":["Deschide aplicația și testele din folderul identificat, nu dintr-o filă veche al cărei traseu nu-l recunoști.","Reîncarcă pagina după salvarea fișierelor JavaScript. Browserul trebuie să ruleze versiunea pe care o inspectezi în VS Code.","Păstrează testul propriu signed128. Este un exemplu de protejare a unei remedieri atunci când adăugăm o funcție nouă."],"steps":[{"title":"Deschide fișierele locale identificate","html":"<p class=\"explain\">Din File Explorer sau Finder deschide <code>PROJECT/index.html</code> și <code>PROJECT/tests.html</code> din clona proprie. Citește calea <code>file:</code> din browser. Dacă limba nu este cea dorită, folosește selectorul <strong>Limba / Language</strong>. Nu modificăm codul numai pentru a schimba limba.</p>"},{"title":"Rulează S06 înainte de a adăuga testele S07","html":"<p class=\"explain\">În pagina de teste alege <strong>S06 · Interpretare cu semn</strong> și apasă <strong>Rulează testele</strong>. Cu testele furnizate, exemplul binar original și testul propriu pentru 128, ai <strong>37 trecute, 0 eșuate, 0 neimplementate</strong>. Testele suplimentare pot modifica totalul; citește rândurile, nu numai numărul.</p>"},{"title":"Verifică dacă remedierea a ajuns în main local","html":"<p class=\"explain\">În aplicație, valoarea 128 trebuie interpretată cu semn ca −128. Dacă testul S06 nu trece, verifică mai întâi folderul, ramura și salvarea. O remediere aflată numai în PR, numai pe GitHub sau numai într-o altă clonă nu înseamnă că această copie locală o conține. Revino la integrarea S06 și păstrează explicația reală a blocajului.</p>"},{"title":"De ce textele aplicației pot descrie încă starter-ul","html":"<p class=\"explain\">Mesajul despre starea inițială este text furnizat cu proiectul, nu verdict calculat din codul tău. După remediere poate rămâne afișat. Folosește rezultatele efective și testele ca dovezi; nu șterge un mesaj pentru a simula rezolvarea unei funcții. Astăzi nu refacem interfața.</p>"}],"connection":"Atribuim un singur mod de paritate și precizăm rezultatul cerut.","mistake":"În această verificare încă nu ai adăugat cazurile S07. Mai târziu testele proprii de paritate vor rula și în etapele anterioare.","prompt":"Arată verificarea S06"},{"id":"requirement","start":600,"end":780,"title":"Cerința: un bit separat, pentru modul atribuit","chapter":"02 · Din cerință în predicție","rule":"Implementezi numai modul atribuit în parityBit8(u, mode): A înseamnă even, paritate pară; B înseamnă odd, paritate impară. Funcția primește un număr validat și întoarce numărul 0 sau 1.","method":["Numărăm biții 1 din cei opt biți de date și alegem un bit suplimentar astfel încât totalul să aibă paritatea cerută.","Interfața anexează bitul la dreapta. Cuvântul rezultat are nouă biți: opt de date și unul de control. Un octet rămâne alcătuit din opt biți.","Păstrăm validarea, funcțiile deja completate și modul neatribuit. Alegerea A/B este o cerință de proiect, nu o permisiune de a ignora modul specificat într-un item Q07."],"steps":[{"title":"Notează modul primit","html":"<p class=\"explain\">Scrie la începutul secțiunii S07 din <code>PROJECT/evidence.md</code>: <strong>Varianta A — even</strong> sau <strong>Varianta B — odd</strong>, conform atribuirii din seminar. Alege aceeași variantă în aplicație și în pagina de teste. Nu alegi ulterior modul pentru care ai obținut întâmplător rezultate verzi.</p>"},{"title":"Separă datele, numărul de biți 1 și bitul de control","html":"<p class=\"explain\">Numim <code>k</code> numărul de biți 1 din date și <code>p</code> bitul suplimentar. <code>k</code> poate fi un număr de la 0 la 8; <code>p</code> poate fi numai 0 sau 1. Pentru A, totalul <code>k + p</code> trebuie să fie par; pentru B trebuie să fie impar. Numărăm biții 1, nu valoarea zecimală a datelor.</p>"},{"title":"Ce păstrează funcția și ce construiește interfața","html":"<p class=\"explain\"><code>parityBit8</code> nu schimbă octetul <code>u</code> și nu întoarce șirul de nouă caractere. Întoarce numai bitul numeric. Interfața combină apoi cei opt biți din <code>toBinary8(u)</code> cu acest bit. Interpretarea cu semn rămâne aceeași funcție corectată în S06.</p>"},{"title":"Cum te ajută această delimitare","html":"<p class=\"explain\">O cerință mică devine ușor de verificat când precizăm intrarea, ieșirea și responsabilitatea fiecărei funcții. La Q07 vei putea explica diferența dintre date și control. În alte proiecte, aceeași disciplină împiedică o funcție nouă să schimbe accidental formatele sau comportamentul deja folosit.</p>"}],"connection":"Prezici două rezultate înainte de formule sau implementare.","mistake":"Paritatea numărului zecimal introdus nu este numărul de biți 1 din reprezentarea lui.","prompt":"Arată cerința exactă"},{"id":"prediction","start":780,"end":960,"title":"Întâi prezici pentru 3 și 7","chapter":"02 · Din cerință în predicție","rule":"Înainte să consulți tabelul completat sau să modifici funcția, scrie ce bit suplimentar ai alege pentru modul tău și de ce. O predicție păstrată poate fi comparată cu rezultatul real.","method":["Folosește definiția din cerință: totalul biților 1 după anexarea bitului trebuie să aibă paritatea atribuită.","Scrie încercarea în evidence.md și abia apoi arată explicațiile următoare. O corectură ulterioară rămâne vizibilă alături de predicția inițială.","Nu evaluăm separat faptul că prima predicție a fost greșită. Avem nevoie de raționament și de observația care te-a făcut să o revizuiești."],"steps":[{"title":"Încercarea ta, înaintea răspunsului","html":"<p class=\"explain\">Pentru <code>3 = 00000011</code> și <code>7 = 00000111</code>, notează modul primit, numărul de biți 1 și bitul pe care îl propui. Scrie apoi totalul biților 1 după anexare. Nu modifica încă <code>lab.js</code> și nu deschide răspunsul următor până nu ai două predicții proprii.</p>"},{"title":"Verifică numărătoarea","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Datele înaintea bitului de control\"><table><caption>Datele înaintea bitului de control</caption><thead><tr><th scope=\"col\">Valoare</th><th scope=\"col\">Opt biți de date</th><th scope=\"col\">k</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td><code>00000011</code></td><td>2</td></tr><tr><th scope=\"row\">7</th><td><code>00000111</code></td><td>3</td></tr></tbody></table></div><p class=\"explain\">Numărăm pozițiile care conțin 1. Zerourile din stânga păstrează lățimea de opt biți, dar nu contribuie la <code>k</code>. Cele două exemple au numărători de parități diferite, deși ambele valori zecimale sunt impare.</p>"},{"title":"Compară ambele moduri cu definiția","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Predicții justificate pentru A și B\"><table><caption>Predicții justificate pentru A și B</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">k</th><th scope=\"col\">A: p / total</th><th scope=\"col\">B: p / total</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td>2</td><td>0 / 2</td><td>1 / 3</td></tr><tr><th scope=\"row\">7</th><td>3</td><td>1 / 4</td><td>0 / 3</td></tr></tbody></table></div><p class=\"explain\">Pentru A și 3, cei doi biți 1 au deja total par, deci anexăm 0. Pentru A și 7, cei trei biți 1 cer încă un 1. Pentru B, alegerea este opusă, pentru a obține un total impar. Citește numai modul tău ca cerință de implementare; ambele explicații sunt utile pentru a înțelege definiția.</p>"},{"title":"Păstrează nouă poziții și sensul fiecăreia","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Cuvinte formate prin anexare la dreapta\"><table><caption>Cuvinte formate prin anexare la dreapta</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">A: par</th><th scope=\"col\">B: impar</th></tr></thead><tbody><tr><th scope=\"row\">3</th><td><code>000000110</code></td><td><code>000000111</code></td></tr><tr><th scope=\"row\">7</th><td><code>000001111</code></td><td><code>000001110</code></td></tr></tbody></table></div><p class=\"explain\">Ultimul caracter este bitul suplimentar. Primii opt sunt datele inițiale. Nu interpretezi acest cuvânt ca pe rezultatul <code>asSigned8</code> și nu înlocuiești unul dintre cei opt biți cu paritatea.</p>"},{"title":"256 nu primește un bit de paritate","html":"<p class=\"explain\">În aceeași notă adaugă: <strong>intrarea 256 trebuie respinsă</strong>. Un octet fără semn are valori între 0 și 255 inclusiv. Testul invalid verifică validarea, nu caută o paritate pentru 256. În lista de teste vom folosi operația <code>parse-error</code>.</p>"}],"connection":"Transformăm explicația într-o regulă care acoperă toate numărătorile.","mistake":"Nu rescrie predicția inițială ca și cum ai fi știut răspunsul de la început. Notează ce ai schimbat și de ce.","prompt":"Am scris predicțiile; arată verificarea","answer_after_attempt":true},{"id":"parity-rule","start":960,"end":1200,"title":"Deduci regula din totalul cerut","chapter":"02 · Din cerință în predicție","rule":"O regulă generală trebuie să funcționeze pentru orice număr de biți 1, de la niciunul la toți cei opt. O deducem din paritatea totalului, apoi o exprimăm matematic.","method":["Înaintea formulei, descrie în cuvinte ce faci dacă numărătoarea este pară și ce faci dacă este impară.","Compară regula ta cu cele două predicții deja scrise. O regulă care dă același bit pentru orice intrare nu poate satisface ambele cazuri.","Deducerea este pentru datele valide. Validarea rămâne înaintea calculului, iar modul este verificat separat."],"steps":[{"title":"Spune regula înainte de formulă","html":"<p class=\"explain\">Completează în nota ta: „Dacă numărul de biți 1 este par, pentru modul meu adaug …; dacă este impar, adaug …”. Explică pentru fiecare situație de ce totalul obținut are paritatea cerută. Încearcă fără să copiezi o expresie JavaScript.</p>"},{"title":"Restul împărțirii descrie paritatea numărării","html":"<p class=\"explain\">Numim <code>r = k % 2</code> restul împărțirii lui <code>k</code> la 2. Pentru o numărătoare pară, <code>r</code> este 0; pentru o numărătoare impară, este 1. Aici <code>k</code> este un întreg nenegativ, deci această expresie este suficientă pentru cele două cazuri. Nu aplicăm <code>u % 2</code> valorii zecimale a datelor.</p>"},{"title":"Deducerea pentru A și B","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Regula pentru fiecare paritate a numărării\"><table><caption>Regula pentru fiecare paritate a numărării</caption><thead><tr><th scope=\"col\">k</th><th scope=\"col\">r</th><th scope=\"col\">A: p</th><th scope=\"col\">B: p</th></tr></thead><tbody><tr><th scope=\"row\">par</th><td>0</td><td>0</td><td>1</td></tr><tr><th scope=\"row\">impar</th><td>1</td><td>1</td><td>0</td></tr></tbody></table></div><p class=\"explain\">Pentru A, alegem <code>p = k % 2</code>: o numărătoare impară primește încă un 1 și devine pară. Pentru B, alegem <code>p = 1 - (k % 2)</code>: o numărătoare pară primește un 1 și devine impară. Rezultatul fiecărei expresii este bitul numeric, nu totalul <code>k + p</code>.</p>"},{"title":"Verifică și capetele numărării","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Niciun bit 1 și toți cei opt\"><table><caption>Niciun bit 1 și toți cei opt</caption><thead><tr><th scope=\"col\">Date</th><th scope=\"col\">Binar</th><th scope=\"col\">k</th><th scope=\"col\">A: p</th><th scope=\"col\">B: p</th></tr></thead><tbody><tr><th scope=\"row\">0</th><td><code>00000000</code></td><td>0</td><td>0</td><td>1</td></tr><tr><th scope=\"row\">255</th><td><code>11111111</code></td><td>8</td><td>0</td><td>1</td></tr></tbody></table></div><p class=\"explain\">Aceste exemple arată că regula nu are nevoie de cazuri speciale pentru datele zero sau pentru toți biții 1. Totalul cerut decide bitul. Pentru opt biți de date, <code>k</code> poate avea nouă valori, dar bitul suplimentar are numai două.</p>"},{"title":"De ce două exemple nu sunt demonstrația completă","html":"<p class=\"explain\">Exemplele 3 și 7 verifică cele două tipuri de numărătoare, însă justificarea generală este că orice <code>k</code> este fie par, fie impar. Regula acoperă ambele posibilități. Ulterior, testul furnizat verifică și toate cele 256 de intrări valide; păstrăm separat explicația matematică și verificarea programului.</p>"}],"connection":"Scriem teste cu aceste așteptări înainte să implementăm regula.","mistake":"Funcția întoarce p. Nu întoarce k, k + p sau un șir care conține întregul cuvânt.","prompt":"Am încercat regula; arată deducerea","answer_after_attempt":true},{"id":"custom-tests","start":1200,"end":1440,"title":"Adaugi o singură dată cele trei teste proprii","chapter":"03 · Teste înaintea implementării","rule":"În custom-tests.js păstrezi lista existentă și adaugi numai setul modului atribuit: două cazuri valide și respingerea intrării 256. Rezultatele așteptate vin din definiție, înainte de implementare.","method":["Păstrează exemplul binar original și testul pentru pragul 128 din S06. Adăugăm verificări, nu înlocuim istoricul util.","Fiecare obiect are label, input, operation și expected. Virgulele separă obiectele din listă; blocul nu include o nouă declarație CustomTests.","Nu modificăm tests.js. El include automat toate intrările CustomTests, inclusiv când alegem o etapă anterioară."],"steps":[{"title":"Găsește locul în listă și păstrează intrările","html":"<p class=\"explain\">În VS Code deschide <code>PROJECT/custom-tests.js</code>. Găsește lista <code>globalThis.CustomTests = [ ... ];</code>. Păstrează obiectele existente, inclusiv <code>operation: 'signed'</code> pentru 128 și exemplul <code>binary</code>. Adaugă o virgulă după ultimul obiect existent, apoi inserează blocul variantei tale înainte de <code>];</code>.</p>"},{"title":"A — even: obiectele care se adaugă","html":"<p class=\"explain\"><strong>Unde se copiază: numai în lista existentă din PROJECT/custom-tests.js, dacă ai varianta A.</strong></p><pre><code>{ label: 'A: doi biți 1', input: 3, operation: 'parity-even', expected: 0 },\n{ label: 'A: trei biți 1', input: 7, operation: 'parity-even', expected: 1 },\n{ label: 'Respinge 256', input: '256', operation: 'parse-error', expected: 'ERROR' }</code></pre><p class=\"explain\">Primele două rezultate sunt numere fără ghilimele. Al treilea folosește exact textul <code>'ERROR'</code>, convenția runner-ului pentru respingere. Nu copia și setul B.</p>"},{"title":"B — odd: obiectele care se adaugă","html":"<p class=\"explain\"><strong>Unde se copiază: numai în lista existentă din PROJECT/custom-tests.js, dacă ai varianta B.</strong></p><pre><code>{ label: 'B: doi biți 1', input: 3, operation: 'parity-odd', expected: 1 },\n{ label: 'B: trei biți 1', input: 7, operation: 'parity-odd', expected: 0 },\n{ label: 'Respinge 256', input: '256', operation: 'parse-error', expected: 'ERROR' }</code></pre><p class=\"explain\">Aceleași date cer biți opuși față de A, deoarece aici totalul trebuie să fie impar. Cazul invalid este identic pentru ambele variante: validarea octetului nu depinde de paritate.</p>"},{"title":"Salvează și evită dublarea","html":"<p class=\"explain\">Salvează cu <strong>Ctrl+S</strong> sau <strong>Cmd+S</strong>. Citește lista: ai păstrat cele două intrări anterioare și ai adăugat trei noi, pentru un singur mod. Dacă ai mai multe teste proprii legitime, le păstrezi; totalurile din lecție se referă la setul descris aici. În rulările următoare nu lipești din nou blocul.</p>"}],"connection":"Prima rulare arată ce este implementat și ce lipsește încă.","mistake":"Nu înlocui numărul 0 sau 1 cu text, valoare booleană sau rezultatul obținut dintr-o funcție greșită.","prompt":"Arată cele trei teste"},{"id":"initial-run","start":1440,"end":1620,"title":"Citești starea inițială fără să o numești succes","chapter":"03 · Teste înaintea implementării","rule":"Rulezi S07 și modul atribuit înaintea implementării. Null înseamnă Neimplementat; nu înseamnă 0, rezultat corect sau test trecut. Testul pentru intrarea invalidă trebuie să treacă deja.","method":["Reîncarci pagina de teste ca să încarce lista salvată. Alegi S07 și același mod ca în evidence.md.","Citești starea fiecărui rând: trecut, eșuat sau neimplementat. Numărul total fără aceste categorii poate induce în eroare.","Păstrezi această rulare ca punct de comparație pentru după implementare. Nu schimbi așteptările pentru a ascunde o diferență."],"steps":[{"title":"Selectează etapa și modul înainte de rulare","html":"<p class=\"explain\">În browser reîncarcă <code>PROJECT/tests.html</code>. La <strong>Etapa</strong> alege S07; la <strong>Varianta S07</strong> alege A — pară sau B — impară, conform atribuirii. Apasă <strong>Rulează testele</strong>. Schimbarea unui selector recalculează și ea pagina, dar butonul îți oferă un pas explicit de verificare.</p>"},{"title":"Totalurile pentru setul descris","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Înainte de implementarea parității\"><table><caption>Înainte de implementarea parității</caption><thead><tr><th scope=\"col\">Stare</th><th scope=\"col\">Trecute</th><th scope=\"col\">Eșuate</th><th scope=\"col\">Neimplementate</th></tr></thead><tbody><tr><th scope=\"row\">S07 fără cele trei teste noi</th><td>38</td><td>0</td><td>7</td></tr><tr><th scope=\"row\">S07 cu cele trei teste noi</th><td>39</td><td>0</td><td>9</td></tr></tbody></table></div><p class=\"explain\">Cele două cazuri noi de paritate cresc numărul de verificări neimplementate. Respingerea lui 256 adaugă un test trecut, fiindcă validarea există deja. Cele șapte verificări furnizate de paritate includ exemple punctuale și un rând care verifică toate intrările; un rând nu înseamnă întotdeauna o singură intrare.</p>"},{"title":"Păstrează observația în evidence.md","html":"<p class=\"explain\">Notează etapa, modul, totalurile și rezultatele cazurilor proprii: 3 și 7 sunt încă neimplementate, iar 256 este respins. Dacă ai un test eșuat în loc de neimplementat, citește operația și cauza. Dacă paritatea era deja completată, consemnează starea reală și istoricul; nu reinstala artificial <code>null</code> ca să fabrici o primă rulare.</p>"},{"title":"Dacă pagina nu încarcă testele","html":"<p class=\"explain\">Verifică salvarea și sintaxa din <code>custom-tests.js</code>: o virgulă lipsă poate împiedica încărcarea întregii liste. Păstrează numele fișierelor și proprietăților. Dacă apare <strong>custom-tests.js nu s-a încărcat</strong>, nu trata lipsa rândurilor drept lipsa erorilor. Corectează cauza și reîncarcă pagina înainte să continui.</p>"}],"connection":"Acum scrii regula ta pentru funcția pe care o completezi.","mistake":"Nu modificăm tests.js și nu eliminăm rândurile neimplementate. Ele descriu onest starea de dinaintea cerinței.","prompt":"Arată prima rulare"},{"id":"own-rule","start":1620,"end":1800,"title":"Scrii regula ta și o verifici înainte de cod","chapter":"04 · Implementăm și explicăm","rule":"Înainte să modifici return-ul, leagă modul atribuit de o regulă proprie și de cele două predicții. Formularea trebuie să spună ce intrare folosești și ce rezultat întorci.","method":["Folosește k pentru numărul de biți 1. Rezultatul cerut este p, bitul separat, nu numărul de biți 1 și nu valoarea datelor.","Verifică regula cu numărătorile din cele două cazuri. O expresie scurtă nu devine corectă numai pentru că este ușor de copiat.","Poți deschide explicația după încercarea ta. Păstrează orice revizuire, astfel încât testele să aibă o legătură clară cu raționamentul."],"steps":[{"title":"Încercarea proprie","html":"<p class=\"explain\">În <code>evidence.md</code> scrie două-trei propoziții: „Modul meu este … . Dacă numărul de biți 1 este …, aleg …, pentru că … . Funcția trebuie să întoarcă …”. Apoi scrie expresia pe care ai folosi-o, fără să editezi încă funcția. Compară cu predicțiile deja păstrate pentru 3 și 7.</p>"},{"title":"Separă numărătoarea de alegerea bitului","html":"<p class=\"explain\"><code>countOnes8(u)</code> este furnizată. Primește un număr valid și întoarce câți biți 1 are reprezentarea de opt biți. O folosim pentru <code>k</code>; nu o rescriem și nu adăugăm manual câte un rezultat pentru fiecare valoare. Regula de paritate transformă această numărătoare în bitul suplimentar.</p>"},{"title":"Expresiile și o verificare pe hârtie","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Regula verificată pe cele două numărători\"><table><caption>Regula verificată pe cele două numărători</caption><thead><tr><th scope=\"col\">Mod</th><th scope=\"col\">Expresie pentru p</th><th scope=\"col\">k = 2</th><th scope=\"col\">k = 3</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>k % 2</code></td><td>0</td><td>1</td></tr><tr><th scope=\"row\">B — odd</th><td><code>1 - (k % 2)</code></td><td>1</td><td>0</td></tr></tbody></table></div><p class=\"explain\">Restul împărțirii lui 2 la 2 este 0, iar al lui 3 este 1. Pentru B scădem acest rest din 1. Verificarea înlocuiește simbolurile cu valori și întreabă din nou dacă totalul are paritatea cerută.</p>"},{"title":"Ce poți explica fără să memorezi expresia","html":"<p class=\"explain\">Dacă uiți formula, o reconstruiești din cele două posibilități ale numărătorii și din totalul cerut. Acesta este lucrul pe care vrem să-l păstrăm: o cerință explicată, nu o linie memorată. La Q07 un item poate cere celălalt mod; îl deduci din definiție, chiar dacă proiectul tău implementează numai unul.</p>"}],"connection":"Aplicăm regula numai în blocul modului atribuit.","mistake":"Urmărim numărul de biți 1, nu paritatea valorii zecimale u.","prompt":"Am scris regula; arată comparația","answer_after_attempt":true},{"id":"implement","start":1800,"end":2100,"title":"Completezi numai return-ul modului atribuit","chapter":"04 · Implementăm și explicăm","rule":"În parityBit8 păstrezi validarea și cele două blocuri existente. Înlocuiești return null numai în blocul even pentru A sau odd pentru B, apoi salvezi și verifici comportamentul.","method":["Încearcă implementarea pornind de la regula proprie, înainte să dezvălui codul de sprijin. Folosește funcția countOnes8 deja furnizată.","Editarea este individuală. Explicațiile te ajută să legi expresia de definiție, iar testele verifică funcția efectiv salvată.","Modul neatribuit poate rămâne null. Nu extinde cerința dacă asta te împiedică să publici și să reproduci complet modul tău."],"steps":[{"title":"Încercarea ta în fișier","html":"<p class=\"explain\">În VS Code deschide <code>PROJECT/lab.js</code> și caută <code>function parityBit8(u, mode)</code>. Citește validarea și găsește blocul variantei tale. Folosește regula pe care ai scris-o pentru a înlocui numai acel <code>return null;</code>. Nu schimba funcția întreagă și nu edita <code>tests.js</code>. Încearcă întâi înainte de codul următor.</p>"},{"title":"Citește indiciile pe rând, după încercarea proprie","html":"<ol><li><strong>Regula:</strong> bitul întors trebuie să facă totalul <code>k + p</code> par pentru A sau impar pentru B. Verifică separat o numărătoare pară și una impară.</li><li><strong>Intrarea calculului:</strong> <code>countOnes8(u)</code> furnizează numărătoarea <code>k</code>. Valoarea zecimală <code>u</code> și numărul ei de biți 1 sunt lucruri diferite.</li><li><strong>Locul schimbării:</strong> lucrează numai în blocul modului atribuit, păstrează validarea și folosește expresia dedusă pentru acel mod. Funcția trebuie să întoarcă numărul 0 sau 1, nu numărătoarea și nu cuvântul transmis.</li><li><strong>Verificarea:</strong> pentru 3 și 7, compară rezultatul funcției cu predicția din numărarea biților. Dacă un caz diferă, verifică întâi modul, numărătoarea și tipul rezultatului; nu modifica așteptarea testului.</li></ol><p class=\"explain\">Oprește-te la indiciul care îți permite să continui. Formulele și exemplele explică regula; linia de implementare pentru varianta ta o scrii tu.</p>"},{"title":"Exemplu analog: câte cutii de opt obiecte sunt necesare?","html":"<p class=\"explain\"><strong>Exemplu de sprijin, fără sarcină suplimentară.</strong> Avem un număr întreg de obiecte între 0 și 255, deja validat; o cutie poate ține cel mult opt. Mai întâi calculăm cutiile pline; restul spune dacă mai trebuie una. Obiectul problemei este numărul de cutii, nu bitul de paritate.</p><pre><code>function boxesNeeded(itemCount) {\n  const fullBoxes = Math.floor(itemCount / 8);\n  const extraBox = itemCount % 8 === 0 ? 0 : 1;\n  return fullBoxes + extraBox;\n}</code></pre><p class=\"explain\">La 16 obiecte avem două cutii pline și rest zero: rezultatul este 2. La 19 avem două cutii pline și rest 3: rezultatul este 3. Pentru zero obiecte rezultatul este 0. Observă succesiunea: valoare intermediară → decizie din contract → rezultat numeric.</p><p class=\"explain\">Fragmentul se poate evalua separat în JavaScript, dar nu se copiază în <code>PROJECT/lab.js</code> și nu se comite în proiect. În sarcina S07, numărătoarea este furnizată de altă funcție, criteriul privește paritatea totalului și rezultatul este numai 0 sau 1. Regula cutiilor nu rezolvă acea sarcină.</p>"},{"title":"Salvează și deschide aplicația din aceeași copie","html":"<p class=\"explain\">Salvează <code>lab.js</code>, reîncarcă <code>PROJECT/index.html</code> și selectează modul tău. Introdu 3 și 7. Compară bitul separat și cuvântul de nouă biți cu predicțiile. Dacă celălalt mod afișează <strong>Neimplementat încă</strong>, este normal pentru o cerință care completează numai varianta atribuită.</p>"},{"title":"De ce un rezultat cu alt tip nu satisface contractul","html":"<p class=\"explain\">Nu întoarce <code>'0'</code>, <code>'1'</code>, <code>true</code> sau <code>false</code>. Testele compară strict valorile; tipul face parte din contract. Interfața poate afișa uneori ceva care pare plauzibil chiar dacă funcția a întors un șir. De aceea inspectăm și testele, nu numai forma textului din aplicație.</p>"}],"connection":"Dacă o explicație rămâne neclară, poți cere o clarificare înainte de verificarea finală.","mistake":"Nu șterge validateByte sau verificarea modului și nu transforma ieșirea funcției în cuvântul afișat.","prompt":"Am încercat implementarea; arată sprijinul","answer_after_attempt":true},{"id":"optional-clarification","start":2100,"end":2280,"title":"Gemini poate clarifica o regulă pe care ai încercat-o","chapter":"04 · Implementăm și explicăm","rule":"Consultarea Gemini este opțională în S07 și urmează predicția și regula proprie. Cerem o explicație verificabilă, fără cod; păstrăm ce afirmație am verificat și cum.","method":["Dacă explicația îți este deja clară, continui cu testele. Nu ai nevoie de cont sau abonament pentru a încheia această cerință.","Dacă folosești Gemini, specifică modul și propria regulă. Un răspuns aparent sigur nu înlocuiește numărarea și rularea.","S07 rămâne o implementare individuală. Nu cerem un transcript; în Q07 nu este permisă consultarea AI."],"steps":[{"title":"Alege ce anume vrei să clarifici","html":"<p class=\"explain\">Înainte să deschizi Gemini, scrie o întrebare precisă: „Nu înțeleg de ce …” sau „Regula mea ar da …; vreau să verific …”. Dacă nu ai o neclaritate, notează că ai continuat fără consultare S07. Faptul că nu folosești Gemini aici nu este o lipsă a proiectului.</p>"},{"title":"Prompt după completarea regulii tale","html":"<p class=\"explain\"><strong>Unde se copiază: câmpul Gemini, numai dacă alegi consultarea. Completează întâi rubricile dintre paranteze.</strong></p><pre><code>Pentru varianta mea [A-pară/B-impară], regula pe care am dedus-o este: [regula mea].\nPentru 00000011 și 00000111, verifică bitul suplimentar și explică de ce totalul are paritatea cerută.\nNu scrie codul. Păstrează separat cei opt biți de date și bitul de control.\nIndică o afirmație din explicație pe care o pot verifica singur prin numărare sau prin test.</code></pre><p class=\"explain\">Nu incluzi parole, token-uri sau date personale în prompt. Pentru această clarificare sunt suficiente cerința, regula și cele două șiruri de biți.</p>"},{"title":"Transformă explicația în verificare","html":"<p class=\"explain\">Alege o afirmație precisă din răspuns și verific-o cu numărătoarea și rezultatele reale din aplicație. Dacă afirmă ceva despre toate intrările, leagă afirmația de regula generală și de testul exhaustiv furnizat. Dacă răspunsul confundă valoarea zecimală cu numărul de biți 1, arată diferența prin cazurile 3 și 7.</p>"},{"title":"Păstrează sursa onest, pe scurt","html":"<p class=\"explain\">În nota S07 sunt suficiente: sursa consultată, afirmația sau neclaritatea, verificarea și concluzia. Poți scrie „Nu am folosit AI în S07; am verificat regula prin numărare și teste”. Păstrezi separat sursa investigației S06: Gemini folosit efectiv sau alternativa didactică pregătită. Nu atribui unui serviciu un răspuns pe care nu l-ai primit.</p>"}],"connection":"Rulăm din nou aceleași teste, fără să modificăm așteptările.","mistake":"Un prompt bun nu constituie o dovadă a rezultatului. Dovada vine din verificarea descrisă și executată.","prompt":"Am formulat întrebarea; arată pașii","answer_after_attempt":true},{"id":"retest","start":2280,"end":2520,"title":"Rerulezi aceleași teste după implementare","chapter":"05 · Verificăm ce am păstrat","rule":"Salvezi, reîncarci pagina și rulezi S07 pentru modul atribuit. Compari aceleași rezultate așteptate cu ieșirile reale; un test neimplementat trebuie acum să devină trecut, dacă funcția este corectă.","method":["Nu adaugi din nou testele 3, 7 și 256. Refolosești lista care a fost rulată înainte de implementare.","Pentru setul descris, rezultatul S07 complet este 48 trecute, 0 eșuate și 0 neimplementate. Citește și rezultatele proprii și rândul exhaustiv.","Notele păstrează etapa, modul, intrarea, așteptarea și rezultatul observat. Confirmarea clonei noi o vei adăuga în Moodle numai după clonare."],"steps":[{"title":"Reîncarcă și rulează explicit","html":"<p class=\"explain\">Salvează <code>lab.js</code> și <code>custom-tests.js</code>. Reîncarcă pagina de teste din clona originală, alege S07 și modul atribuit, apoi apasă <strong>Rulează testele</strong>. Dacă aplicația și testele par să folosească versiuni diferite, verifică ambele căi <code>file:</code> și reîncarcă ambele file.</p>"},{"title":"Compară rezultatele setului complet","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"S07 după completarea modului atribuit\"><table><caption>S07 după completarea modului atribuit</caption><thead><tr><th scope=\"col\">Rulare</th><th scope=\"col\">Trecute</th><th scope=\"col\">Eșuate</th><th scope=\"col\">Neimplementate</th></tr></thead><tbody><tr><th scope=\"row\">S07 cu testele cerute</th><td>48</td><td>0</td><td>0</td></tr></tbody></table></div><p class=\"explain\">Cele nouă verificări de paritate anterior neimplementate trec acum: șapte furnizate și cele două proprii. Testul invalid trecea deja. Totalul presupune exemplul binar original, signed128 și exact cele trei teste noi; alte teste pot schimba numărul fără să schimbe cerința.</p>"},{"title":"Verifică aplicația și cele trei cazuri","html":"<p class=\"explain\">În aplicație introdu 3 și 7 pentru modul tău și citește bitul separat, apoi cuvântul complet. Introdu 256 și verifică mesajul de respingere; nu raporta un bit pentru o intrare invalidă. În <code>evidence.md</code> completează tabelul <strong>intrare / operație / așteptat / obținut</strong> din această rulare. Acestea sunt rezultate din clona originală; nu sunt încă rezultate confirmate din clona nouă.</p>"},{"title":"Dacă un test rămâne eșuat","html":"<p class=\"explain\">Citește primul rând diferit: operația, așteptarea, ieșirea și tipul ei. Verifică modul selectat, blocul editat, salvarea și parantezele expresiei. Dacă rezultatul este text în loc de număr, schimbă implementarea; nu slăbi testul. Dacă problema rămâne, consemnează diferența reală. Un mesaj onest despre un blocaj este mai util decât un „totul trece” inventat.</p><p class=\"explain\"><strong>Aprofundare opțională, fără test obligatoriu nou:</strong> alege un alt octet valid decât 3 și 7. Numără biții 1, prezice bitul pentru modul tău și explică de ce ai ales intrarea. Dacă o verifici în aplicație, compară numai cu acea predicție. Fișa Moodle păstrează aceleași trei teste cerute.</p>"}],"connection":"Confirmăm și comportamentul anterior și contractul intrării.","mistake":"Nu deduce funcționarea modului neatribuit din succesul testelor modului tău.","prompt":"Arată comparația după implementare"},{"id":"regression","start":2520,"end":2760,"title":"Noua funcție păstrează validarea și remedierea anterioară","chapter":"05 · Verificăm ce am păstrat","rule":"S07 include verificările anterioare. Testăm cerința nouă și faptul că adăugarea ei nu a stricat comportamentul deja completat; păstrăm separat intrarea text și numărul validat primit de funcție.","method":["Citirea rândurilor hexazecimale și cu semn din S07 este o verificare de regresie: ceea ce mergea trebuie să rămână corect.","Testele proprii rulează în toate etapele. Alegerea S05 sau S06 nu ascunde testele de paritate pe care le-ai adăugat.","Rezultatele locale sunt necesare, însă publicarea și clonarea nouă vor verifica dacă aceeași versiune este disponibilă altcuiva."],"steps":[{"title":"Citește verificările anterioare în rularea S07","html":"<p class=\"explain\">În aceeași rulare S07, citește rândurile pentru hexazecimal și interpretarea cu semn, inclusiv testul propriu pentru 128. Nu este nevoie să refaci toate exercițiile S05–S06. Dacă ai schimbat numai blocul de paritate atribuit, aceste rezultate trebuie păstrate. Diferența din <code>lab.js</code> te va ajuta să verifici mai târziu ce ai atins efectiv.</p>"},{"title":"Intrarea text nu este argumentul numeric al funcției","html":"<p class=\"explain\"><code>parseByte</code> acceptă cifre zecimale ASCII, spații la început sau la sfârșit și zerouri inițiale, dacă valoarea este între 0 și 255 inclusiv. Pentru exercițiul nostru, <code>' 003 '</code> devine numărul 3. Textul gol, semnul plus sau minus, fracțiile, notația hexazecimală și 256 sunt respinse. <code>parityBit8</code> primește apoi numărul, nu textul câmpului.</p>"},{"title":"Testele proprii dintr-o etapă anterioară","html":"<p class=\"explain\">După adăugarea testelor S07, o rulare S06 include și obiectele proprii pentru 3, 7 și 256. Înaintea implementării, primele două apar neimplementate; după implementarea modului atribuit, trec. Nu elimina testele ca să regăsești totalul 37 de la început. Etapa selectată filtrează verificările furnizate, dar nu lista ta CustomTests.</p>"},{"title":"Ce înseamnă verificarea tuturor valorilor valide","html":"<p class=\"explain\">Rândul exhaustiv de paritate testează toate cele 256 de numere întregi valide pentru modul selectat. El verifică ieșirea calculată de funcția actuală în acest domeniu finit. Nu verifică automat toate textele posibile, autorul codului sau publicarea lui. Pentru acestea folosim validarea și pașii de identificare și reproducere, fără să pretindem că un singur test dovedește tot proiectul.</p>"}],"connection":"Înainte de publicare discutăm ce erori poate detecta paritatea și care pot trece neobservate.","mistake":"Un total corect fără rânduri citite poate ascunde un mod ales greșit sau teste suplimentare diferite.","prompt":"Arată ce păstrăm și ce verificăm"},{"id":"error-patterns","title":"Ce poate observa bitul de paritate?","chapter":"05 · Verificăm rezultatul și limitele sale","start":2760,"end":3000,"rule":"O verificare are un scop precis. Comparăm mesaje de aceeași lungime și investigăm ce se întâmplă când inversăm biți în cuvântul transmis.","method":["Păstrăm convenția stabilită: opt biți de date, apoi un bit de paritate în dreapta. Cuvântul transmis are nouă biți.","Prezicem rezultatul verificării înainte să citim explicația. Un bit inversat înseamnă 0 devenit 1 sau 1 devenit 0, într-o poziție fixată.","Separăm semnalarea unei nepotriviri de identificarea și corectarea erorii. Vom stabili ce concluzie permite fiecare exemplu."],"steps":[{"title":"Prezicem trei modificări ale aceluiași cuvânt","html":"<p class=\"explain\">Pentru datele <code>00000011</code>, pornește de la cuvântul valid al variantei tale: A — <code>000000110</code>; B — <code>000000111</code>. Ultimul bit este controlul. Fără să calculezi un nou bit de paritate, imaginează-ți: inversarea primului bit de date, inversarea primilor doi biți de date și inversarea numai a ultimului bit. Va accepta verificarea fiecare cuvânt primit? Notează predicția și motivul, apoi dezvăluie explicația.</p>"},{"title":"Un bit de date inversat schimbă totalul","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Un bit de date inversat, aceeași paritate așteptată\"><table><caption>Un bit de date inversat, aceeași paritate așteptată</caption><thead><tr><th scope=\"col\">Variantă</th><th scope=\"col\">Cuvânt trimis</th><th scope=\"col\">Cuvânt primit</th><th scope=\"col\">Biți 1 în primit</th><th scope=\"col\">Verificare</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>100000110</code></td><td>3</td><td>Impar: semnalează nepotrivirea.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>100000111</code></td><td>4</td><td>Par: semnalează nepotrivirea.</td></tr></tbody></table></div><p class=\"explain\">Verificăm paritatea cuvântului primit folosind convenția cunoscută. Nu recalculăm și înlocuim bitul de control primit: am ascunde tocmai schimbarea pe care vrem să o observăm.</p>"},{"title":"Doi biți distincți inversați păstrează paritatea","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Două inversări, un cuvânt diferit care trece verificarea\"><table><caption>Două inversări, un cuvânt diferit care trece verificarea</caption><thead><tr><th scope=\"col\">Variantă</th><th scope=\"col\">Cuvânt trimis</th><th scope=\"col\">Cuvânt primit</th><th scope=\"col\">Biți 1 în primit</th><th scope=\"col\">Verificare</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>110000110</code></td><td>4</td><td>Par: verificarea acceptă, deși datele diferă.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>110000111</code></td><td>5</td><td>Impar: verificarea acceptă, deși datele diferă.</td></tr></tbody></table></div><p class=\"explain\">Aceste două poziții sunt distincte. Fiecare inversare schimbă paritatea, iar a doua o schimbă înapoi. Acceptarea nu demonstrează că mesajul primit este identic cu cel trimis.</p>"},{"title":"Controlul poate fi și el inversat","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Inversarea numai a bitului de control\"><table><caption>Inversarea numai a bitului de control</caption><thead><tr><th scope=\"col\">Variantă</th><th scope=\"col\">Cuvânt trimis</th><th scope=\"col\">Cuvânt primit</th><th scope=\"col\">Biți 1 în primit</th><th scope=\"col\">Verificare</th></tr></thead><tbody><tr><th scope=\"row\">A — even</th><td><code>000000110</code></td><td><code>000000111</code></td><td>3</td><td>Nepotrivire detectată.</td></tr><tr><th scope=\"row\">B — odd</th><td><code>000000111</code></td><td><code>000000110</code></td><td>2</td><td>Nepotrivire detectată.</td></tr></tbody></table></div><p class=\"explain\">Verificarea nu poate spune dacă s-a schimbat un bit de date sau bitul de control. Există mai multe poziții ale căror inversări ar produce aceeași nepotrivire.</p>"},{"title":"Formulăm exact limita","html":"<p class=\"explain\">În acest model, pentru un cuvânt de nouă biți și inversări în poziții distincte, orice număr impar de inversări schimbă paritatea și este detectat. Orice număr par de inversări păstrează paritatea și trece această verificare. Paritatea simplă nu localizează și nu corectează eroarea. Nu am analizat aici inserări, ștergeri sau alte schimbări de lungime.</p><p class=\"explain\">Compară predicția ta cu cele trei situații. O predicție corectată după verificare arată ce ai înțeles; păstrează o explicație precisă în locul afirmației prea largi „paritatea detectează toate erorile”.</p>"}],"connection":"Acum consemnăm ce am verificat efectiv, înainte de publicarea finală.","mistake":"Nu trata cei nouă biți drept un octet și nu confunda acceptarea parității cu integritatea completă a mesajului.","prompt":"Am o predicție; arată verificarea","answer_after_attempt":true},{"id":"work-notes","title":"Pregătim explicațiile și textul pentru Moodle","chapter":"06 · Publicăm o versiune identificabilă","start":3000,"end":3240,"rule":"Înregistrăm faptele deja observate înainte de commitul final. SHA-ul final și rezultatele clonei noi se completează în Moodle după operațiile care le stabilesc.","method":["Actualizăm scurt PROJECT/README.md și PROJECT/evidence.md; păstrăm predicția și rezultatul chiar dacă diferă.","Pregătim acum cele zece rubrici ale fișei finale într-un document de lucru sau în editorul Moodle. Rubricile încă neverificate rămân explicit „de completat după verificare”.","O persoană care preia proiectul trebuie să poată identifica modul implementat, pornirea și limitele reale ale versiunii."],"steps":[{"title":"README descrie versiunea pe care o publicăm","html":"<p class=\"explain\">În <code>PROJECT/README.md</code> precizează varianta S07 implementată: A — <code>even</code> sau B — <code>odd</code>. Spune că celălalt mod rămâne neimplementat și că S05/S06 sunt păstrate, dacă ai confirmat aceasta. Actualizează progresul numai pentru pașii deja făcuți; clonarea nouă și depunerea urmează.</p><p class=\"explain\">Instrucțiunile de pornire: deschizi <code>PROJECT/index.html</code> în browser pentru aplicație și <code>PROJECT/tests.html</code> pentru teste; alegi S07 și varianta ta, apoi rulezi testele. Aplicația se actualizează când schimbi intrarea; nu are buton Run. Nu sunt necesare server local sau biblioteci suplimentare.</p>"},{"title":"Însemnările păstrează traseul verificării","html":"<p class=\"explain\">În secțiunea S07 din <code>PROJECT/evidence.md</code> completează varianta, predicțiile pentru 3 și 7, rezultatele observate și respingerea lui 256. Păstrează testele și afirmația S06, ipoteza inițială și concluzia. Dacă ai folosit AI în S07, scrie pe scurt ce ai clarificat și cum ai verificat.</p><p class=\"explain\">Pentru S06, URL-ul issue-ului, URL-ul PR-ului și confirmarea integrării pot fi trecute numai dacă operațiile au avut loc. O stare încă incompletă se descrie explicit. Nu înlocui o ipoteză inițială greșită cu una inventată după rezultat.</p>"},{"title":"Începem fișa finală înainte de ultimele două minute","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce pregătim acum și ce confirmăm după clonare\"><table><caption>Ce pregătim acum și ce confirmăm după clonare</caption><thead><tr><th scope=\"col\">Rubrici</th><th scope=\"col\">Momentul completării</th></tr></thead><tbody><tr><th scope=\"row\">1, 3, 4 și 10</th><td>Repository propriu, variantă, pornire și URL-ul template-ului pot fi pregătite acum.</td></tr><tr><th scope=\"row\">6, 7 și 9</th><td>Afirmația S06, ipoteza/testul/concluzia și sursa provin din însemnările reale.</td></tr><tr><th scope=\"row\">2, 5 și 8</th><td>Pregătești etichetele acum; SHA-ul final, cele trei rezultate și confirmarea clonei se completează după verificare.</td></tr></tbody></table></div><p class=\"explain\">Poți pregăti și rezultatele așteptate pentru rubrica 5. Coloana „obținut în copia nouă” rămâne necompletată până rulezi acea copie.</p>"},{"title":"Evităm un identificator care se schimbă prin documentare","html":"<p class=\"explain\">Nu introduce SHA-ul final al acestui proiect în <code>evidence.md</code> și apoi comite fișierul: noul commit va avea alt identificator. În această activitate, SHA-ul final și confirmarea reproducerii se consemnează numai în Moodle, după ultimul commit și push.</p><p class=\"explain\">Poți păstra în proiect explicații despre metoda de verificare și rezultatele deja obținute. Nu declara anticipat „clona nouă a trecut”, iar după clonare nu crea un commit suplimentar numai pentru a adăuga acea confirmare.</p>"},{"title":"Păstrăm sursa și limitele relevante","html":"<p class=\"explain\">În README și în rubrica 10 păstrează adresa template-ului comun: <a href=\"https://github.com/antonioclim/BBS-bit-byte-starter\">https://github.com/antonioclim/BBS-bit-byte-starter</a>. Rubrica 1 conține altă adresă: repository-ul tău.</p><p class=\"explain\">Dacă ai un blocaj, precizează ce ai verificat, ce a eșuat și ce mai trebuie făcut. Fișa este obligatorie și fără punctaj separat; nu se cer PDF, capturi de ecran sau transcriptul Gemini.</p>"}],"connection":"Citim diferențele înainte să selectăm ce intră în commit.","mistake":"Nu completa rubricile viitoare cu rezultate presupuse și nu confunda URL-ul sursei comune cu URL-ul proiectului propriu.","prompt":"Pregătește documentarea"},{"id":"diff-stage","title":"Ce includem în versiunea finală?","chapter":"06 · Publicăm o versiune identificabilă","start":3240,"end":3360,"rule":"Salvarea schimbă fișierul, iar staging selectează versiunea care va intra în commit. Diff-ul ne arată schimbările înainte de înregistrare.","method":["Salvăm fișierele relevante și verificăm că lucrăm pe main în repository-ul propriu.","Citirea diferențelor trebuie să confirme cerința: modul atribuit, testele păstrate și documentarea reală. Nu modificăm tests.js ca să ascundem un rezultat.","Selectăm fișierele relevante, apoi citim din nou varianta pregătită pentru commit."],"steps":[{"title":"Verificăm locul și ramura","html":"<p class=\"explain\">În terminalul VS Code din rădăcina proiectului original rulează comenzile de mai jos. <code>origin</code> trebuie să fie repository-ul tău, iar ramura trebuie să fie <code>main</code>. În S07 publicăm direct pe main; ramura și PR-ul au fost exersate în S06. Nu se cere un PR nou.</p><pre><code>git remote -v\ngit branch --show-current\ngit status</code></pre>"},{"title":"Citirea diferențelor are întrebări concrete","html":"<p class=\"explain\">În Source Control, deschide fiecare fișier schimbat. În <code>lab.js</code> verifică numai modul de paritate atribuit și păstrarea conversiei hexazecimale, a interpretării lui 128 și a validării. În <code>custom-tests.js</code> verifică testele existente și adăugarea unică a celor trei teste. README și evidence trebuie să descrie fapte, pornirea și limita modului neimplementat.</p><p class=\"explain\">Comanda <code>git diff</code> arată diferențele urmărite care încă nu sunt pregătite pentru commit. Fișierele noi se văd în <code>git status</code> și trebuie deschise separat; un diff gol nu demonstrează că nu există fișiere noi.</p>"},{"title":"Pregătim numai fișierele relevante","html":"<p class=\"explain\">Poți apăsa <strong>+</strong> lângă fiecare fișier relevant în Source Control sau folosi blocul de mai jos din rădăcina repository-ului. Nu copia automat o selecție a întregului calculator ori a unui alt proiect.</p><pre><code>git add PROJECT/lab.js PROJECT/custom-tests.js PROJECT/README.md PROJECT/evidence.md\ngit diff --cached\ngit status</code></pre>"},{"title":"Verificăm instantaneul pregătit","html":"<p class=\"explain\"><code>git diff --cached</code> arată schimbările pregătite pentru commit. Dacă ai salvat un fișier din nou după staging, ultima modificare poate fi încă în afara acestei selecții; citește starea și pregătește din nou fișierul relevant.</p><p class=\"explain\">Dacă <code>tests.js</code> sau alt fișier s-a schimbat accidental, inspectează și păstrează munca utilă înainte de a corecta situația. Nu folosi ștergeri generale sau <code>reset --hard</code> pentru a obține o stare aparent curată.</p>"}],"connection":"Înregistrăm instantaneul verificat și îl publicăm în repository-ul propriu.","mistake":"O bifă de staging nu înseamnă că fișierul este publicat și nu garantează că include ultima editare.","prompt":"Citește și selectează schimbările"},{"id":"commit-push","title":"Înregistrăm și publicăm pe main","chapter":"06 · Publicăm o versiune identificabilă","start":3360,"end":3480,"rule":"Commitul înregistrează o versiune locală. Push-ul reușit publică acele commituri pe ramura main a repository-ului propriu.","method":["Încheiem commitul cu fișierele de cod, teste și documentare verificate. Nu comitem o confirmare a clonei care încă nu există.","Trimitem main către propriul origin și citim rezultatul operației. Un commit fără push nu este versiunea disponibilă pentru clonarea de pe GitHub.","Dacă publicarea se oprește, păstrăm mesajul și rezolvăm cauza; nu declarăm o publicare reușită și nu folosim force push."],"steps":[{"title":"Un mesaj care explică schimbarea","html":"<p class=\"explain\">În Source Control, scrie un mesaj precum <code>S07: paritate si instructiuni de reproducere</code> și folosește Commit după ce ai verificat staging. Acest mesaj spune ce s-a schimbat, fără să pretindă că verificarea viitoare a fost deja făcută.</p><p class=\"explain\">În terminal, alternativa este:</p><pre><code>git commit -m &quot;S07: paritate si instructiuni de reproducere&quot;</code></pre>"},{"title":"Publicăm ramura verificată","html":"<p class=\"explain\">Confirmă că ai rămas pe <code>main</code>, apoi folosește <strong>Push</strong> în Source Control sau comanda de mai jos. Dacă interfața afișează Sync Changes, aceasta poate include și preluarea schimbărilor; pentru acest pas alegem operația explicită Push.</p><pre><code>git push origin main\ngit status</code></pre>"},{"title":"Citim succesul și verificăm repository-ul online","html":"<p class=\"explain\">După un push reușit, deschide propriul repository pe GitHub și selectează <code>main</code>. Verifică mesajul ultimului commit și fișierele <code>PROJECT/lab.js</code>, <code>PROJECT/custom-tests.js</code>, <code>PROJECT/README.md</code> și <code>PROJECT/evidence.md</code>. Un fișier salvat local dar neinclus în commit nu apare prin push.</p><p class=\"explain\">Pentru traseul fără schimbări suplimentare, <code>git status</code> arată o stare curată și main la zi cu origin/main. Nu sunt necesare Actions și nu așteptăm aprobarea unui PR nou.</p>"},{"title":"Dacă push-ul nu reușește","html":"<p class=\"explain\">Un refuz, o problemă de autentificare sau lipsa conexiunii trebuie rezolvată înainte de a afirma că versiunea este publicată. Verifică URL-ul și contul folosit. Dacă main de pe server s-a schimbat între timp, citește mesajul și clarifică istoricul; nu îl suprascrie prin force push.</p><p class=\"explain\">Dacă nu poți încheia acum, păstrează commitul local și scrie în fișă starea reală. Urmează recuperarea stabilită pentru curs, fără rezultate inventate și fără o condiție nouă de acces la Q07.</p>"}],"connection":"Identificăm exact commitul publicat, apoi verificăm aceeași versiune dintr-o copie separată.","mistake":"„Committed” și „pushed” sunt două stări diferite. Un mesaj de eroare la push nu este o confirmare de publicare.","prompt":"Înregistrează și publică versiunea"},{"id":"final-id","title":"Identificatorul versiunii pe care o predăm","chapter":"06 · Publicăm o versiune identificabilă","start":3480,"end":3600,"rule":"Adresa repository-ului indică proiectul. Ramura indică o linie de lucru. SHA-ul complet identifică commitul verificat în această predare.","method":["După ultimul push reușit, obținem identificatorul din main local și verificăm același commit pe GitHub.","În acest repository, identificatorul complet SHA-1 are 40 de caractere hexazecimale. Comparăm întregul șir, fără a generaliza lungimea la toate repository-urile Git.","Punem identificatorul în rubrica 2 Moodle și îl păstrăm pentru comparația cu clona nouă."],"steps":[{"title":"Obținem identificatorul după publicare","html":"<p class=\"explain\">Din copia originală verificată, rulează:</p><pre><code>git branch --show-current\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Ramura trebuie să fie <code>main</code>. Copiază întregul rezultat al ultimei comenzi; nu include promptul terminalului și nu folosi numai primele caractere. Acesta identifică HEAD local, deci succesul push-ului trebuie verificat separat.</p>"},{"title":"Comparăm cu main de pe GitHub","html":"<p class=\"explain\">În propriul repository GitHub, cu <code>main</code> selectată, deschide ultimul commit și folosește opțiunea de copiere a SHA-ului complet dacă este afișată. Compară-l cu rezultatul local. Un prefix scurt afișat într-o listă ajută navigarea, dar pentru fișă folosim identificatorul întreg.</p><p class=\"explain\">Dacă commitul diferă, verifică repository-ul, ramura și ultimul push. Nu continua cu afirmația că ai identificat versiunea publicată până nu ai clarificat diferența.</p>"},{"title":"Repository, ramură și commit au roluri diferite","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ce identifică fiecare informație\"><table><caption>Ce identifică fiecare informație</caption><thead><tr><th scope=\"col\">Informație</th><th scope=\"col\">Rol în predare</th></tr></thead><tbody><tr><th scope=\"row\">URL repository propriu</th><td>Unde se găsește proiectul și de unde îl clonezi.</td></tr><tr><th scope=\"row\">main</th><td>Ramura finală publicată pentru această activitate.</td></tr><tr><th scope=\"row\">SHA complet</th><td>Commitul precis pentru care declari rezultatele.</td></tr></tbody></table></div><p class=\"explain\">O adresă corectă nu garantează că ai copiat commitul final, iar același nume de director nu demonstrează că rulezi aceeași versiune.</p>"},{"title":"După o schimbare avem o nouă verificare","html":"<p class=\"explain\">Dacă modifici codul, testele sau un fișier necesar, salvează, testează, fă un nou commit și push. Copiază noul SHA, verifică noua versiune în copia separată și actualizează fișa Moodle. Nu păstra rezultatele etichetate cu SHA-ul vechi ca și cum ar descrie ultima versiune.</p><p class=\"explain\">Nu crea o schimbare suplimentară doar ca să înscrii SHA-ul în propriul fișier evidence. Confirmarea finală rămâne în Moodle.</p>"}],"connection":"Clonează repository-ul propriu într-un loc separat pentru a verifica versiunea publicată.","mistake":"git rev-parse HEAD nu demonstrează singur că acel commit a ajuns pe server sau că programul funcționează.","prompt":"Copiază și verifică SHA-ul complet"},{"id":"fresh-clone","title":"O copie nouă, din repository-ul propriu","chapter":"07 · Reproducem versiunea publicată","start":3600,"end":3780,"rule":"O clonare nouă preia conținutul publicat. Ea poate evidenția fișiere sau modificări care funcționau local, dar nu au intrat în commitul trimis.","method":["Copiem URL-ul HTTPS al propriului repository, nu adresa template-ului comun.","Alegem un alt director părinte, în afara proiectului original, și deschidem clona într-o fereastră separată VS Code.","Nu copiem manual fișiere din proiectul original peste clona nouă: verificăm ce a fost publicat."],"steps":[{"title":"Alegem un loc separat","html":"<p class=\"explain\">De exemplu, dacă proiectul original este în <code>Documents/BTI_LUCRU/numele-proiectului</code>, creează sau alege <code>Documents/BTI_VERIFICARE</code> ca alt director părinte. Nu alege un director din interiorul repository-ului original și nu clona peste un folder existent.</p><p class=\"explain\">Păstrează originalul. Noua clonare este o verificare a publicării, nu o mutare sau ștergere a muncii tale.</p>"},{"title":"Clonăm din VS Code","html":"<p class=\"explain\">În GitHub, deschide repository-ul tău, apasă <strong>Code</strong> și copiază URL-ul HTTPS. În VS Code deschide Command Palette și alege <strong>Git: Clone</strong>; lipește URL-ul și selectează noul director părinte.</p><p class=\"explain\">La întrebarea de deschidere, alege o fereastră nouă dacă interfața oferă această opțiune. Dacă ai deschis-o în aceeași fereastră, verifică explicit calea înainte să rulezi comenzile.</p>"},{"title":"Alternativă prin terminal","html":"<p class=\"explain\">Din noul director părinte, aflat în afara originalului, înlocuiește URL-ul exemplu cu cel propriu. Numele local <code>BTI_REPRO</code> trebuie să nu existe deja. Comenzile sunt o alternativă la Git: Clone; nu este necesar să clonezi de două ori.</p><pre><code>git clone https://github.com/CONTUL_TAU/REPOSITORY_UL_TAU.git BTI_REPRO\ncd BTI_REPRO</code></pre>"},{"title":"Confirmăm ce am deschis","html":"<p class=\"explain\">În Explorer trebuie să vezi rădăcina noii clone cu <code>PROJECT</code>, <code>GUIDES</code> și <code>START.html</code>. Verifică calea completă din fereastră sau din File Explorer/Finder. Două clone pot avea același nume de folder în directoare părinte diferite.</p><p class=\"explain\">Dacă ai clonat template-ul sau ai redeschis originalul, oprește această confirmare și alege repository-ul/calea corectă. Nu declara reproducerea dintr-o clonă care nu este cea cerută.</p>"}],"connection":"În copia nouă comparăm origin, main, starea și identificatorul complet.","mistake":"Un alt tab sau o altă fereastră cu același nume nu garantează că lucrezi în alt director.","prompt":"Creează copia separată"},{"id":"clone-identity","title":"Verificăm identitatea copiei noi","chapter":"07 · Reproducem versiunea publicată","start":3780,"end":3900,"rule":"Comparația este relevantă numai dacă noua clonă provine din același repository și rulează main la același commit, fără modificări locale.","method":["Rulează comenzile din terminalul noii clone, nu dintr-un terminal rămas pe proiectul original.","Verifică patru informații diferite: origin propriu, main, stare curată și același SHA complet.","Identitatea versiunii este condiția comparației. Rezultatele programului trebuie verificate separat."],"steps":[{"title":"Patru verificări din clona nouă","html":"<p class=\"explain\">Deschide un terminal în fereastra noii clone și rulează:</p><pre><code>git remote -v\ngit branch --show-current\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Înainte de comandă, verifică directorul terminalului. Fereastra poate conține un terminal vechi care nu și-a schimbat automat locația.</p>"},{"title":"Citim fiecare rezultat","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Identitatea clonei separate\"><table><caption>Identitatea clonei separate</caption><thead><tr><th scope=\"col\">Verificare</th><th scope=\"col\">Ce trebuie confirmat</th></tr></thead><tbody><tr><th scope=\"row\">origin</th><td>URL-ul aceluiași repository propriu; un URL cu sau fără .git poate desemna același repository.</td></tr><tr><th scope=\"row\">Ramură</th><td>main.</td></tr><tr><th scope=\"row\">Stare</th><td>Working tree clean / fără modificări locale.</td></tr><tr><th scope=\"row\">HEAD</th><td>Același identificator complet de 40 de caractere ca versiunea finală publicată.</td></tr></tbody></table></div><p class=\"explain\">Compară întregul SHA din cele două copii. Dacă origin este o adresă SSH, verifică identitatea contului și repository-ului, nu simpla identitate textuală a formatului URL.</p>"},{"title":"Dacă SHA-ul sau ramura diferă","html":"<p class=\"explain\">Verifică dacă ai clonat propriul repository, dacă ultimul push a reușit și dacă ai selectat <code>main</code>. O clonă obținută înaintea unui nou push poate avea un SHA vechi. Dintr-o copie fără modificări, o actualizare permisă este:</p><pre><code>git switch main\ngit pull --ff-only\ngit status\ngit rev-parse HEAD</code></pre><p class=\"explain\">Dacă operația refuză actualizarea sau copia are modificări, citește situația înainte de a continua. Nu folosi resetări distructive pentru a ascunde diferența.</p>"},{"title":"Ce dovedesc și ce nu dovedesc aceste date","html":"<p class=\"explain\">Același SHA identifică același commit; starea curată evită testarea unor editări locale adăugate peste el. Aceste verificări nu demonstrează că toate fișierele necesare au fost incluse, că testele trec sau cine a scris codul.</p><p class=\"explain\">Dacă nu ai încă versiunea cerută, în rubrica 8 scrie diferența reală. Nu folosi confirmarea „aceeași versiune” până nu ai verificat-o.</p>"}],"connection":"Deschidem aplicația și testele chiar din PROJECT al acestei clone.","mistake":"Un SHA copiat corect în fișă nu schimbă codul care rulează într-un tab vechi.","prompt":"Compară identitatea versiunii"},{"id":"reproduction","title":"Rulăm ceea ce poate prelua altcineva","chapter":"07 · Reproducem versiunea publicată","start":3900,"end":4080,"rule":"Reproducerea cere rularea fișierelor din copia verificată. Înregistrăm rezultatele observate acolo, împreună cu versiunea căreia îi aparțin.","method":["Deschidem PROJECT/index.html și PROJECT/tests.html din directorul clonei noi. Verificăm calea în bara de adrese a browserului.","Selectăm modul atribuit în aplicație și S07 plus aceeași variantă în teste. Rerulăm cazurile 3, 7 și 256.","Completăm rezultatele din fișa Moodle numai după această rulare. Un rezultat din copia originală nu se substituie confirmării din clona nouă."],"steps":[{"title":"Taburile deschid fișierele clonei noi","html":"<p class=\"explain\">Din File Explorer/Finder al noii clone, deschide <code>PROJECT/index.html</code> și separat <code>PROJECT/tests.html</code> în browser. Verifică adresa fiecărui tab: calea trebuie să includă noul director părinte. Dacă vezi HTML în VS Code, ai deschis sursa pentru editare, nu aplicația.</p><p class=\"explain\">Paginile sunt locale și nu necesită server. Poți închide taburile vechi pentru a evita confuzia. Nu copia peste această clonă fișiere care au lipsit din publicare.</p>"},{"title":"Verificăm aplicația și rulăm S07","html":"<p class=\"explain\">În aplicație alege paritatea atribuită și introdu pe rând 3, 7 și 256. Verifică bitul separat de paritate, cuvântul de nouă biți și mesajul de respingere pentru intrarea invalidă. Aplicația actualizează rezultatele la schimbarea intrării.</p><p class=\"explain\">În teste, alege etapa <strong>S07</strong> și varianta <strong>A — even</strong> sau <strong>B — odd</strong>, apoi apasă <strong>Rulează testele</strong>. Cu setul furnizat, testul 128 și exact cele trei teste cerute, după implementarea modului atribuit sunt 48 trecute, 0 eșuate și 0 neimplementate. Testele suplimentare pot schimba numărul.</p>"},{"title":"Confirmăm cele trei rezultate efective","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Rezultate de confirmat în clona nouă\"><table><caption>Rezultate de confirmat în clona nouă</caption><thead><tr><th scope=\"col\">Intrare / operație</th><th scope=\"col\">Așteptat A — even</th><th scope=\"col\">Așteptat B — odd</th><th scope=\"col\">Obținut în clona nouă</th></tr></thead><tbody><tr><th scope=\"row\">3 / modul atribuit</th><td>0</td><td>1</td><td>Completezi după rulare.</td></tr><tr><th scope=\"row\">7 / același mod</th><td>1</td><td>0</td><td>Completezi după rulare.</td></tr><tr><th scope=\"row\">256 / parse-error</th><td><code>ERROR</code></td><td><code>ERROR</code></td><td>Completezi respingerea observată.</td></tr></tbody></table></div><p class=\"explain\">La primele două teste, rezultatul este numărul 0 sau 1. La testul invalid, <code>ERROR</code> este indicatorul testului pentru respingerea intrării; textul mesajului din aplicație poate fi o explicație a erorii. Alegerea celuilalt mod poate lăsa cazuri neimplementate și nu este cerința ta.</p>"},{"title":"Când publicarea nu reproduce originalul","html":"<p class=\"explain\">Dacă lipsește un fișier sau ai o versiune greșită, revino în original, corectează cauza, testează, comite și publică. Verifică noul SHA în copia separată, reîncarcă fișierele ei și repetă testele. Actualizează SHA-ul și rezultatele din Moodle împreună.</p><p class=\"explain\">Dacă un eșec rămâne, consemnează intrarea, așteptatul, obținutul și ce nu ai reușit să verifici. Clona nouă verifică reproducerea versiunii publicate; nu certifică autorul codului. Nu faci un commit nou doar pentru a scrie această confirmare în evidence.md.</p>"}],"connection":"Completăm numai ultimele date ale fișei deja pregătite și verificăm depunerea.","mistake":"Nu raporta 48 de teste trecute doar pentru că lecția indică acest total. Citește rezultatele reale și versiunea testată.","prompt":"Rulează din copia nouă"},{"id":"submission","title":"Depunem fișa, fără confirmări presupuse","chapter":"08 · Încheiem proiectul și evaluarea","start":4080,"end":4140,"rule":"Fișa finală este obligatorie, depusă ca text online și fără punctaj separat. Identifică versiunea și consemnează verificarea, fără a condiționa accesul la Q07.","method":["Folosim textul pregătit în minutele 50–60. Acum completăm SHA-ul final, rezultatele din clona nouă și confirmarea reală a reproducerii.","Păstrăm toate cele zece rubrici, inclusiv sursa afirmației S06 și URL-ul template-ului. Dacă ceva rămâne blocat, descriem explicit starea.","Salvăm și verificăm starea afișată de Moodle. Textul aflat doar în editor nu confirmă depunerea."],"steps":[{"title":"Unde introducem textul","html":"<p class=\"explain\">Deschide tema finală S05–S07 din cursul BTI în Moodle și alege editarea/adăugarea depunerii. În editorul de <strong>Text online</strong> lipește fișa deja completată, cu ultimele date confirmate. Nu încărca PDF, capturi de ecran sau întregul chat Gemini.</p><p class=\"explain\">Pentru seria ta folosește limba comunicată în curs. Rubricile identifică propriul proiect; nu copia URL-ul, SHA-ul sau rezultatele unui coleg.</p>"},{"title":"Rubricile 1–5 identifică versiunea și rezultatele","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Primele cinci rubrici\"><table><caption>Primele cinci rubrici</caption><thead><tr><th scope=\"col\">Rubrică</th><th scope=\"col\">Conținut necesar</th></tr></thead><tbody><tr><th scope=\"row\">1 · Repository propriu</th><td>URL-ul proiectului tău, fără date de autentificare.</td></tr><tr><th scope=\"row\">2 · SHA final</th><td>Identificatorul complet publicat pe main și confirmat în copia nouă.</td></tr><tr><th scope=\"row\">3 · Variantă</th><td>A — even/pară sau B — odd/impară.</td></tr><tr><th scope=\"row\">4 · Pornire</th><td>Aplicația, testele, etapa S07 și varianta; particularități reale dacă există.</td></tr><tr><th scope=\"row\">5 · Trei teste</th><td>3 și 7 în modul atribuit, apoi respingerea lui 256: așteptat și obținut în copia nouă.</td></tr></tbody></table></div><p class=\"explain\">Nu înlocui rubrica 5 cu o propoziție generică precum „toate testele sunt verzi”. Cele trei intrări și rezultatele lor trebuie să poată fi citite.</p>"},{"title":"Rubricile 6–10 păstrează investigația și proveniența","html":"<div class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"Ultimele cinci rubrici\"><table><caption>Ultimele cinci rubrici</caption><thead><tr><th scope=\"col\">Rubrică</th><th scope=\"col\">Conținut necesar</th></tr></thead><tbody><tr><th scope=\"row\">6 · Afirmație S06</th><td>O afirmație precisă din Gemini sau din exemplul pregătit.</td></tr><tr><th scope=\"row\">7 · Verificare</th><td>În 2–4 propoziții: ipoteza inițială, testul care deosebește explicațiile, așteptat, obținut și concluzia.</td></tr><tr><th scope=\"row\">8 · Reproducere</th><td>Director separat, main, același SHA, fișiere deschise din noua clonă și rezultate / eșecuri reale.</td></tr><tr><th scope=\"row\">9 · Sursă</th><td>Gemini sau exemplul pregătit; dacă ai folosit AI în S07, ce ai clarificat și verificat.</td></tr><tr><th scope=\"row\">10 · Template</th><td>https://github.com/antonioclim/BBS-bit-byte-starter</td></tr></tbody></table></div><p class=\"explain\">O ipoteză inițială greșită nu se penalizează separat. Contează să descrii cinstit traseul până la concluzie; un rezultat neobținut nu se inventează.</p>"},{"title":"Structura completă a textului","html":"<p class=\"explain\">Dacă ai nevoie de structură, copiază textul de mai jos în editorul Moodle după ce înlocuiești punctele cu datele proprii. El are zece rubrici; păstrează toate etichetele.</p><pre><code>1. URL repository propriu: ...\n2. SHA complet final publicat pe main: ...\n3. Varianta S07: A — even / B — odd\n4. Pornire: ...\n5. Teste din copia nouă:\n   3, operația ...: așteptat ...; obținut ...\n   7, aceeași operație: așteptat ...; obținut ...\n   256, validare: așteptat respingere; obținut ...\n6. Afirmația precisă analizată în S06: ...\n7. Ipoteza inițială, testul și concluzia (2–4 propoziții): ...\n8. Reproducere dintr-o clonare separată: director ..., main, SHA ..., aplicație și teste deschise din copia nouă; rezultate / eșecuri rămase ...\n9. Sursa: Gemini / exemplu pregătit din ghid. Clarificare AI în S07, dacă am folosit: ...\n10. URL template de pornire: ...</code></pre>"},{"title":"Verificăm starea depunerii","html":"<p class=\"explain\">Apasă <strong>Salvează modificările</strong>. În configurația recomandată pentru această temă, nu există un buton separat „Trimite tema”; salvarea finalizează depunerea. Revino la pagina temei și verifică starea afișată și textul salvat.</p><p class=\"explain\">Dacă activitatea existentă folosește un buton separat de trimitere, urmează acel pas și verifică starea finală. Tema rămâne obligatorie, fără punctaj separat și fără aprobare individuală înainte de Q07. Nu condiționăm accesul la quiz de bifarea automată sau de evaluarea manuală a fișei.</p>"}],"connection":"Închidem materialele de lucru și intrăm în evaluarea individuală.","mistake":"Un editor deschis, un draft nesalvat sau o confirmare copiată din model nu reprezintă depunere și verificare efectivă.","prompt":"Completează și salvează fișa"},{"id":"quiz-transition","title":"Q07: interpretăm enunțul, apoi răspundem","chapter":"08 · Încheiem proiectul și evaluarea","start":4140,"end":4200,"rule":"Q07 durează 15 minute și valorează maximum 50 de puncte interne, adică 0,50 puncte reale. Întregul bloc S05–S07 rămâne la maximum 1 punct real.","method":["Rezolvăm individual, fără Gemini, alte instrumente AI sau ajutorul colegilor. Fișa comună de referință rămâne permisă.","Fiecare întrebare precizează modul de paritate. Urmăm acel mod chiar dacă proiectul nostru implementează cealaltă variantă.","Quizul verifică înțelegerea situațiilor descrise cu sprijinul permis. Nu inspectează automat repository-ul și nu certifică executarea ori autorul codului."],"steps":[{"title":"Separăm lucrul practic de quiz","html":"<p class=\"explain\">În minutele 70–85 deschide Q07. Închide lecția extinsă, simulatorul, Gemini și celelalte materiale de lucru. Păstrează numai fișa comună de referință permisă în evaluare. Există o singură încercare și 15 minute; urmărește timpul afișat de Moodle.</p><p class=\"explain\">Depunerea finală este obligatorie, dar accesul la Q07 nu depinde de o aprobare individuală a proiectului. Dacă ai un blocaj, descrie-l în fișă și aplică regulile existente ale cursului.</p>"},{"title":"Modul din întrebare decide răspunsul","html":"<p class=\"explain\">Înainte de calcul, citește dacă enunțul cere <code>even</code> sau <code>odd</code>. Separă octetul de date de bitul de control și de cuvântul transmis. Nu aplica automat varianta proiectului propriu unei întrebări care precizează alt mod.</p><p class=\"explain\">Pentru o întrebare despre o eroare, stabilește ce biți sunt modificați și ce verificare este folosită. Formulează numai concluzia pe care acea verificare o permite.</p>"},{"title":"Citirea, navigarea și trimiterea","html":"<p class=\"explain\">Completează ambele răspunsuri din fiecare item CLOZE. Navigarea este liberă: poți reveni la un item în timpul încercării. Verifică răspunsurile înainte de <strong>Trimite tot și termină</strong>; feedbackul detaliat se publică după încheierea evaluării pentru toate grupele.</p><p class=\"explain\">Cele cinci întrebări selectate valorează câte 10 puncte interne. Totalul Q07 de 50 se transformă în maximum 0,50 puncte reale; fișa proiectului nu adaugă un punctaj separat.</p>"},{"title":"Ce ne rămâne din cele trei seminarii","html":"<p class=\"explain\">În S05 ai preluat un proiect și ai publicat prima modificare. În S06 ai investigat o problemă, ai testat o afirmație și ai integrat o remediere. În S07 ai transformat o cerință în regulă verificabilă și ai verificat versiunea publicată dintr-o copie nouă.</p><p class=\"explain\">Chiar dacă uiți o comandă, păstrează întrebările: ce cere problema, ce mă aștept să observ, ce am verificat, ce limite are verificarea și din ce versiune poate reproduce altcineva rezultatul? Ultimele cinci minute, 85–90, sunt pentru această recapitulare.</p>"}],"connection":"Încheiem S07 cu proiectul, istoricul și metoda de verificare, apoi revenim la parcursul disciplinei.","mistake":"Quizul cu referință permisă nu este o certificare automată a proiectului și nu autorizează consultarea AI sau a colegilor.","prompt":"Pregătește Q07"}],"math_checks":[],"rehearsal":[]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('lessonData').textContent);
const $=id=>document.getElementById(id), pages=DATA.pages;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={index:0,scale:100,reading:false,panel:null,frames:Array(pages.length).fill(-1),all:Array(pages.length).fill(false),theme:'dark',shortcuts:true};
let toastTask=0,scrollTask=0,scrollGuard=false;
let timer={total:300,left:300,deadline:0,running:false};
